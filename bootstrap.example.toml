[hosts]
openclaw = "openclaw.localtest.me"
nextcloud = "nextcloud.localtest.me"
nextcloud_mcp = "nextcloud-mcp.localtest.me"
qdrant = "qdrant.localtest.me"
qdrant_mcp = "qdrant-mcp.localtest.me"
memgraph = "memgraph.localtest.me"
memgraph_lab = "memgraph-lab.localtest.me"
nextcloud_public = ""
gitea = "gitea.localtest.me"
registry = "registry.localtest.me"
argocd = "argocd.localtest.me"
vaultwarden = "vaultwarden.localtest.me"
paperless = "paperless.localtest.me"

[mail]
domain = "example.com"
smtp_host = "smtp.example.com"
from_localpart = "noreply"
from_name = "ai-homebase"

[providers]
openai_api_key = "replace-me"
anthropic_api_key = "replace-me"
brave_api_key = ""
perplexity_api_key = ""
gemini_api_key = "replace-me"
xai_api_key = ""
moonshot_api_key = ""

[openclaw.agents.main]
model = "anthropic/claude-sonnet-4-6"
fallback_models = ["openai/gpt-5.4", "google/gemini-3.1-pro-preview"]

[openclaw.agents.coder]
model = "openai/gpt-5.4"
fallback_models = ["anthropic/claude-sonnet-4-6", "google/gemini-3.1-pro-preview"]
codex_model = "openai/gpt-5.3-codex"
codex_elevated_model = "openai/gpt-5.5"

[openclaw.agents.coder.gitea]
username = "coder"
email = ""
password = ""

[openclaw.agents.reviewer.gitea]
username = "reviewer"
email = ""
password = ""

[openclaw.agents.architect]
model = "openai/gpt-5.4"
fallback_models = ["anthropic/claude-sonnet-4-6", "google/gemini-3.1-pro-preview"]

[openclaw.agents.archivist]
model = "openai/gpt-5.4-mini"
fallback_models = ["anthropic/claude-sonnet-4-6", "google/gemini-3.1-flash-lite-preview"]

[openclaw.agents.watchdog]
model = "openai/gpt-5.4-nano"
fallback_models = ["google/gemini-3.1-flash-lite-preview", "anthropic/claude-haiku-4-5"]

[openclaw.agents.auditor]
model = "anthropic/claude-opus-4-7"
fallback_models = ["openai/gpt-5.4", "google/gemini-3.1-pro-preview"]

[admin]
name = "Homebase Admin"
username = "homebase-admin"
email = "admin@example.invalid"
password = ""

[secrets]
openclaw_gateway_token = ""
postgres_admin_password = ""
redis_password = ""
gitea_db_password = ""
vaultwarden_db_password = ""
vaultwarden_admin_token = ""
nextcloud_db_password = ""
openclaw_nextcloud_mcp_password = ""
github_token = ""
paperless_db_password = ""
paperless_secret_key = ""

[services.gitea]
# Optional absolute URL used by bootstrap-generated OpenClaw and Actions runner
# config. Defaults to "http://<hosts.gitea>" because the shipped Gitea ingress is
# internal HTTP unless you add explicit TLS configuration.
base_url = ""

[services.gitea.admin]
username = ""
email = ""
password = ""

[services.gitea.actions]
enabled = true
vm_name = "gitea-actions-runner"
host_alias = ""
ssh_port = 2223
labels = ["linux-amd64", "homebase-coder"]

[services.registry.auth]
username = "coder"
password = ""

[services.nextcloud.admin]
user = ""
password = ""

[services.paperless.admin]
user = ""
mail = ""
password = ""

[services.argocd.admin]
user = "admin"
password = ""

[gitops]
cluster_name = ""
repo_name = "cluster-gitops"
sandbox_images_repo_name = "openclaw-sandbox-images"
repo_branch = "main"
repo_private = true
project = "platform-stack"
