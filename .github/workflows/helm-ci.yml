name: Helm CI

on:
  push:
    paths:
      - "charts/**"
      - ".github/workflows/helm-ci.yml"
      - "README.md"
      - "scripts/ci/**"
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/helm-ci.yml"
      - "README.md"
      - "scripts/ci/**"

jobs:
  helm-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build chart dependencies
        run: helm dependency build charts/platform-stack

      - name: Lint all charts
        run: ./scripts/ci/lint_all_charts.sh

      - name: Lint platform-stack k3d profile
        run: |
          set -euo pipefail
          helm lint charts/platform-stack \
            -f charts/platform-stack/values-dev.yaml \
            -f charts/platform-stack/values-k3d.yaml

      - name: Render platform-stack profiles
        run: ./scripts/ci/render_profiles.sh

      - name: Install Python dependencies
        run: python -m pip install --quiet pyyaml

      - name: Validate rendered YAML syntax (lightweight)
        run: ./scripts/ci/validate_rendered_yaml.py

      - name: Render service-combination matrix and assert key resources
        run: ./scripts/ci/assert_service_matrix.py
