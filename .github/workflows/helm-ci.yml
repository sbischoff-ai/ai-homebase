name: Helm CI

on:
  push:
    paths:
      - "charts/**"
      - "scripts/ci/**"
      - ".github/workflows/helm-ci.yml"
      - "README.md"
  pull_request:
    paths:
      - "charts/**"
      - "scripts/ci/**"
      - ".github/workflows/helm-ci.yml"
      - "README.md"

jobs:
  helm-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Build chart dependencies
        run: helm dependency build charts/platform-stack

      - name: Lint all charts
        run: ./scripts/ci/lint_all_charts.sh

      - name: Assert canonical host keys in values/docs/examples
        run: ./scripts/ci/assert_canonical_host_keys.sh

      - name: Validate values schema compatibility across platform-stack profiles
        run: |
          set -euo pipefail
          profiles=(
            "values.yaml"
            "values-dev.yaml"
            "values-aks.yaml"
            "values-prod.yaml"
          )

          for profile in "${profiles[@]}"; do
            echo "Schema-validating platform-stack with $profile"
            helm lint charts/platform-stack \
              -f "charts/platform-stack/$profile"
          done


      - name: Lint platform-stack k3d profile
        run: |
          set -euo pipefail
          helm lint charts/platform-stack \
            -f charts/platform-stack/values-dev.yaml \
            -f charts/platform-stack/values-k3d.yaml

      - name: Render platform-stack for each values profile
        run: ./scripts/ci/render_profiles.sh

      - name: Validate rendered YAML syntax (lightweight)
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python scripts/ci/validate_rendered_yaml.py

      - name: Render service-combination matrix and assert key resources
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python scripts/ci/assert_service_matrix.py
