    ---
    name: design_handoff
    description: Use when architect is returning a plan or design deliverable to main. Covers the Handoff Complete structure, durable artifact placement, and what a complete design return must contain.
    ---

    # Design Handoff

    Use this skill when returning completed planning work to main.

    ## Return Format

    ```markdown
    ## Handoff Complete
    **Task:** <brief restatement>
    **Status:** <complete | partial - needs X | blocked - needs Y>

    ### Deliverables
    - <what was produced and where it lives>
    - Nextcloud: <paths updated>
    - Qdrant: <memories stored>

    ### For the user
    <user-facing summary>

    ### Follow-up needed
    <remaining work and owner>
    ```

    ## Rules

    - Store durable design artifacts before returning.
    - Keep the user-facing summary concise and decision-oriented.
  workspace-architect-skills__nextcloud_project_planning__SKILL.md: |2

    ---
    name: nextcloud_project_planning
    description: Use when architect needs to create or update durable planning artifacts in Nextcloud. Covers project folder structure, specs, decision logs, planning trackers, and when to prefer markdown versus tables.
    ---

    # Nextcloud Project Planning

    Architect owns durable planning artifacts in Nextcloud.

    ## Default Outputs

    For a project slug, prefer:
    - `/Projects/<slug>/plan.md`
    - `/Projects/<slug>/spec.md`
    - `/Projects/<slug>/decisions.md`

    Use a table only when the state is truly structured and repeatedly updated, such as:
    - work-item trackers
    - worker-definition matrices
    - dependency inventories

    ## Procedure

    1. Treat Nextcloud paths as remote paths.
    2. Check whether `/Projects/<slug>/` already exists before creating new planning artifacts.
    3. Reuse and update existing project docs instead of scattering multiple overlapping files.
    4. Write one decision-complete artifact per planning pass.
    5. Promote stable planning outputs into shareable locations.
    6. Store distilled decisions in Qdrant with `nc_refs`.

    ## Boundaries

    - Main coordinates the user; architect authors the durable planning artifact.
    - Do not turn lightweight coordination into an overbuilt project tree.
  workspace-architect-skills__worker_definition_package__SKILL.md: |2

    ---
    name: worker_definition_package
    description: Use when architect is defining a recurring worker workflow. Covers the required package fields, output structure, safety boundaries, and when auditor review is required.
    ---

    # Worker Definition Package

    Architect is the sole author of worker definition packages.

    ## Required Package Content

    Every worker package must specify:
    - purpose and scope
    - exact execution steps
    - tool usage by surface
    - inputs and outputs
    - escalation conditions
    - schedule or trigger mode
    - model tier

    ## Procedure

    1. Define the worker's narrow job and stopping conditions.
    2. Make the execution plan concrete enough that the worker does not need to improvise.
    3. Explicitly separate:
       - local workspace operations
       - Nextcloud operations
       - Qdrant operations, if any
    4. Document exactly when the worker escalates to main.
    5. Write the package into durable Nextcloud project docs.
    6. If the workflow touches sensitive data, external communication, financial actions, destructive operations, or real-world automation, require auditor review before return.

    ## Output Shape

    - concise package title
    - role and trigger
    - exact execution plan
    - escalation rules
    - model tier and budget posture

    When returning the result through main, use:

    ```markdown
    ## Handoff Complete
    **Task:** <brief restatement>
    **Status:** <complete | partial - needs X | blocked - needs Y>

    ### Deliverables
    - <what was produced and where it lives>
    - Nextcloud: <paths updated>
    - Qdrant: <memories stored>

    ### For the user
    <user-facing summary>

    ### Follow-up needed
    <remaining work and owner>
    ```
