  workspace-architect-daily__README.md: |
    # Daily Notes - Architect

    Each file here is a historical planning wrap-up for one day. Write it in past tense so it cannot be mistaken for live planning state.

    Capture:
    - which project or decision thread was active
    - what changed that still mattered afterward
    - which open questions were carried forward
    - brief references to shared artifacts or surfaces that should be revisited

    Keep live planning state in `CURRENT.md`. Promote stable decisions into Qdrant or Nextcloud `/Projects/<slug>/` instead of leaving them here.
  workspace-architect-skills__deliver-design__SKILL.md: |
    ---
    name: deliver-design
    description: Use when returning a plan or design deliverable to main, especially when the response needs a structured handoff and durable artifact references.
    ---

    # Design Handoff

    Use when returning completed planning work to main.

    ## Return Format

    ```markdown
    ## Handoff Complete
    **Task:** <brief restatement>
    **Status:** <complete | partial - needs X | blocked - needs Y>

    ### Deliverables
    - <what was produced and where it lives>
    - Nextcloud: <paths updated>
    - Qdrant: <memories stored>

    ### For the user
    <user-facing summary>

    ### Follow-up needed
    <remaining work and owner>
    ```

    ## Recall And Escalation

    Before returning non-trivial planning work:
    1. Read the relevant local desk notes and shared Nextcloud `/Desk/` entries.
    2. Search Qdrant for relevant decisions and patterns.
    3. Read existing Nextcloud project docs when they exist.
    4. Ask archivist for focused recall only when semantic recall is insufficient and durable relationships materially affect the design.

    Store a durable Qdrant memory with canonical slugs when:
    - a new project or subsystem is designed
    - a decision changes how existing entities relate
    - a new external dependency or integration is introduced
    - a new worker agent is designed

    ## Rules

    - Store durable design artifacts before returning.
    - Keep the user-facing summary concise and decision-oriented.
  workspace-architect-skills__gitea-browse__SKILL.md: |
    ---
    name: gitea-browse
    description: Browse in-cluster Gitea repos, issues, pull requests, commits, chart values, GitOps definitions, and sandbox image sources for read-only design context with the shared reviewer identity.
    ---

    # Gitea Browse

    Use this skill to inspect in-cluster source control before design work.
    Your sandbox is expected to arrive with the shared reviewer identity already configured for `git` and `tea`.

    ## Default Repos

    - `cluster-gitops` - GitOps deployment definitions, platform-stack charts, values, and cluster handoff material
    - `openclaw-sandbox-images` - Dockerfiles and image build configs for agent sandbox runtimes

    ## Read-Only Commands

    Use `git` and `tea` with the shared reviewer identity that is already configured in your sandbox.

    ```bash
    tea repo list
    tea repo view <owner>/<repo>
    tea issue list --repo <owner>/<repo> --state open
    tea issue view <number> --repo <owner>/<repo>
    tea pr list --repo <owner>/<repo> --state open
    tea pr view <number> --repo <owner>/<repo>
    ```

    Clone only for inspection, then discard the clone.

    ```bash
    git clone <gitea-url>/<owner>/<repo> /tmp/<repo>
    cd /tmp/<repo>
    git ls-tree -r HEAD --name-only
    git show HEAD:path/to/file.yaml
    git show <sha>:path/to/file.yaml
    git log --oneline -20
    git log --oneline -- path/to/file.yaml
    git show <sha> --stat
    ```

    ## Rules

    - Do not push branches, open pull requests, create commits, merge, or modify repo state.
    - Do not stage or commit changes.
    - Cite concrete repo paths, commits, issues, or PRs when they shape a design.
    - Tell main when a design depends on absent, ambiguous, or inconsistent Gitea state.
    - If `tea` auth fails or a critical repo is missing, stop and tell main exactly what failed.
