    #!/usr/bin/env python3
    """Patch the archivist grooming checkpoint JSON atomically."""

    from __future__ import annotations

    import argparse
    import json
    import tempfile
    from pathlib import Path
    from typing import Any


    DEFAULT_CHECKPOINT: dict[str, Any] = {
        "version": 1,
        "last_successful_grooming": None,
        "last_successful_graph_link": None,
        "last_weekly_grooming": None,
        "last_triggered_grooming": None,
        "last_run": {
            "run_id": None,
            "trigger": None,
            "scope": None,
            "started_at": None,
            "completed_at": None,
            "status": None,
        },
        "nextcloud": {
            "last_successful_scan": None,
            "surfaces": {},
        },
    }


    def deep_merge(base: dict[str, Any], patch: dict[str, Any]) -> dict[str, Any]:
        merged = dict(base)
        for key, value in patch.items():
            if isinstance(value, dict) and isinstance(merged.get(key), dict):
                merged[key] = deep_merge(merged[key], value)
            else:
                merged[key] = value
        return merged


    def parse_value(raw: str) -> Any:
        try:
            return json.loads(raw)
        except json.JSONDecodeError:
            return raw


    def set_dotted(target: dict[str, Any], dotted: str, value: Any) -> None:
        parts = dotted.split(".")
        if not parts or any(not part for part in parts):
            raise SystemExit(f"Invalid dotted path: {dotted}")
        cursor = target
        for part in parts[:-1]:
            existing = cursor.setdefault(part, {})
            if not isinstance(existing, dict):
                raise SystemExit(f"Cannot set child key under non-object path: {part}")
            cursor = existing
        cursor[parts[-1]] = value


    def load_checkpoint(path: Path) -> dict[str, Any]:
        if not path.exists():
            return dict(DEFAULT_CHECKPOINT)
        loaded = json.loads(path.read_text(encoding="utf-8"))
        if not isinstance(loaded, dict):
            raise SystemExit(f"Checkpoint is not a JSON object: {path}")
        return deep_merge(DEFAULT_CHECKPOINT, loaded)


    def parse_args() -> argparse.Namespace:
        parser = argparse.ArgumentParser(description=__doc__)
        parser.add_argument("--file", default="state/grooming-checkpoint.json", help="Checkpoint path.")
        parser.add_argument("--patch-json", default="", help="JSON object to deep-merge into the checkpoint.")
        parser.add_argument("--set", action="append", default=[], metavar="PATH=VALUE", help="Set dotted path to JSON VALUE or string. May be repeated.")
        parser.add_argument("--dry-run", action="store_true", help="Print the resulting checkpoint without writing.")
        return parser.parse_args()


    def main() -> None:
        args = parse_args()
        path = Path(args.file)
        checkpoint = load_checkpoint(path)
        if args.patch_json:
            patch = json.loads(args.patch_json)
            if not isinstance(patch, dict):
                raise SystemExit("--patch-json must be a JSON object")
            checkpoint = deep_merge(checkpoint, patch)
        for item in args.set:
            if "=" not in item:
                raise SystemExit("--set expects PATH=VALUE")
            key, raw_value = item.split("=", 1)
            set_dotted(checkpoint, key, parse_value(raw_value))

        text = json.dumps(checkpoint, indent=2, sort_keys=False) + "\n"
        if args.dry_run:
            print(text, end="")
            return

        path.parent.mkdir(parents=True, exist_ok=True)
        with tempfile.NamedTemporaryFile("w", encoding="utf-8", dir=str(path.parent), delete=False) as handle:
            handle.write(text)
            temp_path = Path(handle.name)
        temp_path.replace(path)


    if __name__ == "__main__":
        main()
  workspace-archivist-qdrant__README.md: |
    ## Archivist Qdrant Scripts

    These scripts are the archivist-only Qdrant REST surface for graph grooming.
    Ordinary semantic memory search and storage still goes through `qdrant-find` and `qdrant-store`.

    The runtime provides:

    - `QDRANT_URL`
    - `QDRANT_COLLECTION` (defaults to `openclaw-memory`)
    - optional `QDRANT_API_KEY`

    ## Common Flows

    Read the grooming checkpoint before choosing a delta:

    ```bash
    cat state/grooming-checkpoint.json
    ```

    Scroll recent memories into normalized JSONL:

    ```bash
    python3 qdrant/scroll_memories.py --since "2026-04-15T00:00:00Z" --limit 100 --out state/qdrant-candidates.jsonl
    ```

    Scroll unbounded only when explicitly backfilling:

    ```bash
    python3 qdrant/scroll_memories.py --limit 200 --out state/qdrant-backfill.jsonl
    ```

    Filter by project, kind, agent, or tag:

    ```bash
    python3 qdrant/scroll_memories.py --project ai-homebase --kind decision --agent architect --tag gitops --limit 50
    ```

    Inspect graph-link catch-up candidates:

    ```bash
    python3 qdrant/scroll_memories.py --graph-status pending --limit 100 --out state/qdrant-link-catchup.jsonl
    ```

    Fetch one exact Qdrant point after graph traversal returns `MemoryEntry.qdrant_id`:

    ```bash
    python3 qdrant/get_memory.py "<point-id>"
    ```

    Annotate a successfully linked point. This only sets the top-level `graph` payload object; it does not change vectors, `document`, or `metadata`.

    ```bash
    python3 qdrant/set_graph_link.py \
      --point-id "<point-id>" \
      --entity-slug ai-homebase \
      --entity-slug archivist \
      --status linked
    ```

    Preview the payload before writing:

    ```bash
    python3 qdrant/set_graph_link.py --point-id "<point-id>" --entity-slug ai-homebase --dry-run
    ```

    ## Normalized Packet Shape

    Each JSONL row contains:

    - `point_id`
    - `document`
    - `document_sha256`
    - `metadata`
    - `payload`

    Use `point_id` as the Memgraph `MemoryEntry.qdrant_id`, `qdrant:<point_id>` as the default `MemoryEntry.slug`, and `document_sha256` to detect whether a graph entry still matches the Qdrant memory text.
  workspace-archivist-qdrant___qdrant_common.py: |
    #!/usr/bin/env python3
    """Shared helpers for archivist Qdrant grooming scripts."""

    from __future__ import annotations

    import argparse
    import hashlib
    import json
    import os
    import sys
    import urllib.error
    import urllib.request
    from datetime import datetime, timezone
    from pathlib import Path
    from typing import Any


    DEFAULT_COLLECTION = "openclaw-memory"


    def add_common_args(parser: argparse.ArgumentParser) -> None:
        parser.add_argument(
            "--qdrant-url",
            default=os.environ.get("QDRANT_URL", ""),
            help="Qdrant base URL. Defaults to QDRANT_URL.",
        )
        parser.add_argument(
            "--collection",
            default=os.environ.get("QDRANT_COLLECTION", DEFAULT_COLLECTION),
            help=f"Qdrant collection name. Defaults to QDRANT_COLLECTION or {DEFAULT_COLLECTION}.",
        )
        parser.add_argument(
            "--api-key",
            default=os.environ.get("QDRANT_API_KEY", ""),
            help="Optional Qdrant API key. Defaults to QDRANT_API_KEY.",
        )


    def require_qdrant_url(raw_url: str) -> str:
        url = raw_url.rstrip("/")
        if not url:
            raise SystemExit("QDRANT_URL is required. Set QDRANT_URL or pass --qdrant-url.")
        return url


    def qdrant_request(
        qdrant_url: str,
        method: str,
        path: str,
        body: dict[str, Any] | None,
        api_key: str = "",
    ) -> dict[str, Any]:
        data = None if body is None else json.dumps(body, sort_keys=True).encode("utf-8")
        headers = {"Content-Type": "application/json"}
        if api_key:
            headers["api-key"] = api_key
        request = urllib.request.Request(
            f"{qdrant_url}{path}",
            data=data,
            method=method,
            headers=headers,
        )
        try:
            with urllib.request.urlopen(request, timeout=30) as response:
                raw = response.read().decode("utf-8")
        except urllib.error.HTTPError as exc:
            details = exc.read().decode("utf-8", errors="replace")
            raise SystemExit(f"Qdrant HTTP {exc.code} for {path}: {details}") from exc
        except urllib.error.URLError as exc:
            raise SystemExit(f"Unable to reach Qdrant at {qdrant_url}: {exc}") from exc

        if not raw:
            return {}
        return json.loads(raw)


    def document_from_payload(payload: dict[str, Any]) -> str:
        for key in ("document", "information", "text", "page_content"):
            value = payload.get(key)
            if isinstance(value, str):
                return value
        value = payload.get("content")
        if isinstance(value, str):
            return value
        return ""


    def normalize_point(point: dict[str, Any]) -> dict[str, Any]:
        payload = point.get("payload") or {}
        if not isinstance(payload, dict):
            payload = {}
        metadata = payload.get("metadata") or {}
        if not isinstance(metadata, dict):
            metadata = {}
        document = document_from_payload(payload)
        return {
            "point_id": str(point.get("id", "")),
            "document": document,
            "document_sha256": hashlib.sha256(document.encode("utf-8")).hexdigest(),
            "metadata": metadata,
            "payload": payload,
        }


    def write_jsonl(rows: list[dict[str, Any]], output_path: str) -> None:
        lines = [json.dumps(row, sort_keys=True, ensure_ascii=False) for row in rows]
        text = "\n".join(lines)
        if text:
            text += "\n"
        if output_path:
            path = Path(output_path)
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(text, encoding="utf-8")
        else:
            sys.stdout.write(text)


    def utc_now_iso() -> str:
        return datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")


    def build_filter(
        *,
        created_gte: str = "",
        created_lte: str = "",
        project: str = "",
        kind: str = "",
        domain: str = "",
        agent: str = "",
        tags: list[str] | None = None,
        graph_status: str = "",
    ) -> dict[str, Any] | None:
        must: list[dict[str, Any]] = []
        created_range: dict[str, str] = {}
        if created_gte:
            created_range["gte"] = created_gte
        if created_lte:
            created_range["lte"] = created_lte
        if created_range:
            must.append({"key": "metadata.created", "range": created_range})

        for key, value in (
            ("metadata.project", project),
            ("metadata.kind", kind),
            ("metadata.domain", domain),
            ("metadata.agent", agent),
            ("graph.status", graph_status),
        ):
            if value:
                must.append({"key": key, "match": {"value": value}})

        for tag in tags or []:
            if tag:
                must.append({"key": "metadata.tags", "match": {"value": tag}})

        if not must:
            return None
        return {"must": must}


    def read_json_arg(raw: str, default: Any) -> Any:
        if not raw:
            return default
        try:
            return json.loads(raw)
        except json.JSONDecodeError as exc:
            raise SystemExit(f"Invalid JSON argument: {exc}") from exc
