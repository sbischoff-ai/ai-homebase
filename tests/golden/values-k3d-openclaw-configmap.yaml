    # Bootstrap

    Fresh stack bootstrap is a conversation first, then a stack-alignment task.

    Do not run a sterile checklist. Talk naturally, but make sure the whole multi-agent stack becomes usable.

    ## First Conversation

    Learn enough to anchor the system:
    - the user's name and how to address them
    - timezone
    - preferred tone
    - current priorities
    - Nextcloud username

    Then update:
    - your `USER.md`
    - each standing specialist's `USER.md` with the same shared user facts
    - your `IDENTITY.md` only if the user meaningfully changes how they want you to present yourself

    ## Bring Up The Stack

    After the basic introduction:
    1. Verify the standing specialist sessions respond:
       - `agent:architect:main`
       - `agent:coder:main`
       - `agent:archivist:main`
       - `agent:watchdog:main`
       - `agent:auditor:main`
    2. Ensure shared Nextcloud structure exists:
       - `/Projects/`
       - project folders that bootstrap depends on
    3. Share only `/Projects/` with the user's Nextcloud account during initial setup.
    4. Create additional Nextcloud folders later only when the work benefits from them.
    5. Seed or update any shared stack docs needed for immediate collaboration.

    ## Explain The System Briefly

    Give the user a short orientation:
    - you are the coordinator
    - architect designs
    - coder implements
    - archivist maintains durable knowledge
    - watchdog monitors
    - auditor reviews
    - workers can be added later for recurring workflows

    ## Channels

    If channel setup is requested, read `CHANNELS.md` and do it there.

    ## Optional Shared Ops Setup

    If the user wants operational help immediately, set up:
    - calendar collaboration
    - todos
    - lightweight tables for tracking projects or recurring work
    - daily or periodic briefings via cron

    ## Finish

    Store durable preferences in Qdrant.
    Store durable collaboration artifacts in Nextcloud.
    Delete or retire this file only when bootstrap is complete and no longer needed by the seeded workspace model.
  workspace-main-CHANNELS.md: "\n# Channel Binding Reference\n\nRead this file when the user asks to set up, change, or inspect how agents are connected\nto messaging channels. Do not load it proactively in every session.\n\n## Concepts\n\n**Channel binding** pins inbound messages from a channel/account to a specific agent:\n`openclaw agents bind --agent <id> --bind <channel[:accountId]>`\n\n**Outbound routing** is automatic: replies go back to the channel the message came from.\nOutbound-only agents (watchdog, workers) do not need a binding \u2014 they route via the session's\n`lastRoute` or via explicit `openclaw message` calls in their cron prompts.\n\nRouting priority (most to least specific):\n1. Exact peer match\n2. Account match\n3. Channel-wide wildcard (`accountId: \"*\"`)\n4. Default agent\n\n## Main's primary channel\n\nMain should be bound to the user's primary messaging channel.\nMain is the only agent that receives inbound messages on this channel.\n\n```\nopenclaw agents bind --agent main --bind <channel[:accountId]>\n```\n\nDo not bind watchdog, workers, or other agents to receive from the user's primary channel.\n\n## Watchdog and worker notifications\n\nWatchdog and workers that push alerts or deliverables to the user directly do not need a binding.\nThey route outbound through `lastRoute` (set when the user last messaged from that channel),\nor via an explicit `openclaw message --channel <channel> --account <accountId>` call in the cron prompt.\n\nNever bind watchdog or workers to receive inbound messages from the user's primary channel.\n\n## Dedicated agent channels (optional)\n\nIf the user wants a direct conversation with a specific agent, create a separate bot/account\non that platform and bind it to that agent only:\n\n```\nopenclaw agents bind --agent <agent-id> --bind <channel>:<dedicated-account-id>\n```\n\nThe user messages that separate bot/account to reach the agent directly.\nThe architect is a natural first choice given its general-purpose design and thinking scope.\nWorkers that accept user triggers (rather than running only on a schedule) may also warrant\na dedicated channel \u2014 this should be specified in their definition package.\n\n## Inspecting and managing bindings\n\n```\nopenclaw agents list --bindings                                    # all agents and their bindings\nopenclaw agents bindings --agent <id>                              # bindings for one agent\nopenclaw agents unbind --agent <id> --bind <channel[:accountId]>   # remove a binding\nopenclaw agents unbind --agent <id> --all                          # remove all bindings\n```\n"
