        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: SMTP_PASSWORD
              name: infisical-secrets
              optional: true
        - name: SMTP_FROM_ADDRESS
          valueFrom:
            secretKeyRef:
              key: SMTP_FROM_ADDRESS
              name: infisical-secrets
              optional: true
        - name: SMTP_FROM_NAME
          valueFrom:
            secretKeyRef:
              key: SMTP_FROM_NAME
              name: infisical-secrets
              optional: true
        - name: DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              key: DB_CONNECTION_URI
              name: infisical-secrets
              optional: true
        - name: REDIS_URL
