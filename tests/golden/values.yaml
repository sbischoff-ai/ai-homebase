          httpGet:
            path: /livez
            port: healthcheck
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: cert-manager-webhook
        ports:
        - containerPort: 10250
          name: https
          protocol: TCP
        - containerPort: 6080
          name: healthcheck
          protocol: TCP
        - containerPort: 9402
          name: http-metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: healthcheck
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: platform-stack-cert-manager-webhook
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: platform-stack-root-ca
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-private
spec:
  ingressClassName: internal-nginx
  rules:
  - host: cloud.homebase.local
    http:
      paths:
      - backend:
          service:
            name: platform-stack-nextcloud
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - cloud.homebase.local
    secretName: nextcloud-private-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
spec:
  rules:
  - host: openclaw.homebase.local
    http:
      paths:
      - backend:
          service:
            name: platform-stack-openclaw
            port:
              number: 18789
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - openclaw.homebase.local
    secretName: openclaw-tls
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/component: shared-postgresql-bootstrap
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
  name: platform-stack-shared-postgresql-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: shared-postgresql-bootstrap
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: platform-stack
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - "until pg_isready -h \"$PGHOST\" -p \"$PGPORT\" -U \"$PGUSER\" --dbname\
          \ postgres; do\n  echo \"waiting for ${PGHOST}:${PGPORT}\"\n  sleep 2\n\
          done\npsql -v ON_ERROR_STOP=1 --dbname postgres --set=nextcloud_db_password=\"\
          $NEXTCLOUD_DB_PASSWORD\" <<'SQL'\nSELECT format('CREATE ROLE nextcloud LOGIN\
          \ PASSWORD %L', :'nextcloud_db_password')\nWHERE NOT EXISTS (SELECT FROM\
          \ pg_catalog.pg_roles WHERE rolname = 'nextcloud')\\gexec\nSELECT format('ALTER\
          \ ROLE nextcloud WITH LOGIN PASSWORD %L', :'nextcloud_db_password')\nWHERE\
          \ EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'nextcloud')\\\
          gexec\nSELECT 'CREATE DATABASE nextcloud OWNER nextcloud'\nWHERE NOT EXISTS\
          \ (SELECT FROM pg_database WHERE datname = 'nextcloud')\\gexec\nALTER DATABASE\
          \ nextcloud OWNER TO nextcloud;\nSQL\n"
        env:
        - name: PGHOST
          value: platform-stack-shared-postgresql
        - name: PGPORT
          value: '5432'
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: shared-postgresql-auth
        - name: NEXTCLOUD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        name: shared-postgresql-bootstrap
        terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '1'
  labels:
    app: startupapicheck
    app.kubernetes.io/component: startupapicheck
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: startupapicheck
    app.kubernetes.io/version: v1.20.0
  name: platform-stack-cert-manager-startupapicheck
  namespace: ai-homebase
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: startupapicheck
        app.kubernetes.io/component: startupapicheck
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: startupapicheck
        app.kubernetes.io/version: v1.20.0
    spec:
      containers:
      - args:
        - check
        - api
        - --wait=1m
        - -v
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/jetstack/cert-manager-startupapicheck:v1.20.0
        imagePullPolicy: IfNotPresent
        name: cert-manager-startupapicheck
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: platform-stack-cert-manager-startupapicheck
