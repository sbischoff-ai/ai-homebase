      - command:
        - /bin/sh
        - -c
        - |
          set -eu
          if [ ! -s /config-source/mcp-http-bridge.mjs ]; then
            echo >&2 "Rendered ConfigMap file /config-source/mcp-http-bridge.mjs is missing or empty; verify the openclaw ConfigMap rendered correctly before deployment."
            exit 1
          fi
          mkdir -p /runtime-target || {
            echo >&2 "Failed to create MCP runtime target directory /runtime-target."
            exit 1
          }
          cp -f /config-source/mcp-http-bridge.mjs /runtime-target/mcp-http-bridge.mjs || {
            echo >&2 "Failed to bootstrap shared MCP bridge into /runtime-target/mcp-http-bridge.mjs."
            exit 1
          }
        image: ghcr.io/openclaw/openclaw:2026.4.5
        imagePullPolicy: IfNotPresent
        name: mcp-runtime
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /config-source
          name: config-source
          readOnly: true
        - mountPath: /runtime-target
          name: mcp-runtime
      - command:
        - /bin/sh
        - -c
        - |
          set -eu
          mkdir -p /tools-target/bin /tools-target/lib /tools-target/lib64
          cp -f /usr/bin/mgconsole /tools-target/lib/mgconsole || {
            echo >&2 "Failed to copy /usr/bin/mgconsole into the shared Memgraph tools volume."
            exit 1
          }
          cp -f /lib/x86_64-linux-gnu/libssl.so.3 /tools-target/lib/libssl.so.3
          cp -f /lib/x86_64-linux-gnu/libcrypto.so.3 /tools-target/lib/libcrypto.so.3
          cp -f /lib/x86_64-linux-gnu/libc.so.6 /tools-target/lib/libc.so.6
          cp -f /lib64/ld-linux-x86-64.so.2 /tools-target/lib64/ld-linux-x86-64.so.2
          cat >/tools-target/bin/mgconsole <<'EOF'
          #!/bin/sh
          set -eu
          exec /opt/memgraph-tools/lib64/ld-linux-x86-64.so.2 \
            --library-path /opt/memgraph-tools/lib \
            /opt/memgraph-tools/lib/mgconsole "$@"
          EOF
          chmod 0755 /tools-target/bin/mgconsole /tools-target/lib/mgconsole
          chown -R 1000:1000 /tools-target
