    # Monitoring Baselines

    ## Gateway
    - /readyz -> HTTP 200 (expected at all times after startup)
    - Startup time: ~30-60 seconds after pod creation

    ## Sessions
    - Standing sessions after bootstrap: 6 (main, architect, coder, archivist, watchdog, auditor)
    - Cold-start session response time: 5-30 seconds (expected, not a fault)

    ## Services
    - Nextcloud: HTTP 200 at internal service URL
    - Memgraph: Bolt connection on port 7687
    - Qdrant: HTTP 200 at internal service URL

    ## Known Patterns
    - sessions_list returns 0 from sandboxed cron context (expected - sandbox isolation)
    - First heartbeat after deploy may show stale timestamp (expected - main has not run yet)

    Watchdog should update this document as new baselines are established.
  project-0-file-15: |2

    # Escalation Rules

    | Severity | Gate | Follow-up owner |
    | --- | --- | --- |
    | info | Expected behavior, first observation, or no user-visible impact | watchdog documents it and updates baselines if needed |
    | warning | Repeated deviation, degraded behavior, or issue needing scheduled follow-up | watchdog notifies main; main decides routing |
    | critical | User-visible outage, data-risk condition, or sustained control-plane failure | watchdog escalates to main immediately; main coordinates response |

    ## Anti-False-Positive Rules
    - Cold-start exemption: do not escalate slow first response from a newly created session if it falls within the documented cold-start baseline.
    - Sandbox isolation exemption: do not escalate `sessions_list` returning 0 from sandboxed cron context; that is expected isolation behavior.
    - 30-minute cooldown: do not re-raise the same warning or critical condition more than once within 30 minutes unless severity increases.
    - Baseline requirement: before classifying anything as a deviation, compare it against `/Projects/ai-homebase/baselines.md`. If no baseline exists, log it as info and propose a baseline instead of escalating.

    Ownership note:
    - `info` stays with `watchdog`.
    - `warning` goes from `watchdog` to `main` for prioritization and delegation.
    - `critical` goes directly to `main`, which owns immediate coordination and follow-up assignment.
  project-0-file-2: |2

    # GitOps Workflow

    This stack is designed to evolve through repository changes, image publishing, and GitOps handoff.

    Canonical mutation chain:
    1. the user states a requirement;
    2. `main` routes it;
    3. `architect` defines the plan, design direction, and task decomposition when the work is non-trivial;
    4. `coder` applies cluster and application changes in the relevant repository;
    5. `coder` maintains the OpenClaw sandbox image source repo and publishes resulting images to the in-cluster registry;
    6. `coder` validates changes with the documented lint and render commands;
    7. cluster-definition changes are pushed to the GitOps repo;
    8. sandbox runtime changes are pushed to the sandbox-images repo and published to the registry before those tags are referenced from cluster config;
    9. the user reviews the diff and syncs Argo CD manually;
    10. `watchdog`, `auditor`, and `archivist` feed observations, findings, and durable knowledge back into the next iteration.

    Repository roles:
    - the GitOps repo is the source of truth for cluster definitions;
    - the sandbox-images repo is the source of truth for OpenClaw runtime image source;
    - the registry is the canonical artifact distribution layer for those images.

    Self-mutation rule:
    - this system is allowed to prepare its own mutations;
    - the manual Argo CD sync step is the operator control boundary for infrastructure mutation.

    Important constraint:
    - `coder` executes changes;
    - `architect` should shape the work when a project needs planning or design first.
  project-0-file-3: |2

    # Cluster Architecture

    The cluster centers on OpenClaw as the coordination layer and uses supporting services as one integrated AI control system.

    Important components:
    - OpenClaw for multi-agent coordination
    - Nextcloud for durable shared storage, project documentation, and operator-visible system memory
    - Gitea for source control, the GitOps repo, and the sandbox-images repo
    - the in-cluster registry for canonical OpenClaw sandbox image distribution
    - Argo CD for GitOps application delivery
    - shared PostgreSQL and Redis for stateful services
    - Qdrant for semantic memory and Memgraph for graph-structured long-term knowledge

    Control-plane perspective:
    - OpenClaw provides reasoning, delegation, and execution control;
    - Nextcloud provides durable human-readable documentation and shared project artifacts;
    - Gitea and the registry provide the mutable artifact layer for code and runtime images;
    - Argo CD provides the reviewed path from repo state to running cluster state;
    - Qdrant and Memgraph provide the durable memory and relationship layer that let the system reason across time instead of only within a single chat.

    Runtime model:
    - the OpenClaw gateway owns durable state;
    - specialist execution happens through standing agents;
    - coder can use the remote Docker sandbox path for implementation work and owns the sandbox image source/publish workflow;
    - archivist curates Memgraph and the graph-linked Qdrant memory layer;
    - watchdog stays in the gateway for low-cost observation and triage.
    - auditor reviews plans, implementations, and operating patterns, then proposes optimizations and stronger automation paths.
  project-0-file-4: |2

    # Project Documentation Model

    Every project should use the same default documentation model:

    - `/Projects/<project-slug>/` is the default durable project home
    - additional Nextcloud folders may be created later when a project truly benefits from them

    Durable artifacts belong in `/Projects/`, for example:
    - `spec.md`
    - `architecture.md`
    - `plan.md`
    - `decisions.md`

    Drafts may also live in `/Projects/` when they are part of the project's shared working record. If agents create additional Nextcloud folders later, they should do so intentionally and document their purpose.
  project-0-file-5: "\n# Worker Agent Design Guide\n\n## What Is a Worker Agent\n\nA worker agent is a bottom-layer execution unit in the layered agent architecture. Workers run cheap models (GPT-5.4 Nano or Mini), follow strict predefined workflows, and escalate when they encounter ambiguity. They are designed to amortize the intelligence of top-layer agents across many cheap, repeated executions.\n\n## Who Designs Workers\n\nThe architect is the sole author of worker agent definitions. Main requests a worker design when the user identifies a recurring need. The auditor reviews worker definitions before instantiation when the worker handles sensitive data, financial operations, or external communications.\n\n## Promotion Principle\n\nRepeated LLM work should move down the cost and determinism ladder over time:\n\n- first, a high-judgment agent does the work manually;\n- then, if the pattern repeats, architect defines a worker agent;\n- later, if the workflow is stable and highly structured, it should be promoted again into deterministic software such as a Kubernetes `CronJob`, service, or controller implemented by `coder`.\n\nWorkers are therefore not the end state for mature repetitive workflows. They are often the transition stage between frontier-agent reasoning and ordinary software.\n\n## Worker Definition Package\n\nEvery worker must be fully specified before instantiation. The architect produces a definition package containing:\n\n### 1. Execution Plan\n- Step-by-step workflow with explicit inputs, outputs, and tool calls\n- Decision rules with no ambiguous branches\n- Error conditions and escalation triggers\n- What to do when input is missing or malformed\n\n### 2. Reference Documentation\n- Templates, schemas, formatting rules\n- Domain-specific constraints and examples\n- Validation criteria\n\n### 3. Schedule\n- Cron expression for recurring tasks, or heartbeat interval\n- Whether the worker responds to user triggers or runs autonomously\n\n### 4. Model Selection\n- Nano: purely procedural tasks with no variance\n- Mini: light conditional logic or tool chaining\n\n### 5. Escalation Rules\n- Workers always escalate to main\n- Standard triggers: rule gaps, unexpected input, tool failures\n- Domain-specific triggers defined per worker\n\n## How Workers Are Instantiated\n\n1. Architect produces the definition package and writes it to `/Projects/<project-slug>/workers/<worker-id>/` in Nextcloud.\n2. If risk-triggered review is warranted, main routes the definition to auditor.\n3. Main instantiates the worker at runtime:\n   a. Create the workspace directory (e.g., `~/.openclaw/workspace-<worker-id>`).\n   b. Write the workspace files (AGENTS.md, SOUL.md, IDENTITY.md, MEMORY.md, TOOLS.md, HEARTBEAT.md, USER.md) by filling in the worker template placeholders with values from the architect's definition package.\n   c. Run `openclaw agents add <worker-id> --workspace ~/.openclaw/workspace-<worker-id> --model <model-id>` to register the agent.\n   d. Update `/Projects/ai-homebase/budget-policy.md` if the new worker changes the expected ongoing LLM spend posture.\n   e. If the worker needs a cron schedule, configure it with `openclaw cron add`.\n4. Main confirms to the user that the worker is active.\n\nTo decommission a worker:\n1. Remove its cron schedule with `openclaw cron remove` (if any).\n2. Run `openclaw agents delete <worker-id>`.\n3. Update `/Projects/ai-homebase/budget-policy.md` if the removal changes expected ongoing spend.\n4. Announce to the user.\n\n## Worker Behavior Invariants\n\nWorkers must:\n- Follow instructions deterministically\n- Avoid interpretation or creativity\n- Request missing inputs via escalation to main\n- Escalate to main for complex decisions, design changes, and ambiguity\n\nWorkers must NOT:\n- Redesign their own workflows\n- Generate strategy or make creative decisions\n- Improvise structure or output formats\n- Store memories unless their execution plan explicitly requires it\n- Contact agents other than main\n\n## Template Location\n\nThe worker workspace template is at `charts/openclaw/files/workspaces/worker-template/` in the ai-homebase repo. Main uses this as a reference when creating workspace files for new workers \u2014 it is not deployed as a live agent workspace.\n"
  project-0-file-6: |2

    # Qdrant Semantic Memory Schema

    This document defines the shared OpenClaw memory contract for the Qdrant MCP server.

    Summary:
    - all agents share one Qdrant collection for durable semantic memory;
    - retrieval is currently semantic, so text prefixes are part of the contract;
    - metadata is still required for auditability, cleanup, and future filtering.

    Required metadata:
    - `kind`
    - `domain`
    - `agent`
    - `created`

    Optional metadata:
    - `confidence`
    - `project`
    - `nc_refs`
    - `tags`
    - `supersedes`
    - `expiry`
    - `source_url`

    Stable kind vocabulary:
    - `user-preference`
    - `user-context`
    - `decision`
    - `convention`
    - `pattern`
    - `fact`
    - `plan`
    - `task-context`
    - `incident`
    - `monitor-rule`
    - `creative`
    - `relationship`
    - `reference`

    Stable domain vocabulary:
    - `real`
    - `speculative`
    - `fictional`
    - `synthetic`

    Required text format:
    - `[domain] [kind] Complete self-contained statement.`

    Guidance:
    - store durable knowledge, not transient status;
    - do not store secrets;
    - use `fictional` for creative content;
    - include Nextcloud references in both text and `nc_refs` when relevant.
  project-0-file-7: "\n# Knowledge Graph Schema\n\nThis document defines the canonical Memgraph schema for the user's long-term cross-domain world model.\n\n## Canonical node labels\n\nEvery node must have the `Entity` label plus one or more specialized labels from this hierarchy:\n\n```text\nEntity                    \u2014 base label, all nodes have this\n\u251C\u2500\u2500 Person                \u2014 humans, fictional characters, contacts, personas\n\u251C\u2500\u2500 Agent                 \u2014 AI agents (subtype of Person in this system)\n\u251C\u2500\u2500 Organization          \u2014 companies, teams, groups, factions, guilds\n\u251C\u2500\u2500 Place                 \u2014 locations, venues, regions, fictional lands\n\u251C\u2500\u2500 Thing                 \u2014 physical objects, items, equipment, artifacts\n\u251C\u2500\u2500 Concept               \u2014 abstract ideas, topics, skills, fields, genres\n\u251C\u2500\u2500 Event                 \u2014 occurrences with temporal extent (meetings, incidents, sessions, campaigns)\n\u251C\u2500\u2500 Work                  \u2014 creative or intellectual outputs (documents, code, art, publications)\n\u251C\u2500\u2500 Project               \u2014 tracked efforts with goals (software projects, campaigns, trips, research)\n\u251C\u2500\u2500 Service               \u2014 running systems, APIs, platforms, tools\n\u251C\u2500\u2500 Collection            \u2014 named groupings (playlists, reading lists, inventories, tag bundles)\n\u2514\u2500\u2500 MemoryEntry           \u2014 Qdrant-linked memory nodes (grooming artifacts)\n```\n\n### Properties for specialization\n\nUse properties instead of inventing more labels unless traversal semantics truly require a new one:\n\n- `domain`: `real` | `fictional` | `speculative` | `synthetic`\n- `kind`: freeform string for subtype (for example `repository`, `NPC`, `recipe`, `medication`)\n- `category`: freeform grouping (for example `source-control`, `fantasy`)\n- `status`: `active` | `archived` | `draft` | `completed` | `abandoned`\n- `slug`: stable identifier for `MERGE`-based idempotency\n- `name`: human-readable display name\n\n### When to add a new label\n\nOnly add a new label if the concept requires structurally different traversal patterns or if it would be queried independently by label very frequently. If the concept can be represented with `kind` on an existing label, do not add a label.\n\n## Canonical relationships\n\nUse this compact set of reusable relationships and push domain-specific semantics into relationship properties:\n\n| Relationship | Meaning | Key properties |\n| --- | --- | --- |\n| `RELATES_TO` | General association; fallback when nothing more specific fits | `role`, `kind`, `context`, `weight` |\n| `HAS_PART` | Composition or membership: project has member, organization has department, collection has item, system has component | `role`, `kind`, `since`, `until` |\n| `INFLUENCES` | Causal or directional effect: person influences decision, event influences project, concept influences work, medication influences condition | `kind`, `strength`, `context` |\n| `LOCATED_IN` | Spatial containment: person lives in place, event happens at place, service runs on infrastructure, item stored in location | `kind`, `since`, `until` |\n| `CREATED_BY` | Authorship or origin: work created by person, project started by organization, memory stored by agent, artifact made by character | `role`, `context` |\n| `DERIVED_FROM` | Provenance or lineage: work based on work, decision derived from plan, fork from repo, adaptation from source material | `kind`, `context` |\n| `OCCURS_IN` | Temporal or narrative containment: event occurs in project, scene occurs in campaign, transaction occurs in period, session occurs in day | `kind`, `sequence` |\n| `TAGGED_WITH` | Classification or annotation: any entity tagged with a concept, topic, or category | `confidence`, `context` |\n\n### Relationship properties\n\nEvery relationship may use these properties for specialization:\n\n- `role`: the specific role of this connection (for example `maintainer`, `antagonist`, `primary-care`)\n- `kind`: sub-type of the relationship (for example on `HAS_PART`: `member`, `component`, `chapter`)\n- `context`: freeform note about why this relationship exists\n- `since` / `until`: ISO-8601 timestamps for temporal relationships\n- `weight` / `strength`: numeric relevance from `0.0` to `1.0` for weighted traversals\n- `confidence`: for inferred relationships (`high`, `medium`, `low`)\n\n### When to add a new relationship\n\nOnly add a new relationship if it has genuinely different traversal semantics that cannot be expressed with `kind` or `role` on an existing one. If an existing relationship plus properties can express the fact, do not add a new relationship.\n\nExamples:\n\n- \"Person X plays in Campaign Y\" becomes `Campaign -[:HAS_PART {role: \"player\"}]-> Person`\n- \"Doctor prescribed medication\" becomes `Person -[:INFLUENCES {kind: \"prescription\"}]-> Thing`\n"
  project-0-file-8: |2

    # LLM Budget Policy

    This file is the shared budget policy for the `ai-homebase` stack.

    Purpose:
    - make the stack's LLM budget rules visible to the user;
    - define the current spending posture for the standing agents and Codex-assisted work;
    - give the user one durable place to review and change budget policy.

    Working rule:
    - `main` is the budget manager for routine delegation decisions;
    - agents should treat this file as the canonical source for budget thresholds and escalation posture;
    - if the user wants to change budget behavior, update this file instead of hiding those rules in seeded workspace prompts.

    ## Cost Surfaces

    The stack tracks LLM usage on two main surfaces:
    - gateway-side OpenClaw session spend via `tokscale`;
    - Codex usage logged by `coder` in `/Projects/ai-homebase/codex-usage/YYYY-MM-DD.json`.

    Important note:
    - `tokscale` groups spend by model, not by agent, so per-agent posture is approximate and should be interpreted using the standing model assignments.

    ## Hard Ceilings

    - daily: `$15`
    - weekly: `$50`
    - monthly: `$150`

    These are the primary user-managed guardrails for the standard stack posture.

    ## Soft Reference Thresholds

    These are planning references, not hard stops:
    - `main`: `$1` per day
    - `architect`: `$5` per day
    - `coder` agent session: `$5` per day
    - Codex CLI usage: `$4` per day
    - `archivist`: `$1` per day
    - `watchdog`: `$0.50` per day
    - `auditor`: `$2` per day

    ## Delegation Classes

    - `P0`: direct user requests always proceed
    - `P1`: active handoffs proceed unless a hard ceiling is at risk
    - `P2`: proactive work defers once the daily ceiling is reached or weekly spend exceeds `$40`
    - `P3`: speculative work skips when monthly spend exceeds `$120` or weekly spend exceeds `$40`

    ## Monitoring And Review Posture

    - `watchdog` should alert `main` when total daily spend exceeds `$12`, because the stack is approaching the daily hard ceiling
    - `auditor` should stay conservative and prefer compact review packets
    - reference review posture:
      - on-demand reviews should usually stay under `30K` input tokens
      - weekly audit passes should usually stay under `50K` input tokens total

    These review numbers are cost-discipline guidance, not hard functional limits.

    ## Off-Budget Sessions

    If the user explicitly says work is off-budget:
    - note that status in the handoff;
    - specialists may skip their normal self-checks;
    - the user is intentionally overriding the default spending posture for that work.

    ## User Control

    This file is intentionally part of `/Projects/ai-homebase/`, which is shared with the user during bootstrap.

    If the user wants a different budget posture, update this document and treat the new values as the current policy.

    ## Maintenance Rule

    `main` must keep this file current when the live agent roster changes.

    Update this document when:
    - a new worker or other agent is added and it introduces meaningful ongoing LLM spend
    - an agent is retired and the expected spend posture changes
    - an existing agent is materially re-scoped and its expected budget guidance changes

    This document should reflect the current live topology, not only the original bootstrap defaults.
