      initContainers:
      - command:
        - sh
        - -ceu
        - |
          mkdir -p /qdrant/storage/storage /qdrant/storage/snapshots /qdrant/storage/tmp
          chown -R 0:0 /qdrant/storage
        image: busybox:1.36.1
