apiVersion: v1
data:
  openclaw.json: "{\n  \"gateway\": {\n    \"mode\": \"local\",\n    \"bind\": \"\
    lan\",\n    \"port\": 18789,\n    \"auth\": {\n      \"mode\": \"token\",\n  \
    \    \"token\": \"${OPENCLAW_GATEWAY_TOKEN}\"\n    },\n    \"controlUi\": {\n\
    \      \"enabled\": true,\n      \"allowedOrigins\": [\"http://openclaw.homebase.local\"\
    ]\n    }\n  },\n  \"agents\": {\n    \"defaults\": {\n      \"workspace\": \"\
    ~/.openclaw/workspace\",\n      \"sandbox\": {\"backend\":\"openshell\",\"mode\"\
    :\"all\",\"prune\":{\"idleHours\":24,\"maxAgeDays\":7},\"scope\":\"session\",\"\
    workspaceAccess\":\"rw\",\"workspaceRoot\":\"~/.openclaw/sandboxes\"}\n    },\n\
    \    \"list\": [{\"id\":\"default\",\"name\":\"OpenClaw Assistant\",\"workspace\"\
    :\"~/.openclaw/workspace\"}]\n  },\n  \"plugins\": {\"entries\":{\"openshell\"\
    :{\"config\":{\"autoProviders\":true,\"command\":\"openshell\",\"from\":\"openclaw\"\
    ,\"gateway\":\"\",\"gatewayEndpoint\":\"http://openshell:80\",\"gpu\":false,\"\
    mode\":\"remote\",\"policy\":\"\",\"providers\":[],\"remoteAgentWorkspaceDir\"\
    :\"/agent\",\"remoteWorkspaceDir\":\"/sandbox\",\"timeoutSeconds\":120},\"enabled\"\
    :true}}}\n}\n"
kind: ConfigMap
metadata:
