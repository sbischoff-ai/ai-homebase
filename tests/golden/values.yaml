    release: platform-stack
  name: platform-stack-infisical
  namespace: ai-homebase
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: nextcloud
  serviceName: platform-stack-nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - env:
        - name: NEXTCLOUD_ADMIN_USER
          value: ''
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: ''
        - name: OVERWRITEPROTOCOL
          value: https
        - name: PHP_MEMORY_LIMIT
          value: 512M
        - name: PHP_UPLOAD_LIMIT
          value: 16G
        - name: NEXTCLOUD_INIT_HTACCESS
          value: 'true'
        - name: SMTP_HOST
          value: ''
        - name: SMTP_PORT
          value: '587'
        - name: SMTP_NAME
          value: ''
        - name: MAIL_FROM_ADDRESS
          value: ''
        - name: MAIL_DOMAIN
          value: ''
        - name: POSTGRES_HOST
          value: ''
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: ''
        - name: POSTGRES_USER
          value: ''
        - name: REDIS_HOST
          value: ''
        - name: REDIS_HOST_PORT
          value: '6379'
        image: nextcloud:29.0.0-apache
        imagePullPolicy: IfNotPresent
        name: nextcloud
        ports:
        - containerPort: 80
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/name: sharedPostgresql
  name: platform-stack-shared-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: sharedPostgresql
  serviceName: platform-stack-shared-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: sharedPostgresql
    spec:
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: shared-postgresql-auth
        image: docker.io/postgres:17.5
        imagePullPolicy: IfNotPresent
        name: postgresql
        ports:
        - containerPort: 5432
          name: postgresql
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: initdb-scripts
          readOnly: true
      volumes:
      - name: initdb-scripts
        secret:
          secretName: shared-postgresql-initdb
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 100Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/name: sharedRedis
  name: platform-stack-shared-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: sharedRedis
  serviceName: platform-stack-shared-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: sharedRedis
    spec:
      containers:
      - args:
        - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
        command:
        - sh
        - -c
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: shared-redis-auth
        image: docker.io/redis:8.0.3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping
        name: redis
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping
        volumeMounts:
        - mountPath: /data
          name: data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 30Gi
