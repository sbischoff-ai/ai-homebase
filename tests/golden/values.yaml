    # Nextcloud Knowledge Support

    Nextcloud is supporting documentation for archivist, not the primary truth source.

    ## Use Nextcloud For

    - schema guidance
    - human-readable graph documentation
    - supporting project artifacts that the graph should reference

    ## Procedure

    1. Answer structural questions from Memgraph first.
    2. Use Qdrant to locate candidate memories or related decisions.
    3. Read Nextcloud only when the graph points to it or it is the authoritative schema note.
    4. When a Qdrant memory corresponds to a Nextcloud artifact, include `nc_refs`.
    5. Update `/Projects/ai-homebase/knowledge-graph-schema.md` when the canonical model changes.

    ## Boundaries

    - Do not let supporting docs replace graph structure.
    - Do not create duplicate documentation when an existing schema note already serves the purpose.
  workspace-archivist-skills__groom-recent-memories__SKILL.md: |
    ---
    name: groom-recent-memories
    description: Use when archivist is running a memory grooming, deduplication, or curation pass. Covers the last-successful-grooming cursor, recency-scoped Qdrant search, bootstrap behavior, and when to advance the cursor.
    ---

    # Recent Memory Grooming

    Use this when running a periodic memory grooming, deduplication, or curation pass.

    ## Cursor State

    - Read the last successful grooming boundary from `state/grooming-cursor.json`.
    - The cursor file must contain `last_successful_grooming` as an ISO-8601 timestamp or `null`.
    - Treat this file as runtime state, not as a prose note.

    ## Procedure

    1. Read `state/grooming-cursor.json` before searching Qdrant.
    2. If `last_successful_grooming` is present, search only for candidate memories newer than that timestamp.
    3. If `last_successful_grooming` is `null`, do a bootstrap pass over a bounded recent window instead of an unbounded historical search.
    4. Groom, deduplicate, merge, or link only the candidate memories returned by that recency-scoped search.
    5. If the pass produces durable semantic outcomes, store them in Qdrant using the standard archivist memory rules.
    6. If a groomed memory deserves graph structure, update Memgraph and link it through the existing `MemoryEntry` rules.
    7. Advance `last_successful_grooming` only after the grooming pass completes successfully.
    8. If the pass aborts, fails, or leaves the work incomplete, do not change the cursor.

    ## Bootstrap Window

    - A first-run bootstrap pass should stay bounded to recent history.
    - Prefer the smallest recent window that still captures ungroomed backlog for the active task.
    - Do not run an unbounded full-history search unless main explicitly asks for historical backfill.

    ## Return Notes

    - Report the effective grooming window in the handoff to main.
    - Include whether the cursor was advanced.
    - Include any durable Qdrant or Memgraph changes.
  workspace-archivist-skills__map-context-and-link-memories__SKILL.md: |
    ---
    name: map-context-and-link-memories
    description: Use when archivist needs to return a structural context map or connect Qdrant memories to graph structure. Covers the Context Map format, graph-promotion rules, and nc_refs linkage.
    ---

    # Context Map And Memory Linking

    Use this skill when another agent needs durable cross-entity context.

    ## Context Map Format

    ```markdown
    ## Context Map: <entity or topic>

    ### Entity
    - Slug: <slug>
    - Labels: <graph labels>
    - Domain: <real | fictional | speculative>
    - Status: <active | archived | other>

    ### Relationships
    - <relationship> -> <connected entity> (role: <role>, kind: <kind>)

    ### Linked Memories
    - [<kind>] <memory summary> (agent: <agent>, created: <date>)

    ### Nextcloud References
    - <path> - <brief description>

    ### Summary
    <2-3 sentence synthesis>
    ```

    ## Linking Rules

    - Memgraph first for relationships
    - Qdrant second for candidate memories and prior decisions
    - Nextcloud references third for supporting docs
    - when a Qdrant memory deserves graph structure, represent it as linked `MemoryEntry` structure
    - include `nc_refs` when a memory points to a Nextcloud artifact

    ## General Archivist Return Format

    Use this when the task is curation work but not primarily a context-map response:

    ```markdown
    ## Handoff Complete
    **Task:** <brief restatement>
    **Status:** <complete | partial - needs X | blocked - needs Y>

    ### Deliverables
    - Memgraph: <nodes, edges, schema or query updates>
    - Qdrant: <memories stored, linked, groomed>
    - Nextcloud: <paths updated, if any>

    ### For the user
    <concise explanation of what durable context was added or clarified>

    ### Follow-up needed
    <which agent should do what next>
    ```
  workspace-archivist-skills__update-memgraph__SKILL.md: |
    ---
    name: update-memgraph
    description: Use when archivist needs to query or update Memgraph as the structural source of truth. Covers the Memgraph-first workflow, canonical labels and relationships, and idempotent graph updates.
    ---

    # Memgraph Curation

    Memgraph is the structural source of truth.

    ## Procedure

    1. Start from the seeded `queries/` files when possible.
    2. Use `${MEMGRAPH_HOST}:${MEMGRAPH_PORT}` or `${MEMGRAPH_BOLT_URI}` as the runtime target.
    3. Prefer idempotent graph mutations.
    4. Reuse canonical labels and relationships instead of inventing ad hoc structure.
    5. Push domain-specific meaning into properties before introducing new graph structure.
    6. When a Qdrant memory deserves graph structure, create or update a `MemoryEntry` node and connect it to the relevant entities.

    ## Canonical Shape

    Labels:
    - `Entity`
    - `Person`
    - `Agent`
    - `Organization`
    - `Place`
    - `Thing`
    - `Concept`
    - `Event`
    - `Work`
    - `Project`
    - `Service`
    - `Collection`
    - `MemoryEntry`

    Relationships:
    - `RELATES_TO`
    - `HAS_PART`
    - `INFLUENCES`
    - `LOCATED_IN`
    - `CREATED_BY`
    - `DERIVED_FROM`
    - `OCCURS_IN`
    - `TAGGED_WITH`

    ## Escalate

    - if the requested structure would require a canonical schema change
