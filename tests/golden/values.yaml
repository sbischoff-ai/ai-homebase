apiVersion: v1
data:
  run-nextcloud-mcp.py: "import os\n\nimport uvicorn\n\nfrom nextcloud_mcp_server.app\
    \ import get_app\nfrom nextcloud_mcp_server.config import get_settings\nfrom nextcloud_mcp_server.observability\
    \ import get_uvicorn_logging_config\n\n\ndef main():\n    enabled_apps = [\n \
    \       app.strip()\n        for app in os.getenv(\"NEXTCLOUD_ENABLED_APPS\",\
    \ \"\").split(\",\")\n        if app.strip()\n    ]\n    app = get_app(\n    \
    \    transport=os.getenv(\"MCP_TRANSPORT\", \"streamable-http\"),\n        enabled_apps=enabled_apps\
    \ or None,\n    )\n\n    settings = get_settings()\n    log_level = str(settings.log_level).lower()\n\
    \    uvicorn_log_config = get_uvicorn_logging_config(\n        log_format=settings.log_format,\n\
    \        log_level=log_level,\n        include_trace_context=settings.log_include_trace_context,\n\
    \    )\n\n    uvicorn.run(\n        app=app,\n        host=os.getenv(\"HOST\"\
    , \"0.0.0.0\"),\n        port=int(os.getenv(\"PORT\", \"8000\")),\n        log_level=log_level,\n\
    \        log_config=uvicorn_log_config,\n    )\n\n\nif __name__ == \"__main__\"\
    :\n    main()\n"
