apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '8'
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-bootstrap-apps
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; do
            echo "waiting for nextcloud bootstrap"
            sleep 5
          done

          install_and_enable_app() {
            app_id="$1"
            echo "processing app: ${app_id}"
            if su -s /bin/sh www-data -c "cd /var/www/html && php occ app:list --output=json" | grep -q "\"${app_id}\":"; then
              echo "app '${app_id}' is already installed"
            else
              echo "installing '${app_id}'"
              su -s /bin/sh www-data -c "cd /var/www/html && php occ app:install \"${app_id}\""
            fi
            echo "enabling '${app_id}'"
            su -s /bin/sh www-data -c "cd /var/www/html && php occ app:enable \"${app_id}\""
          }
          install_and_enable_app "notes"
          install_and_enable_app "tables"
          install_and_enable_app "calendar"
          install_and_enable_app "tasks"
        env:
        - name: POSTGRES_HOST
          value: platform-stack-shared-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        image: nextcloud:33.0.2-apache
        imagePullPolicy: IfNotPresent
        name: bootstrap-apps
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      restartPolicy: Never
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '12'
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-bootstrap-project-content
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; do
            echo "waiting for nextcloud bootstrap"
            sleep 5
          done

          ensure_parent_dir() {
            target="$1"
            parent_dir="$(dirname "${target}")"
            mkdir -p "${parent_dir}"
            chown 33:33 "${parent_dir}"
            chmod 0750 "${parent_dir}"
          }

          write_managed_file() {
            target="$1"
            source_file="$2"
            if [ ! -f "${target}" ] || ! cmp -s "${source_file}" "${target}"; then
              cp "${source_file}" "${target}"
              chown 33:33 "${target}"
              chmod 0640 "${target}"
            fi
          }
          owner_username="openclaw"
          project_slug="ai-homebase"
          project_root="/var/www/html/data/${owner_username}/files/Projects/${project_slug}"
          notes_root="/var/www/html/data/${owner_username}/files/Notes/${project_slug}"
          mkdir -p "${project_root}" "${notes_root}"
          chown 33:33 "${project_root}" "${notes_root}"
          chmod 0750 "${project_root}" "${notes_root}"
          ensure_parent_dir "${project_root}/overview.md"
          write_managed_file "${project_root}/overview.md" "/bootstrap-content/project-0-file-0"
          ensure_parent_dir "${project_root}/multi-agent-topology.md"
          write_managed_file "${project_root}/multi-agent-topology.md" "/bootstrap-content/project-0-file-1"
          ensure_parent_dir "${project_root}/gitops-workflow.md"
          write_managed_file "${project_root}/gitops-workflow.md" "/bootstrap-content/project-0-file-2"
          ensure_parent_dir "${project_root}/cluster-architecture.md"
          write_managed_file "${project_root}/cluster-architecture.md" "/bootstrap-content/project-0-file-3"
          ensure_parent_dir "${project_root}/project-documentation-model.md"
          write_managed_file "${project_root}/project-documentation-model.md" "/bootstrap-content/project-0-file-4"
          ensure_parent_dir "${project_root}/qdrant-memory-schema.md"
          write_managed_file "${project_root}/qdrant-memory-schema.md" "/bootstrap-content/project-0-file-5"
          ensure_parent_dir "${project_root}/knowledge-graph-schema.md"
          write_managed_file "${project_root}/knowledge-graph-schema.md" "/bootstrap-content/project-0-file-6"
          ensure_parent_dir "${project_root}/archivist-grooming-log.md"
          write_managed_file "${project_root}/archivist-grooming-log.md" "/bootstrap-content/project-0-file-7"
          ensure_parent_dir "${project_root}/incidents/README.md"
          write_managed_file "${project_root}/incidents/README.md" "/bootstrap-content/project-0-file-8"
          ensure_parent_dir "${project_root}/heartbeat.json"
          write_managed_file "${project_root}/heartbeat.json" "/bootstrap-content/project-0-file-9"
          ensure_parent_dir "${project_root}/codex-usage/.gitkeep"
          write_managed_file "${project_root}/codex-usage/.gitkeep" "/bootstrap-content/project-0-file-10"
          ensure_parent_dir "${project_root}/audit-log.md"
          write_managed_file "${project_root}/audit-log.md" "/bootstrap-content/project-0-file-11"
          ensure_parent_dir "${project_root}/baselines.md"
          write_managed_file "${project_root}/baselines.md" "/bootstrap-content/project-0-file-12"
          ensure_parent_dir "${project_root}/escalation-rules.md"
          write_managed_file "${project_root}/escalation-rules.md" "/bootstrap-content/project-0-file-13"
          ensure_parent_dir "${notes_root}/project-brief.md"
          write_managed_file "${notes_root}/project-brief.md" "/bootstrap-content/project-0-note-0"
          ensure_parent_dir "${notes_root}/planning-backlog.md"
          write_managed_file "${notes_root}/planning-backlog.md" "/bootstrap-content/project-0-note-1"
          ensure_parent_dir "${notes_root}/open-questions.md"
          write_managed_file "${notes_root}/open-questions.md" "/bootstrap-content/project-0-note-2"
          su -s /bin/sh www-data -c "cd /var/www/html && php occ files:scan --path='${owner_username}/files/Projects/${project_slug}'"
          su -s /bin/sh www-data -c "cd /var/www/html && php occ files:scan --path='${owner_username}/files/Notes/${project_slug}'"
        env:
        - name: POSTGRES_HOST
          value: platform-stack-shared-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        image: nextcloud:33.0.2-apache
        imagePullPolicy: IfNotPresent
        name: bootstrap-project-content
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
        - mountPath: /bootstrap-content
          name: bootstrap-content
          readOnly: true
      restartPolicy: Never
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - configMap:
          name: platform-stack-nextcloud-bootstrap-project-content
        name: bootstrap-content
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '10'
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-bootstrap-users
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; do
            echo "waiting for nextcloud bootstrap"
            sleep 5
          done
          username_var="BOOTSTRAP_USER_0_USERNAME"
          display_name_var="BOOTSTRAP_USER_0_DISPLAY_NAME"
          password_var="BOOTSTRAP_USER_0_PASSWORD"
          username="$(printenv "${username_var}")"
          display_name="$(printenv "${display_name_var}")"
          password="$(printenv "${password_var}")"

          if ! su -s /bin/sh www-data -c "cd /var/www/html && php occ user:info \"${username}\" >/dev/null 2>&1"; then
            OC_PASS="${password}" su -s /bin/sh www-data -c "cd /var/www/html && php occ user:add --password-from-env --display-name \"${display_name}\" \"${username}\""
          fi
          current_display_name="$(su -s /bin/sh www-data -c "cd /var/www/html && php occ user:info \"${username}\" 2>/dev/null" | sed -n 's/^  - display_name: //p' | head -n 1)"
          if [ "${current_display_name}" != "${display_name}" ]; then
            su -s /bin/sh www-data -c "cd /var/www/html && php occ user:setting \"${username}\" settings display_name \"${display_name}\" >/dev/null"
          fi
          OC_PASS="${password}" su -s /bin/sh www-data -c "cd /var/www/html && php occ user:resetpassword --password-from-env \"${username}\""
        env:
        - name: POSTGRES_HOST
          value: platform-stack-shared-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        - name: BOOTSTRAP_USER_0_USERNAME
          value: openclaw
        - name: BOOTSTRAP_USER_0_DISPLAY_NAME
          value: OpenClaw
        - name: BOOTSTRAP_USER_0_PASSWORD
          valueFrom:
            secretKeyRef:
              key: NEXTCLOUD_PASSWORD
              name: openclaw-nextcloud-mcp-secrets
        image: nextcloud:33.0.2-apache
        imagePullPolicy: IfNotPresent
        name: bootstrap-users
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      restartPolicy: Never
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
