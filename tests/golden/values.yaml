apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-cron
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: platform-stack
            app.kubernetes.io/name: nextcloud
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - php -f /var/www/html/cron.php
            env:
            - name: POSTGRES_HOST
              value: ''
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: ''
            - name: POSTGRES_USER
              value: ''
            - name: REDIS_HOST
              value: ''
            - name: REDIS_HOST_PORT
              value: '6379'
            - name: SMTP_HOST
              value: ''
            - name: SMTP_PORT
              value: '587'
            - name: SMTP_NAME
              value: ''
            - name: MAIL_FROM_ADDRESS
              value: ''
            - name: MAIL_DOMAIN
              value: ''
            image: nextcloud:29.0.0-apache
            imagePullPolicy: IfNotPresent
            name: nextcloud-cron
            volumeMounts:
            - mountPath: /var/www/html
              name: data
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
  schedule: '*/5 * * * *'
  successfulJobsHistoryLimit: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: infisical
    chart: infisical-0.2.0
    component: infisical
    heritage: Helm
    release: platform-stack
  name: platform-stack-infisical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical
      component: infisical
      release: platform-stack
  template:
    metadata:
      labels:
        app: infisical
        component: infisical
        release: platform-stack
    spec:
      containers:
      - env:
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              key: AUTH_SECRET
              name: infisical-secrets
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: ENCRYPTION_KEY
              name: infisical-secrets
        - name: SITE_URL
          valueFrom:
            secretKeyRef:
              key: SITE_URL
              name: infisical-secrets
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              key: SMTP_HOST
              name: infisical-secrets
              optional: true
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              key: SMTP_PORT
              name: infisical-secrets
              optional: true
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              key: SMTP_USERNAME
              name: infisical-secrets
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: SMTP_PASSWORD
              name: infisical-secrets
              optional: true
        - name: SMTP_FROM_ADDRESS
          valueFrom:
            secretKeyRef:
              key: SMTP_FROM_ADDRESS
              name: infisical-secrets
              optional: true
        - name: SMTP_FROM_NAME
          valueFrom:
            secretKeyRef:
              key: SMTP_FROM_NAME
              name: infisical-secrets
              optional: true
        - name: DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              key: DB_CONNECTION_URI
              name: infisical-secrets
              optional: true
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              key: REDIS_URL
              name: infisical-secrets
              optional: true
        image: infisical/infisical:v0.151.0
        imagePullPolicy: IfNotPresent
        name: infisical-infisical
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/status
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            memory: 1000Mi
          requests:
            cpu: 350m
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      initContainers:
      - args:
        - job
        - platform-stack-schema-migration-1
        image: ghcr.io/groundnuty/k8s-wait-for:no-root-v2.0
        imagePullPolicy: IfNotPresent
        name: migration-init
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: platform-stack-infisical
