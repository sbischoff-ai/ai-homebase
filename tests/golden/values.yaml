apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openclaw
    spec:
      containers:
      - command:
        - node
        - openclaw.mjs
        - gateway
        - --allow-unconfigured
        env:
        - name: OPENCLAW_GATEWAY_PORT
          value: '18789'
        - name: OPENCLAW_GATEWAY_BIND
          value: 0.0.0.0
        - name: OPENCLAW_HOME
          value: /home/node/.openclaw
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_PATH
          value: /home/node/.openclaw/openclaw.json
        - name: OPENCLAW_SANDBOX
          value: '1'
        - name: PATH
          value: /opt/memgraph-tools/bin:/opt/openclaw-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL
          value: http://platform-stack-nextcloud-mcp.ai-homebase.svc.cluster.local:8000/mcp
        - name: OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL
          value: https://nextcloud-mcp.homebase.local/mcp
        - name: OPENCLAW_QDRANT_MCP_INTERNAL_URL
          value: http://platform-stack-qdrant-mcp.ai-homebase.svc.cluster.local:8000/mcp
        - name: OPENCLAW_QDRANT_MCP_EXTERNAL_URL
          value: https://qdrant-mcp.homebase.local/mcp
        - name: DOCKER_HOST
          value: ssh://docker-remote@openclaw-sandbox:2222
        - name: HOME
          value: /home/node
        - name: MEMGRAPH_HOST
          value: memgraph.homebase.local
        - name: MEMGRAPH_PORT
          value: '7687'
        - name: MEMGRAPH_BOLT_URI
          value: bolt://memgraph.homebase.local:7687
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_GATEWAY_TOKEN
              name: openclaw-secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: openclaw-secrets
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: ANTHROPIC_API_KEY
              name: openclaw-secrets
        - name: BRAVE_API_KEY
          valueFrom:
            secretKeyRef:
              key: BRAVE_API_KEY
              name: openclaw-secrets
        - name: MOONSHOT_API_KEY
          valueFrom:
            secretKeyRef:
              key: MOONSHOT_API_KEY
              name: openclaw-secrets
        - name: PERPLEXITY_API_KEY
          valueFrom:
            secretKeyRef:
              key: PERPLEXITY_API_KEY
              name: openclaw-secrets
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              key: GEMINI_API_KEY
              name: openclaw-secrets
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: XAI_API_KEY
              name: openclaw-secrets
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: GITHUB_TOKEN
              name: openclaw-secrets
        - name: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
              name: openclaw-nextcloud-mcp-secrets
        - name: CODER_GITEA_PASSWORD
          valueFrom:
            secretKeyRef:
              key: CODER_GITEA_PASSWORD
              name: coder-credentials
        - name: CODER_REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              key: CODER_REGISTRY_PASSWORD
              name: coder-credentials
        image: ghcr.io/openclaw/openclaw:2026.4.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        name: openclaw
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /startupz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /home/node/.openclaw
          name: data
        - mountPath: /opt/openclaw-runtime/mcp
          name: mcp-runtime
          readOnly: true
        - mountPath: /opt/memgraph-tools
          name: memgraph-tools-runtime
          readOnly: true
        - mountPath: /opt/openclaw-tools/bin
          name: remote-docker-cli
          readOnly: true
        - mountPath: /home/node/.ssh
          name: remote-docker-ssh
          readOnly: true
      initContainers:
      - command:
        - /bin/sh
        - -c
        - |
          set -eu
          target_dir="/config-target-root"
          target_file="${target_dir}/openclaw.json"
          mkdir -p "${target_dir}"
          if [ ! -s /config-source/openclaw.json ]; then
            echo >&2 "Rendered ConfigMap file /config-source/openclaw.json is missing or empty; verify the openclaw ConfigMap rendered correctly before deployment."
            exit 1
          fi
          if [ -s "${target_file}" ]; then
            echo "Preserving existing OpenClaw config at ${target_file}."
          else
            cp -f /config-source/openclaw.json "${target_file}" || {
              echo >&2 "Failed to bootstrap ${target_file} from /config-source/openclaw.json; verify the writable config target volume is mounted and accessible to the init container."
              exit 1
            }
          fi
          state_root=/config-target-root
          workspace_dir="${state_root}/workspace-architect"
          mkdir -p "${workspace_dir}" || {
            echo >&2 "Failed to create bootstrapped workspace directory ${workspace_dir} for agent architect."
            exit 1
          }
          target_path="${workspace_dir}/AGENTS.md"
          target_parent="$(dirname "${target_path}")"
          mkdir -p "${target_parent}" || {
            echo >&2 "Failed to create ${target_parent} before seeding AGENTS.md for agent architect."
            exit 1
          }
          if [ -e "${target_path}" ]; then
            echo "Preserving existing AGENTS.md in ${workspace_dir}."
          else
            cp -f /config-source/workspace-architect-AGENTS.md "${target_path}" || {
              echo >&2 "Failed to seed AGENTS.md into ${workspace_dir} for agent architect."
              exit 1
            }
          fi
          target_path="${workspace_dir}/HEARTBEAT.md"
