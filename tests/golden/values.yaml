        - name: DOCKER_HOST
          value: ssh://docker-remote@openclaw-sandbox:2222
        - name: HOME
          value: /home/node
        - name: MEMGRAPH_HOST
          value: memgraph.homebase.local
        - name: MEMGRAPH_PORT
          value: '7687'
        - name: MEMGRAPH_BOLT_URI
          value: bolt://memgraph.homebase.local:7687
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
