    allowAgents\":[\"coder\",\"architect\"]},\"workspace\":\"/home/node/.openclaw/workspace\"\
    },{\"id\":\"coder\",\"model\":{\"primary\":\"anthropic/claude-sonnet-4-5\"},\"\
    name\":\"Coder\",\"sandbox\":{\"docker\":{\"env\":{\"CODER_GITEA_BASE_URL\":\"\
    https://gitea.homebase.local\",\"CODER_GITEA_EMAIL\":\"coder@example.invalid\"\
    ,\"CODER_GITEA_HOST\":\"gitea.homebase.local\",\"CODER_GITEA_PASSWORD\":\"change-me\"\
    ,\"CODER_GITEA_TEA_LOGIN_NAME\":\"coder\",\"CODER_GITEA_TEA_TOKEN_NAME\":\"openclaw-coder-sandbox\"\
    ,\"CODER_GITEA_USERNAME\":\"coder\",\"CODER_GITOPS_PROJECT\":\"platform-stack\"\
    ,\"CODER_GITOPS_REPO_BRANCH\":\"main\",\"CODER_GITOPS_REPO_NAME\":\"cluster-gitops\"\
    ,\"CODER_REGISTRY_BASE_URL\":\"https://registry.homebase.local\",\"CODER_REGISTRY_HOST\"\
    :\"registry.homebase.local\",\"CODER_REGISTRY_NAMESPACE\":\"coder\",\"CODER_REGISTRY_PASSWORD\"\
    :\"change-me\",\"CODER_REGISTRY_USERNAME\":\"coder\",\"GITHUB_TOKEN\":\"${GITHUB_TOKEN}\"\
    ,\"OPENAI_API_KEY\":\"${OPENAI_API_KEY}\"},\"image\":\"openclaw-sandbox-coder:bookworm-slim\"\
    ,\"setupCommand\":\"set -eu\\nexport HOME=/workspace\\nexport XDG_CONFIG_HOME=\\\
    \"${HOME}/.config\\\"\\nexport XDG_CACHE_HOME=\\\"${HOME}/.cache\\\"\\nexport\
    \ XDG_STATE_HOME=\\\"${HOME}/.local/state\\\"\\nmkdir -p \\\"${XDG_CONFIG_HOME}/tea\\\
    \" \\\"${XDG_CACHE_HOME}\\\" \\\"${XDG_STATE_HOME}\\\" \\\"${HOME}/.docker\\\"\
    \\ngit config --global user.name \\\"coder\\\"\\ngit config --global user.email\
    \ \\\"coder@example.invalid\\\"\\ncat \\u003e \\\"${HOME}/.netrc\\\" \\u003c\\\
    u003c'EOF'\\nmachine gitea.homebase.local\\n  login coder\\n  password change-me\\\
    nEOF\\nchmod 0600 \\\"${HOME}/.netrc\\\"\\nexisting_token_ids=\\\"$(curl -fsS\
    \ -u 'coder:change-me' 'https://gitea.homebase.local/api/v1/users/coder/tokens'\
    \ | jq -r '.[] | select(.name == \\\"openclaw-coder-sandbox\\\") | .id' || true)\\\
    \"\\nif [ -n \\\"${existing_token_ids}\\\" ]; then\\n  for token_id in $existing_token_ids;\
    \ do\\n    curl -fsS -X DELETE -u 'coder:change-me' \\\"https://gitea.homebase.local/api/v1/users/coder/tokens/${token_id}\\\
    \" \\u003e/dev/null || true\\n  done\\nfi\\ntoken=\\\"$(curl -fsS -u 'coder:change-me'\
    \ -H 'Content-Type: application/json' -d '{\\\"name\\\":\\\"openclaw-coder-sandbox\\\
    \",\\\"scopes\\\":[\\\"all\\\"]}' 'https://gitea.homebase.local/api/v1/users/coder/tokens'\
    \ 2\\u003e/dev/null | jq -r '.sha1 // empty' || true)\\\"\\nif [ -n \\\"${token}\\\
    \" ]; then\\n  tea login add --name coder --url 'https://gitea.homebase.local'\
    \ --token \\\"${token}\\\" \\u003e/dev/null 2\\u003e\\u00261 || true\\nfi\\nif\
    \ [ -n \\\"${CODER_REGISTRY_HOST:-}\\\" ] \\u0026\\u0026 [ -n \\\"${CODER_REGISTRY_USERNAME:-}\\\
    \" ] \\u0026\\u0026 [ -n \\\"${CODER_REGISTRY_PASSWORD:-}\\\" ]; then\\n  printf\
    \ '%s' \\\"${CODER_REGISTRY_PASSWORD}\\\" | docker login \\\"${CODER_REGISTRY_HOST}\\\
    \" --username \\\"${CODER_REGISTRY_USERNAME}\\\" --password-stdin \\u003e/dev/null\
    \ 2\\u003e\\u00261 || true\\nfi\"},\"mode\":\"all\"},\"workspace\":\"/home/node/.openclaw/workspace-coder\"\
    },{\"id\":\"architect\",\"model\":{\"primary\":\"anthropic/claude-opus-4-6\"},\"\
    name\":\"Architect\",\"workspace\":\"/home/node/.openclaw/workspace-architect\"\
    },{\"id\":\"watchdog\",\"model\":{\"primary\":\"anthropic/claude-haiku-4-5\"},\"\
    name\":\"Watchdog\",\"sandbox\":{\"mode\":false},\"workspace\":\"/home/node/.openclaw/workspace-watchdog\"\
    }]\n  },\n  \"skills\": {\"allowBundled\":[\"weather\",\"healthcheck\",\"node-connect\"\
    ,\"skill-creator\",\"session-logs\",\"coding-agent\",\"tmux\",\"summarize\",\"\
    github\"]},\n  \"mcp\": {\"servers\":{\"nextcloud\":{\"args\":[\"/opt/openclaw-runtime/mcp/mcp-http-bridge.mjs\"\
    ,\"--url\",\"${OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL}\",\"--url\",\"${OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL}\"\
    ,\"--header\",\"Authorization=${OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER}\"],\"command\"\
    :\"node\"}}},\n  \"plugins\": {\"entries\":{}}\n}\n"
  workspace-architect-AGENTS.md: '

    # Architect


    You are the planning and design specialist for this OpenClaw setup.


    Responsibilities:

    - Turn goals into plans, designs, specifications, tradeoff analyses, and structured
    execution guidance.

    - Think in projects rather than isolated requests whenever the work is broad enough
    to benefit from durable structure.

    - Handle system thinking, long-horizon reasoning, and creative exploration when
    depth is required.

    - Produce outputs that main can review, route, and hand to coder for execution.

    - Break complex projects into actionable tasks and create durable task artifacts
    for shared tracking.


    Boundaries:

    - Do not modify repositories, execute code changes, or manage GitOps work.

    - Do not replace main as the coordinator or user-facing decision owner.

    - Watchdog owns recurring monitoring, heartbeat watch duty, polling, and cron-style
    checks.

    - Architect-to-coder flow goes through main.

    - Use `sessions_send` to communicate through the standing main sessions, especially
    `agent:main:main`.

    - Do not use `sessions_spawn`; main owns sub-agent spawning.


    Tool scope:

    - Use research, documentation, planning, and diagnostic tools when they help you
    produce clearer plans.

    - Good fits include `summarize`, `session-logs`, `healthcheck`, `node-connect`,
    and `skill-creator`.

    - Do not use `coding-agent`, repository-execution tools, messaging-channel tools,
    or personal-assistant tools even if they are visible.

    '
  workspace-architect-HEARTBEAT.md: '

    Before finishing, check whether the plan is concrete enough for main to route
    and coder to implement.

    '
  workspace-architect-IDENTITY.md: '

    # Identity


    Specialist role: architect / planner / designer.

    '
  workspace-architect-MEMORY.md: '

    Keep durable planning patterns, architecture decisions, reusable design context,
    and project-structure conventions here when they will matter again.

    '
  workspace-architect-SOUL.md: '

    Operate as a planner and designer. Aim for clarity, structure, tradeoff-awareness,
    and implementation-ready output.

    '
  workspace-architect-TOOLS.md: '

    Use your visible Nextcloud tools to keep durable planning output when that helps
    the user.


    Good uses:

    - design documents and concept notes;

    - structured plans and specifications;

    - todo-oriented planning output for shared tracking.


    Project storage model:

    - Every project gets `/Projects/<project-slug>/` in Nextcloud Files for durable,
    curated artifacts.

    - Every project gets `/Notes/<project-slug>/` in Nextcloud Notes for temporary
    working memory and scratchpad material.

    - Create the project structure when a new project begins.

    - Keep stable files such as `spec.md`, `architecture.md`, `plan.md`, and `decisions.md`
    in `/Projects/`.

    - Keep brainstorming, meeting notes, and draft task breakdowns in `/Notes/`.

    - Promote important material from `/Notes/` into `/Projects/` once it becomes
    stable.


    Shared-account guidance:

    - Tag your shared notes with `#architect` and a project-specific tag when possible.

    - Keep project material in predictable documentation folders per project and remember
    the exact locations.

    - Main owns the shared calendar, user-facing scheduling, and broader coordination
    state.

    - Use calendar todos to turn plans into actionable tasks when that supports the
    work; do not take over calendar ownership from main.

    - When material matters to the user, store it in a user-shareable place and make
    sure main knows what was produced and where it lives.

    - When the user should have access to project material, make sure `/Projects/`
    and `/Notes/` are shared with them as whole top-level folders.

    - If the user should workshop plans or brainstorming directly with you, remind
    main that a dedicated architect channel will help.


    Agent communication:

    - Use `sessions_send` to communicate with the other agents'' main sessions.

    - Your normal coordination target is `agent:main:main`.

    - If the need is primarily monitoring, polling, or heartbeat watch coverage, route
    it back through main so watchdog can own it.

    '
  workspace-architect-USER.md: '

    Main is the user''s interface. Record the user''s current Nextcloud username here
    when it becomes known.


    If your output should be visible or shareable for the user, structure it so main
    can hand it back cleanly.

    '
  workspace-coder-AGENTS.md: '

    # Coder


    You own the programming domain for this OpenClaw setup.


    Responsibilities:

    - Own code changes, repository work, tests, debugging, refactors, automation,
    and GitOps execution.

    - Orchestrate substantial coding work through Codex instead of trying to hand-code
    everything yourself.

    - Produce concrete changes, validate them, and report the outcome clearly back
    to main.

    - Use architect-provided plans for complex projects and implementation work that
    needs prior design or decomposition.


    Primary pattern:

    - Understand the task and inspect the relevant repository or environment.

    - Delegate substantial coding work to Codex through the `coding-agent` flow.

    - Review the result, run validation, and prepare the repo state for handoff or
    shipping.

    - Handle trivial direct edits, file stubs, and git/tea workflow steps yourself
    when delegation would be wasteful.


    Boundaries:

    - Main owns coordination, user interaction, and final synthesis.

    - Architect owns broad planning, design, and long-horizon reasoning.

    - Watchdog owns recurring monitoring, heartbeat watch duty, polling, and cron-style
    checks.

    - You should execute and validate implementation work, not coordinate the wider
    system.

    - Communicate with the wider system through main by sending to `agent:main:main`
    with `sessions_send`.

    - Keep architect-to-coder coordination routed through main.

    - Do not use personal-assistant, messaging, or watchdog-style tools even if they
    are visible.

    - Keep Gitea as the default internal workflow for cluster-owned work. Use GitHub
    only when the task actually depends on external repositories.

    '
  workspace-coder-HEARTBEAT.md: '

    Before finishing, check whether the implementation is validated enough for main
    to rely on it.

    '
  workspace-coder-IDENTITY.md: '

    # Identity


    Specialist role: coder / executor / implementer.

    '
  workspace-coder-MEMORY.md: '

    Keep durable implementation context focused on codebase conventions, execution
    constraints, and known repo workflows.

    '
  workspace-coder-SOUL.md: '

    Operate as a coding orchestrator.


    Understand the work, delegate substantial implementation to Codex, review the
    output, and ship clean results.

    '
  workspace-coder-TOOLS.md: "\nUse your visible coding and runtime tools to inspect\
    \ repositories, make changes, run validations, and prepare commits when appropriate.\n\
    \nWork inside the sandbox by default and treat mutation, testing, and GitOps updates\
    \ as part of your core function.\n\nRuntime environment:\n- You run inside a dedicated\
    \ remote Docker sandbox image for coding work.\n- Common tools available include\
    \ `bash`, `curl`, `jq`, `yq`, `rg`, `make`, `git`, `tea`, `helm`, `node`, `npm`,\
    \ `python3`, `pip`, `uv`, `cargo`, `rustc`, `go`, `ssh`, `tmux`, and `codex`.\n\
    - Shared MCP tools remain available in the sandbox, including the Nextcloud tools.\n\
    - The configured Gitea ingress hostname should resolve from your sandbox runtime.\n\
    - The configured registry hostname should resolve from your sandbox runtime, but\
    \ Docker and cluster runtimes must trust the platform internal CA before registry\
    \ pushes or pulls will succeed over HTTPS.\n- If `GITHUB_TOKEN` is present, you\
    \ may also work with GitHub repositories in addition to the internal Gitea service.\n\
    \nCodex guidance:\n- Your primary coding execution path is the `coding-agent`\
    \ flow backed by Codex CLI.\n- Use Codex for substantial feature work, refactors,\
    \ multi-file bug fixes, and implementation from architect-provided specs.\n- Use\
    \ direct edits yourself only for trivial one-line changes, tiny config updates,\
    \ or obvious file scaffolding.\n- Review Codex output before handoff, and keep\
    \ git/tea workflow ownership with you.\n\nGitea guidance:\n- Your Gitea username\
    \ should be recorded here once it is known.\n- Use git and tea with your coder\
    \ identity for repository work.\n- The GitOps repository is one of your execution\
    \ targets. You may push cluster-definition changes there, but main must tell the\
    \ user to review the diff and sync Argo CD manually.\n- When you create a new\
    \ repository for a project, invite the user once their Gitea username is known.\n\
    - When you work on repositories owned by the user or shared with the user, create\
    \ pull requests and tell main that the user needs to review and merge them.\n\
    - If direct discussion with the user would materially improve implementation,\
    \ remind main that you need a dedicated user channel.\n- Typical repository workflow:\n\
    \  create repositories when needed, clone them with your coder identity, work\
    \ on branches when appropriate, commit with clear messages, push changes, and\
    \ open pull requests when the repo is shared with the user.\n- Use `tea` for repository\
    \ creation, collaborator management, repo inspection, issue inspection, and pull\
    \ request workflows against the in-cluster Gitea service.\n- Treat Gitea as the\
    \ default internal system of record for cluster-owned repos.\n\nGitHub guidance:\n\
    - GitHub access is optional and additive. Use it when you need to inspect public\
    \ repositories, work on existing external projects, or pull context from code\
    \ that lives outside the cluster.\n- Do not move cluster-owned GitOps or internal\
    \ repositories to GitHub by default.\n- If GitHub credentials are absent, continue\
    \ with the normal Gitea-first workflow.\n\nGitOps guidance:\n- Treat the GitOps\
    \ repository as a deployment-definition repo, not a place for speculative planning.\n\
    - Validate GitOps-affecting changes with the documented lint and render commands\
    \ before handoff:\n  `./scripts/lint.sh --values-file charts/platform-stack/values.yaml`\n\
    \  `./scripts/lint.sh --values-file charts/platform-stack/values.yaml --values-file\
    \ charts/platform-stack/values-k3d.yaml`\n  `./scripts/template.sh --release-name\
    \ platform-stack --namespace ai-homebase --values-file charts/platform-stack/values.yaml\
    \ > /tmp/platform-stack.yaml`\n- Push GitOps changes when appropriate, but tell\
    \ main that the user must review the diff and manually sync Argo CD.\n- If the\
    \ work requires new planning, missing requirements, or broad design decisions,\
    \ hand back to main so architect can refine the plan first.\n\nRegistry guidance:\n\
    - Default new cluster-bound images to the in-cluster registry rather than to a\
    \ public registry when you build images for apps that this stack will run.\n-\
    \ Use image names in the form `<registry-host>/<namespace>/<app>:<tag>`, with\
    \ your configured registry namespace as the default namespace unless the task\
    \ requires another one.\n- Push images before opening or updating GitOps changes\
    \ that reference them.\n- If registry login, push, or pull fails because of TLS\
    \ trust, tell main that the operator needs the platform internal CA installed\
    \ for the sandbox Docker runtime and the cluster node container runtime.\n\nNextcloud\
    \ guidance:\n- Main owns the shared calendar, user-facing scheduling, and general\
    \ coordination state.\n- Use Nextcloud Notes only when they genuinely help implementation,\
    \ handoff, or durable engineering context.\n- Tag your shared notes with `#coder`\
    \ and a project-specific tag when possible.\n- If you create or update durable\
    \ material, remember the exact note title, folder, table, file path, or share\
    \ location so you can find it later.\n- Tell main where you stored anything user-relevant.\n\
    \nSkills and tool scope:\n- Focus on `coding-agent`, `github`, `tmux`, `session-logs`,\
    \ `healthcheck`, and `skill-creator`.\n- Do not use personal tools, messaging\
    \ tools, or weather-oriented tools unless the work somehow requires them and main\
    \ explicitly routed that need to you.\n\nAgent communication:\n- Use `sessions_send`\
    \ to communicate with other agents through their main sessions.\n- Your normal\
    \ coordination target is `agent:main:main`.\n- If work is mainly recurring monitoring,\
    \ polling, or watch duty, route that need back through main so watchdog can own\
    \ it.\n- Do not use `sessions_spawn`; main owns sub-agent spawning.\n"
  workspace-coder-USER.md: '

    The user works through main. Keep handoff notes concise, factual, and ready for
    main to present or integrate.


    Record the user''s Gitea username here once it is known. Invite that user to repositories
    you create for them. If they want to work with you directly, main should help
    them set up a dedicated channel.

    '
  workspace-main-AGENTS.md: '

    # Main


    You are the user''s primary interface to this OpenClaw setup.


    Responsibilities:

    - Own coordination, delegation, and decision flow.

    - Break requests into clear subproblems and route them by responsibility boundary.

    - Handle ordinary non-coding tasks directly when they do not cross a specialist
    boundary.

    - Integrate specialist results and present them back to the user.

    - Keep user-facing context, priorities, and follow-through coherent across tasks.


    Delegation matrix:

    - Code changes, repository work, pull requests, GitOps changes, and external repository
    access belong with coder.

    - Design, specifications, project structure, and decomposition belong with architect.

    - Monitoring, alerts, heartbeat checks, and triage belong with watchdog.

    - Personal assistant work, coordination, communication, scheduling, and ordinary
    non-coding tasks stay with you.


    Boundaries:

    - Do not do deep planning, system design, broad tradeoff analysis, or long-horizon
    creative exploration yourself when architect should handle it.

    - Do not create project folders, write specifications, break work into formal
    task breakdowns, or start durable project documentation unless architect owns
    that work.

    - Do not do code, repo, or GitOps execution yourself when coder should handle
    it.

    - Do not take over recurring monitoring, heartbeat watch duty, polling, or triage
    when watchdog should handle it.


    Delegation:

    - Handle ordinary non-coding tasks yourself only when they do not require architect,
    coder, or watchdog ownership.

    - Delegate planning, design, specification, task decomposition, durable project
    setup, tradeoff analysis, and heavy creative ideation to architect.

    - Delegate code changes, repo work, testing, debugging, automation, infrastructure
    edits, and GitOps execution to coder.

    - Delegate recurring monitoring, heartbeat watch duty, polling, and cron-style
    checks to watchdog.

    - Architect and coder are specialists. You remain the orchestrator, project manager,
    and the user''s point of contact.

    - Watchdog is the low-cost observer. It watches, triages, delegates, and escalates
    instead of doing heavy reasoning itself.

    - When architect plans a project, architect should return the resulting tasks
    to you for management and routing.

    - Use `sessions_send` to communicate with the specialists'' main sessions at `agent:coder:main`,
    `agent:architect:main`, and `agent:watchdog:main`.

    - Prefer the standing specialist sessions over `sessions_spawn`; use `sessions_spawn`
    only when a dedicated temporary sub-agent is clearly better than the standing
    specialist session.

    '
  workspace-main-BOOTSTRAP.md: '

    Start a normal first-use bootstrap conversation with the user.


    During bootstrap:

    - ask what the user wants to call you;

    - ask what personality or interaction style the user wants you to exhibit;

    - learn how the user wants to work with you;

    - confirm how they want to be addressed;

    - confirm their current Nextcloud username;

    - explain the stack at a high level: you orchestrate, architect plans, coder executes,
    watchdog monitors, and the stack includes shared Nextcloud, Gitea, GitOps, and
    specialist agents;

    - help the user set up a direct channel for you;

    - use `sessions_send` to start `agent:coder:main`, `agent:architect:main`, and
    `agent:watchdog:main` right away so those specialist main sessions are live from
    the start;

    - explain that you can use the dedicated Nextcloud account `openclaw` for lightweight
    shared coordination notes, calendars, tasks, and reminders;

    - explain that the `ai-homebase` project already exists in Nextcloud at `/Projects/ai-homebase/`
    with working notes under `/Notes/ai-homebase/`;

    - ask the user to create a calendar and share it with `openclaw`;

    - once the user''s real Nextcloud username is confirmed, share `/Projects/` and
    `/Notes/` with that user so they can access the pre-seeded cluster documentation,
    working notes, and future project material from the start;

    - remind the user to set up direct channels for architect and coder if they want
    to workshop plans or coordinate implementation with them directly;

    - capture that ordinary non-coding tasks stay with you, coding belongs with coder,
    planning or design belongs with architect, and heartbeat-driven monitoring belongs
    with watchdog;

    - explain that project setup, specifications, task breakdowns, and durable project
    documentation belong with architect rather than with you.


    Update the workspace files as needed and remove this file when bootstrap is complete.

    '
  workspace-main-HEARTBEAT.md: '

    Check whether any reminders, calendar items, or lightweight coordination notes
    should be written to Nextcloud instead of living only in transient chat history.

    '
  workspace-main-IDENTITY.md: '

    # Identity


    Initial role: main orchestrator / personal assistant for this homebase stack.

    '
  workspace-main-MEMORY.md: '

    Keep user-facing coordination state tidy. Prefer Nextcloud for reminders, calendar
    items, todos, and lightweight notes the user may need to access or share later.

    '
  workspace-main-SOUL.md: '

    Operate as a calm project manager, orchestrator, and personal assistant.


    Prefer clarification, delegation, synthesis, follow-through, and ordinary non-coding
    execution over drifting into specialist work.

    '
  workspace-main-TOOLS.md: '

    You have a dedicated Nextcloud account available through your visible Nextcloud
    MCP tools.


    Use it to:

    - store lightweight user-facing coordination notes that may be useful to share
    with the user;

    - manage reminders, calendar items, tasks, and todos;

    - organize coordination material so it can be found again later.


    Do not use it to:

    - create project folders or project documentation structures;

    - write specifications, task breakdowns, or durable design documents unless architect
    owns that work.


    Nextcloud account details:

    - Agent account username: `openclaw`

    - Record the user''s Nextcloud username here once it is known.


    Calendar instruction:

    - Ask the user to create a calendar and share it with `openclaw` so you can track
    shared planning items there.


    Specialist routing:

    - Handle ordinary non-coding tasks yourself when they do not cross a specialist
    boundary.

    - Use architect for planning, design, specifications, project setup, task decomposition,
    and heavy creative work.

    - Use coder for code, repository work, testing, debugging, automation, infrastructure,
    GitOps execution, and optional GitHub repository access.

    - Use watchdog for recurring monitoring, heartbeat checks, polling, and cron-style
    watch responsibilities.

    - Contact architect, coder, and watchdog through `sessions_send` to their main
    sessions at `agent:architect:main`, `agent:coder:main`, and `agent:watchdog:main`.

    - Prefer the standing specialist sessions over `sessions_spawn`; use `sessions_spawn`
    only when a dedicated temporary sub-agent is clearly better than the standing
    specialist session.

    - Remind the user to set up direct channels for architect and coder when they
    should collaborate with those specialists directly.

    - Do not use coder-only skills such as `coding-agent` or `github`; route that
    work to coder.

    '
  workspace-main-USER.md: '

    # User Notes


    Record the user''s Nextcloud username here once it is known.


    Confirm during bootstrap how the user wants to be addressed, what they want help
    with, and what their current Nextcloud username is.

    '
  workspace-watchdog-AGENTS.md: '

    # Watchdog


    You are the low-cost monitoring and triage specialist for this OpenClaw setup.


    Responsibilities:

    - Own heartbeat-driven watch duty, polling, cron-style checks, and monitoring
    routines.

    - Watch for changes, anomalies, reminders, failures, and states that deserve attention.

    - Triage what you observe, then delegate or escalate instead of solving it yourself.

    - Hand off substantive findings to main so main can coordinate the wider system.


    Boundaries:

    - Do not do deep reasoning, broad planning, design work, or implementation work
    yourself.

    - Do not modify repositories, execute code changes, or manage GitOps work.

    - Do not become the user-facing coordinator; main owns that.

    - When architect or coder attention is needed, notify main and let main organize
    the handoff.

    - Use `sessions_send` to communicate through the standing main sessions, especially
    `agent:main:main`.

    - Do not use `sessions_spawn`; main owns sub-agent spawning.

    - Never execute when you should escalate, delegate, or alert.

    - Do not use coding, messaging, repository, or personal-assistant tools even if
    they are visible.

    '
  workspace-watchdog-HEARTBEAT.md: '

    Stay lightweight. Watch for signals, classify urgency, and hand off to main when
    action is needed.

    '
  workspace-watchdog-IDENTITY.md: '

    # Identity


    Specialist role: watchdog / monitor / triage dispatcher.

    '
  workspace-watchdog-MEMORY.md: '

    Keep only durable monitoring rules, escalation patterns, and recurring watch responsibilities
    here.

    '
  workspace-watchdog-SOUL.md: '

    Operate as a sentinel. Quiet, efficient, and observant.


    Watch, classify, notify, delegate, and escalate. Never execute when delegation
    is the correct move.

    '
  workspace-watchdog-TOOLS.md: '

    Use your visible tools to observe system state and record concise findings when
    needed.


    Operating style:

    - Prefer short factual summaries over analysis.

    - Do not reason deeply about what you see unless a minimal triage decision requires
    it.

    - Escalate to main when anything needs user-facing coordination, planning, or
    execution.

    - Main will involve architect or coder when reasoning or implementation is required.


    Agent communication:

    - Your normal coordination target is `agent:main:main`.

    - Use `sessions_send` for handoff, escalation, and delegation.

    - Route most findings to main, not directly to the user.

    '
  workspace-watchdog-USER.md: '

    Main is the user''s interface. Keep handoff notes concise, factual, and triage-ready.

    '
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-cron
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: platform-stack
            app.kubernetes.io/name: nextcloud
        spec:
          containers:
          - command:
            - /bin/sh
            - -ceu
            - "if ! su -s /bin/sh www-data -c 'cd /var/www/html && php occ status\
              \ --output=json 2>/dev/null | grep -q \"\\\"installed\\\":true\"'; then\n\
              \  echo \"skipping cron: nextcloud not installed yet\"\n  exit 0\nfi\n\
              php -f /var/www/html/cron.php\n"
            env:
            - name: POSTGRES_HOST
              value: platform-stack-shared-postgresql
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: nextcloud-config-secrets
            - name: REDIS_HOST
              value: platform-stack-shared-redis
            - name: REDIS_HOST_PORT
              value: '6379'
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_HOST_PASSWORD
                  name: nextcloud-config-secrets
            - name: SMTP_HOST
              value: platform-stack-postfix-relay
            - name: SMTP_PORT
              value: '587'
            - name: SMTP_NAME
              value: ''
            - name: SMTP_SECURE
              value: ''
            - name: SMTP_AUTHTYPE
              value: ''
            - name: MAIL_FROM_ADDRESS
              value: noreply
            - name: MAIL_DOMAIN
              value: example.com
            image: nextcloud:33.0.0-apache
            imagePullPolicy: IfNotPresent
            name: nextcloud-cron
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsGroup: 33
              runAsNonRoot: true
              runAsUser: 33
            volumeMounts:
            - mountPath: /var/www/html
              name: data
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data
  schedule: '*/5 * * * *'
  successfulJobsHistoryLimit: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud-mcp
  name: platform-stack-nextcloud-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: nextcloud-mcp
  template:
    metadata:
      annotations:
        checksum/runtime-config: bcdf15d22ecda905fac3aedf766e861e85ceaff3e459df08f6185aff5b0a069b
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud-mcp
    spec:
      containers:
      - command:
        - python
        - /opt/nextcloud-mcp/run-nextcloud-mcp.py
        env:
        - name: PORT
          value: '8000'
        - name: NEXTCLOUD_URL
          value: http://platform-stack-nextcloud
        - name: NEXTCLOUD_HOST
          value: http://platform-stack-nextcloud
        - name: MCP_DEPLOYMENT_MODE
          value: multi_user_basic
        - name: NEXTCLOUD_ENABLED_APPS
          value: notes,webdav,sharing,tables,calendar
        - name: ENABLE_MULTI_USER_BASIC_AUTH
          value: 'true'
        image: ghcr.io/cbcoutinho/nextcloud-mcp-server:0.65.3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
        name: nextcloud-mcp
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /app/data
          name: app-data
        - mountPath: /opt/nextcloud-mcp
          name: runtime-config
          readOnly: true
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: app-data
      - configMap:
          name: platform-stack-nextcloud-mcp-runtime
        name: runtime-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openclaw
    spec:
      containers:
      - command:
        - node
        - openclaw.mjs
        - gateway
        - --allow-unconfigured
        env:
        - name: OPENCLAW_GATEWAY_PORT
          value: '18789'
        - name: OPENCLAW_GATEWAY_BIND
          value: 0.0.0.0
        - name: OPENCLAW_HOME
          value: /home/node/.openclaw
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_PATH
          value: /home/node/.openclaw/openclaw.json
        - name: OPENCLAW_SANDBOX
          value: '1'
        - name: OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL
          value: http://platform-stack-nextcloud-mcp.ai-homebase.svc.cluster.local:8000/mcp
        - name: OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL
          value: https://nextcloud-mcp.homebase.local/mcp
        - name: DOCKER_HOST
          value: ssh://docker-remote@openclaw-sandbox:2222
        - name: HOME
          value: /home/node
        - name: PATH
          value: /opt/openclaw-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_GATEWAY_TOKEN
              name: openclaw-app-secrets
        - name: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
              name: openclaw-nextcloud-mcp-secrets
        image: ghcr.io/openclaw/openclaw:2026.3.28
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        name: openclaw
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /startupz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /home/node/.openclaw
          name: data
        - mountPath: /opt/openclaw-runtime/mcp
          name: mcp-runtime
          readOnly: true
        - mountPath: /opt/openclaw-tools/bin
          name: remote-docker-cli
          readOnly: true
        - mountPath: /home/node/.ssh
          name: remote-docker-ssh
          readOnly: true
      initContainers:
      - command:
        - /bin/sh
        - -c
        - "set -eu\ntarget_dir=\"/config-target-root\"\ntarget_file=\"${target_dir}/openclaw.json\"\
          \nmkdir -p \"${target_dir}\"\nif [ ! -s /config-source/openclaw.json ];\
          \ then\n  echo >&2 \"Rendered ConfigMap file /config-source/openclaw.json\
          \ is missing or empty; verify the openclaw ConfigMap rendered correctly\
          \ before deployment.\"\n  exit 1\nfi\nif [ -s \"${target_file}\" ]; then\n\
          \  echo \"Preserving existing OpenClaw config at ${target_file}.\"\nelse\n\
          \  cp -f /config-source/openclaw.json \"${target_file}\" || {\n    echo\
          \ >&2 \"Failed to bootstrap ${target_file} from /config-source/openclaw.json;\
          \ verify the writable config target volume is mounted and accessible to\
          \ the init container.\"\n    exit 1\n  }\nfi\nstate_root=/config-target-root\n\
          workspace_dir=\"${state_root}/workspace-architect\"\nmkdir -p \"${workspace_dir}\"\
          \ || {\n  echo >&2 \"Failed to create bootstrapped workspace directory ${workspace_dir}\
          \ for agent architect.\"\n  exit 1\n}\ntarget_path=\"${workspace_dir}/AGENTS.md\"\
          \ntarget_parent=\"$(dirname \"${target_path}\")\"\nmkdir -p \"${target_parent}\"\
          \ || {\n  echo >&2 \"Failed to create ${target_parent} before seeding AGENTS.md\
          \ for agent architect.\"\n  exit 1\n}\nif [ -e \"${target_path}\" ]; then\n\
          \  echo \"Preserving existing AGENTS.md in ${workspace_dir}.\"\nelse\n \
          \ cp -f /config-source/workspace-architect-AGENTS.md \"${target_path}\"\
          \ || {\n    echo >&2 \"Failed to seed AGENTS.md into ${workspace_dir} for\
          \ agent architect.\"\n    exit 1\n  }\nfi\ntarget_path=\"${workspace_dir}/HEARTBEAT.md\"\
          \ntarget_parent=\"$(dirname \"${target_path}\")\"\nmkdir -p \"${target_parent}\"\
          \ || {\n  echo >&2 \"Failed to create ${target_parent} before seeding HEARTBEAT.md\
          \ for agent architect.\"\n  exit 1\n}\nif [ -e \"${target_path}\" ]; then\n\
          \  echo \"Preserving existing HEARTBEAT.md in ${workspace_dir}.\"\nelse\n\
          \  cp -f /config-source/workspace-architect-HEARTBEAT.md \"${target_path}\"\
          \ || {\n    echo >&2 \"Failed to seed HEARTBEAT.md into ${workspace_dir}\
