spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: platform-stack
            app.kubernetes.io/name: nextcloud
        spec:
          containers:
          - command:
            - /bin/sh
            - -ceu
            - |
              if ! su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; then
                echo "skipping cron: nextcloud not installed yet"
                exit 0
              fi
              php -f /var/www/html/cron.php
            env:
            - name: POSTGRES_HOST
              value: platform-stack-shared-postgresql
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: nextcloud-config-secrets
            - name: REDIS_HOST
              value: platform-stack-shared-redis
            - name: REDIS_HOST_PORT
              value: '6379'
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_HOST_PASSWORD
                  name: nextcloud-config-secrets
            - name: SMTP_HOST
              value: platform-stack-postfix-relay
            - name: SMTP_PORT
              value: '587'
            - name: SMTP_NAME
              value: ''
            - name: SMTP_SECURE
              value: ''
            - name: SMTP_AUTHTYPE
              value: ''
            - name: MAIL_FROM_ADDRESS
              value: noreply
            - name: MAIL_DOMAIN
              value: example.com
            image: nextcloud:33.0.2-apache
            imagePullPolicy: IfNotPresent
            name: nextcloud-cron
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsGroup: 33
              runAsNonRoot: true
              runAsUser: 33
            volumeMounts:
            - mountPath: /var/www/html
              name: data
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data
  schedule: '*/5 * * * *'
  successfulJobsHistoryLimit: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: memgraph
  name: platform-stack-memgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: memgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: memgraph
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          exec /usr/lib/memgraph/memgraph \
            --bolt-address=0.0.0.0 \
            --bolt-port=7687 \
            --monitoring-address=0.0.0.0 \
            --monitoring-port=7444 \
            --data-directory=/var/lib/memgraph
        image: memgraph/memgraph:3.8.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 15
          tcpSocket:
            port: bolt
        name: memgraph
        ports:
        - containerPort: 7687
          name: bolt
        - containerPort: 7444
          name: http
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: bolt
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/memgraph
          name: data
        - mountPath: /var/log/memgraph
          name: logs
      initContainers:
      - command:
        - sh
        - -ceu
        - |
          mkdir -p /var/lib/memgraph
          mkdir -p /var/log/memgraph
          chown -R 0:0 /var/lib/memgraph
          chown -R 0:0 /var/log/memgraph
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        name: volume-permissions
        securityContext:
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/memgraph
          name: data
        - mountPath: /var/log/memgraph
          name: logs
      securityContext:
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-memgraph-data
      - name: logs
---
