apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qdrant
  name: platform-stack-qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: qdrant
    spec:
      containers:
      - env:
        - name: QDRANT__STORAGE__STORAGE_PATH
          value: /qdrant/storage/storage
        - name: QDRANT__STORAGE__SNAPSHOTS_PATH
          value: /qdrant/storage/snapshots
        - name: QDRANT__STORAGE__TEMP_PATH
          value: /qdrant/storage/tmp
        image: qdrant/qdrant:v1.17.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        name: qdrant
        ports:
        - containerPort: 6333
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /qdrant/storage
          name: data
      initContainers:
      - command:
        - sh
        - -ceu
        - |
          mkdir -p /qdrant/storage/storage /qdrant/storage/snapshots /qdrant/storage/tmp
          chown -R 0:0 /qdrant/storage
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        name: volume-permissions
        securityContext:
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /qdrant/storage
          name: data
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-qdrant-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qdrant-mcp
  name: platform-stack-qdrant-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: qdrant-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: qdrant-mcp
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          if [ ! -x /tmp/qdrant-mcp/bin/mcp-server-qdrant ]; then
            python -m venv /tmp/qdrant-mcp
            /tmp/qdrant-mcp/bin/pip install --no-cache-dir "mcp-server-qdrant==0.8.0"
          fi
          exec /tmp/qdrant-mcp/bin/mcp-server-qdrant --transport streamable-http
        env:
        - name: FASTMCP_PORT
          value: '8000'
        - name: QDRANT_URL
          value: http://platform-stack-qdrant:6333
        - name: COLLECTION_NAME
          value: openclaw-memory
        - name: EMBEDDING_PROVIDER
          value: fastembed
        - name: EMBEDDING_MODEL
          value: BAAI/bge-base-en-v1.5
        - name: TOOL_STORE_DESCRIPTION
          value: |
            Store a memory for cross-agent recall. Use this to preserve durable knowledge such as user preferences, decisions, conventions, patterns, incidents, plans, creative content, and reusable context.

            REQUIRED: The `information` parameter must begin with domain and kind tags in brackets, followed by a complete statement:
              [real|speculative|fictional|synthetic] [user-preference|user-context|decision|convention|pattern|fact|plan|task-context|incident|monitor-rule|creative|relationship|reference] Your memory text here.

            REQUIRED: The `metadata` parameter must be a JSON object with at minimum:
              {"kind": "...", "domain": "...", "agent": "...", "created": "ISO-8601"}

            Optional metadata: confidence (high|medium|low), project, tags (array), nc_refs (array of {type, id, path, label}), supersedes, expiry, source_url.

            Guidelines:
            - Store facts you would want any agent to recall weeks later.
            - Do not store ephemeral task status, transient tool output, or easily re-derivable information.
            - Do not store secrets or credentials.
            - For fictional or creative content, always use domain `fictional`.
            - If correcting a prior memory, include `supersedes` in metadata and mention the correction in the text.
            - Include Nextcloud references in both the text and `nc_refs` metadata when relevant.
        - name: TOOL_FIND_DESCRIPTION
          value: |
            Search shared semantic memory across all agents. Returns memories ranked by relevance.

            Use this tool before answering questions about user preferences, prior decisions, established conventions, past incidents, project history, people and relationships, creative worlds, or anything that may have been stored previously.

            Query tips:
            - Include a domain tag when useful: `[real] user's preferred editor` or `[fictional] Ashenmoor political structure`
            - Include a kind tag when useful: `[decision] database choice for Nextcloud`
            - Use natural language for broad recall.
            - Be specific when possible.
            - If results mix real and fictional content, re-query with an explicit `[real]` or `[fictional]` prefix.

            Important:
            - This searches all memories from all agents.
            - Returned memories include metadata such as kind, domain, agent, confidence, and Nextcloud references.
            - Treat speculative or low-confidence results cautiously.
            - Treat expired memories as potentially stale.

            Filtering:
            - You can filter by metadata fields using the `query_filter` parameter.
            - All memories include a `created` ISO-8601 timestamp in metadata.
            - Common metadata fields: `kind`, `domain`, `agent`, `confidence`, `project`, `tags`.
            - Example: Find memories from the last 24 hours:
              query_filter: {"must": [{"key": "created", "range": {"gte": "2026-04-02T00:00:00Z"}}]}
            - Example: Find memories by a specific agent:
              query_filter: {"must": [{"key": "agent", "match": {"value": "coder"}}]}
            - Example: Find decisions from a specific project:
              query_filter: {"must": [{"key": "kind", "match": {"value": "decision"}}, {"key": "project", "match": {"value": "ai-homebase"}}]}
            - Combine semantic search (the `query` parameter) with filters for best results.
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: HF_HOME
          value: /tmp/.cache/huggingface
        - name: HUGGINGFACE_HUB_CACHE
          value: /tmp/.cache/huggingface/hub
        - name: FASTMCP_HOST
          value: 0.0.0.0
        - name: QDRANT_ALLOW_ARBITRARY_FILTER
          value: 'true'
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 300
          periodSeconds: 15
          tcpSocket:
            port: http
        name: qdrant-mcp
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          initialDelaySeconds: 180
          periodSeconds: 10
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
