          \ 2>/dev/null | grep -q \"\\\"installed\\\":true\"'; do\n  echo \"waiting\
          \ for nextcloud bootstrap\"\n  sleep 5\ndone\n\nensure_parent_dir() {\n\
          \  target=\"$1\"\n  parent_dir=\"$(dirname \"${target}\")\"\n  mkdir -p\
          \ \"${parent_dir}\"\n  chown 33:33 \"${parent_dir}\"\n  chmod 0750 \"${parent_dir}\"\
          \n}\n\nwrite_managed_file() {\n  target=\"$1\"\n  temp_file=\"$(mktemp)\"\
          \n  cat >\"${temp_file}\"\n  if [ ! -f \"${target}\" ] || ! cmp -s \"${temp_file}\"\
          \ \"${target}\"; then\n    cp \"${temp_file}\" \"${target}\"\n    chown\
          \ 33:33 \"${target}\"\n    chmod 0640 \"${target}\"\n  fi\n  rm -f \"${temp_file}\"\
          \n}\nowner_username=\"openclaw\"\nproject_slug=\"ai-homebase\"\nproject_root=\"\
          /var/www/html/data/${owner_username}/files/Projects/${project_slug}\"\n\
