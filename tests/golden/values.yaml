apiVersion: v1
data:
  openclaw.json: "{\n  \"gateway\": {\n    \"mode\": \"local\",\n    \"bind\": \"\
    lan\",\n    \"port\": 18789,\n    \"auth\": {\n      \"mode\": \"token\",\n  \
    \    \"token\": \"${OPENCLAW_GATEWAY_TOKEN}\"\n    },\n    \"controlUi\": {\n\
    \      \"enabled\": true,\n      \"allowedOrigins\": [\"https://openclaw.homebase.local\"\
    ]\n    },\n    \"trustedProxies\": []\n  },\n  \"agents\": {\n    \"defaults\"\
    : {\n      \"workspace\": \"~/.openclaw/workspace\",\n      \"sandbox\": {\"browser\"\
    :{\"cdpPort\":9222,\"cdpSourceRange\":\"\",\"enableNoVnc\":true,\"enabled\":true,\"\
    headless\":false,\"image\":\"openclaw-sandbox-browser:bookworm-slim\",\"network\"\
    :\"bridge\",\"noVncPort\":6080,\"vncPort\":5900},\"docker\":{\"capDrop\":[\"ALL\"\
    ],\"cpus\":1,\"image\":\"openclaw-sandbox:bookworm-slim\",\"memory\":\"1g\",\"\
    memorySwap\":\"2g\",\"network\":\"bridge\",\"pidsLimit\":256,\"readOnlyRoot\"\
    :true,\"tmpfs\":[\"/tmp\",\"/var/tmp\",\"/run\"],\"user\":\"1000:1000\",\"workdir\"\
    :\"/workspace\"},\"mode\":\"non-main\",\"scope\":\"agent\"}\n    },\n    \"list\"\
    : [{\"id\":\"default\",\"name\":\"OpenClaw Assistant\",\"workspace\":\"~/.openclaw/workspace\"\
    }]\n  },\n  \"plugins\": {\"entries\":{}}\n}\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-cron
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: platform-stack
            app.kubernetes.io/name: nextcloud
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - php -f /var/www/html/cron.php
            env:
            - name: POSTGRES_HOST
              value: ''
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: ''
            - name: POSTGRES_USER
              value: ''
            - name: REDIS_HOST
              value: ''
            - name: REDIS_HOST_PORT
              value: '6379'
            - name: SMTP_HOST
              value: ''
            - name: SMTP_PORT
              value: '587'
            - name: SMTP_NAME
              value: ''
            - name: MAIL_FROM_ADDRESS
              value: ''
            - name: MAIL_DOMAIN
              value: ''
            image: nextcloud:29.0.0-apache
            imagePullPolicy: IfNotPresent
            name: nextcloud-cron
            volumeMounts:
            - mountPath: /var/www/html
              name: data
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
  schedule: '*/5 * * * *'
  successfulJobsHistoryLimit: 3
---
apiVersion: apps/v1
