apiVersion: v1
data:
  openclaw.json: "{\n  \"gateway\": {\n    \"mode\": \"local\",\n    \"bind\": \"\
    lan\",\n    \"port\": 18789,\n    \"auth\": {\n      \"mode\": \"token\",\n  \
    \    \"token\": \"${OPENCLAW_GATEWAY_TOKEN}\"\n    },\n    \"controlUi\": {\n\
    \      \"enabled\": true,\n      \"allowedOrigins\": [\"https://openclaw.homebase.local\"\
    ]\n    },\n    \"trustedProxies\": []\n  },\n  \"agents\": {\n    \"defaults\"\
    : {\n      \"workspace\": \"/home/node/.openclaw/workspace\",\n      \"sandbox\"\
    : {\"backend\":\"docker\",\"browser\":{\"cdpPort\":9222,\"cdpSourceRange\":\"\"\
    ,\"enableNoVnc\":true,\"enabled\":true,\"headless\":false,\"image\":\"openclaw-sandbox-browser:bookworm-slim\"\
    ,\"network\":\"bridge\",\"noVncPort\":6080,\"vncPort\":5900},\"docker\":{\"capDrop\"\
    :[\"ALL\"],\"cpus\":1,\"image\":\"openclaw-sandbox:bookworm-slim\",\"memory\"\
    :\"1g\",\"memorySwap\":\"2g\",\"network\":\"bridge\",\"pidsLimit\":256,\"readOnlyRoot\"\
    :true,\"tmpfs\":[\"/tmp\",\"/var/tmp\",\"/run\"],\"user\":\"1000:1000\",\"workdir\"\
    :\"/workspace\"},\"mode\":\"non-main\",\"scope\":\"agent\"}\n    },\n    \"list\"\
    : [{\"id\":\"default\",\"name\":\"OpenClaw Assistant\",\"workspace\":\"/home/node/.openclaw/workspace\"\
    }]\n  },\n  \"plugins\": {\"entries\":{}}\n}\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-cron
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: platform-stack
            app.kubernetes.io/name: nextcloud
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - php -f /var/www/html/cron.php
            env:
            - name: POSTGRES_HOST
              value: platform-stack-shared-postgresql
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: nextcloud-config-secrets
            - name: REDIS_HOST
              value: platform-stack-shared-redis
            - name: REDIS_HOST_PORT
              value: '6379'
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_HOST_PASSWORD
                  name: nextcloud-config-secrets
            - name: SMTP_HOST
              value: ''
            - name: SMTP_PORT
              value: '587'
            - name: SMTP_NAME
              value: ''
            - name: MAIL_FROM_ADDRESS
              value: ''
            - name: MAIL_DOMAIN
              value: ''
            image: nextcloud:33.0.0-apache
            imagePullPolicy: IfNotPresent
            name: nextcloud-cron
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsGroup: 33
              runAsNonRoot: true
              runAsUser: 33
            volumeMounts:
            - mountPath: /var/www/html
              name: data
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data
  schedule: '*/5 * * * *'
  successfulJobsHistoryLimit: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openclaw
    spec:
      containers:
      - command:
        - node
        - openclaw.mjs
        - gateway
        - --allow-unconfigured
        env:
        - name: OPENCLAW_GATEWAY_PORT
          value: '18789'
        - name: OPENCLAW_GATEWAY_BIND
          value: 0.0.0.0
        - name: OPENCLAW_HOME
          value: /home/node/.openclaw
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_PATH
          value: /home/node/.openclaw/openclaw.json
        - name: OPENCLAW_SANDBOX
          value: '1'
        - name: DOCKER_HOST
          value: ssh://docker-remote@openclaw-sandbox:2222
        - name: HOME
          value: /home/node
        - name: PATH
          value: /opt/openclaw-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_GATEWAY_TOKEN
              name: openclaw-app-secrets
        image: ghcr.io/openclaw/openclaw:2026.3.23-2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        name: openclaw
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /startupz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /home/node/.openclaw
          name: data
        - mountPath: /opt/openclaw-tools/bin
          name: remote-docker-cli
          readOnly: true
        - mountPath: /home/node/.ssh
          name: remote-docker-ssh
          readOnly: true
      initContainers:
      - command:
        - /bin/sh
        - -c
        - "set -eu\ntarget_dir=\"/config-target-root\"\ntarget_file=\"${target_dir}/openclaw.json\"\
          \nmkdir -p \"${target_dir}\"\nif [ ! -s /config-source/openclaw.json ];\
          \ then\n  echo >&2 \"Rendered ConfigMap file /config-source/openclaw.json\
          \ is missing or empty; verify the openclaw ConfigMap rendered correctly\
          \ before deployment.\"\n  exit 1\nfi\nif [ -s \"${target_file}\" ]; then\n\
          \  echo \"Preserving existing OpenClaw config at ${target_file}.\"\n  exit\
          \ 0\nfi\ncp -f /config-source/openclaw.json \"${target_file}\" || {\n  echo\
          \ >&2 \"Failed to bootstrap ${target_file} from /config-source/openclaw.json;\
          \ verify the writable config target volume is mounted and accessible to\
          \ the init container.\"\n  exit 1\n}\nchmod 0755 \"${target_dir}\" || {\n\
          \  echo >&2 \"Failed to set mode 0755 on ${target_dir} before handing it\
          \ to the main container.\"\n  exit 1\n}\nchmod 0644 \"${target_file}\" ||\
          \ {\n  echo >&2 \"Failed to set mode 0644 on ${target_file} after bootstrapping\
          \ the rendered config.\"\n  exit 1\n}\nchown -R 1000:1000 \"${target_dir}\"\
          \ || {\n  echo >&2 \"Failed to hand ${target_dir} to UID/GID 1000 after\
          \ bootstrapping the rendered config.\"\n  exit 1\n}\n"
        image: ghcr.io/openclaw/openclaw:2026.3.23-2
        imagePullPolicy: IfNotPresent
        name: config-permissions
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /config-source
          name: config-source
          readOnly: true
        - mountPath: /config-target-root
          name: data
      - command:
        - /bin/sh
        - -c
        - "set -eu\nmkdir -p /tools-target\ndocker_path=\"$(command -v docker || true)\"\
          \nif [ -z \"${docker_path}\" ]; then\n  echo >&2 \"remoteDocker.cli.image\
          \ must contain a working docker CLI on PATH so OpenClaw can use the Docker\
          \ sandbox backend.\"\n  exit 1\nfi\ncp -f \"${docker_path}\" /tools-target/docker\
          \ || {\n  echo >&2 \"Failed to copy ${docker_path} into /tools-target/docker\
          \ for OpenClaw remote Docker support.\"\n  exit 1\n}\nchmod 0755 /tools-target\
          \ /tools-target/docker || {\n  echo >&2 \"Failed to lock permissions on\
          \ /tools-target/docker for OpenClaw remote Docker support.\"\n  exit 1\n\
          }\nchown -R 1000:1000 /tools-target || {\n  echo >&2 \"Failed to hand /tools-target\
          \ to UID/GID 1000 after copying the docker CLI.\"\n  exit 1\n}\n"
        image: docker:28.0.4-cli
        imagePullPolicy: IfNotPresent
        name: remote-docker-cli
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /tools-target
          name: remote-docker-cli
      - command:
        - /bin/sh
        - -c
        - "set -eu\nexport PATH=\"/opt/openclaw-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\
          \ndocker_path=\"$(command -v docker || true)\"\nif [ -z \"${docker_path}\"\
          \ ]; then\n  echo >&2 \"Docker sandbox backend requested, but no docker\
          \ CLI is available after the remoteDocker.cli init step.\"\n  exit 1\nfi\n\
          ssh_path=\"$(command -v ssh || true)\"\nif [ -z \"${ssh_path}\" ]; then\n\
          \  echo >&2 \"OpenClaw remote Docker over ssh:// requires an ssh client\
          \ in the OpenClaw image. Build from images/openclaw-remote-docker/Dockerfile\
          \ or use an equivalent image.\"\n  exit 1\nfi\necho \"docker CLI available\
          \ at ${docker_path}\"\necho \"ssh client available at ${ssh_path}\"\n"
        image: ghcr.io/openclaw/openclaw:2026.3.23-2
        imagePullPolicy: IfNotPresent
        name: remote-docker-runtime-check
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /opt/openclaw-tools/bin
          name: remote-docker-cli
          readOnly: true
      - command:
        - /bin/sh
        - -c
        - "set -eu\nmkdir -p /ssh-target\nif [ ! -s /ssh-source/id_ed25519 ]; then\n\
          \  echo >&2 \"remoteDocker.ssh.secretName must reference a Secret containing\
          \ non-empty id_ed25519 and known_hosts keys; id_ed25519 is missing or empty.\"\
          \n  exit 1\nfi\nif [ ! -s /ssh-source/known_hosts ]; then\n  echo >&2 \"\
          remoteDocker.ssh.secretName must reference a Secret containing non-empty\
          \ id_ed25519 and known_hosts keys; known_hosts is missing or empty.\"\n\
          \  exit 1\nfi\necho \"Copying SSH files from /ssh-source into /ssh-target.\"\
          \ncp -f /ssh-source/id_ed25519 /ssh-target/id_ed25519 || {\n  echo >&2 \"\
          Failed to copy /ssh-source/id_ed25519 to /ssh-target/id_ed25519; verify\
          \ the mounted Secret files are readable and that the init container security\
          \ context allows writes to /ssh-target.\"\n  exit 1\n}\ncp -f /ssh-source/known_hosts\
          \ /ssh-target/known_hosts || {\n  echo >&2 \"Failed to copy /ssh-source/known_hosts\
          \ to /ssh-target/known_hosts; verify the mounted Secret files are readable\
          \ and that the init container security context allows writes to /ssh-target.\"\
          \n  exit 1\n}\necho \"Locking permissions before handing /ssh-target to\
          \ UID/GID 1000.\"\nchmod 0700 /ssh-target || {\n  echo >&2 \"Failed to set\
          \ mode 0700 on /ssh-target before ownership changes; verify the init container\
          \ security context still permits writes to the mounted emptyDir volume.\"\
          \n  exit 1\n}\nchmod 0600 /ssh-target/id_ed25519 || {\n  echo >&2 \"Failed\
          \ to set mode 0600 on /ssh-target/id_ed25519 before ownership changes; verify\
          \ the copied SSH key is writable inside /ssh-target and that the init container\
          \ security context still permits writes to the mounted emptyDir volume.\"\
          \n  exit 1\n}\nchmod 0644 /ssh-target/known_hosts || {\n  echo >&2 \"Failed\
          \ to set mode 0644 on /ssh-target/known_hosts before ownership changes;\
          \ verify the copied known_hosts file is writable inside /ssh-target and\
          \ that the init container security context still permits writes to the mounted\
          \ emptyDir volume.\"\n  exit 1\n}\nchown -R 1000:1000 /ssh-target || {\n\
          \  echo >&2 \"Failed to hand /ssh-target to UID/GID 1000 after permissions\
          \ were locked down; verify the init container still runs as UID/GID 0 with\
          \ the CHOWN capability required by the security context.\"\n  exit 1\n}\n"
        image: ghcr.io/openclaw/openclaw:2026.3.23-2
        imagePullPolicy: IfNotPresent
        name: remote-docker-ssh-permissions
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /ssh-source
          name: remote-docker-ssh-secret
          readOnly: true
        - mountPath: /ssh-target
          name: remote-docker-ssh
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openclaw
      volumes:
      - emptyDir:
          medium: Memory
        name: tmp
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-openclaw
      - configMap:
          items:
          - key: openclaw.json
            path: openclaw.json
          name: platform-stack-openclaw
        name: config-source
      - name: remote-docker-cli
      - name: remote-docker-ssh-secret
        secret:
          secretName: openclaw-remote-docker-ssh
      - name: remote-docker-ssh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cert-manager
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/version: v1.20.0
  name: platform-stack-cert-manager
  namespace: ai-homebase
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: cert-manager
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '9402'
        prometheus.io/scrape: 'true'
      labels:
        app: cert-manager
        app.kubernetes.io/component: controller
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: cert-manager
        app.kubernetes.io/version: v1.20.0
    spec:
      containers:
      - args:
        - --v=2
        - --cluster-resource-namespace=$(POD_NAMESPACE)
        - --leader-election-namespace=kube-system
        - --acme-http01-solver-image=quay.io/jetstack/cert-manager-acmesolver:v1.20.0
        - --max-concurrent-challenges=60
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: quay.io/jetstack/cert-manager-controller:v1.20.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 8
          httpGet:
            path: /livez
            port: http-healthz
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 15
        name: cert-manager-controller
        ports:
        - containerPort: 9402
          name: http-metrics
          protocol: TCP
        - containerPort: 9403
          name: http-healthz
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: platform-stack-cert-manager
---
