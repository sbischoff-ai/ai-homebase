    : \"token\",\n      \"token\": \"${OPENCLAW_GATEWAY_TOKEN}\"\n    },\n    \"controlUi\"\
    : {\n      \"enabled\": true,\n      \"allowedOrigins\": [\"https://openclaw.homebase.local\"\
    ]\n    },\n    \"trustedProxies\": []\n  },\n  \"agents\": {\n    \"defaults\"\
    : {\"models\":{\"anthropic/claude-haiku-4-5\":{\"alias\":\"Watchdog\"},\"anthropic/claude-opus-4-6\"\
    :{\"alias\":\"Architect\"},\"anthropic/claude-sonnet-4-5\":{\"alias\":\"Coder\"\
    },\"anthropic/claude-sonnet-4-6\":{\"alias\":\"Main\"}},\"sandbox\":{\"backend\"\
    :\"docker\",\"browser\":{\"cdpPort\":9222,\"cdpSourceRange\":\"\",\"enableNoVnc\"\
    :true,\"enabled\":true,\"headless\":false,\"image\":\"openclaw-sandbox-browser:bookworm-slim\"\
    ,\"network\":\"bridge\",\"noVncPort\":6080,\"vncPort\":5900},\"docker\":{\"capDrop\"\
    :[\"ALL\"],\"cpus\":1,\"image\":\"openclaw-sandbox:bookworm-slim\",\"memory\"\
    :\"1g\",\"memorySwap\":\"2g\",\"network\":\"bridge\",\"pidsLimit\":256,\"readOnlyRoot\"\
