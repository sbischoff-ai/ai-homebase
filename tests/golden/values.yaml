          cp -f /lib/x86_64-linux-gnu/libssl.so.3 /tools-target/lib/libssl.so.3
          cp -f /lib/x86_64-linux-gnu/libcrypto.so.3 /tools-target/lib/libcrypto.so.3
          cp -f /lib/x86_64-linux-gnu/libc.so.6 /tools-target/lib/libc.so.6
