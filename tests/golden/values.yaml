  labels:
    app.kubernetes.io/component: shared-postgresql-bootstrap
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
  name: platform-stack-shared-postgresql-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: shared-postgresql-bootstrap
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: platform-stack
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - "until pg_isready -h \"$PGHOST\" -p \"$PGPORT\" -U \"$PGUSER\" --dbname\
          \ postgres; do\n  echo \"waiting for ${PGHOST}:${PGPORT}\"\n  sleep 2\n\
          done\npsql -v ON_ERROR_STOP=1 --dbname postgres --set=nextcloud_db_password=\"\
          $NEXTCLOUD_DB_PASSWORD\" <<'SQL'\nSELECT format('CREATE ROLE nextcloud LOGIN\
          \ PASSWORD %L', :'nextcloud_db_password')\nWHERE NOT EXISTS (SELECT FROM\
          \ pg_catalog.pg_roles WHERE rolname = 'nextcloud')\\gexec\nSELECT format('ALTER\
          \ ROLE nextcloud WITH LOGIN PASSWORD %L', :'nextcloud_db_password')\nWHERE\
          \ EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'nextcloud')\\\
          gexec\nSELECT 'CREATE DATABASE nextcloud OWNER nextcloud'\nWHERE NOT EXISTS\
          \ (SELECT FROM pg_database WHERE datname = 'nextcloud')\\gexec\nALTER DATABASE\
          \ nextcloud OWNER TO nextcloud;\nSQL\n"
        env:
        - name: PGHOST
          value: platform-stack-shared-postgresql
        - name: PGPORT
          value: '5432'
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: shared-postgresql-auth
        - name: NEXTCLOUD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        name: shared-postgresql-bootstrap
        terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Never
---
apiVersion: batch/v1
