apiVersion: v1
data:
  openclaw.json: "{\n  \"gateway\": {\n    \"mode\": \"local\",\n    \"bind\": \"\
    lan\",\n    \"port\": 18789,\n    \"auth\": {\n      \"mode\": \"token\",\n  \
    \    \"token\": \"${OPENCLAW_GATEWAY_TOKEN}\"\n    },\n    \"controlUi\": {\n\
    \      \"enabled\": true,\n      \"allowedOrigins\": [\"http://openclaw.localtest.me\"\
    ]\n    }\n  },\n  \"agents\": {\n    \"defaults\": {\n      \"workspace\": \"\
    ~/.openclaw/workspace\"\n    },\n    \"list\": [{\"id\":\"default\",\"name\":\"\
    OpenClaw Assistant\",\"workspace\":\"~/.openclaw/workspace\"}]\n  }\n}\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
---
apiVersion: v1
data:
  autoscalingEnabled: 'false'
  domain: localtest.me
  externalSecretsEnabled: 'false'
  ingressEnabled: 'false'
  observabilityEnabled: 'false'
  persistenceEnabled: 'false'
  workerIsolationEnabled: 'false'
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
  name: platform-stack-platform-stack-settings
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openclaw
    spec:
      containers:
      - env:
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_PATH
          value: /etc/openclaw/openclaw.json
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_GATEWAY_TOKEN
              name: openclaw-app-secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: openclaw-app-secrets
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: ANTHROPIC_API_KEY
              name: openclaw-app-secrets
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              key: TAVILY_API_KEY
              name: openclaw-app-secrets
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              key: GOOGLE_API_KEY
              name: openclaw-app-secrets
        - name: BRAVE_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              key: BRAVE_SEARCH_API_KEY
              name: openclaw-app-secrets
        image: nginx:1.27.5-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        name: openclaw
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /etc/openclaw/openclaw.json
          name: config
          readOnly: true
          subPath: openclaw.json
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openclaw
      volumes:
      - configMap:
          items:
          - key: openclaw.json
            path: openclaw.json
          name: platform-stack-openclaw
        name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openhands
  name: platform-stack-openhands
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openhands
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openhands
    spec:
      containers:
      - env:
        - name: AGENT_SERVER_IMAGE_REPOSITORY
          value: ghcr.io/openhands/agent-server
        - name: AGENT_SERVER_IMAGE_TAG
          value: 1.12.0-python
        - name: RUNTIME_MODE
          value: ''
        - name: QUEUE_ENABLED
          value: 'false'
        - name: QUEUE_PROVIDER
          value: ''
        - name: QUEUE_ENDPOINT
          value: ''
        - name: QUEUE_NAME
          value: ''
        - name: QUEUE_DLQ_NAME
          value: ''
        - name: WORKER_CONCURRENCY
          value: '4'
        image: nginx:1.27.5-alpine
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 15
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        name: openhands
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          initialDelaySeconds: 15
          periodSeconds: 15
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        startupProbe:
          failureThreshold: 30
          periodSeconds: 10
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openhands
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: internal
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openhands
  name: platform-stack-openhands
spec:
  ingressClassName: nginx
  rules:
  - host: openhands.homebase.local
    http:
      paths:
      - backend:
          service:
            name: platform-stack-openhands
            port:
              number: 3000
        path: /
        pathType: Prefix
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/name: openclaw
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openhands
  name: platform-stack-openhands
spec:
  ports:
  - name: http
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/name: openhands
  type: ClusterIP
---
