apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
    environment: production
  name: platform-stack-openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openclaw
    spec:
      containers:
      - env:
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_PATH
          value: /etc/openclaw/openclaw.json
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_GATEWAY_TOKEN
              name: openclaw-app-secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: openclaw-app-secrets
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: ANTHROPIC_API_KEY
              name: openclaw-app-secrets
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              key: TAVILY_API_KEY
              name: openclaw-app-secrets
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              key: GOOGLE_API_KEY
              name: openclaw-app-secrets
        - name: BRAVE_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              key: BRAVE_SEARCH_API_KEY
              name: openclaw-app-secrets
        image: ghcr.io/example/openclaw:2026.3.12
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        name: openclaw
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /home/node/.openclaw
          name: data
        - mountPath: /etc/openclaw/openclaw.json
          name: config
          readOnly: true
          subPath: openclaw.json
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openclaw
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-openclaw
      - configMap:
          items:
          - key: openclaw.json
            path: openclaw.json
          name: platform-stack-openclaw
        name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openhands
    environment: production
  name: platform-stack-openhands
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openhands
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openhands
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                  - platform-stack
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - env:
        - name: AGENT_SERVER_IMAGE_REPOSITORY
          value: ghcr.io/openhands/agent-server
        - name: AGENT_SERVER_IMAGE_TAG
          value: 1.12.0-python
        - name: RUNTIME_MODE
          value: ''
        - name: QUEUE_ENABLED
          value: 'true'
        - name: QUEUE_PROVIDER
          value: <set-provider>
        - name: QUEUE_ENDPOINT
          value: <set-endpoint>
        - name: QUEUE_NAME
          value: openhands-jobs
        - name: QUEUE_DLQ_NAME
          value: openhands-jobs-deadletter
        - name: WORKER_CONCURRENCY
          value: '10'
        image: ghcr.io/example/openhands:1.5
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 15
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        name: openhands
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          initialDelaySeconds: 15
          periodSeconds: 15
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '3'
            memory: 4Gi
          requests:
            cpu: 750m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          periodSeconds: 10
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
      nodeSelector:
        workload-tier: isolated
      runtimeClassName: gvisor
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openhands
      tolerations:
      - effect: NoSchedule
        key: workload-tier
        operator: Equal
        value: isolated
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: wg-easy
    environment: production
  name: platform-stack-wg-easy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: wg-easy
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: wg-easy
    spec:
      containers:
      - env:
        - name: WG_HOST
          valueFrom:
            secretKeyRef:
              key: WG_HOST
              name: platform-stack-wg-easy-secrets
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              key: PASSWORD
              name: platform-stack-wg-easy-secrets
        - name: WG_DEFAULT_ADDRESS
          value: 10.8.0.x
        - name: WG_DEFAULT_DNS
          value: 1.1.1.1
        - name: WG_ALLOWED_IPS
          value: 0.0.0.0/0
        image: ghcr.io/wg-easy/wg-easy:14
        imagePullPolicy: IfNotPresent
        name: wg-easy
        ports:
        - containerPort: 51821
          name: web
        - containerPort: 51820
          name: vpn
          protocol: UDP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /etc/wireguard
          name: data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-wg-easy
