apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: infisical-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: infisical.prod.example.com
    http:
      paths:
      - backend:
          service:
            name: platform-stack-infisical
            port:
              number: 8080
        path: /
        pathType: Prefix
      - backend:
          service:
            name: platform-stack-infisical
            port:
              number: 8080
        path: /ss-webhook
        pathType: Exact
  tls:
  - hosts:
    - infisical.prod.example.com
    secretName: infisical-prod-tls
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-stack-schema-migration-1
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
      name: platform-stack-create-tables
    spec:
      containers:
      - command:
        - npm
        - run
        - migration:latest
        envFrom:
        - secretRef:
            name: infisical-app-secrets
        image: ghcr.io/example/infisical:stable
        name: infisical-schema-migration
      restartPolicy: OnFailure
      serviceAccountName: platform-stack-infisical
