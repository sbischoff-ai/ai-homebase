apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postfix-relay
  name: platform-stack-postfix-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: postfix-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: postfix-relay
    spec:
      containers:
      - env:
        - name: ALLOWED_SENDER_DOMAINS
          value: example.com
        - name: POSTFIX_myhostname
          value: smtp.example.com
        - name: POSTFIX_mynetworks
          value: 127.0.0.0/8 10.42.0.0/16 10.43.0.0/16
        - name: MASQUERADED_DOMAINS
          value: example.com
        - name: INBOUND_DEBUGGING
          value: '0'
        - name: LOG_FORMAT
          value: plain
        image: boky/postfix:v4.4.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: smtp-submission
        name: postfix-relay
        ports:
        - containerPort: 587
          name: smtp-submission
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: smtp-submission
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
      securityContext:
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
