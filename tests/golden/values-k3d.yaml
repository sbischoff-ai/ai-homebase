apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: gitea
  name: platform-stack-gitea
  namespace: ai-homebase
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: gitea
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: fc1d9a0c6359313803ba7443effe9e60bc59459e93b3d8d5a52af4ba07634adc
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: gitea
    spec:
      containers:
      - env:
        - name: SSH_LISTEN_PORT
          value: '2222'
        - name: SSH_PORT
          value: '22'
        - name: GITEA_APP_INI
          value: /data/gitea/conf/app.ini
        - name: GITEA_CUSTOM
          value: /data/gitea
        - name: GITEA_WORK_DIR
          value: /data
        - name: GITEA_TEMP
          value: /tmp/gitea
        - name: TMPDIR
          value: /tmp/gitea
        - name: HOME
          value: /data/gitea/git
        image: docker.gitea.com/gitea:1.25.5-rootless
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          initialDelaySeconds: 200
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 1
        name: gitea
        ports:
        - containerPort: 2222
          name: ssh
        - containerPort: 3000
          name: http
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tmp
          name: temp
        - mountPath: /data
          name: data
      initContainers:
      - command:
        - /usr/sbinx/init_directory_structure.sh
        env:
        - name: GITEA_APP_INI
          value: /data/gitea/conf/app.ini
        - name: GITEA_CUSTOM
          value: /data/gitea
        - name: GITEA_WORK_DIR
          value: /data
        - name: GITEA_TEMP
          value: /tmp/gitea
        image: docker.gitea.com/gitea:1.25.5-rootless
        imagePullPolicy: IfNotPresent
        name: init-directories
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /usr/sbinx
          name: init
        - mountPath: /tmp
          name: temp
        - mountPath: /data
          name: data
      - command:
        - /usr/sbinx/config_environment.sh
        env:
        - name: GITEA_APP_INI
          value: /data/gitea/conf/app.ini
        - name: GITEA_CUSTOM
          value: /data/gitea
        - name: GITEA_WORK_DIR
          value: /data
        - name: GITEA_TEMP
          value: /tmp/gitea
        - name: TMP_EXISTING_ENVS_FILE
          value: /tmp/existing-envs
        - name: ENV_TO_INI_MOUNT_POINT
          value: /env-to-ini-mounts
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              key: GITEA__database__PASSWD
              name: gitea-config-secrets
        - name: GITEA__session__PROVIDER_CONFIG
          valueFrom:
            secretKeyRef:
              key: GITEA__session__PROVIDER_CONFIG
              name: gitea-config-secrets
        - name: GITEA__cache__HOST
          valueFrom:
            secretKeyRef:
              key: GITEA__cache__HOST
              name: gitea-config-secrets
        - name: GITEA__queue__CONN_STR
          valueFrom:
            secretKeyRef:
              key: GITEA__queue__CONN_STR
              name: gitea-config-secrets
        - name: GITEA__global_lock__SERVICE_CONN_STR
          valueFrom:
            secretKeyRef:
              key: GITEA__global_lock__SERVICE_CONN_STR
              name: gitea-config-secrets
        image: docker.gitea.com/gitea:1.25.5-rootless
        imagePullPolicy: IfNotPresent
        name: init-app-ini
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /usr/sbinx
          name: config
        - mountPath: /tmp
          name: temp
        - mountPath: /data
          name: data
        - mountPath: /env-to-ini-mounts/inlines/
          name: inline-config-sources
      - command:
        - /usr/sbinx/configure_gitea.sh
        env:
        - name: GITEA_APP_INI
          value: /data/gitea/conf/app.ini
        - name: GITEA_CUSTOM
          value: /data/gitea
        - name: GITEA_WORK_DIR
          value: /data
        - name: GITEA_TEMP
          value: /tmp/gitea
        - name: HOME
          value: /data/gitea/git
        - name: GITEA_ADMIN_USERNAME
          value: git-admin
        - name: GITEA_ADMIN_PASSWORD
          value: r8sA8CPHD9!bt6d
        - name: GITEA_ADMIN_PASSWORD_MODE
          value: keepUpdated
        image: docker.gitea.com/gitea:1.25.5-rootless
        imagePullPolicy: IfNotPresent
        name: configure-gitea
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /usr/sbinx
          name: init
        - mountPath: /tmp
          name: temp
        - mountPath: /data
          name: data
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
