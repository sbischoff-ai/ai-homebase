apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '8'
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-bootstrap-apps
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; do
            echo "waiting for nextcloud bootstrap"
            sleep 5
          done

          install_and_enable_app() {
            app_id="$1"
            echo "processing app: ${app_id}"
            if su -s /bin/sh www-data -c "cd /var/www/html && php occ app:list --output=json" | grep -q "\"${app_id}\":"; then
              echo "app '${app_id}' is already installed"
            else
              echo "installing '${app_id}'"
              su -s /bin/sh www-data -c "cd /var/www/html && php occ app:install \"${app_id}\""
            fi
            echo "enabling '${app_id}'"
            su -s /bin/sh www-data -c "cd /var/www/html && php occ app:enable \"${app_id}\""
          }
          install_and_enable_app "notes"
          install_and_enable_app "tables"
          install_and_enable_app "calendar"
          install_and_enable_app "tasks"
        env:
        - name: POSTGRES_HOST
          value: platform-stack-shared-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        image: nextcloud:33.0.2-apache
        imagePullPolicy: IfNotPresent
        name: bootstrap-apps
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      restartPolicy: Never
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
