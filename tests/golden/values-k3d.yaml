    cdpSourceRange\":\"\",\"enableNoVnc\":true,\"enabled\":true,\"headless\":false,\"\
    image\":\"openclaw-sandbox-browser:bookworm-slim\",\"network\":\"bridge\",\"noVncPort\"\
    :6080,\"vncPort\":5900},\"docker\":{\"capDrop\":[\"ALL\"],\"cpus\":1,\"image\"\
    :\"openclaw-sandbox:bookworm-slim\",\"memory\":\"1g\",\"memorySwap\":\"2g\",\"\
