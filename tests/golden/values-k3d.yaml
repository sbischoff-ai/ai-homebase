apiVersion: v1
data:
  openclaw.json: "{\n  \"gateway\": {\n    \"mode\": \"local\",\n    \"bind\": \"\
    lan\",\n    \"port\": 18789,\n    \"auth\": {\n      \"mode\": \"token\",\n  \
    \    \"token\": \"${OPENCLAW_GATEWAY_TOKEN}\"\n    },\n    \"controlUi\": {\n\
    \      \"enabled\": true,\n      \"allowedOrigins\": [\"http://openclaw.localtest.me\"\
    ]\n    }\n  },\n  \"agents\": {\n    \"defaults\": {\n      \"workspace\": \"\
    ~/.openclaw/workspace\",\n      \"sandbox\": {\"docker\":{\"capDrop\":[\"ALL\"\
    ],\"env\":{\"LANG\":\"C.UTF-8\"},\"image\":\"openclaw-sandbox:bookworm-slim\"\
    ,\"network\":\"none\",\"readOnlyRoot\":true,\"tmpfs\":[\"/tmp\",\"/var/tmp\",\"\
    /run\"],\"user\":\"1000:1000\",\"workdir\":\"/workspace\"},\"mode\":\"non-main\"\
    ,\"prune\":{\"idleHours\":24,\"maxAgeDays\":7},\"scope\":\"agent\",\"workspaceAccess\"\
    :\"none\",\"workspaceRoot\":\"~/.openclaw/sandboxes\"}\n    },\n    \"list\":\
    \ [{\"id\":\"default\",\"name\":\"OpenClaw Assistant\",\"workspace\":\"~/.openclaw/workspace\"\
    }]\n  }\n}\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: infisical
    chart: infisical-0.2.0
    component: infisical
    heritage: Helm
    release: platform-stack
  name: platform-stack-infisical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical
      component: infisical
      release: platform-stack
  template:
    metadata:
      labels:
        app: infisical
        component: infisical
        release: platform-stack
    spec:
      containers:
      - env:
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              key: AUTH_SECRET
              name: infisical-secrets
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: ENCRYPTION_KEY
              name: infisical-secrets
        - name: SITE_URL
          valueFrom:
            secretKeyRef:
              key: SITE_URL
              name: infisical-secrets
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              key: SMTP_HOST
              name: infisical-secrets
              optional: true
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              key: SMTP_PORT
              name: infisical-secrets
              optional: true
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              key: SMTP_USERNAME
              name: infisical-secrets
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: SMTP_PASSWORD
              name: infisical-secrets
              optional: true
        - name: SMTP_FROM_ADDRESS
          valueFrom:
            secretKeyRef:
              key: SMTP_FROM_ADDRESS
              name: infisical-secrets
              optional: true
        - name: SMTP_FROM_NAME
          valueFrom:
            secretKeyRef:
              key: SMTP_FROM_NAME
              name: infisical-secrets
              optional: true
        - name: DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              key: DB_CONNECTION_URI
              name: infisical-secrets
              optional: true
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              key: REDIS_URL
              name: infisical-secrets
              optional: true
        image: infisical/infisical:v0.151.0
        imagePullPolicy: IfNotPresent
        name: infisical-infisical
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/status
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            memory: 1000Mi
          requests:
            cpu: 350m
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      initContainers:
      - args:
        - job
        - platform-stack-schema-migration-1
        image: ghcr.io/groundnuty/k8s-wait-for:no-root-v2.0
        imagePullPolicy: IfNotPresent
        name: migration-init
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: platform-stack-infisical
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openclaw
    spec:
      containers:
      - command:
        - node
        - openclaw.mjs
        - gateway
        - --allow-unconfigured
        env:
        - name: OPENCLAW_GATEWAY_PORT
          value: '18789'
        - name: OPENCLAW_GATEWAY_BIND
          value: 0.0.0.0
        - name: OPENCLAW_HOME
          value: /home/node/.openclaw
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_PATH
          value: /etc/openclaw/openclaw.json
        - name: OPENCLAW_SANDBOX
          value: '1'
        - name: OPENCLAW_DOCKER_SOCKET
          value: /var/run/docker.sock
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_GATEWAY_TOKEN
              name: openclaw-app-secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: openclaw-app-secrets
        image: ghcr.io/openclaw/openclaw:2026.3.12
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        name: openclaw
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 2000m
            memory: 8Gi
          requests:
            cpu: 1000m
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /startupz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/openclaw/openclaw.json
          name: config
          readOnly: true
          subPath: openclaw.json
        - mountPath: /var/run/docker.sock
          name: docker-socket
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openclaw
      volumes:
      - emptyDir:
          medium: Memory
        name: tmp
      - configMap:
          items:
          - key: openclaw.json
            path: openclaw.json
          name: platform-stack-openclaw
        name: config
      - hostPath:
          path: /var/run/docker.sock
          type: Socket
        name: docker-socket
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openhands
  name: platform-stack-openhands
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openhands
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openhands
    spec:
      containers:
      - env:
        - name: AGENT_SERVER_IMAGE_REPOSITORY
          value: ghcr.io/openhands/agent-server
        - name: AGENT_SERVER_IMAGE_TAG
          value: 1.12.0-python
        - name: RUNTIME_MODE
          value: ''
        - name: QUEUE_ENABLED
          value: 'false'
        - name: QUEUE_PROVIDER
          value: ''
        - name: QUEUE_ENDPOINT
          value: ''
        - name: QUEUE_NAME
          value: ''
        - name: QUEUE_DLQ_NAME
          value: ''
        - name: WORKER_CONCURRENCY
          value: '4'
        image: ghcr.io/openhands/openhands:1.5.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 15
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        name: openhands
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          initialDelaySeconds: 15
          periodSeconds: 15
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 8Gi
          requests:
            cpu: 1000m
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 42420
          runAsNonRoot: true
          runAsUser: 42420
        startupProbe:
          failureThreshold: 30
          periodSeconds: 10
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /var/run/docker.sock
          name: docker-socket
      securityContext:
        fsGroup: 42420
      serviceAccountName: platform-stack-openhands
      volumes:
      - hostPath:
          path: /var/run/docker.sock
          type: Socket
        name: docker-socket
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: wg-easy
  name: platform-stack-wg-easy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: wg-easy
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: wg-easy
    spec:
      containers:
      - env:
        - name: WG_HOST
          valueFrom:
            secretKeyRef:
              key: WG_HOST
              name: platform-stack-wg-easy-secrets
        - name: PASSWORD_HASH
          valueFrom:
            secretKeyRef:
              key: PASSWORD_HASH
              name: platform-stack-wg-easy-secrets
        - name: WG_DEFAULT_ADDRESS
          value: 10.8.0.x
        - name: WG_DEFAULT_DNS
          value: 1.1.1.1
        - name: WG_ALLOWED_IPS
          value: 0.0.0.0/0
        image: ghcr.io/wg-easy/wg-easy:14
        imagePullPolicy: IfNotPresent
        name: wg-easy
        ports:
        - containerPort: 51821
          name: web
        - containerPort: 51820
          name: vpn
          protocol: UDP
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
          privileged: true
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infisical-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: infisical.localtest.me
    http:
      paths:
      - backend:
          service:
            name: platform-stack-infisical
            port:
              number: 8080
        path: /
        pathType: Prefix
      - backend:
          service:
            name: platform-stack-infisical
            port:
              number: 8080
        path: /ss-webhook
        pathType: Exact
---
