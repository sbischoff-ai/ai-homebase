          value: ai-homebase
        - name: SMTP_SECURITY
          value: 'off'
        image: ghcr.io/dani-garcia/vaultwarden:1.35.4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: http
        name: vaultwarden
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /data
          name: data
      initContainers:
      - command:
