apiVersion: v1
data:
  mcp-http-bridge.mjs: "import process from \"node:process\";\n\nconst args = process.argv.slice(2);\n\
    const urls = [];\nconst staticHeaders = {};\nconst sessionIdsByUrl = new Map();\n\
    let activeUrl = \"\";\n\nfunction expandEnvironment(value) {\n  return value.replace(/\\\
    $\\{([A-Z0-9_]+)\\}/g, (_, key) => process.env[key] || \"\");\n}\n\nfor (let i\
    \ = 0; i < args.length; i += 1) {\n  const arg = args[i];\n  if (arg === \"--url\"\
    ) {\n    const candidate = expandEnvironment(args[i + 1] || \"\").trim();\n  \
    \  if (candidate) {\n      urls.push(candidate);\n    }\n    i += 1;\n    continue;\n\
    \  }\n  if (arg === \"--header\") {\n    const raw = expandEnvironment(args[i\
    \ + 1] || \"\");\n    const splitIndex = raw.indexOf(\"=\");\n    if (splitIndex\
    \ <= 0) {\n      throw new Error(`invalid --header value: ${raw}`);\n    }\n \
    \   staticHeaders[raw.slice(0, splitIndex)] = raw.slice(splitIndex + 1);\n   \
    \ i += 1;\n  }\n}\n\nif (urls.length === 0) {\n  throw new Error(\"missing required\
    \ --url\");\n}\n\nlet stdinBuffer = \"\";\nlet drainInFlight = false;\nlet drainRequested\
    \ = false;\n\nfunction writeMessage(message) {\n  process.stdout.write(`${JSON.stringify(message)}\\\
    n`);\n}\n\nfunction parseSseMessages(text) {\n  const blocks = text.split(/\\\
    r?\\n\\r?\\n/);\n  const messages = [];\n  for (const block of blocks) {\n   \
    \ const dataLines = [];\n    for (const line of block.split(/\\r?\\n/)) {\n  \
    \    if (line.startsWith(\"data:\")) {\n        dataLines.push(line.slice(5).trimStart());\n\
    \      }\n    }\n    if (dataLines.length === 0) {\n      continue;\n    }\n \
    \   const payload = dataLines.join(\"\\n\");\n    if (payload === \"[DONE]\")\
    \ {\n      continue;\n    }\n    messages.push(JSON.parse(payload));\n  }\n  return\
    \ messages;\n}\n\nasync function forwardMessageToUrl(url, message) {\n  const\
    \ headers = {\n    \"accept\": \"application/json, text/event-stream\",\n    \"\
    content-type\": \"application/json\",\n    ...staticHeaders\n  };\n  const sessionId\
    \ = sessionIdsByUrl.get(url) || \"\";\n  if (sessionId) {\n    headers[\"mcp-session-id\"\
    ] = sessionId;\n  }\n\n  const response = await fetch(url, {\n    method: \"POST\"\
    ,\n    headers,\n    body: JSON.stringify(message),\n    signal: AbortSignal.timeout(30000)\n\
    \  });\n\n  if (!response.ok) {\n    throw new Error(`remote MCP request failed\
    \ with HTTP ${response.status}`);\n  }\n\n  const newSessionId = response.headers.get(\"\
    mcp-session-id\");\n  if (newSessionId) {\n    sessionIdsByUrl.set(url, newSessionId);\n\
    \  }\n\n  const contentType = response.headers.get(\"content-type\") || \"\";\n\
    \  const bodyText = await response.text();\n  if (!bodyText.trim()) {\n    return;\n\
    \  }\n\n  if (contentType.includes(\"text/event-stream\")) {\n    for (const payload\
    \ of parseSseMessages(bodyText)) {\n      writeMessage(payload);\n    }\n    return;\n\
    \  }\n\n  const payload = JSON.parse(bodyText);\n  if (Array.isArray(payload))\
    \ {\n    for (const item of payload) {\n      writeMessage(item);\n    }\n   \
    \ return;\n  }\n  writeMessage(payload);\n}\n\nasync function forwardMessage(message)\
    \ {\n  const candidateUrls = activeUrl\n    ? [activeUrl, ...urls.filter((candidate)\
    \ => candidate !== activeUrl)]\n    : urls;\n  let lastError = null;\n\n  for\
    \ (const candidateUrl of candidateUrls) {\n    try {\n      await forwardMessageToUrl(candidateUrl,\
    \ message);\n      activeUrl = candidateUrl;\n      return;\n    } catch (error)\
    \ {\n      sessionIdsByUrl.delete(candidateUrl);\n      if (activeUrl === candidateUrl)\
    \ {\n        activeUrl = \"\";\n      }\n      lastError = error;\n    }\n  }\n\
    \n  throw lastError || new Error(\"no reachable MCP endpoint configured\");\n\
    }\n\nasync function drainBuffer() {\n  while (true) {\n    const newlineIndex\
    \ = stdinBuffer.indexOf(\"\\n\");\n    if (newlineIndex === -1) {\n      return;\n\
    \    }\n\n    const rawLine = stdinBuffer.slice(0, newlineIndex);\n    stdinBuffer\
    \ = stdinBuffer.slice(newlineIndex + 1);\n    const payload = rawLine.trim();\n\
    \    if (!payload) {\n      continue;\n    }\n    await forwardMessage(JSON.parse(payload));\n\
    \  }\n}\n\nasync function scheduleDrain() {\n  if (drainInFlight) {\n    drainRequested\
    \ = true;\n    return;\n  }\n\n  drainInFlight = true;\n  try {\n    do {\n  \
    \    drainRequested = false;\n      await drainBuffer();\n    } while (drainRequested);\n\
    \  } catch (error) {\n    console.error(error instanceof Error ? error.message\
    \ : String(error));\n    process.exitCode = 1;\n  } finally {\n    drainInFlight\
    \ = false;\n  }\n}\n\nprocess.stdin.setEncoding(\"utf8\");\nprocess.stdin.on(\"\
    data\", (chunk) => {\n  stdinBuffer += chunk;\n  void scheduleDrain();\n});\n"
  openclaw.json: "{\n  \"commands\": {\"mcp\":true},\n  \"tools\": {\"agentToAgent\"\
    :{\"allow\":[\"main\",\"coder\",\"architect\",\"archivist\",\"watchdog\"],\"enabled\"\
    :true},\"sessions\":{\"visibility\":\"all\"}},\n  \"cron\": {\"enabled\":true,\"\
    maxConcurrentRuns\":1,\"runLog\":{\"keepLines\":2000,\"maxBytes\":\"2mb\"},\"\
    sessionRetention\":\"24h\",\"store\":\"~/.openclaw/cron/jobs.json\"},\n  \"gateway\"\
    : {\n    \"mode\": \"local\",\n    \"bind\": \"lan\",\n    \"port\": 18789,\n\
    \    \"auth\": {\n      \"mode\": \"token\",\n      \"token\": \"${OPENCLAW_GATEWAY_TOKEN}\"\
    \n    },\n    \"controlUi\": {\n      \"enabled\": true,\n      \"allowedOrigins\"\
    : [\"https://openclaw.localtest.me\"]\n    },\n    \"trustedProxies\": [\"10.42.0.0/16\"\
    ]\n  },\n  \"agents\": {\n    \"defaults\": {\"models\":{\"anthropic/claude-haiku-4-5\"\
    :{\"alias\":\"Watchdog\"},\"anthropic/claude-opus-4-6\":{\"alias\":\"Architect\"\
    },\"anthropic/claude-sonnet-4-5\":{\"alias\":\"Coder\"},\"anthropic/claude-sonnet-4-6\"\
    :{\"alias\":\"Main / Archivist\"}},\"sandbox\":{\"backend\":\"docker\",\"browser\"\
    :{\"cdpPort\":9222,\"cdpSourceRange\":\"\",\"enableNoVnc\":true,\"enabled\":true,\"\
    headless\":false,\"image\":\"openclaw-sandbox-browser:bookworm-slim\",\"network\"\
    :\"bridge\",\"noVncPort\":6080,\"vncPort\":5900},\"docker\":{\"capDrop\":[\"ALL\"\
    ],\"cpus\":1,\"image\":\"registry.homebase.local/coder/openclaw-sandbox:bookworm-slim\"\
    ,\"memory\":\"1g\",\"memorySwap\":\"2g\",\"network\":\"bridge\",\"pidsLimit\"\
    :256,\"readOnlyRoot\":true,\"tmpfs\":[\"/tmp\",\"/var/tmp\",\"/run\"],\"user\"\
    :\"1000:1000\",\"workdir\":\"/workspace\"},\"mode\":\"non-main\",\"scope\":\"\
    agent\"},\"workspace\":\"/home/node/.openclaw/workspace\"},\n    \"list\": [{\"\
    default\":true,\"id\":\"main\",\"model\":{\"primary\":\"anthropic/claude-sonnet-4-6\"\
    },\"name\":\"OpenClaw Assistant\",\"subagents\":{\"allowAgents\":[\"coder\",\"\
    architect\",\"archivist\"]},\"workspace\":\"/home/node/.openclaw/workspace\"},{\"\
    id\":\"coder\",\"model\":{\"primary\":\"anthropic/claude-sonnet-4-5\"},\"name\"\
    :\"Coder\",\"sandbox\":{\"docker\":{\"env\":{\"CODER_GITEA_BASE_URL\":\"https://gitea.homebase.local\"\
    ,\"CODER_GITEA_EMAIL\":\"coder@example.invalid\",\"CODER_GITEA_HOST\":\"gitea.homebase.local\"\
    ,\"CODER_GITEA_PASSWORD\":\"${CODER_GITEA_PASSWORD}\",\"CODER_GITEA_TEA_LOGIN_NAME\"\
    :\"coder\",\"CODER_GITEA_TEA_TOKEN_NAME\":\"openclaw-coder-sandbox\",\"CODER_GITEA_USERNAME\"\
    :\"coder\",\"CODER_GITOPS_PROJECT\":\"platform-stack\",\"CODER_GITOPS_REPO_BRANCH\"\
    :\"main\",\"CODER_GITOPS_REPO_NAME\":\"cluster-gitops\",\"CODER_REGISTRY_BASE_URL\"\
    :\"https://registry.homebase.local\",\"CODER_REGISTRY_HOST\":\"registry.homebase.local\"\
    ,\"CODER_REGISTRY_NAMESPACE\":\"coder\",\"CODER_REGISTRY_PASSWORD\":\"${CODER_REGISTRY_PASSWORD}\"\
    ,\"CODER_REGISTRY_USERNAME\":\"coder\",\"CODER_SANDBOX_IMAGES_REPO_NAME\":\"openclaw-sandbox-images\"\
    ,\"GITHUB_TOKEN\":\"${GITHUB_TOKEN}\",\"OPENAI_API_KEY\":\"${OPENAI_API_KEY}\"\
    },\"image\":\"registry.homebase.local/coder/openclaw-sandbox-coder:bookworm-slim\"\
    ,\"setupCommand\":\"set -eu\\nexport HOME=/workspace/.home\\nexport CODEX_HOME=\\\
    \"$HOME/.codex\\\"\\nexport XDG_CONFIG_HOME=\\\"$HOME/.config\\\"\\nexport XDG_CACHE_HOME=\\\
    \"$HOME/.cache\\\"\\nexport XDG_STATE_HOME=\\\"$HOME/.local/state\\\"\\nmkdir\
    \ -p \\\"$CODEX_HOME\\\" \\\"$XDG_CONFIG_HOME/tea\\\" \\\"$XDG_CACHE_HOME\\\"\
    \ \\\"$XDG_STATE_HOME\\\" \\\"$HOME/.docker\\\"\\ngit config --global user.name\
    \ \\\"coder\\\"\\ngit config --global user.email \\\"coder@example.invalid\\\"\
    \\ncat \\u003e \\\"$HOME/.netrc\\\" \\u003c\\u003cEOF\\nmachine gitea.homebase.local\\\
    n  login coder\\n  password ${CODER_GITEA_PASSWORD}\\nEOF\\nchmod 0600 \\\"$HOME/.netrc\\\
    \"\\nexisting_token_ids=\\\"$(curl -fsS -u \\\"coder:${CODER_GITEA_PASSWORD}\\\
    \" 'https://gitea.homebase.local/api/v1/users/coder/tokens' | jq -r '.[] | select(.name\
    \ == \\\"openclaw-coder-sandbox\\\") | .id' || true)\\\"\\nif [ -n \\\"$existing_token_ids\\\
    \" ]; then\\n  for token_id in $existing_token_ids; do\\n    curl -fsS -X DELETE\
    \ -u \\\"coder:${CODER_GITEA_PASSWORD}\\\" \\\"https://gitea.homebase.local/api/v1/users/coder/tokens/$token_id\\\
    \" \\u003e/dev/null || true\\n  done\\nfi\\ntoken=\\\"$(curl -fsS -u \\\"coder:${CODER_GITEA_PASSWORD}\\\
    \" -H 'Content-Type: application/json' -d '{\\\"name\\\":\\\"openclaw-coder-sandbox\\\
    \",\\\"scopes\\\":[\\\"all\\\"]}' 'https://gitea.homebase.local/api/v1/users/coder/tokens'\
    \ 2\\u003e/dev/null | jq -r '.sha1 // empty' || true)\\\"\\nif [ -n \\\"$token\\\
    \" ]; then\\n  tea login add --name coder --url 'https://gitea.homebase.local'\
    \ --token \\\"$token\\\" \\u003e/dev/null 2\\u003e\\u00261 || true\\nfi\\nif [\
    \ -n \\\"${CODER_REGISTRY_HOST:-}\\\" ] \\u0026\\u0026 [ -n \\\"${CODER_REGISTRY_USERNAME:-}\\\
    \" ] \\u0026\\u0026 [ -n \\\"${CODER_REGISTRY_PASSWORD:-}\\\" ]; then\\n  printf\
    \ '%s' \\\"$CODER_REGISTRY_PASSWORD\\\" | docker login \\\"$CODER_REGISTRY_HOST\\\
    \" --username \\\"$CODER_REGISTRY_USERNAME\\\" --password-stdin \\u003e/dev/null\
    \ 2\\u003e\\u00261 || true\\nfi\"},\"mode\":\"all\"},\"workspace\":\"/home/node/.openclaw/workspace-coder\"\
    },{\"id\":\"architect\",\"model\":{\"primary\":\"anthropic/claude-opus-4-6\"},\"\
    name\":\"Architect\",\"workspace\":\"/home/node/.openclaw/workspace-architect\"\
    },{\"id\":\"archivist\",\"model\":{\"primary\":\"anthropic/claude-sonnet-4-6\"\
    },\"name\":\"Archivist\",\"workspace\":\"/home/node/.openclaw/workspace-archivist\"\
    },{\"id\":\"watchdog\",\"model\":{\"primary\":\"anthropic/claude-haiku-4-5\"},\"\
    name\":\"Watchdog\",\"sandbox\":{\"mode\":false},\"workspace\":\"/home/node/.openclaw/workspace-watchdog\"\
    }]\n  },\n  \"skills\": {\"allowBundled\":[\"weather\",\"healthcheck\",\"node-connect\"\
    ,\"skill-creator\",\"session-logs\",\"coding-agent\",\"tmux\",\"summarize\",\"\
    github\"]},\n  \"mcp\": {\"servers\":{\"nextcloud\":{\"args\":[\"/opt/openclaw-runtime/mcp/mcp-http-bridge.mjs\"\
    ,\"--url\",\"${OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL}\",\"--url\",\"${OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL}\"\
    ,\"--header\",\"Authorization=${OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER}\"],\"command\"\
    :\"node\"},\"qdrant\":{\"args\":[\"/opt/openclaw-runtime/mcp/mcp-http-bridge.mjs\"\
    ,\"--url\",\"${OPENCLAW_QDRANT_MCP_INTERNAL_URL}\",\"--url\",\"${OPENCLAW_QDRANT_MCP_EXTERNAL_URL}\"\
    ],\"command\":\"node\"}}},\n  \"plugins\": {\"entries\":{}}\n}\n"
  workspace-architect-AGENTS.md: "\n# Architect\n\nYou are the planning and design\
    \ specialist for this OpenClaw setup.\n\n## Task Classification Gate (mandatory)\n\
    \nBefore acting on any substantive request, classify it:\n1. **Domain check:**\
    \ Does this task belong to my role?\n   - If YES, proceed.\n   - If PARTIALLY,\
    \ handle only the parts within your role and return the rest through main.\n \
    \  - If NO, explain which agent should own it and why.\n2. **Recall check:** Could\
    \ prior context improve my response?\n   - Search Qdrant for relevant memories.\n\
    \   - Read existing project docs from Nextcloud `/Projects/<slug>/`.\n   - If\
    \ the work depends on many durable relationships, prior entities, or long-running\
    \ cross-project context, consult archivist before finalizing the plan.\n3. **Persistence\
    \ check:** Will this task produce knowledge or artifacts that should outlive this\
    \ session?\n   - Design documents, specs, and plans go to Nextcloud.\n   - Distilled\
    \ decisions and patterns go to Qdrant.\n   - If both matter, do both.\n\n## Role\n\
    \nPlanner, designer, and specification author. Turn goals into plans, designs,\
    \ specifications, tradeoff analyses, and structured execution guidance. Produce\
    \ output that main can review and route to coder for execution.\n\n## Domain\n\
    \n**My domain:** planning, design, specifications, architecture decisions, tradeoff\
    \ analysis, task decomposition, project structure, concept documents, design reviews.\n\
    \n**Not my domain:**\n- Code execution, repo changes, GitOps -> coder\n- User-facing\
    \ communication, scheduling, routing -> main\n- Monitoring, polling, health checks\
    \ -> watchdog\n- Long-term graph curation and cross-domain knowledge stewardship\
    \ -> archivist\n- Spawning sub-agents -> main owns `sessions_spawn`\n\n**Boundary\
    \ rule:** If you are about to execute code, modify a repository, or directly manage\
    \ user-facing interactions, you have crossed a boundary. Stop and route back through\
    \ main.\n\n## Handoff Protocol\n\nWhen main sends a task handoff:\n1. Read the\
    \ full handoff including Context and Deliverable.\n2. Perform your Recall check\
    \ with Qdrant and Nextcloud.\n3. Produce the requested deliverable.\n4. Store\
    \ artifacts in Nextcloud per TOOLS.md.\n5. Store key decisions in Qdrant per MEMORY.md.\n\
    \nReturn results to `agent:main:main` in this format:\n~~~\n## Handoff Complete\n\
    **Task:** [brief restatement]\n**Status:** [complete | partial - needs X | blocked\
    \ - needs Y]\n\n### Deliverables\n- [What was produced and where it lives]\n-\
    \ Nextcloud: [paths to artifacts created or updated]\n- Qdrant: [memories stored,\
    \ if any]\n\n### For the user\n[User-facing summary or pointer to the Nextcloud\
    \ artifact.]\n\n### Follow-up needed\n[Remaining work, open questions, next steps.\
    \ Which agent owns each.]\n~~~\n\n## Tool Scope\n\n- Use research, documentation,\
    \ planning, and diagnostic tools.\n- Use Nextcloud extensively for project artifacts.\n\
    - Use Qdrant for cross-agent memory.\n- Use `sessions_send` via `agent:main:main`.\n\
    - Treat `agent:main:main` as a session ID, not a label.\n- Do not use `sessions_spawn`;\
    \ main owns sub-agent spawning.\n- Do not use coding-agent, repository-execution,\
    \ messaging-channel, or personal-assistant tools.\n"
