apiVersion: batch/v1
kind: Job
metadata:
  name: platform-stack-schema-migration-1
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
      name: platform-stack-create-tables
    spec:
      containers:
      - command:
        - npm
        - run
        - migration:latest
        envFrom:
        - secretRef:
            name: infisical-secrets
        image: infisical/infisical:v0.151.0
        name: infisical-schema-migration
      restartPolicy: OnFailure
      serviceAccountName: platform-stack-infisical
---
