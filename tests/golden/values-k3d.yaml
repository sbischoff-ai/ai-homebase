apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '-5'
  labels:
    app.kubernetes.io/component: memgraph-bootstrap
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
  name: platform-stack-platform-stack-memgraph-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: memgraph-bootstrap
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: platform-stack
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - "until printf 'RETURN 1;\\n' | mgconsole --host \"platform-stack-memgraph\" --port 7687 --output-format csv >/dev/null 2>&1; do\n  echo \"waiting for platform-stack-memgraph:7687\"\n  sleep 2\ndone\ncat <<'CYPHER' >/tmp/memgraph-seed.cypher\n  // === Core entities ===\n  \n  MERGE (project:Entity:Project {slug: 'ai-homebase'})\n  ON CREATE SET project.name = 'ai-homebase',\n                project.domain = 'real',\n                project.kind = 'platform',\n                project.status = 'active';\n  \n  MERGE (user:Entity:Person {slug: 'user'})\n  ON CREATE SET user.name = 'User',\n                user.domain = 'real',\n                user.kind = 'owner';\n  \n  // === Services ===\n  \n  MERGE (openclaw:Entity:Service {slug: 'openclaw'})\n  ON CREATE SET openclaw.name = 'OpenClaw',\n                openclaw.domain = 'real',\n                openclaw.kind = 'agent-runtime';\n  \n  MERGE (nextcloud:Entity:Service {slug: 'nextcloud'})\n  ON CREATE SET nextcloud.name = 'Nextcloud',\n                nextcloud.domain = 'real',\n                nextcloud.kind = 'knowledge-store';\n  \n  MERGE (qdrant:Entity:Service {slug: 'qdrant'})\n  ON CREATE SET qdrant.name = 'Qdrant',\n                qdrant.domain = 'real',\n                qdrant.kind = 'vector-memory';\n  \n  MERGE (memgraph:Entity:Service {slug: 'memgraph'})\n  ON CREATE SET memgraph.name = 'Memgraph',\n                memgraph.domain = 'real',\n                memgraph.kind = 'graph-memory';\n  \n  MERGE (gitea:Entity:Service {slug: 'gitea'})\n  ON CREATE SET gitea.name = 'Gitea',\n                gitea.domain = 'real',\n                gitea.kind = 'source-control';\n  \n  MERGE (argocd:Entity:Service {slug: 'argocd'})\n  ON CREATE SET argocd.name = 'Argo CD',\n                argocd.domain = 'real',\n                argocd.kind = 'gitops';\n  \n  MERGE (registry:Entity:Service {slug: 'registry'})\n  ON CREATE SET registry.name = 'Registry',\n                registry.domain = 'real',\n                registry.kind = 'artifact-store';\n  \n  // === Agents ===\n  \n  MERGE (main:Entity:Agent {slug: 'main'})\n  ON CREATE SET main.name = 'main',\n                main.domain = 'real',\n                main.kind = 'orchestrator';\n  \n  MERGE (architect:Entity:Agent {slug: 'architect'})\n  ON CREATE SET architect.name = 'architect',\n                architect.domain = 'real',\n                architect.kind = 'planner';\n  \n  MERGE (coder:Entity:Agent {slug: 'coder'})\n  ON CREATE SET coder.name = 'coder',\n                coder.domain = 'real',\n                coder.kind = 'implementer';\n  \n  MERGE (watchdog:Entity:Agent {slug: 'watchdog'})\n  ON CREATE SET watchdog.name = 'watchdog',\n                watchdog.domain = 'real',\n                watchdog.kind = 'monitor';\n  \n  MERGE (archivist:Entity:Agent {slug: 'archivist'})\n  ON CREATE SET archivist.name = 'archivist',\n                archivist.domain = 'real',\n                archivist.kind = 'curator';\n  \n  MERGE (auditor:Entity:Agent {slug: 'auditor'})\n  ON CREATE SET auditor.name = 'auditor',\n                auditor.domain = 'real',\n                auditor.kind = 'reviewer';\n  \n  // === Repositories ===\n  \n  MERGE (gitopsRepo:Entity:Work {slug: 'cluster-gitops'})\n  ON CREATE SET gitopsRepo.name = 'cluster-gitops',\n                gitopsRepo.domain = 'real',\n                gitopsRepo.kind = 'repository';\n  \n  MERGE (sandboxRepo:Entity:Work {slug: 'openclaw-sandbox-images'})\n  ON CREATE SET sandboxRepo.name = 'openclaw-sandbox-images',\n                sandboxRepo.domain = 'real',\n                sandboxRepo.kind = 'repository';\n  \n  // === Relationships ===\n  \n  MATCH (project:Entity:Project {slug: 'ai-homebase'})\n  MATCH (user:Entity:Person {slug: 'user'})\n  MATCH (openclaw:Entity:Service {slug: 'openclaw'})\n  MATCH (nextcloud:Entity:Service {slug: 'nextcloud'})\n  MATCH (qdrant:Entity:Service {slug: 'qdrant'})\n  MATCH (memgraph:Entity:Service {slug: 'memgraph'})\n  MATCH (gitea:Entity:Service {slug: 'gitea'})\n  MATCH (argocd:Entity:Service {slug: 'argocd'})\n  MATCH (registry:Entity:Service {slug: 'registry'})\n  MATCH (main:Entity:Agent {slug: 'main'})\n  MATCH (architect:Entity:Agent {slug: 'architect'})\n  MATCH (coder:Entity:Agent {slug: 'coder'})\n  MATCH (watchdog:Entity:Agent {slug: 'watchdog'})\n  MATCH (archivist:Entity:Agent {slug: 'archivist'})\n  MATCH (auditor:Entity:Agent {slug: 'auditor'})\n  MATCH (gitopsRepo:Entity:Work {slug: 'cluster-gitops'})\n  MATCH (sandboxRepo:Entity:Work {slug: 'openclaw-sandbox-images'})\n  \n  // User owns the project\n  MERGE (project)-[:HAS_PART {role: 'owner'}]->(user)\n  \n  // Project uses services\n  MERGE (project)-[:HAS_PART {kind: 'service'}]->(openclaw)\n  MERGE (project)-[:HAS_PART {kind: 'service'}]->(nextcloud)\n  MERGE (project)-[:HAS_PART {kind: 'service'}]->(qdrant)\n  MERGE (project)-[:HAS_PART {kind: 'service'}]->(memgraph)\n  MERGE (project)-[:HAS_PART {kind: 'service'}]->(gitea)\n  MERGE (project)-[:HAS_PART {kind: 'service'}]->(argocd)\n  MERGE (project)-[:HAS_PART {kind: 'service'}]->(registry)\n  MERGE (project)-[:HAS_PART {kind: 'artifact'}]->(gitopsRepo)\n  MERGE (project)-[:HAS_PART {kind: 'artifact'}]->(sandboxRepo)\n  \n  // Agents are part of OpenClaw\n  MERGE (openclaw)-[:HAS_PART {kind: 'agent'}]->(main)\n  MERGE (openclaw)-[:HAS_PART {kind: 'agent'}]->(architect)\n  MERGE (openclaw)-[:HAS_PART {kind: 'agent'}]->(coder)\n  MERGE (openclaw)-[:HAS_PART {kind: 'agent'}]->(watchdog)\n  MERGE (openclaw)-[:HAS_PART {kind: 'agent'}]->(archivist)\n  MERGE (openclaw)-[:HAS_PART {kind: 'agent'}]->(auditor)\n  \n  // Archivist manages graph and memory services\n  MERGE (archivist)-[:INFLUENCES {kind: 'curates', context: 'graph structure'}]->(memgraph)\n  MERGE (archivist)-[:INFLUENCES {kind: 'grooms', context: 'memory consolidation'}]->(qdrant);\n  \nCYPHER\nmgconsole --host \"platform-stack-memgraph\" --port 7687 --output-format csv < /tmp/memgraph-seed.cypher\n"
        image: memgraph/memgraph:3.8.1
        imagePullPolicy: IfNotPresent
        name: memgraph-bootstrap
        terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '-10'
  labels:
    app.kubernetes.io/component: shared-postgresql-bootstrap
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
  name: platform-stack-shared-postgresql-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: shared-postgresql-bootstrap
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: platform-stack
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --dbname postgres; do
            echo "waiting for ${PGHOST}:${PGPORT}"
            sleep 2
          done
          psql -v ON_ERROR_STOP=1 --dbname postgres --set=gitea_db_password="$GITEA_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE gitea LOGIN PASSWORD %L', :'gitea_db_password')
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'gitea')\gexec
          SELECT format('ALTER ROLE gitea WITH LOGIN PASSWORD %L', :'gitea_db_password')
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'gitea')\gexec
          SELECT 'CREATE DATABASE gitea OWNER gitea'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'gitea')\gexec
          ALTER DATABASE gitea OWNER TO gitea;
          SQL
          psql -v ON_ERROR_STOP=1 --dbname postgres --set=vaultwarden_db_password="$VAULTWARDEN_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE vaultwarden LOGIN PASSWORD %L', :'vaultwarden_db_password')
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vaultwarden')\gexec
          SELECT format('ALTER ROLE vaultwarden WITH LOGIN PASSWORD %L', :'vaultwarden_db_password')
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vaultwarden')\gexec
          SELECT 'CREATE DATABASE vaultwarden OWNER vaultwarden'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vaultwarden')\gexec
          ALTER DATABASE vaultwarden OWNER TO vaultwarden;
          SQL
          psql -v ON_ERROR_STOP=1 --dbname postgres --set=nextcloud_db_password="$NEXTCLOUD_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE nextcloud LOGIN PASSWORD %L', :'nextcloud_db_password')
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'nextcloud')\gexec
          SELECT format('ALTER ROLE nextcloud WITH LOGIN PASSWORD %L', :'nextcloud_db_password')
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'nextcloud')\gexec
          SELECT 'CREATE DATABASE nextcloud OWNER nextcloud'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'nextcloud')\gexec
          ALTER DATABASE nextcloud OWNER TO nextcloud;
          SQL
          psql -v ON_ERROR_STOP=1 --dbname postgres --set=paperless_db_password="$PAPERLESS_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE paperless LOGIN PASSWORD %L', :'paperless_db_password')
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'paperless')\gexec
          SELECT format('ALTER ROLE paperless WITH LOGIN PASSWORD %L', :'paperless_db_password')
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'paperless')\gexec
          SELECT 'CREATE DATABASE paperless OWNER paperless'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'paperless')\gexec
          ALTER DATABASE paperless OWNER TO paperless;
          SQL
        env:
        - name: PGHOST
          value: platform-stack-shared-postgresql
        - name: PGPORT
          value: '5432'
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: shared-postgresql-auth
        - name: GITEA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: GITEA__database__PASSWD
              name: gitea-config-secrets
        - name: VAULTWARDEN_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: VAULTWARDEN_DB_PASSWORD
              name: vaultwarden-config-secrets
        - name: NEXTCLOUD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: PAPERLESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PAPERLESS_DB_PASSWORD
              name: paperless-config-secrets
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        name: shared-postgresql-bootstrap
        terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Never
---
