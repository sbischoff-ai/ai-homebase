apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qdrant-mcp
  name: platform-stack-qdrant-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: qdrant-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: qdrant-mcp
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - "if [ ! -x /tmp/qdrant-mcp/bin/mcp-server-qdrant ]; then\n  python -m venv\
          \ /tmp/qdrant-mcp\n  /tmp/qdrant-mcp/bin/pip install --no-cache-dir \"mcp-server-qdrant==0.8.0\"\
          \nfi\nexec /tmp/qdrant-mcp/bin/mcp-server-qdrant --transport streamable-http\n"
        env:
        - name: FASTMCP_PORT
          value: '8000'
        - name: QDRANT_URL
          value: http://platform-stack-qdrant:6333
        - name: COLLECTION_NAME
          value: openclaw-memory
        - name: EMBEDDING_PROVIDER
          value: fastembed
        - name: EMBEDDING_MODEL
          value: BAAI/bge-base-en-v1.5
        - name: TOOL_STORE_DESCRIPTION
          value: "Store a memory for cross-agent recall. Use this to preserve durable\
            \ knowledge such as user preferences, decisions, conventions, patterns,\
            \ incidents, plans, creative content, and reusable context.\n\nREQUIRED:\
            \ The `information` parameter must begin with domain and kind tags in\
            \ brackets, followed by a complete statement:\n  [real|speculative|fictional|synthetic]\
            \ [user-preference|user-context|decision|convention|pattern|fact|plan|task-context|incident|monitor-rule|creative|relationship|reference]\
            \ Your memory text here.\n\nREQUIRED: The `metadata` parameter must be\
            \ a JSON object with at minimum:\n  {\"kind\": \"...\", \"domain\": \"\
            ...\", \"agent\": \"...\", \"created\": \"ISO-8601\"}\n\nOptional metadata:\
            \ confidence (high|medium|low), project, tags (array), nc_refs (array\
            \ of {type, id, path, label}), supersedes, expiry, source_url.\n\nGuidelines:\n\
            - Store facts you would want any agent to recall weeks later.\n- Do not\
            \ store ephemeral task status, transient tool output, or easily re-derivable\
            \ information.\n- Do not store secrets or credentials.\n- For fictional\
            \ or creative content, always use domain `fictional`.\n- If correcting\
            \ a prior memory, include `supersedes` in metadata and mention the correction\
            \ in the text.\n- Include Nextcloud references in both the text and `nc_refs`\
            \ metadata when relevant.\n"
        - name: TOOL_FIND_DESCRIPTION
          value: 'Search shared semantic memory across all agents. Returns memories
            ranked by relevance.


            Use this tool before answering questions about user preferences, prior
            decisions, established conventions, past incidents, project history, people
            and relationships, creative worlds, or anything that may have been stored
            previously.


            Query tips:

            - Include a domain tag when useful: `[real] user''s preferred editor`
            or `[fictional] Ashenmoor political structure`

            - Include a kind tag when useful: `[decision] database choice for Nextcloud`

            - Use natural language for broad recall.

            - Be specific when possible.

            - If results mix real and fictional content, re-query with an explicit
            `[real]` or `[fictional]` prefix.


            Important:

            - This searches all memories from all agents.

            - Retrieval is currently semantic, not metadata-filtered, so phrasing
            matters.

            - Returned memories include metadata such as kind, domain, agent, confidence,
            and Nextcloud references.

            - Treat speculative or low-confidence results cautiously.

            - Treat expired memories as potentially stale.

            '
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: HF_HOME
          value: /tmp/.cache/huggingface
        - name: HUGGINGFACE_HUB_CACHE
          value: /tmp/.cache/huggingface/hub
        - name: FASTMCP_HOST
          value: 0.0.0.0
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 300
          periodSeconds: 15
          tcpSocket:
            port: http
        name: qdrant-mcp
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          initialDelaySeconds: 180
          periodSeconds: 10
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
