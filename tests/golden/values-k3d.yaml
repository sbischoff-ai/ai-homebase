apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '10'
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-bootstrap-users
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - "until su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json\
          \ 2>/dev/null | grep -q \"\\\"installed\\\":true\"'; do\n  echo \"waiting\
          \ for nextcloud bootstrap\"\n  sleep 5\ndone\nusername_var=\"BOOTSTRAP_USER_0_USERNAME\"\
          \ndisplay_name_var=\"BOOTSTRAP_USER_0_DISPLAY_NAME\"\npassword_var=\"BOOTSTRAP_USER_0_PASSWORD\"\
          \nusername=\"$(printenv \"${username_var}\")\"\ndisplay_name=\"$(printenv\
          \ \"${display_name_var}\")\"\npassword=\"$(printenv \"${password_var}\"\
          )\"\n\nif ! su -s /bin/sh www-data -c \"cd /var/www/html && php occ user:info\
          \ \\\"${username}\\\" >/dev/null 2>&1\"; then\n  OC_PASS=\"${password}\"\
          \ su -s /bin/sh www-data -c \"cd /var/www/html && php occ user:add --password-from-env\
          \ --display-name \\\"${display_name}\\\" \\\"${username}\\\"\"\nfi\ncurrent_display_name=\"\
          $(su -s /bin/sh www-data -c \"cd /var/www/html && php occ user:info \\\"\
          ${username}\\\" 2>/dev/null\" | sed -n 's/^  - display_name: //p' | head\
          \ -n 1)\"\nif [ \"${current_display_name}\" != \"${display_name}\" ]; then\n\
          \  su -s /bin/sh www-data -c \"cd /var/www/html && php occ user:setting\
          \ \\\"${username}\\\" settings display_name \\\"${display_name}\\\" >/dev/null\"\
          \nfi\nOC_PASS=\"${password}\" su -s /bin/sh www-data -c \"cd /var/www/html\
          \ && php occ user:resetpassword --password-from-env \\\"${username}\\\"\"\
          \n"
        env:
        - name: POSTGRES_HOST
          value: platform-stack-shared-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        - name: BOOTSTRAP_USER_0_USERNAME
          value: openclaw
        - name: BOOTSTRAP_USER_0_DISPLAY_NAME
          value: OpenClaw
        - name: BOOTSTRAP_USER_0_PASSWORD
          valueFrom:
            secretKeyRef:
              key: NEXTCLOUD_PASSWORD
              name: openclaw-nextcloud-mcp-secrets
        image: nextcloud:33.0.0-apache
        imagePullPolicy: IfNotPresent
        name: bootstrap-users
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      restartPolicy: Never
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
