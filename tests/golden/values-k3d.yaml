apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openclaw
    spec:
      containers:
      - command:
        - node
        - openclaw.mjs
        - gateway
        - --allow-unconfigured
        env:
        - name: OPENCLAW_GATEWAY_PORT
          value: '18789'
        - name: OPENCLAW_GATEWAY_BIND
          value: 0.0.0.0
        - name: OPENCLAW_HOME
          value: /home/node/.openclaw
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_PATH
          value: /home/node/.openclaw/openclaw.json
        - name: OPENCLAW_SANDBOX
          value: '1'
        - name: PATH
          value: /opt/memgraph-tools/bin:/opt/openclaw-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
