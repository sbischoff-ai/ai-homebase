          timeoutSeconds: 5
        name: nextcloud-mcp
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /app/data
          name: app-data
        - mountPath: /opt/nextcloud-mcp
          name: runtime-config
          readOnly: true
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: app-data
      - configMap:
          name: platform-stack-nextcloud-mcp-runtime
        name: runtime-config
