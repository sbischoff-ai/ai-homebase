apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '-5'
  labels:
    app.kubernetes.io/component: memgraph-bootstrap
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
  name: platform-stack-platform-stack-memgraph-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: memgraph-bootstrap
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: platform-stack
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - "until printf 'RETURN 1;\\n' | mgconsole --host \"platform-stack-memgraph\"\
          \ --port 7687 --output-format csv >/dev/null 2>&1; do\n  echo \"waiting\
          \ for platform-stack-memgraph:7687\"\n  sleep 2\ndone\ncat <<'CYPHER' >/tmp/memgraph-seed.cypher\n\
          \  MERGE (project:Project:System {slug: 'ai-homebase'})\n  ON CREATE SET\
          \ project.name = 'ai-homebase',\n                project.domain = 'real',\n\
          \                project.kind = 'platform';\n  \n  MERGE (user:Person:User\
          \ {slug: 'user'})\n  ON CREATE SET user.name = 'User',\n               \
          \ user.domain = 'real';\n  \n  MERGE (openclaw:Service:System {slug: 'openclaw'})\n\
          \  ON CREATE SET openclaw.name = 'OpenClaw',\n                openclaw.category\
          \ = 'agent-runtime';\n  \n  MERGE (nextcloud:Service:System {slug: 'nextcloud'})\n\
          \  ON CREATE SET nextcloud.name = 'Nextcloud',\n                nextcloud.category\
          \ = 'knowledge-store';\n  \n  MERGE (qdrant:Service:System {slug: 'qdrant'})\n\
          \  ON CREATE SET qdrant.name = 'Qdrant',\n                qdrant.category\
          \ = 'vector-memory';\n  \n  MERGE (memgraph:Service:System {slug: 'memgraph'})\n\
          \  ON CREATE SET memgraph.name = 'Memgraph',\n                memgraph.category\
          \ = 'graph-memory';\n  \n  MERGE (memgraphLab:Service:System {slug: 'memgraph-lab'})\n\
          \  ON CREATE SET memgraphLab.name = 'Memgraph Lab',\n                memgraphLab.category\
          \ = 'graph-ui';\n  \n  MERGE (gitea:Service:System {slug: 'gitea'})\n  ON\
          \ CREATE SET gitea.name = 'Gitea',\n                gitea.category = 'source-control';\n\
          \  \n  MERGE (argocd:Service:System {slug: 'argocd'})\n  ON CREATE SET argocd.name\
          \ = 'Argo CD',\n                argocd.category = 'gitops';\n  \n  MERGE\
          \ (registry:Service:System {slug: 'registry'})\n  ON CREATE SET registry.name\
          \ = 'Registry',\n                registry.category = 'artifact-store';\n\
          \  \n  MERGE (main:Agent:Person {slug: 'main'})\n  ON CREATE SET main.name\
          \ = 'main',\n                main.role = 'orchestrator';\n  \n  MERGE (architect:Agent:Person\
          \ {slug: 'architect'})\n  ON CREATE SET architect.name = 'architect',\n\
          \                architect.role = 'planner';\n  \n  MERGE (coder:Agent:Person\
          \ {slug: 'coder'})\n  ON CREATE SET coder.name = 'coder',\n            \
          \    coder.role = 'implementer';\n  \n  MERGE (watchdog:Agent:Person {slug:\
          \ 'watchdog'})\n  ON CREATE SET watchdog.name = 'watchdog',\n          \
          \      watchdog.role = 'monitor';\n  \n  MERGE (archivist:Agent:Person {slug:\
          \ 'archivist'})\n  ON CREATE SET archivist.name = 'archivist',\n       \
          \         archivist.role = 'knowledge-graph-curator';\n  \n  MERGE (gitopsRepo:Repository:System\
          \ {slug: 'cluster-gitops'})\n  ON CREATE SET gitopsRepo.name = 'cluster-gitops',\n\
          \                gitopsRepo.kind = 'gitops';\n  \n  MERGE (sandboxRepo:Repository:System\
          \ {slug: 'openclaw-sandbox-images'})\n  ON CREATE SET sandboxRepo.name =\
          \ 'openclaw-sandbox-images',\n                sandboxRepo.kind = 'sandbox-images';\n\
          \  \n  MATCH (project:Project:System {slug: 'ai-homebase'})\n  MATCH (user:Person:User\
          \ {slug: 'user'})\n  MATCH (openclaw:Service:System {slug: 'openclaw'})\n\
          \  MATCH (nextcloud:Service:System {slug: 'nextcloud'})\n  MATCH (qdrant:Service:System\
          \ {slug: 'qdrant'})\n  MATCH (memgraph:Service:System {slug: 'memgraph'})\n\
          \  MATCH (memgraphLab:Service:System {slug: 'memgraph-lab'})\n  MATCH (gitea:Service:System\
          \ {slug: 'gitea'})\n  MATCH (argocd:Service:System {slug: 'argocd'})\n \
          \ MATCH (registry:Service:System {slug: 'registry'})\n  MATCH (main:Agent:Person\
          \ {slug: 'main'})\n  MATCH (architect:Agent:Person {slug: 'architect'})\n\
          \  MATCH (coder:Agent:Person {slug: 'coder'})\n  MATCH (watchdog:Agent:Person\
          \ {slug: 'watchdog'})\n  MATCH (archivist:Agent:Person {slug: 'archivist'})\n\
          \  MATCH (gitopsRepo:Repository:System {slug: 'cluster-gitops'})\n  MATCH\
          \ (sandboxRepo:Repository:System {slug: 'openclaw-sandbox-images'})\n  MERGE\
          \ (project)-[:HAS_USER]->(user)\n  MERGE (project)-[:USES_SERVICE]->(openclaw)\n\
          \  MERGE (project)-[:USES_SERVICE]->(nextcloud)\n  MERGE (project)-[:USES_SERVICE]->(qdrant)\n\
          \  MERGE (project)-[:USES_SERVICE]->(memgraph)\n  MERGE (project)-[:USES_SERVICE]->(memgraphLab)\n\
          \  MERGE (project)-[:USES_SERVICE]->(gitea)\n  MERGE (project)-[:USES_SERVICE]->(argocd)\n\
          \  MERGE (project)-[:USES_SERVICE]->(registry)\n  MERGE (project)-[:USES_REPOSITORY]->(gitopsRepo)\n\
          \  MERGE (project)-[:USES_REPOSITORY]->(sandboxRepo)\n  MERGE (openclaw)-[:COORDINATES]->(main)\n\
          \  MERGE (openclaw)-[:COORDINATES]->(architect)\n  MERGE (openclaw)-[:COORDINATES]->(coder)\n\
          \  MERGE (openclaw)-[:COORDINATES]->(watchdog)\n  MERGE (openclaw)-[:COORDINATES]->(archivist)\n\
          \  MERGE (archivist)-[:CURATES]->(memgraph)\n  MERGE (archivist)-[:GROOMS]->(qdrant)\n\
          \  MERGE (memgraphLab)-[:VISUALIZES]->(memgraph)\n  MERGE (archivist)-[:MAINTAINS_SCHEMA_FOR]->(memgraph)\n\
          \  \nCYPHER\nmgconsole --host \"platform-stack-memgraph\" --port 7687 --output-format\
          \ csv < /tmp/memgraph-seed.cypher\n"
        image: memgraph/memgraph:3.8.1
        imagePullPolicy: IfNotPresent
        name: memgraph-bootstrap
        terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '-10'
  labels:
    app.kubernetes.io/component: shared-postgresql-bootstrap
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
  name: platform-stack-shared-postgresql-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: shared-postgresql-bootstrap
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: platform-stack
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - "until pg_isready -h \"$PGHOST\" -p \"$PGPORT\" -U \"$PGUSER\" --dbname\
          \ postgres; do\n  echo \"waiting for ${PGHOST}:${PGPORT}\"\n  sleep 2\n\
          done\npsql -v ON_ERROR_STOP=1 --dbname postgres --set=gitea_db_password=\"\
          $GITEA_DB_PASSWORD\" <<'SQL'\nSELECT format('CREATE ROLE gitea LOGIN PASSWORD\
          \ %L', :'gitea_db_password')\nWHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles\
          \ WHERE rolname = 'gitea')\\gexec\nSELECT format('ALTER ROLE gitea WITH\
          \ LOGIN PASSWORD %L', :'gitea_db_password')\nWHERE EXISTS (SELECT FROM pg_catalog.pg_roles\
          \ WHERE rolname = 'gitea')\\gexec\nSELECT 'CREATE DATABASE gitea OWNER gitea'\n\
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'gitea')\\gexec\n\
          ALTER DATABASE gitea OWNER TO gitea;\nSQL\npsql -v ON_ERROR_STOP=1 --dbname\
          \ postgres --set=vaultwarden_db_password=\"$VAULTWARDEN_DB_PASSWORD\" <<'SQL'\n\
          SELECT format('CREATE ROLE vaultwarden LOGIN PASSWORD %L', :'vaultwarden_db_password')\n\
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vaultwarden')\\\
          gexec\nSELECT format('ALTER ROLE vaultwarden WITH LOGIN PASSWORD %L', :'vaultwarden_db_password')\n\
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vaultwarden')\\\
          gexec\nSELECT 'CREATE DATABASE vaultwarden OWNER vaultwarden'\nWHERE NOT\
          \ EXISTS (SELECT FROM pg_database WHERE datname = 'vaultwarden')\\gexec\n\
          ALTER DATABASE vaultwarden OWNER TO vaultwarden;\nSQL\npsql -v ON_ERROR_STOP=1\
          \ --dbname postgres --set=nextcloud_db_password=\"$NEXTCLOUD_DB_PASSWORD\"\
          \ <<'SQL'\nSELECT format('CREATE ROLE nextcloud LOGIN PASSWORD %L', :'nextcloud_db_password')\n\
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'nextcloud')\\\
          gexec\nSELECT format('ALTER ROLE nextcloud WITH LOGIN PASSWORD %L', :'nextcloud_db_password')\n\
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'nextcloud')\\\
          gexec\nSELECT 'CREATE DATABASE nextcloud OWNER nextcloud'\nWHERE NOT EXISTS\
          \ (SELECT FROM pg_database WHERE datname = 'nextcloud')\\gexec\nALTER DATABASE\
          \ nextcloud OWNER TO nextcloud;\nSQL\npsql -v ON_ERROR_STOP=1 --dbname postgres\
          \ --set=paperless_db_password=\"$PAPERLESS_DB_PASSWORD\" <<'SQL'\nSELECT\
          \ format('CREATE ROLE paperless LOGIN PASSWORD %L', :'paperless_db_password')\n\
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'paperless')\\\
          gexec\nSELECT format('ALTER ROLE paperless WITH LOGIN PASSWORD %L', :'paperless_db_password')\n\
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'paperless')\\\
          gexec\nSELECT 'CREATE DATABASE paperless OWNER paperless'\nWHERE NOT EXISTS\
          \ (SELECT FROM pg_database WHERE datname = 'paperless')\\gexec\nALTER DATABASE\
          \ paperless OWNER TO paperless;\nSQL\n"
        env:
        - name: PGHOST
          value: platform-stack-shared-postgresql
        - name: PGPORT
          value: '5432'
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: shared-postgresql-auth
        - name: GITEA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: GITEA__database__PASSWD
              name: gitea-config-secrets
        - name: VAULTWARDEN_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: VAULTWARDEN_DB_PASSWORD
              name: vaultwarden-config-secrets
        - name: NEXTCLOUD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
