        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        image: nextcloud:33.0.0-apache
        imagePullPolicy: IfNotPresent
        name: bootstrap-apps
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      restartPolicy: Never
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
