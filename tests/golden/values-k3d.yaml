apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: postfix-relay
  name: platform-stack-postfix-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: postfix-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: postfix-relay
    spec:
      containers:
      - env:
        - name: ALLOWED_SENDER_DOMAINS
          value: example.com
        - name: POSTFIX_myhostname
          value: smtp.example.com
        - name: POSTFIX_mynetworks
          value: 127.0.0.0/8 10.42.0.0/16 10.43.0.0/16
        - name: MASQUERADED_DOMAINS
          value: example.com
        - name: INBOUND_DEBUGGING
          value: '0'
        - name: LOG_FORMAT
          value: plain
        image: boky/postfix:v4.4.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: smtp-submission
        name: postfix-relay
        ports:
        - containerPort: 587
          name: smtp-submission
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: smtp-submission
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
      securityContext:
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: qdrant
  name: platform-stack-qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: qdrant
    spec:
      containers:
      - env:
        - name: QDRANT__STORAGE__STORAGE_PATH
          value: /qdrant/storage/storage
        - name: QDRANT__STORAGE__SNAPSHOTS_PATH
          value: /qdrant/storage/snapshots
        - name: QDRANT__STORAGE__TEMP_PATH
          value: /qdrant/storage/tmp
        image: qdrant/qdrant:v1.17.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        name: qdrant
        ports:
        - containerPort: 6333
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /qdrant/storage
          name: data
      initContainers:
      - command:
        - sh
        - -ceu
        - |
          mkdir -p /qdrant/storage/storage /qdrant/storage/snapshots /qdrant/storage/tmp
          chown -R 0:0 /qdrant/storage
