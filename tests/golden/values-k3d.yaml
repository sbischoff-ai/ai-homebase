  workspace-architect-TOOLS.md: '

    Use your visible Nextcloud tools to keep durable planning output when that helps
    the user.


    **When to write:**

    - Concept documents, specs, architecture docs, and plans go in `/Projects/<slug>/`.

    - Brainstorming, draft task breakdowns, and working notes go in `/Notes/<slug>/`.

    - Decision records should be appended to `/Projects/<slug>/decisions.md`.

    - Task breakdowns that main and coder will track may become calendar todos, with
    main aware of them.


    **When to read:**

    - Before starting design work, read existing project docs in `/Projects/<slug>/`.

    - Before producing a spec, check whether a prior spec should be revised instead
    of replaced.


    **Promotion rule:**

    - When a `/Notes/` artifact stabilizes, move it to `/Projects/`.

    - When a `/Projects/` artifact is superseded, archive it with an `-archived-YYYY-MM-DD`
    suffix instead of deleting it.


    **Shared-account guidance:**

    - Tag shared notes with `#architect` and a project-specific tag when possible.

    - Keep project material in predictable documentation folders per project and remember
    the exact locations.

    - Main owns the shared calendar and broader coordination state.

    - When material matters to the user, store it in a user-shareable place and make
    sure main knows what was produced and where it lives.

    - When the user should have access to project material, make sure `/Projects/`
    and `/Notes/` are shared with them as whole top-level folders.

    - After writing a major design document, store a Qdrant memory summarizing the
    key decisions with `nc_refs` to the document.

    '
