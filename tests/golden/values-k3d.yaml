apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: infisical
    chart: infisical-0.2.0
    component: infisical
    heritage: Helm
    release: platform-stack
  name: platform-stack-infisical
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infisical
      component: infisical
      release: platform-stack
  template:
    metadata:
      labels:
        app: infisical
        component: infisical
        release: platform-stack
    spec:
      containers:
      - env:
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              key: AUTH_SECRET
              name: infisical-secrets
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: ENCRYPTION_KEY
              name: infisical-secrets
        - name: SITE_URL
          valueFrom:
            secretKeyRef:
              key: SITE_URL
              name: infisical-secrets
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              key: SMTP_HOST
              name: infisical-secrets
              optional: true
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              key: SMTP_PORT
              name: infisical-secrets
              optional: true
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              key: SMTP_USERNAME
              name: infisical-secrets
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: SMTP_PASSWORD
              name: infisical-secrets
              optional: true
        - name: SMTP_FROM_ADDRESS
          valueFrom:
            secretKeyRef:
              key: SMTP_FROM_ADDRESS
              name: infisical-secrets
              optional: true
        - name: SMTP_FROM_NAME
          valueFrom:
            secretKeyRef:
              key: SMTP_FROM_NAME
              name: infisical-secrets
              optional: true
        - name: DB_CONNECTION_URI
          valueFrom:
            secretKeyRef:
              key: DB_CONNECTION_URI
              name: infisical-secrets
              optional: true
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              key: REDIS_URL
              name: infisical-secrets
              optional: true
        image: infisical/infisical:v0.151.0
        imagePullPolicy: IfNotPresent
        name: infisical-infisical
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/status
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          limits:
            memory: 1000Mi
          requests:
            cpu: 350m
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: false
      initContainers:
      - args:
        - job
        - platform-stack-schema-migration-1
        image: ghcr.io/groundnuty/k8s-wait-for:no-root-v2.0
        imagePullPolicy: IfNotPresent
        name: migration-init
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: platform-stack-infisical
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openclaw
    spec:
      containers:
      - command:
        - node
        - openclaw.mjs
        - gateway
        - --allow-unconfigured
        env:
        - name: OPENCLAW_GATEWAY_PORT
          value: '18789'
        - name: OPENCLAW_GATEWAY_BIND
          value: 0.0.0.0
        - name: OPENCLAW_HOME
          value: /home/node/.openclaw
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_PATH
          value: /etc/openclaw/openclaw.json
        - name: OPENCLAW_SANDBOX
          value: '1'
        - name: DOCKER_HOST
          value: ssh://docker-remote@host.k3d.internal:2222
        - name: HOME
          value: /home/node
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_GATEWAY_TOKEN
              name: openclaw-app-secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: openclaw-app-secrets
        image: ghcr.io/openclaw/openclaw:2026.3.13-1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        name: openclaw
        ports:
        - containerPort: 18789
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 2000m
            memory: 8Gi
          requests:
            cpu: 1000m
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /startupz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /home/node/.openclaw
          name: data
        - mountPath: /etc/openclaw/openclaw.json
          name: config
          readOnly: true
          subPath: openclaw.json
        - mountPath: /home/node/.ssh
          name: remote-docker-ssh
          readOnly: true
      initContainers:
      - command:
        - /bin/sh
        - -c
        - "set -eu\nmkdir -p /ssh-target\nif [ ! -s /ssh-source/id_ed25519 ]; then\n\
          \  echo >&2 \"remoteDocker.ssh.secretName must reference a Secret containing\
          \ non-empty id_ed25519 and known_hosts keys; id_ed25519 is missing or empty.\"\
          \n  exit 1\nfi\nif [ ! -s /ssh-source/known_hosts ]; then\n  echo >&2 \"\
          remoteDocker.ssh.secretName must reference a Secret containing non-empty\
          \ id_ed25519 and known_hosts keys; known_hosts is missing or empty.\"\n\
          \  exit 1\nfi\necho \"Copying SSH files from /ssh-source into /ssh-target.\"\
          \ncp -f /ssh-source/id_ed25519 /ssh-target/id_ed25519 || {\n  echo >&2 \"\
          Failed to copy /ssh-source/id_ed25519 to /ssh-target/id_ed25519; verify\
          \ the mounted Secret files are readable and that the init container security\
          \ context allows writes to /ssh-target.\"\n  exit 1\n}\ncp -f /ssh-source/known_hosts\
          \ /ssh-target/known_hosts || {\n  echo >&2 \"Failed to copy /ssh-source/known_hosts\
          \ to /ssh-target/known_hosts; verify the mounted Secret files are readable\
          \ and that the init container security context allows writes to /ssh-target.\"\
          \n  exit 1\n}\necho \"Locking permissions before handing /ssh-target to\
          \ UID/GID 1000.\"\nchmod 0700 /ssh-target || {\n  echo >&2 \"Failed to set\
          \ mode 0700 on /ssh-target before ownership changes; verify the init container\
          \ security context still permits writes to the mounted emptyDir volume.\"\
          \n  exit 1\n}\nchmod 0600 /ssh-target/id_ed25519 || {\n  echo >&2 \"Failed\
          \ to set mode 0600 on /ssh-target/id_ed25519 before ownership changes; verify\
          \ the copied SSH key is writable inside /ssh-target and that the init container\
          \ security context still permits writes to the mounted emptyDir volume.\"\
          \n  exit 1\n}\nchmod 0644 /ssh-target/known_hosts || {\n  echo >&2 \"Failed\
          \ to set mode 0644 on /ssh-target/known_hosts before ownership changes;\
          \ verify the copied known_hosts file is writable inside /ssh-target and\
          \ that the init container security context still permits writes to the mounted\
          \ emptyDir volume.\"\n  exit 1\n}\nchown -R 1000:1000 /ssh-target || {\n\
          \  echo >&2 \"Failed to hand /ssh-target to UID/GID 1000 after permissions\
          \ were locked down; verify the init container still runs as UID/GID 0 with\
          \ the CHOWN capability required by the security context.\"\n  exit 1\n}\n"
        image: ghcr.io/openclaw/openclaw:2026.3.13-1
        imagePullPolicy: IfNotPresent
        name: remote-docker-ssh-permissions
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /ssh-source
          name: remote-docker-ssh-secret
          readOnly: true
        - mountPath: /ssh-target
          name: remote-docker-ssh
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openclaw
      volumes:
      - emptyDir:
          medium: Memory
        name: tmp
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-openclaw
      - configMap:
          items:
          - key: openclaw.json
            path: openclaw.json
          name: platform-stack-openclaw
        name: config
      - name: remote-docker-ssh-secret
        secret:
          secretName: openclaw-remote-docker-ssh
      - name: remote-docker-ssh
---
