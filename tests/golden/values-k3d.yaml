          \ 2>/dev/null | grep -q \"\\\"installed\\\":true\"'; do\n  echo \"waiting\
          \ for nextcloud bootstrap\"\n  sleep 5\ndone\n\nensure_parent_dir() {\n\
          \  target=\"$1\"\n  parent_dir=\"$(dirname \"${target}\")\"\n  mkdir -p\
          \ \"${parent_dir}\"\n  chown 33:33 \"${parent_dir}\"\n  chmod 0750 \"${parent_dir}\"\
          \n}\n\nwrite_managed_file() {\n  target=\"$1\"\n  temp_file=\"$(mktemp)\"\
          \n  cat >\"${temp_file}\"\n  if [ ! -f \"${target}\" ] || ! cmp -s \"${temp_file}\"\
          \ \"${target}\"; then\n    cp \"${temp_file}\" \"${target}\"\n    chown\
          \ 33:33 \"${target}\"\n    chmod 0640 \"${target}\"\n  fi\n  rm -f \"${temp_file}\"\
          \n}\nowner_username=\"openclaw\"\nproject_slug=\"ai-homebase\"\nproject_root=\"\
          /var/www/html/data/${owner_username}/files/Projects/${project_slug}\"\n\
          notes_root=\"/var/www/html/data/${owner_username}/files/Notes/${project_slug}\"\
          \nmkdir -p \"${project_root}\" \"${notes_root}\"\nchown 33:33 \"${project_root}\"\
          \ \"${notes_root}\"\nchmod 0750 \"${project_root}\" \"${notes_root}\"\n\
          ensure_parent_dir \"${project_root}/overview.md\"\nwrite_managed_file \"\
          ${project_root}/overview.md\" <\"/bootstrap-content/project-0-file-0\"\n\
          ensure_parent_dir \"${project_root}/multi-agent-topology.md\"\nwrite_managed_file\
          \ \"${project_root}/multi-agent-topology.md\" <\"/bootstrap-content/project-0-file-1\"\
          \nensure_parent_dir \"${project_root}/gitops-workflow.md\"\nwrite_managed_file\
          \ \"${project_root}/gitops-workflow.md\" <\"/bootstrap-content/project-0-file-2\"\
          \nensure_parent_dir \"${project_root}/cluster-architecture.md\"\nwrite_managed_file\
          \ \"${project_root}/cluster-architecture.md\" <\"/bootstrap-content/project-0-file-3\"\
          \nensure_parent_dir \"${project_root}/project-documentation-model.md\"\n\
          write_managed_file \"${project_root}/project-documentation-model.md\" <\"\
          /bootstrap-content/project-0-file-4\"\nensure_parent_dir \"${project_root}/qdrant-memory-schema.md\"\
          \nwrite_managed_file \"${project_root}/qdrant-memory-schema.md\" <\"/bootstrap-content/project-0-file-5\"\
          \nensure_parent_dir \"${project_root}/knowledge-graph-schema.md\"\nwrite_managed_file\
          \ \"${project_root}/knowledge-graph-schema.md\" <\"/bootstrap-content/project-0-file-6\"\
          \nensure_parent_dir \"${project_root}/incidents/README.md\"\nwrite_managed_file\
          \ \"${project_root}/incidents/README.md\" <\"/bootstrap-content/project-0-file-7\"\
          \nensure_parent_dir \"${project_root}/baselines.md\"\nwrite_managed_file\
          \ \"${project_root}/baselines.md\" <\"/bootstrap-content/project-0-file-8\"\
          \nensure_parent_dir \"${project_root}/escalation-rules.md\"\nwrite_managed_file\
          \ \"${project_root}/escalation-rules.md\" <\"/bootstrap-content/project-0-file-9\"\
          \nensure_parent_dir \"${notes_root}/project-brief.md\"\nwrite_managed_file\
          \ \"${notes_root}/project-brief.md\" <\"/bootstrap-content/project-0-note-0\"\
          \nensure_parent_dir \"${notes_root}/planning-backlog.md\"\nwrite_managed_file\
          \ \"${notes_root}/planning-backlog.md\" <\"/bootstrap-content/project-0-note-1\"\
          \nensure_parent_dir \"${notes_root}/open-questions.md\"\nwrite_managed_file\
          \ \"${notes_root}/open-questions.md\" <\"/bootstrap-content/project-0-note-2\"\
          \nsu -s /bin/sh www-data -c \"cd /var/www/html && php occ files:scan --path='${owner_username}/files/Projects/${project_slug}'\"\
          \nsu -s /bin/sh www-data -c \"cd /var/www/html && php occ files:scan --path='${owner_username}/files/Notes/${project_slug}'\"\
          \n"
        env:
        - name: POSTGRES_HOST
          value: platform-stack-shared-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        image: nextcloud:33.0.0-apache
        imagePullPolicy: IfNotPresent
        name: bootstrap-project-content
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
        - mountPath: /bootstrap-content
          name: bootstrap-content
          readOnly: true
      restartPolicy: Never
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
