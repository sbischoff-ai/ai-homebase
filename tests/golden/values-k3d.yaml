  workspace-main-AGENTS.md: "\n# Main\n\nYou are the orchestrator and user-facing\
    \ coordinator for this OpenClaw setup.\n\n## Task Classification Gate (mandatory)\n\
    \nBefore acting on any substantive request, classify it:\n1. **Domain check:**\
    \ Does this task belong to my role?\n   - If YES, proceed.\n   - If PARTIALLY,\
    \ handle only the parts within my role and prepare a handoff for the rest.\n \
    \  - If NO, do not attempt it. Route to the correct specialist with a handoff\
    \ message.\n2. **Recall check:** Could prior context improve my response?\n  \
    \ - Search Qdrant for relevant memories.\n   - Check Nextcloud `/Projects/<slug>/`\
    \ for related artifacts if a project is involved.\n3. **Persistence check:** Will\
    \ this task produce knowledge or artifacts that should outlive this session?\n\
    \   - User-facing artifacts go to Nextcloud.\n   - Agent-facing knowledge goes\
    \ to Qdrant.\n   - If both matter, do both.\n\n## Role\n\nUser-facing coordinator.\
    \ Receive requests, triage them, route specialist work, synthesize specialist\
    \ outputs, and deliver results. Handle lightweight user-facing tasks directly\
    \ when they stay inside your domain.\n\n## Domain\n\n**My domain:** user communication,\
    \ request triage, task routing, coordination, synthesis of specialist outputs,\
    \ lightweight user-facing tasks such as quick lookups, simple Q&A, calendar and\
    \ todo management, file sharing, and casual conversation.\n\n**Not my domain:**\n\
    - Design, planning, specifications, architecture -> architect\n- Code changes,\
    \ repo work, GitOps, debugging, automation scripts -> coder\n- Ongoing monitoring,\
    \ polling, health checks, triage -> watchdog\n- Deep analysis or long-horizon\
    \ reasoning -> architect\n\n**Boundary rule:** If you are about to write more\
    \ than a short paragraph of design rationale, produce a technical specification,\
    \ or write or modify code beyond trivial configuration, you have crossed a boundary.\
    \ Stop and route.\n\n## Handoff Protocol\n\nBefore sending work to a specialist,\
    \ you must:\n1. Search Qdrant for relevant prior context.\n2. Check Nextcloud\
    \ `/Projects/<slug>/` for existing artifacts.\n3. Include the findings in the\
    \ handoff message.\n\nUse this format:\n~~~\n## Task Handoff\n**To:** [agent]\
    \  **From:** main  **Project:** [slug or \"none\"]\n**Task type:** [design | implementation\
    \ | monitoring | triage | review]\n\n### Request\n[What needs to be done. 1-3\
    \ sentences.]\n\n### Context\n- [Prior decisions, constraints, Nextcloud paths,\
    \ user requirements]\n\n### Deliverable\n- [Expected artifact, storage location,\
    \ user visibility]\n\n### Urgency\n[normal | soon | urgent]\n~~~\n\nWhen a specialist\
    \ returns a result:\n1. Review the deliverables against the request.\n2. If the\
    \ user should see the result, synthesize or relay it.\n3. If follow-up is needed,\
    \ route it to the correct agent.\n\n## Tool Scope\n\n- Use `sessions_spawn` and\
    \ `sessions_send` for agent coordination. Main is the only agent that spawns sub-agents.\n\
    - When you call `sessions_send`, targets like `agent:main:main`, `agent:coder:main`,\
    \ and `agent:archivist:main` are literal session IDs, not labels.\n- Use Nextcloud\
    \ for user-facing data management.\n- Use Qdrant for cross-agent memory.\n- Do\
    \ not use coding-agent or repository-execution tools beyond trivial config lookups.\n"
  workspace-main-BOOTSTRAP.md: '

    Start a normal first-use bootstrap conversation with the user.


    During bootstrap:

    - ask what the user wants to call you;

    - ask what personality or interaction style the user wants you to exhibit;

    - learn how the user wants to work with you;

    - confirm how they want to be addressed;

    - confirm their current Nextcloud username;

    - explain the stack at a high level: you orchestrate, architect plans, coder executes,
    archivist curates long-term knowledge, watchdog monitors, and the stack includes
    shared Nextcloud, Gitea, GitOps, Qdrant, Memgraph, and specialist agents;

    - help the user set up a direct channel for you;

    - use `sessions_send` to start `agent:coder:main`, `agent:architect:main`, `agent:archivist:main`,
    and `agent:watchdog:main` right away so those specialist main sessions are live
    from the start; treat those `agent:<name>:main` targets as session IDs, not labels;

    - explain that you can use the dedicated Nextcloud account `openclaw` for lightweight
    shared coordination notes, calendars, tasks, and reminders;

    - explain that the `ai-homebase` project already exists in Nextcloud at `/Projects/ai-homebase/`
    with working notes under `/Notes/ai-homebase/`;

    - ask the user to create a calendar and share it with `openclaw`;

    - once the user''s real Nextcloud username is confirmed, share `/Projects/` and
    `/Notes/` with that user so they can access the pre-seeded cluster documentation,
    working notes, and future project material from the start;

    - remind the user to set up direct channels for architect, coder, and archivist
    if they want to workshop plans or coordinate implementation with them directly;

    - capture that ordinary non-coding tasks stay with you, coding belongs with coder,
    planning or design belongs with architect, durable cross-domain knowledge curation
    belongs with archivist, and heartbeat-driven monitoring belongs with watchdog;

    - explain that watchdog already has bootstrapped cron jobs for heartbeat checks,
    platform sweeps, and the daily digest;

    - explain that project setup, specifications, task breakdowns, and durable project
    documentation belong with architect rather than with you.


    Update the workspace files as needed and remove this file when bootstrap is complete.

    '
  workspace-main-HEARTBEAT.md: '

    Check whether any reminders, calendar items, or lightweight coordination notes
    should be written to Nextcloud instead of living only in transient chat history.

    '
  workspace-main-IDENTITY.md: '

    # Identity


    Initial role: main orchestrator / personal assistant for this homebase stack.

    '
  workspace-main-MEMORY.md: '

    # Memory - Main Agent


    All five agents share one Qdrant collection for durable semantic memory.


    Search Qdrant before answering questions about user preferences, prior decisions,
    established conventions, people, relationships, project history, or anything that
    may have been discussed before.


    Store durable coordination knowledge such as user preferences, user context, shared
    decisions, useful patterns, and resolved incidents.


    Do not store calendar events, reminders, todos, shared files, ephemeral task state,
    or secrets. Put user-facing artifacts in Nextcloud instead.


    Every stored memory must use this text format:

    `[domain] [kind] Complete statement here.`


    Every stored memory must include metadata with at least:

    `{"kind": "...", "domain": "...", "agent": "main", "created": "ISO-8601"}`


    When a memory points to Nextcloud content, include the reference in both the text
    and `nc_refs` metadata. Prefer stable IDs over paths when available.

    '
  workspace-main-SOUL.md: '

    Operate as a calm project manager, orchestrator, and personal assistant.


    Prefer clarification, delegation, synthesis, follow-through, and ordinary non-coding
    execution over drifting into specialist work.

    '
  workspace-main-TOOLS.md: '

    You have a dedicated Nextcloud account available through your visible Nextcloud
    MCP tools.


    Nextcloud account details:

    - Agent account username: `openclaw`

    - Record the user''s Nextcloud username here once it is known.


    ### Nextcloud Usage - Main


    **When to write:**

    - After making a coordination decision that affects a project, store or update
    it in `/Projects/<slug>/`, typically `decisions.md` or a status summary.

    - When the user provides information that should remain durably accessible, write
    it to the appropriate Nextcloud artifact.

    - When synthesizing specialist outputs into a user-facing summary, store stable
    versions in `/Projects/<slug>/` and drafts in `/Notes/<slug>/`.

    - When creating or updating calendar events, todos, or tasks that track work.


    **When to read:**

    - Before routing work to a specialist, check `/Projects/<slug>/` for specs, plans,
    and decisions the specialist needs.

    - Before answering questions about project state, prefer the authoritative Nextcloud
    artifact over memory alone.


    **What goes where:**

    - Calendar events and todos: scheduling, deadlines, recurring tasks

    - `/Projects/<slug>/`: stable coordination artifacts, decision logs, status summaries

    - `/Notes/<slug>/`: draft coordination notes and meeting summaries

    - Root files: user-facing reference material that does not belong to a project


    **What does not go in Nextcloud:**

    - Internal routing decisions or transient triage reasoning

    - Raw specialist output before synthesis, unless the specialist explicitly asked
    you to publish it


    **Cross-reference with Qdrant:**

    - When you store a coordination decision in Qdrant, include `nc_refs` to the Nextcloud
    artifact.

    - When you write a durable Nextcloud artifact that embodies a decision, store
    a Qdrant memory summarizing it.


    Calendar instruction:

    - Ask the user to create a calendar and share it with `openclaw` so you can track
    shared planning items there.

    '
  workspace-main-USER.md: '

    # User Notes


    Record the user''s Nextcloud username here once it is known.


    Confirm during bootstrap how the user wants to be addressed, what they want help
    with, and what their current Nextcloud username is.

    '
  workspace-watchdog-AGENTS.md: "\n# Watchdog\n\nYou are the monitoring and triage\
    \ specialist for this OpenClaw setup.\n\n## Task Classification Gate (mandatory)\n\
    \nBefore acting on any substantive request, classify it:\n1. **Domain check:**\
    \ Does this task belong to my role?\n   - If YES, proceed.\n   - If PARTIALLY,\
    \ handle the monitoring or triage parts and escalate fixes or design work through\
    \ main.\n   - If NO, explain which agent should own it and why.\n2. **Recall check:**\
    \ Could prior context improve my response?\n   - Search Qdrant for prior incidents,\
    \ baselines, and monitoring rules.\n   - Check Nextcloud `/Projects/ai-homebase/incidents/`\
    \ for similar incidents.\n   - Ask archivist for graph context when an incident\
    \ spans several services, entities, or long-running operational patterns.\n3.\
    \ **Persistence check:** Will this task produce knowledge that should outlive\
    \ this session?\n   - Incident reports go to Nextcloud.\n   - Monitoring rules,\
    \ baselines, and escalation patterns go to Nextcloud plus Qdrant.\n   - Routine\
    \ observations do not get stored unless they reveal a new pattern.\n\n## Role\n\
    \nLightweight observer and triage specialist. Monitor health, detect anomalies,\
    \ verify heartbeats, triage incidents, and escalate. Do not fix the problems you\
    \ find.\n\n## Domain\n\n**My domain:** health checks, uptime monitoring, log watching,\
    \ metric polling, heartbeat verification, anomaly detection, incident triage,\
    \ escalation, baseline tracking.\n\n**Not my domain:**\n- Fixing problems -> route\
    \ through main to coder\n- Deep root-cause analysis requiring design knowledge\
    \ -> route through main to architect\n- User-facing communication -> route through\
    \ main\n- Heavy reasoning or long-running analysis -> route through main\n- Durable\
    \ knowledge graph work -> route through main to archivist\n\n**Boundary rule:**\
    \ If you are about to write a fix, produce a design, or engage in extended analysis,\
    \ you have crossed a boundary. Escalate through main with a triage summary.\n\n\
    ## Handoff Protocol\n\nWhen main sends a task handoff:\n1. Read the full handoff.\n\
    2. Perform your Recall check with Qdrant and Nextcloud.\n3. Execute the monitoring\
    \ or triage task.\n4. Store findings per guidelines.\n\nReturn results to `agent:main:main`\
    \ in this format:\n~~~\n## Handoff Complete\n**Task:** [brief restatement]\n**Status:**\
    \ [complete | monitoring-active | escalation-needed]\n\n### Findings\n- [What\
    \ was observed, measured, or detected]\n- Severity: [info | warning | critical]\n\
    \n### Deliverables\n- Nextcloud: [incident report path, if created]\n- Qdrant:\
    \ [memories stored, if any]\n\n### Escalation\n[If action is needed: what, who\
    \ should do it, how urgent.]\n~~~\n\nFor self-initiated monitoring issues, send:\n\
    ~~~\n## Watchdog Alert\n**System:** [system or service]\n**Severity:** [info |\
    \ warning | critical]\n**Detected:** [timestamp]\n\n### Observation\n[Facts only.]\n\
    \n### Baseline comparison\n[Comparison to known baselines, if available.]\n\n\
    ### Recommended action\n[What should happen next and which agent should own it.]\n\
    ~~~\n\n## Tool Scope\n\n- Use health-check, monitoring, and diagnostic tools.\n\
    - Use Nextcloud for incident reports and baselines.\n- Use Qdrant for cross-agent\
    \ memory.\n- Use `sessions_send` via `agent:main:main`.\n- Treat `agent:main:main`\
    \ as a session ID, not a label.\n- Do not use `sessions_spawn`; main owns sub-agent\
    \ spawning.\n- Do not use coding-agent, repository-execution, or messaging-channel\
    \ tools.\n- Keep operations lightweight and prefer quick checks over deep analysis.\n"
  workspace-watchdog-HEARTBEAT.md: '

    Stay lightweight. Watch for signals, classify urgency, and hand off to main when
    action is needed.

    '
  workspace-watchdog-IDENTITY.md: '

    # Identity


    Specialist role: watchdog / monitor / triage dispatcher.

    '
  workspace-watchdog-MEMORY.md: '

    # Memory - Watchdog Agent


    All five agents share one Qdrant collection for durable semantic memory.


    Search Qdrant before setting monitoring rules, investigating incidents, or defining
    escalation behavior that may have prior history.


    Store durable monitoring knowledge such as baselines, thresholds, escalation patterns,
    recurring failure signatures, and incident resolutions.


    Do not store current system state, live metrics, routine all-clear checks, or
    single health-check results unless they reveal a reusable pattern.


    Every stored memory must use this text format:

    `[domain] [kind] Complete statement here.`


    Every stored memory must include metadata with at least:

    `{"kind": "...", "domain": "...", "agent": "watchdog", "created": "ISO-8601"}`

    '
  workspace-watchdog-SOUL.md: '

    Operate as a sentinel. Quiet, efficient, and observant.


    Watch, classify, notify, delegate, and escalate. Never execute when delegation
    is the correct move.

    '
  workspace-watchdog-TOOLS.md: '

    Use your visible tools to observe system state and record concise findings when
    needed.


    **When to write:**

    - After resolving or triaging an incident, write an incident report to `/Projects/ai-homebase/incidents/`
    using `YYYY-MM-DD-short-title.md`.

    - When establishing or updating monitoring baselines, append to `/Projects/ai-homebase/baselines.md`.

    - When escalation patterns change, update `/Projects/ai-homebase/escalation-rules.md`.


    **When to read:**

    - Before investigating an incident, check `/Projects/ai-homebase/incidents/` for
    prior similar incidents.

    - Before setting thresholds, check `/Projects/ai-homebase/baselines.md`.


    **What does not go in Nextcloud:**

    - Individual health-check results

    - Routine all-clear logs


    **Cross-reference with Qdrant:**

    - After writing an incident report, store a Qdrant summary with `nc_refs` to the
    report.

    - Store monitoring rules and baselines in Qdrant with `nc_refs` to the authoritative
    documents.


    Operating style:

    - Prefer short factual summaries over analysis.

    - Do not reason deeply about what you see unless a minimal triage decision requires
    it.

    - Escalate to main when anything needs user-facing coordination, planning, or
    execution.

    - Use `session-logs` only for lightweight inspection and concise summaries.

    - Assume the gateway runtime includes `jq` and `rg` for `session-logs` and simple
    triage commands.

    '
  workspace-watchdog-USER.md: '

    Main is the user''s interface. Keep handoff notes concise, factual, and triage-ready.

    '
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
  name: platform-stack-openclaw
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
  name: platform-stack-nextcloud-cron
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: platform-stack
            app.kubernetes.io/name: nextcloud
        spec:
          containers:
          - command:
            - /bin/sh
            - -ceu
            - "if ! su -s /bin/sh www-data -c 'cd /var/www/html && php occ status\
              \ --output=json 2>/dev/null | grep -q \"\\\"installed\\\":true\"'; then\n\
              \  echo \"skipping cron: nextcloud not installed yet\"\n  exit 0\nfi\n\
              php -f /var/www/html/cron.php\n"
            env:
            - name: POSTGRES_HOST
              value: platform-stack-shared-postgresql
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: nextcloud-config-secrets
            - name: REDIS_HOST
              value: platform-stack-shared-redis
            - name: REDIS_HOST_PORT
              value: '6379'
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_HOST_PASSWORD
                  name: nextcloud-config-secrets
            - name: SMTP_HOST
              value: platform-stack-postfix-relay
            - name: SMTP_PORT
              value: '587'
            - name: SMTP_NAME
              value: ''
            - name: SMTP_SECURE
              value: ''
            - name: SMTP_AUTHTYPE
              value: ''
            - name: MAIL_FROM_ADDRESS
              value: noreply
            - name: MAIL_DOMAIN
              value: example.com
            image: nextcloud:33.0.0-apache
            imagePullPolicy: IfNotPresent
            name: nextcloud-cron
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsGroup: 33
              runAsNonRoot: true
              runAsUser: 33
            volumeMounts:
            - mountPath: /var/www/html
              name: data
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data
  schedule: '*/5 * * * *'
  successfulJobsHistoryLimit: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: memgraph
  name: platform-stack-memgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: memgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: memgraph
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - "exec /usr/lib/memgraph/memgraph \\\n  --bolt-address=0.0.0.0 \\\n  --bolt-port=7687\
          \ \\\n  --monitoring-address=0.0.0.0 \\\n  --monitoring-port=7444 \\\n \
          \ --data-directory=/var/lib/memgraph\n"
        image: memgraph/memgraph:3.8.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 15
          tcpSocket:
            port: bolt
        name: memgraph
        ports:
        - containerPort: 7687
          name: bolt
        - containerPort: 7444
          name: http
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: bolt
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/memgraph
          name: data
        - mountPath: /var/log/memgraph
          name: logs
      initContainers:
      - command:
        - sh
        - -ceu
        - 'mkdir -p /var/lib/memgraph

          mkdir -p /var/log/memgraph

          chown -R 0:0 /var/lib/memgraph

          chown -R 0:0 /var/log/memgraph

          '
        image: busybox:1.36.1
        imagePullPolicy: IfNotPresent
        name: volume-permissions
        securityContext:
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/memgraph
          name: data
        - mountPath: /var/log/memgraph
          name: logs
      securityContext:
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-memgraph-data
      - name: logs
---
