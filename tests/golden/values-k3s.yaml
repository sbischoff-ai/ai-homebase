    #!/usr/bin/env python3
    """Scroll Qdrant memories into normalized JSONL packets for graph grooming."""

    from __future__ import annotations

    import argparse
    from typing import Any

    from _qdrant_common import add_common_args, build_filter, normalize_point, qdrant_request, require_qdrant_url, write_jsonl


    def scroll_memories(
        *,
        qdrant_url: str,
        collection: str,
        api_key: str,
        query_filter: dict[str, Any] | None,
        limit: int,
        page_size: int,
    ) -> list[dict[str, Any]]:
        rows: list[dict[str, Any]] = []
        offset: Any = None

        while len(rows) < limit:
            request_limit = min(page_size, limit - len(rows))
            body: dict[str, Any] = {
                "limit": request_limit,
                "with_payload": True,
                "with_vector": False,
            }
            if query_filter:
                body["filter"] = query_filter
            if offset is not None:
                body["offset"] = offset

            response = qdrant_request(
                qdrant_url,
                "POST",
                f"/collections/{collection}/points/scroll",
                body,
                api_key,
            )
            result = response.get("result") or {}
            points = result.get("points") or []
            if not points:
                break
            rows.extend(normalize_point(point) for point in points)
            offset = result.get("next_page_offset")
            if offset is None:
                break

        return rows


    def parse_args() -> argparse.Namespace:
        parser = argparse.ArgumentParser(description=__doc__)
        add_common_args(parser)
        parser.add_argument("--since", default="", help="Alias for --created-gte.")
        parser.add_argument("--created-gte", default="", help="Filter metadata.created greater than or equal to this ISO-8601 timestamp.")
        parser.add_argument("--created-lte", default="", help="Filter metadata.created less than or equal to this ISO-8601 timestamp.")
        parser.add_argument("--project", default="", help="Filter metadata.project.")
        parser.add_argument("--kind", default="", help="Filter metadata.kind.")
        parser.add_argument("--domain", default="", help="Filter metadata.domain.")
        parser.add_argument("--agent", default="", help="Filter metadata.agent.")
        parser.add_argument("--tag", action="append", default=[], help="Filter metadata.tags. May be repeated.")
        parser.add_argument("--graph-status", default="", help="Filter graph.status when rechecking annotated points.")
        parser.add_argument("--limit", type=int, default=100, help="Maximum normalized rows to emit.")
        parser.add_argument("--page-size", type=int, default=64, help="Qdrant scroll page size.")
        parser.add_argument("--out", default="", help="Write JSONL output to this path. Defaults to stdout.")
        return parser.parse_args()


    def main() -> None:
        args = parse_args()
        if args.limit < 1:
            raise SystemExit("--limit must be at least 1")
        if args.page_size < 1:
            raise SystemExit("--page-size must be at least 1")

        qdrant_url = require_qdrant_url(args.qdrant_url)
        created_gte = args.created_gte or args.since
        query_filter = build_filter(
            created_gte=created_gte,
            created_lte=args.created_lte,
            project=args.project,
            kind=args.kind,
            domain=args.domain,
            agent=args.agent,
            tags=args.tag,
            graph_status=args.graph_status,
        )
        rows = scroll_memories(
            qdrant_url=qdrant_url,
            collection=args.collection,
            api_key=args.api_key,
            query_filter=query_filter,
            limit=args.limit,
            page_size=args.page_size,
        )
        write_jsonl(rows, args.out)


    if __name__ == "__main__":
        main()
  workspace-archivist-qdrant__set_graph_link.py: |
    #!/usr/bin/env python3
    """Annotate selected Qdrant points with graph-link payload metadata."""

    from __future__ import annotations

    import argparse
    import json
    from typing import Any

    from _qdrant_common import add_common_args, read_json_arg, qdrant_request, require_qdrant_url, utc_now_iso


    def build_graph_payload(args: argparse.Namespace) -> dict[str, Any]:
        linked_entity_slugs = list(dict.fromkeys(args.entity_slug or []))
        derived_from = list(dict.fromkeys(args.supersedes or []))
        graph: dict[str, Any] = {
            "status": args.status,
            "linked_at": args.linked_at or utc_now_iso(),
            "memory_slug": args.memory_slug,
            "linked_entity_slugs": linked_entity_slugs,
        }
        if derived_from:
            graph["supersedes_memory_slugs"] = derived_from
        extra = read_json_arg(args.extra, {})
        if not isinstance(extra, dict):
            raise SystemExit("--extra must be a JSON object")
        graph.update(extra)
        return graph


    def parse_args() -> argparse.Namespace:
        parser = argparse.ArgumentParser(description=__doc__)
        add_common_args(parser)
        parser.add_argument("--point-id", action="append", required=True, help="Qdrant point ID to annotate. May be repeated.")
        parser.add_argument("--memory-slug", default="", help="Memgraph MemoryEntry slug. Defaults to qdrant:<point_id> for a single point.")
        parser.add_argument("--entity-slug", action="append", default=[], help="Linked Memgraph entity slug. May be repeated.")
        parser.add_argument("--supersedes", action="append", default=[], help="Older Memgraph memory slug superseded by this memory. May be repeated.")
        parser.add_argument("--status", default="linked", choices=["candidate", "linked", "partial", "skipped"], help="Graph-link status.")
        parser.add_argument("--linked-at", default="", help="ISO-8601 timestamp. Defaults to current UTC time.")
        parser.add_argument("--extra", default="", help="Optional JSON object merged into the graph payload.")
        parser.add_argument("--dry-run", action="store_true", help="Print the Qdrant set-payload request without sending it.")
        return parser.parse_args()


    def main() -> None:
        args = parse_args()
        point_ids = list(dict.fromkeys(args.point_id))
        if len(point_ids) == 1 and not args.memory_slug:
            args.memory_slug = f"qdrant:{point_ids[0]}"
        if not args.memory_slug:
            raise SystemExit("--memory-slug is required when annotating multiple points")

        graph = build_graph_payload(args)
        body = {
            "payload": {"graph": graph},
            "points": point_ids,
        }
        if args.dry_run:
            print(json.dumps(body, sort_keys=True, ensure_ascii=False))
            return

        qdrant_url = require_qdrant_url(args.qdrant_url)
        qdrant_request(
            qdrant_url,
            "POST",
            f"/collections/{args.collection}/points/payload",
            body,
            args.api_key,
        )
        print(json.dumps({"updated_point_ids": point_ids, "graph": graph}, sort_keys=True, ensure_ascii=False))


    if __name__ == "__main__":
        main()
  workspace-archivist-queries__README.md: |
    ## Archivist Query Library

    Use these query files as the default entry points for routine graph work.

    - Prefer reusing and extending these files over writing one-off Cypher from scratch.
    - Keep queries idempotent when they mutate canonical entities or relationships.
    - Use `queries/run_query.py` for parameterized helpers so you do not have to hand-render Cypher literals. The same command should work unchanged from both the gateway and the archivist sandbox because the runtime injects `MEMGRAPH_HOST` and `MEMGRAPH_PORT`.

    Examples:

    ```bash
    python3 queries/run_query.py queries/entity-by-slug.cypher --params-json '{"slug":"ai-homebase"}'
    python3 queries/run_query.py queries/project-service-agent-overview.cypher --params-json '{"project_slug":"ai-homebase"}'
    python3 queries/run_query.py queries/upsert-memory-entry.cypher --params state/memory-entry-params.json
    python3 queries/run_query.py queries/upsert-memory-entry.cypher --params state/memory-entry-params.json --dry-run
    ```

    - `context-map.cypher`: Retrieves an entity and its full immediate neighborhood (one hop). Used by the structured recall mode to build context maps on demand.
    - `upsert-memory-entry.cypher`: Creates or refreshes a `MemoryEntry` node from a normalized Qdrant packet.
    - `link-memory-created-by-agent.cypher`: Connects a memory to the agent that stored or curated it.
    - `link-project-memory.cypher`: Connects a project to a graph-promoted memory.
    - `link-memory-to-entity.cypher`: Connects a memory to a selected entity as evidence.
    - `link-memory-supersedes.cypher`: Connects append-only replacement memories to older memory nodes.
    - `link-memory-tag.cypher`: Promotes durable Qdrant tags to `Concept` nodes.
    - `unlinked-memory-entries.cypher`: Lists graph-promoted memories still missing entity evidence links.

    `run_query.py` replaces `$param` placeholders with escaped Cypher literals from JSON. Missing parameters default to `null`; pass `--strict` when you want missing parameters to fail before execution.
  workspace-archivist-queries__context-map.cypher: |
    // Context map for a given entity slug.
    // Usage: replace $slug with the target entity's slug value.
    // Returns the entity, all directly connected entities, and the relationships between them.

    MATCH (e:Entity {slug: $slug})
    OPTIONAL MATCH (e)-[r_out]->(neighbor_out:Entity)
    OPTIONAL MATCH (neighbor_in:Entity)-[r_in]->(e)
    RETURN
      e.slug AS entity_slug,
      labels(e) AS entity_labels,
      e.name AS entity_name,
      e.domain AS entity_domain,
      e.status AS entity_status,
      collect(DISTINCT {
        direction: 'outgoing',
        type: type(r_out),
        role: r_out.role,
        kind: r_out.kind,
        target_slug: neighbor_out.slug,
        target_name: neighbor_out.name
      }) AS outgoing,
      collect(DISTINCT {
        direction: 'incoming',
        type: type(r_in),
        role: r_in.role,
        kind: r_in.kind,
        source_slug: neighbor_in.slug,
        source_name: neighbor_in.name
      }) AS incoming;
  workspace-archivist-queries__entity-by-slug.cypher: |
    MATCH (entity:Entity)
    WHERE entity.slug = $slug
    RETURN labels(entity) AS labels, entity.slug AS slug, entity.name AS name, entity.kind AS kind, entity.domain AS domain;
  workspace-archivist-queries__entity-neighborhood.cypher: |
    MATCH (entity:Entity {slug: $slug})-[rel]-(neighbor:Entity)
    RETURN
      type(rel) AS relationship,
      properties(rel) AS relationship_props,
      labels(neighbor) AS neighbor_labels,
      neighbor.slug AS neighbor_slug,
      neighbor.name AS neighbor_name,
      neighbor.kind AS neighbor_kind
    ORDER BY relationship, neighbor_slug;
  workspace-archivist-queries__link-memory-created-by-agent.cypher: |
    // Link a MemoryEntry to the agent that stored or curated it.
    // Required params: memory_slug, agent_slug.

    MATCH (memory:Entity:MemoryEntry {slug: $memory_slug})
    MATCH (agent:Entity:Agent {slug: $agent_slug})
    MERGE (memory)-[rel:CREATED_BY {role: 'memory-agent'}]->(agent)
    SET rel.context = 'Qdrant memory provenance'
    RETURN memory.slug AS memory_slug, agent.slug AS agent_slug, type(rel) AS relationship;
  workspace-archivist-queries__link-memory-supersedes.cypher: |
    // Link a replacement memory to the older MemoryEntry it supersedes.
    // Required params: new_memory_slug, old_memory_slug.

    MATCH (new_memory:Entity:MemoryEntry {slug: $new_memory_slug})
    MATCH (old_memory:Entity:MemoryEntry {slug: $old_memory_slug})
    MERGE (new_memory)-[rel:DERIVED_FROM {kind: 'supersedes'}]->(old_memory)
    SET rel.context = 'Append-only Qdrant memory correction'
    RETURN new_memory.slug AS new_memory_slug, old_memory.slug AS old_memory_slug, type(rel) AS relationship;
  workspace-archivist-queries__link-memory-tag.cypher: |
    // Link a MemoryEntry to a durable tag concept.
    // Required params: memory_slug, tag_slug, tag_name.
    // Optional params: confidence.

    MATCH (memory:Entity:MemoryEntry {slug: $memory_slug})
    MERGE (tag:Entity:Concept {slug: $tag_slug})
    ON CREATE SET tag.name = $tag_name,
                  tag.domain = 'real',
                  tag.kind = 'tag'
    MERGE (memory)-[rel:TAGGED_WITH]->(tag)
    SET rel.confidence = $confidence,
        rel.context = 'Qdrant memory metadata tag'
    RETURN memory.slug AS memory_slug, tag.slug AS tag_slug, type(rel) AS relationship;
  workspace-archivist-queries__link-memory-to-entity.cypher: |
    // Link a MemoryEntry to one relevant entity selected by archivist.
    // Required params: memory_slug, entity_slug.
    // Optional params: context, confidence.

    MATCH (memory:Entity:MemoryEntry {slug: $memory_slug})
    MATCH (entity:Entity {slug: $entity_slug})
    MERGE (memory)-[rel:RELATES_TO {kind: 'memory-evidence'}]->(entity)
    SET rel.context = $context,
        rel.confidence = $confidence
    RETURN memory.slug AS memory_slug, entity.slug AS entity_slug, type(rel) AS relationship;
  workspace-archivist-queries__link-project-memory.cypher: |
    // Link a project to a graph-promoted Qdrant memory.
    // Required params: project_slug, memory_slug.

    MATCH (project:Entity:Project {slug: $project_slug})
    MATCH (memory:Entity:MemoryEntry {slug: $memory_slug})
    MERGE (project)-[rel:HAS_PART {kind: 'memory'}]->(memory)
    SET rel.context = 'Graph-promoted Qdrant memory'
    RETURN project.slug AS project_slug, memory.slug AS memory_slug, type(rel) AS relationship;
  workspace-archivist-queries__memory-links.cypher: |
    MATCH (memory:Entity:MemoryEntry)-[rel]-(entity:Entity)
    WHERE memory.slug = $memory_slug OR memory.qdrant_id = $qdrant_id
    RETURN
      memory.slug AS memory_slug,
      memory.qdrant_id AS qdrant_id,
      type(rel) AS relationship,
      entity.slug AS entity_slug,
      labels(entity) AS entity_labels,
      entity.name AS entity_name
    ORDER BY entity_slug;
  workspace-archivist-queries__project-service-agent-overview.cypher: |
    MATCH (project:Entity:Project {slug: $project_slug})-[:HAS_PART]->(part:Entity)
    RETURN labels(part) AS labels, part.slug AS slug, part.name AS name, part.kind AS kind
    ORDER BY slug;
  workspace-archivist-queries__run_query.py: |
    #!/usr/bin/env python3
    """Render or run an archivist Cypher helper with JSON parameters."""

    from __future__ import annotations

    import argparse
    import json
    import os
    import re
    import subprocess
    import sys
    import tempfile
    from pathlib import Path
    from typing import Any


    PARAM_RE = re.compile(r"\$([A-Za-z_][A-Za-z0-9_]*)")


    def cypher_literal(value: Any) -> str:
        if value is None:
            return "null"
        if isinstance(value, bool):
            return "true" if value else "false"
        if isinstance(value, (int, float)):
            return str(value)
        if isinstance(value, str):
            escaped = value.replace("\\", "\\\\").replace("'", "\\'")
            return f"'{escaped}'"
        if isinstance(value, list):
            return "[" + ", ".join(cypher_literal(item) for item in value) + "]"
        if isinstance(value, dict):
            items = []
            for key, item in value.items():
                if not isinstance(key, str):
                    raise SystemExit("Cypher map parameter keys must be strings")
                safe_key = key if re.match(r"^[A-Za-z_][A-Za-z0-9_]*$", key) else f"`{key.replace('`', '``')}`"
                items.append(f"{safe_key}: {cypher_literal(item)}")
            return "{" + ", ".join(items) + "}"
        raise SystemExit(f"Unsupported parameter type for Cypher literal: {type(value).__name__}")


    def read_params(args: argparse.Namespace) -> dict[str, Any]:
        merged: dict[str, Any] = {}
        if args.params:
            raw = Path(args.params).read_text(encoding="utf-8")
            loaded = json.loads(raw)
            if not isinstance(loaded, dict):
                raise SystemExit("--params must point to a JSON object")
            merged.update(loaded)
        if args.params_json:
            loaded = json.loads(args.params_json)
            if not isinstance(loaded, dict):
                raise SystemExit("--params-json must be a JSON object")
            merged.update(loaded)
        return merged


    def render_query(template: str, params: dict[str, Any], strict: bool) -> str:
        names = set(PARAM_RE.findall(template))
        missing = sorted(name for name in names if name not in params)
        if missing and strict:
            raise SystemExit(f"Missing required parameter(s): {', '.join(missing)}")
        if missing:
            print(f"Defaulting missing parameter(s) to null: {', '.join(missing)}", file=sys.stderr)
            params = {**params, **{name: None for name in missing}}
        return PARAM_RE.sub(lambda match: cypher_literal(params[match.group(1)]), template)


    def parse_args() -> argparse.Namespace:
        parser = argparse.ArgumentParser(description=__doc__)
        parser.add_argument("query", help="Path to a .cypher helper.")
        parser.add_argument("--params", default="", help="JSON file containing query parameters.")
        parser.add_argument("--params-json", default="", help="Inline JSON object merged after --params.")
        parser.add_argument("--host", default=os.environ.get("MEMGRAPH_HOST", "127.0.0.1"))
        parser.add_argument("--port", default=os.environ.get("MEMGRAPH_PORT", "7687"))
        parser.add_argument("--output-format", default="csv")
        parser.add_argument("--strict", action="store_true", help="Fail if any $param is missing.")
        parser.add_argument("--dry-run", action="store_true", help="Print rendered Cypher instead of running mgconsole.")
        return parser.parse_args()


    def main() -> None:
        args = parse_args()
        template = Path(args.query).read_text(encoding="utf-8")
        rendered = render_query(template, read_params(args), args.strict)
        if args.dry_run:
            sys.stdout.write(rendered)
            if rendered and not rendered.endswith("\n"):
                sys.stdout.write("\n")
            return

        with tempfile.NamedTemporaryFile("w", encoding="utf-8", suffix=".cypher", delete=False) as handle:
            handle.write(rendered)
            temp_path = handle.name
        try:
            with open(temp_path, "r", encoding="utf-8") as stdin:
                subprocess.run(
                    [
                        "mgconsole",
                        "--host",
                        args.host,
                        "--port",
                        str(args.port),
                        "--output-format",
                        args.output_format,
                    ],
                    stdin=stdin,
                    check=True,
                )
        finally:
            Path(temp_path).unlink(missing_ok=True)


    if __name__ == "__main__":
        main()
  workspace-archivist-queries__unlinked-memory-entries.cypher: |
    // MemoryEntry nodes that have not yet been connected to durable graph structure.

    MATCH (memory:Entity:MemoryEntry)
    WHERE NOT (memory)-[:RELATES_TO {kind: 'memory-evidence'}]->(:Entity)
    RETURN
      memory.slug AS memory_slug,
      memory.qdrant_id AS qdrant_id,
      memory.agent AS agent,
      memory.domain AS domain,
      memory.kind AS kind,
      memory.project AS project,
      memory.created AS created,
      memory.summary AS summary
    ORDER BY memory.created DESC, memory.slug
    LIMIT 100;
  workspace-archivist-queries__upsert-entity-and-link.cypher: |
    MERGE (source:Entity {slug: $source_slug})
    ON CREATE SET source.name = $source_name, source.domain = $source_domain, source.kind = $source_kind
    MERGE (target:Entity {slug: $target_slug})
    ON CREATE SET target.name = $target_name, target.domain = $target_domain, target.kind = $target_kind
    MERGE (source)-[rel:RELATES_TO {kind: $relationship_kind}]->(target)
    SET rel.context = $relationship_context
    RETURN source.slug AS source_slug, target.slug AS target_slug, type(rel) AS relationship;
  workspace-archivist-queries__upsert-memory-entry.cypher: |
    // Idempotently create or refresh a graph node for one Qdrant memory packet.
    // Required params: memory_slug, qdrant_id, document_sha256, summary.
    // Optional params: agent, domain, kind, project, created, memory_ref, linked_at.

    MERGE (memory:Entity:MemoryEntry {slug: $memory_slug})
    SET memory.qdrant_id = $qdrant_id,
        memory.document_sha256 = $document_sha256,
        memory.summary = $summary,
        memory.agent = $agent,
        memory.domain = $domain,
        memory.kind = $kind,
        memory.project = $project,
        memory.created = $created,
        memory.memory_ref = $memory_ref,
        memory.linked_at = $linked_at,
        memory.name = coalesce($summary, $memory_slug)
    RETURN memory.slug AS memory_slug, memory.qdrant_id AS qdrant_id, memory.document_sha256 AS document_sha256;
  workspace-archivist-skills__consult-nextcloud-knowledge__SKILL.md: |
    ---
    name: consult-nextcloud-knowledge
    description: Use when Nextcloud documentation may support graph or memory work, especially for schema notes, nc_refs, or shared project artifacts.
    ---

    # Nextcloud Knowledge Support

    Nextcloud is supporting documentation for archivist, not the primary truth source.

    ## Use Nextcloud For

    - schema guidance
    - human-readable graph documentation
    - supporting project artifacts that the graph should reference

    ## Procedure

    1. Answer structural questions from Memgraph first.
    2. Use Qdrant to locate candidate memories or related decisions.
    3. Use Nextcloud `/Desk/index.md` only when you need help locating a supporting file, calendar, task list, or table that another agent registered.
    4. Read Nextcloud only when the graph points to it, the shared index points to it, or it is the authoritative schema note.
    5. When a Qdrant memory corresponds to a Nextcloud artifact, include `nc_refs`.
    6. Update Nextcloud `/Projects/ai-homebase/knowledge-graph-schema.md` when the canonical model changes.

    ## Boundaries

    - Do not let supporting docs replace graph structure.
    - Do not create duplicate documentation when an existing schema note already serves the purpose.
  workspace-archivist-skills__groom-recent-memories__SKILL.md: |
    ---
    name: groom-recent-memories
    description: Use for weekly, nightly-watchdog, impromptu, or targeted memory grooming that must process Qdrant/Nextcloud deltas and checkpoint progress.
    ---

    # Recent Memory Grooming

    Use when running a periodic or requested memory grooming, deduplication, graph-linking, or curation pass.

    ## Checkpoint State

    - Read `state/grooming-checkpoint.json` before any search, scan, or update.
    - Supported triggers are `weekly`, `nightly-watchdog`, `impromptu`, and `targeted`.
    - Treat `last_successful_grooming` as the default Qdrant memory delta boundary.
    - Treat `last_successful_graph_link` as the graph-link catch-up boundary.
    - Treat `last_weekly_grooming` and `last_triggered_grooming` as cadence markers, not replacements for the successful delta boundaries.
    - Track Nextcloud metadata under `nextcloud.surfaces` as `{etag,last_modified,size,checked_at}` when the WebDAV tools expose those fields.
    - Treat this file as runtime state, not as a prose note.

    ## Procedure

    1. Read `state/grooming-checkpoint.json` and assign a compact run ID such as `groom-YYYYMMDD-HHMMSS`.
    2. Identify the trigger:
       - `weekly`: scheduled weekly graph grooming.
       - `nightly-watchdog`: watchdog sent a scored activity trigger with reason codes.
       - `impromptu`: user or another agent requested grooming without a special scope.
       - `targeted`: the request names a project, entity, source, or since-window.
    3. Choose the Qdrant window:
       - default to `last_successful_grooming`.
       - use `last_successful_graph_link` for graph-link catch-up.
       - for `weekly`, also inspect recent/unlinked points since `last_weekly_grooming` when present.
    4. Run `python3 qdrant/scroll_memories.py --since "<cursor>" --limit <n> --out state/qdrant-candidates.jsonl` when a cursor exists. If the cursor is `null`, do a bounded recent bootstrap pass instead of an unbounded historical search.
    5. Scan Nextcloud only for registered high-value surfaces from `SURFACES.md`, Nextcloud `/Desk/index.md`, and current ai-homebase project docs. Compare WebDAV metadata against `nextcloud.surfaces`, and read content only for changed surfaces or paths named in a watchdog/user trigger.
    6. Review the normalized Qdrant packets and changed Nextcloud surfaces. Groom, deduplicate, split, supersede, or link only candidates in the effective delta.
    7. If the pass produces durable semantic outcomes, store replacement memories through `qdrant-store` using the standard archivist memory rules.
    8. If a groomed memory deserves graph structure, create or update the Memgraph `MemoryEntry` and links with the `queries/` helpers through `python3 queries/run_query.py ...`.
    9. After Memgraph succeeds, run `python3 qdrant/set_graph_link.py --point-id "<point-id>" ...` to annotate only the Qdrant top-level `graph` payload.
    10. Append exactly one row to Nextcloud `/Projects/ai-homebase/archivist-grooming-log.md` with completed time, run ID, trigger, window, reason codes, Qdrant count, Nextcloud surface count, Memgraph changes, checkpoint summary, and issues.
    11. Advance `state/grooming-checkpoint.json` with `python3 grooming/update_checkpoint.py ...` only after the grooming pass, Memgraph updates, Qdrant graph annotations, and grooming-log row complete successfully.
    12. If the pass aborts, fails, or leaves work incomplete, record the issue in the grooming log and do not advance successful checkpoint timestamps.

    Qdrant MCP is append-only here: `qdrant-store` adds a new entry, and there is no update, delete, merge, or mark operation for existing points. When splitting or consolidating overloaded memories, store new atomic replacement memories with `supersedes` metadata that describes the older memory text returned by `qdrant-find`; do not claim the old Qdrant entry was changed. Merge only by storing a new consolidated memory when the result remains one durable claim with clear retrieval anchors.

    The archivist-only `qdrant/` scripts may read point IDs and set the top-level `graph` payload for linkage bookkeeping. They must not create semantic memories, modify vectors, or overwrite MCP-managed `document` or `metadata`.

    ## Bootstrap And Delta Windows

    - A first-run bootstrap pass should stay bounded to recent history.
    - Prefer the smallest recent window that still captures ungroomed backlog for the active task.
    - Do not run an unbounded full-history search unless main explicitly asks for historical backfill.
    - If an impromptu request does not specify scope, use the checkpoint delta.
    - If a targeted request specifies project, entity, source, or since-window, constrain the pass to that scope but still update the checkpoint only after a successful run.

    ## Return Notes

    - Report the effective grooming window in the handoff to main.
    - Include whether the checkpoint was advanced.
    - Include any durable Qdrant or Memgraph changes.
  workspace-archivist-skills__map-context-and-link-memories__SKILL.md: |
    ---
    name: map-context-and-link-memories
    description: Use when asked for a structural context map or when Qdrant memories need to be linked into Memgraph structure.
    ---

    # Context Map And Memory Linking

    Use when asked for durable cross-entity context.

    ## Context Map Format

    ```markdown
    ## Context Map: <entity or topic>

    ### Entity
    - Slug: <slug>
    - Labels: <graph labels>
    - Domain: <real | fictional | speculative>
    - Status: <active | archived | other>

    ### Relationships
    - <relationship> -> <connected entity> (role: <role>, kind: <kind>)

    ### Linked Memories
    - [<kind>] <memory summary> (agent: <agent>, created: <date>)

    ### Nextcloud References
    - <path> - <brief description>

    ### Summary
    <2-3 sentence synthesis>
    ```

    ## Linking Rules

    - Memgraph first for relationships
    - Qdrant exact lookup second when Memgraph has `MemoryEntry.qdrant_id`: run `python3 qdrant/get_memory.py "<point-id>"`
    - Qdrant MCP semantic search only when graph traversal is sparse or the entity is unknown
    - shared Nextcloud `/Desk/` cues and Nextcloud references third for supporting docs
    - when a Qdrant memory deserves graph structure, represent it as linked `MemoryEntry` structure with slug `qdrant:<point_id>`
    - include `nc_refs` when a memory points to a Nextcloud artifact
    - after successful Memgraph linking, annotate the Qdrant point with `python3 qdrant/set_graph_link.py`

    ## General Archivist Return Format

    Use this when the task is curation work but not primarily a context-map response:

    ```markdown
    ## Handoff Complete
    **Task:** <brief restatement>
    **Status:** <complete | partial - needs X | blocked - needs Y>

    ### Deliverables
    - Memgraph: <nodes, edges, schema or query updates>
    - Qdrant: <memories stored, linked, groomed>
    - Nextcloud: <paths updated, if any>

    ### For the user
    <concise explanation of what durable context was added or clarified>

    ### Follow-up needed
    <which agent should do what next>
    ```
  workspace-archivist-skills__update-memgraph__SKILL.md: |
    ---
    name: update-memgraph
    description: Use when querying or updating Memgraph as the structural source of truth, especially for canonical entities, relationships, and memory links.
    ---

    # Memgraph Curation

    Memgraph is the structural source of truth.

    ## Procedure

    1. Start from the seeded `queries/` files when possible.
    2. Use `python3 queries/run_query.py <query.cypher> --params-json '{...}'` or `--params <file.json>` for parameterized query helpers.
    3. Prefer idempotent graph mutations.
    4. Reuse canonical labels and relationships instead of inventing ad hoc structure.
    5. Push domain-specific meaning into properties before introducing new graph structure.
    6. When a Qdrant memory deserves graph structure, use `qdrant/scroll_memories.py` or `qdrant/get_memory.py` to obtain the point ID and normalized packet.
    7. Create or update a `MemoryEntry` node with slug `qdrant:<point_id>`, then connect it to the relevant entities with the `queries/` helpers.
    8. After Memgraph updates succeed, annotate the Qdrant point with `qdrant/set_graph_link.py`.

    ## Canonical Shape

    Labels:
    - `Entity`
    - `Person`
    - `Agent`
    - `Organization`
    - `Place`
    - `Thing`
    - `Concept`
    - `Event`
    - `Work`
    - `Project`
    - `Service`
    - `Collection`
    - `MemoryEntry`

    `MemoryEntry` nodes should carry `slug`, `qdrant_id`, `document_sha256`, `agent`, `domain`, `kind`, `project`, `created`, `summary`, `linked_at`, and optional `memory_ref` when Qdrant metadata already has one.

    Relationships:
    - `RELATES_TO`
    - `HAS_PART`
    - `INFLUENCES`
    - `LOCATED_IN`
    - `CREATED_BY`
    - `DERIVED_FROM`
    - `OCCURS_IN`
    - `TAGGED_WITH`

    Standard memory links:
    - memory `CREATED_BY` agent
    - project `HAS_PART {kind: "memory"}` memory
    - memory `RELATES_TO {kind: "memory-evidence"}` selected entities
    - replacement memory `DERIVED_FROM {kind: "supersedes"}` older memory
    - memory `TAGGED_WITH` durable tag concepts

    ## Escalate

    - if the requested structure would require a canonical schema change
