          \ for agent main.\"\n  exit 1\n}\nif [ -e \"${target_path}\" ]; then\n \
          \ echo \"Preserving existing MEMORY.md in ${workspace_dir}.\"\nelse\n  cp\
          \ -f /config-source/workspace-main-MEMORY.md \"${target_path}\" || {\n \
          \   echo >&2 \"Failed to seed MEMORY.md into ${workspace_dir} for agent\
          \ main.\"\n    exit 1\n  }\nfi\ntarget_path=\"${workspace_dir}/SOUL.md\"\
          \ntarget_parent=\"$(dirname \"${target_path}\")\"\nmkdir -p \"${target_parent}\"\
          \ || {\n  echo >&2 \"Failed to create ${target_parent} before seeding SOUL.md\
          \ for agent main.\"\n  exit 1\n}\nif [ -e \"${target_path}\" ]; then\n \
          \ echo \"Preserving existing SOUL.md in ${workspace_dir}.\"\nelse\n  cp\
          \ -f /config-source/workspace-main-SOUL.md \"${target_path}\" || {\n   \
          \ echo >&2 \"Failed to seed SOUL.md into ${workspace_dir} for agent main.\"\
          \n    exit 1\n  }\nfi\ntarget_path=\"${workspace_dir}/TOOLS.md\"\ntarget_parent=\"\
          $(dirname \"${target_path}\")\"\nmkdir -p \"${target_parent}\" || {\n  echo\
          \ >&2 \"Failed to create ${target_parent} before seeding TOOLS.md for agent\
          \ main.\"\n  exit 1\n}\nif [ -e \"${target_path}\" ]; then\n  echo \"Preserving\
          \ existing TOOLS.md in ${workspace_dir}.\"\nelse\n  cp -f /config-source/workspace-main-TOOLS.md\
          \ \"${target_path}\" || {\n    echo >&2 \"Failed to seed TOOLS.md into ${workspace_dir}\
          \ for agent main.\"\n    exit 1\n  }\nfi\ntarget_path=\"${workspace_dir}/USER.md\"\
          \ntarget_parent=\"$(dirname \"${target_path}\")\"\nmkdir -p \"${target_parent}\"\
          \ || {\n  echo >&2 \"Failed to create ${target_parent} before seeding USER.md\
          \ for agent main.\"\n  exit 1\n}\nif [ -e \"${target_path}\" ]; then\n \
          \ echo \"Preserving existing USER.md in ${workspace_dir}.\"\nelse\n  cp\
          \ -f /config-source/workspace-main-USER.md \"${target_path}\" || {\n   \
          \ echo >&2 \"Failed to seed USER.md into ${workspace_dir} for agent main.\"\
          \n    exit 1\n  }\nfi\n"
        image: ghcr.io/openclaw/openclaw:2026.3.24
        imagePullPolicy: IfNotPresent
        name: config-permissions
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /config-source
          name: config-source
          readOnly: true
        - mountPath: /runtime-target
          name: mcp-runtime
        - mountPath: /config-target-root
          name: data
      - command:
        - /bin/sh
        - -c
        - "set -eu\nif [ ! -s /config-source/mcp-http-bridge.mjs ]; then\n  echo >&2\
          \ \"Rendered ConfigMap file /config-source/mcp-http-bridge.mjs is missing\
          \ or empty; verify the openclaw ConfigMap rendered correctly before deployment.\"\
          \n  exit 1\nfi\nmkdir -p /runtime-target || {\n  echo >&2 \"Failed to create\
          \ MCP runtime target directory /runtime-target.\"\n  exit 1\n}\ncp -f /config-source/mcp-http-bridge.mjs\
          \ /runtime-target/mcp-http-bridge.mjs || {\n  echo >&2 \"Failed to bootstrap\
          \ shared MCP bridge into /runtime-target/mcp-http-bridge.mjs.\"\n  exit\
          \ 1\n}\n"
        image: ghcr.io/openclaw/openclaw:2026.3.24
        imagePullPolicy: IfNotPresent
        name: mcp-runtime
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /config-source
          name: config-source
          readOnly: true
        - mountPath: /runtime-target
          name: mcp-runtime
      - command:
        - /bin/sh
        - -c
        - "set -eu\nmkdir -p /tools-target\ndocker_path=\"$(command -v docker || true)\"\
          \nif [ -z \"${docker_path}\" ]; then\n  echo >&2 \"remoteDocker.cli.image\
          \ must contain a working docker CLI on PATH so OpenClaw can use the Docker\
          \ sandbox backend.\"\n  exit 1\nfi\ncp -f \"${docker_path}\" /tools-target/docker\
          \ || {\n  echo >&2 \"Failed to copy ${docker_path} into /tools-target/docker\
          \ for OpenClaw remote Docker support.\"\n  exit 1\n}\nchmod 0755 /tools-target\
          \ /tools-target/docker || {\n  echo >&2 \"Failed to lock permissions on\
          \ /tools-target/docker for OpenClaw remote Docker support.\"\n  exit 1\n\
          }\nchown -R 1000:1000 /tools-target || {\n  echo >&2 \"Failed to hand /tools-target\
          \ to UID/GID 1000 after copying the docker CLI.\"\n  exit 1\n}\n"
        image: docker:28.0.4-cli
        imagePullPolicy: IfNotPresent
        name: remote-docker-cli
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /tools-target
          name: remote-docker-cli
      - command:
        - /bin/sh
        - -c
        - "set -eu\nexport PATH=\"/opt/openclaw-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\"\
          \ndocker_path=\"$(command -v docker || true)\"\nif [ -z \"${docker_path}\"\
          \ ]; then\n  echo >&2 \"Docker sandbox backend requested, but no docker\
          \ CLI is available after the remoteDocker.cli init step.\"\n  exit 1\nfi\n\
          ssh_path=\"$(command -v ssh || true)\"\nif [ -z \"${ssh_path}\" ]; then\n\
          \  echo >&2 \"OpenClaw remote Docker over ssh:// requires an ssh client\
          \ in the OpenClaw image. Build from images/openclaw-remote-docker/Dockerfile\
          \ or use an equivalent image.\"\n  exit 1\nfi\necho \"docker CLI available\
          \ at ${docker_path}\"\necho \"ssh client available at ${ssh_path}\"\n"
        image: ghcr.io/openclaw/openclaw:2026.3.24
        imagePullPolicy: IfNotPresent
        name: remote-docker-runtime-check
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /opt/openclaw-tools/bin
          name: remote-docker-cli
          readOnly: true
      - command:
        - /bin/sh
        - -c
        - "set -eu\nmkdir -p /ssh-target\nif [ ! -s /ssh-source/id_ed25519 ]; then\n\
          \  echo >&2 \"remoteDocker.ssh.secretName must reference a Secret containing\
          \ non-empty id_ed25519 and known_hosts keys; id_ed25519 is missing or empty.\"\
          \n  exit 1\nfi\nif [ ! -s /ssh-source/known_hosts ]; then\n  echo >&2 \"\
          remoteDocker.ssh.secretName must reference a Secret containing non-empty\
          \ id_ed25519 and known_hosts keys; known_hosts is missing or empty.\"\n\
          \  exit 1\nfi\necho \"Copying SSH files from /ssh-source into /ssh-target.\"\
          \ncp -f /ssh-source/id_ed25519 /ssh-target/id_ed25519 || {\n  echo >&2 \"\
          Failed to copy /ssh-source/id_ed25519 to /ssh-target/id_ed25519; verify\
          \ the mounted Secret files are readable and that the init container security\
          \ context allows writes to /ssh-target.\"\n  exit 1\n}\ncp -f /ssh-source/known_hosts\
          \ /ssh-target/known_hosts || {\n  echo >&2 \"Failed to copy /ssh-source/known_hosts\
          \ to /ssh-target/known_hosts; verify the mounted Secret files are readable\
          \ and that the init container security context allows writes to /ssh-target.\"\
          \n  exit 1\n}\necho \"Locking permissions before handing /ssh-target to\
          \ UID/GID 1000.\"\nchmod 0700 /ssh-target || {\n  echo >&2 \"Failed to set\
          \ mode 0700 on /ssh-target before ownership changes; verify the init container\
          \ security context still permits writes to the mounted emptyDir volume.\"\
          \n  exit 1\n}\nchmod 0600 /ssh-target/id_ed25519 || {\n  echo >&2 \"Failed\
          \ to set mode 0600 on /ssh-target/id_ed25519 before ownership changes; verify\
          \ the copied SSH key is writable inside /ssh-target and that the init container\
          \ security context still permits writes to the mounted emptyDir volume.\"\
          \n  exit 1\n}\nchmod 0644 /ssh-target/known_hosts || {\n  echo >&2 \"Failed\
          \ to set mode 0644 on /ssh-target/known_hosts before ownership changes;\
          \ verify the copied known_hosts file is writable inside /ssh-target and\
          \ that the init container security context still permits writes to the mounted\
          \ emptyDir volume.\"\n  exit 1\n}\nchown -R 1000:1000 /ssh-target || {\n\
          \  echo >&2 \"Failed to hand /ssh-target to UID/GID 1000 after permissions\
          \ were locked down; verify the init container still runs as UID/GID 0 with\
          \ the CHOWN capability required by the security context.\"\n  exit 1\n}\n"
        image: ghcr.io/openclaw/openclaw:2026.3.24
        imagePullPolicy: IfNotPresent
        name: remote-docker-ssh-permissions
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /ssh-source
          name: remote-docker-ssh-secret
          readOnly: true
        - mountPath: /ssh-target
          name: remote-docker-ssh
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openclaw
      volumes:
      - emptyDir:
          medium: Memory
        name: tmp
      - hostPath:
          path: /var/lib/ai-homebase/openclaw-state
          type: DirectoryOrCreate
        name: data
      - configMap:
          name: platform-stack-openclaw
        name: config-source
      - name: mcp-runtime
      - name: remote-docker-cli
      - name: remote-docker-ssh-secret
        secret:
          secretName: openclaw-remote-docker-ssh
      - name: remote-docker-ssh
