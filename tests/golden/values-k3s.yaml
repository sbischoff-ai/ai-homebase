apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '10'
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
    environment: k3s
  name: platform-stack-nextcloud-bootstrap-users
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; do
            echo "waiting for nextcloud bootstrap"
            sleep 5
          done
          username_var="BOOTSTRAP_USER_0_USERNAME"
          display_name_var="BOOTSTRAP_USER_0_DISPLAY_NAME"
          password_var="BOOTSTRAP_USER_0_PASSWORD"
          username="$(printenv "${username_var}")"
          display_name="$(printenv "${display_name_var}")"
          password="$(printenv "${password_var}")"

          if ! su -s /bin/sh www-data -c "cd /var/www/html && php occ user:info \"${username}\" >/dev/null 2>&1"; then
            OC_PASS="${password}" su -s /bin/sh www-data -c "cd /var/www/html && php occ user:add --password-from-env --display-name \"${display_name}\" \"${username}\""
          fi
          current_display_name="$(su -s /bin/sh www-data -c "cd /var/www/html && php occ user:info \"${username}\" 2>/dev/null" | sed -n 's/^  - display_name: //p' | head -n 1)"
          if [ "${current_display_name}" != "${display_name}" ]; then
            su -s /bin/sh www-data -c "cd /var/www/html && php occ user:setting \"${username}\" settings display_name \"${display_name}\" >/dev/null"
          fi
          OC_PASS="${password}" su -s /bin/sh www-data -c "cd /var/www/html && php occ user:resetpassword --password-from-env \"${username}\""
        env:
        - name: POSTGRES_HOST
          value: platform-stack-shared-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        - name: BOOTSTRAP_USER_0_USERNAME
          value: openclaw
        - name: BOOTSTRAP_USER_0_DISPLAY_NAME
          value: OpenClaw
        - name: BOOTSTRAP_USER_0_PASSWORD
          valueFrom:
            secretKeyRef:
              key: NEXTCLOUD_PASSWORD
              name: openclaw-nextcloud-mcp-secrets
        image: nextcloud:33.0.0-apache
        imagePullPolicy: IfNotPresent
        name: bootstrap-users
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      restartPolicy: Never
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '-5'
  labels:
    app.kubernetes.io/component: memgraph-bootstrap
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
    environment: k3s
  name: platform-stack-platform-stack-memgraph-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: memgraph-bootstrap
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: platform-stack
        environment: k3s
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - "until printf 'RETURN 1;\\n' | mgconsole --host \"platform-stack-memgraph\" --port 7687 --output-format csv >/dev/null 2>&1; do\n  echo \"waiting for platform-stack-memgraph:7687\"\n  sleep 2\ndone\ncat <<'CYPHER' >/tmp/memgraph-seed.cypher\n  MERGE (project:Entity:Project:System {slug: 'ai-homebase'})\n  ON CREATE SET project.name = 'ai-homebase',\n                project.domain = 'real',\n                project.kind = 'platform';\n  \n  MERGE (user:Entity:Person:User {slug: 'user'})\n  ON CREATE SET user.name = 'User',\n                user.domain = 'real';\n  \n  MERGE (openclaw:Entity:Service:System {slug: 'openclaw'})\n  ON CREATE SET openclaw.name = 'OpenClaw',\n                openclaw.category = 'agent-runtime';\n  \n  MERGE (nextcloud:Entity:Service:System {slug: 'nextcloud'})\n  ON CREATE SET nextcloud.name = 'Nextcloud',\n                nextcloud.category = 'knowledge-store';\n  \n  MERGE (qdrant:Entity:Service:System {slug: 'qdrant'})\n  ON CREATE SET qdrant.name = 'Qdrant',\n                qdrant.category = 'vector-memory';\n  \n  MERGE (memgraph:Entity:Service:System {slug: 'memgraph'})\n  ON CREATE SET memgraph.name = 'Memgraph',\n                memgraph.category = 'graph-memory';\n  \n  MERGE (memgraphLab:Entity:Service:System {slug: 'memgraph-lab'})\n  ON CREATE SET memgraphLab.name = 'Memgraph Lab',\n                memgraphLab.category = 'graph-ui';\n  \n  MERGE (gitea:Entity:Service:System {slug: 'gitea'})\n  ON CREATE SET gitea.name = 'Gitea',\n                gitea.category = 'source-control';\n  \n  MERGE (argocd:Entity:Service:System {slug: 'argocd'})\n  ON CREATE SET argocd.name = 'Argo CD',\n                argocd.category = 'gitops';\n  \n  MERGE (registry:Entity:Service:System {slug: 'registry'})\n  ON CREATE SET registry.name = 'Registry',\n                registry.category = 'artifact-store';\n  \n  MERGE (main:Entity:Agent:Person {slug: 'main'})\n  ON CREATE SET main.name = 'main',\n                main.role = 'orchestrator';\n  \n  MERGE (architect:Entity:Agent:Person {slug: 'architect'})\n  ON CREATE SET architect.name = 'architect',\n                architect.role = 'planner';\n  \n  MERGE (coder:Entity:Agent:Person {slug: 'coder'})\n  ON CREATE SET coder.name = 'coder',\n                coder.role = 'implementer';\n  \n  MERGE (watchdog:Entity:Agent:Person {slug: 'watchdog'})\n  ON CREATE SET watchdog.name = 'watchdog',\n                watchdog.role = 'monitor';\n  \n  MERGE (auditor:Entity:Agent:Person {slug: 'auditor'})\n  ON CREATE SET auditor.name = 'auditor',\n                auditor.role = 'reviewer';\n  \n  MERGE (archivist:Entity:Agent:Person {slug: 'archivist'})\n  ON CREATE SET archivist.name = 'archivist',\n                archivist.role = 'knowledge-graph-curator';\n  \n  MERGE (gitopsRepo:Entity:Repository:System {slug: 'cluster-gitops'})\n  ON CREATE SET gitopsRepo.name = 'cluster-gitops',\n                gitopsRepo.kind = 'gitops';\n  \n  MERGE (sandboxRepo:Entity:Repository:System {slug: 'openclaw-sandbox-images'})\n  ON CREATE SET sandboxRepo.name = 'openclaw-sandbox-images',\n                sandboxRepo.kind = 'sandbox-images';\n  \n  MATCH (project:Entity:Project:System {slug: 'ai-homebase'})\n  MATCH (user:Entity:Person:User {slug: 'user'})\n  MATCH (openclaw:Entity:Service:System {slug: 'openclaw'})\n  MATCH (nextcloud:Entity:Service:System {slug: 'nextcloud'})\n  MATCH (qdrant:Entity:Service:System {slug: 'qdrant'})\n  MATCH (memgraph:Entity:Service:System {slug: 'memgraph'})\n  MATCH (memgraphLab:Entity:Service:System {slug: 'memgraph-lab'})\n  MATCH (gitea:Entity:Service:System {slug: 'gitea'})\n  MATCH (argocd:Entity:Service:System {slug: 'argocd'})\n  MATCH (registry:Entity:Service:System {slug: 'registry'})\n  MATCH (main:Entity:Agent:Person {slug: 'main'})\n  MATCH (architect:Entity:Agent:Person {slug: 'architect'})\n  MATCH (coder:Entity:Agent:Person {slug: 'coder'})\n  MATCH (watchdog:Entity:Agent:Person {slug: 'watchdog'})\n  MATCH (auditor:Entity:Agent:Person {slug: 'auditor'})\n  MATCH (archivist:Entity:Agent:Person {slug: 'archivist'})\n  MATCH (gitopsRepo:Entity:Repository:System {slug: 'cluster-gitops'})\n  MATCH (sandboxRepo:Entity:Repository:System {slug: 'openclaw-sandbox-images'})\n  MERGE (project)-[:HAS_MEMBER]->(user)\n  MERGE (project)-[:USES]->(openclaw)\n  MERGE (project)-[:USES]->(nextcloud)\n  MERGE (project)-[:USES]->(qdrant)\n  MERGE (project)-[:USES]->(memgraph)\n  MERGE (project)-[:USES]->(memgraphLab)\n  MERGE (project)-[:USES]->(gitea)\n  MERGE (project)-[:USES]->(argocd)\n  MERGE (project)-[:USES]->(registry)\n  MERGE (project)-[:USES]->(gitopsRepo)\n  MERGE (project)-[:USES]->(sandboxRepo)\n  MERGE (main)-[:PART_OF]->(openclaw)\n  MERGE (architect)-[:PART_OF]->(openclaw)\n  MERGE (coder)-[:PART_OF]->(openclaw)\n  MERGE (watchdog)-[:PART_OF]->(openclaw)\n  MERGE (auditor)-[:PART_OF]->(openclaw)\n  MERGE (archivist)-[:PART_OF]->(openclaw)\n  MERGE (auditor)-[:USES_SERVICE]->(nextcloud)\n  MERGE (auditor)-[:USES_SERVICE]->(qdrant)\n  MERGE (archivist)-[:MANAGES {role: 'graph-curation'}]->(memgraph)\n  MERGE (archivist)-[:MANAGES {role: 'memory-grooming'}]->(qdrant)\n  MERGE (archivist)-[:MANAGES {role: 'schema-maintenance'}]->(memgraph)\n  MERGE (memgraphLab)-[:USES {role: 'graph-visualization'}]->(memgraph)\n  \nCYPHER\nmgconsole --host \"platform-stack-memgraph\" --port 7687 --output-format csv < /tmp/memgraph-seed.cypher\n"
        image: memgraph/memgraph:3.8.1
        imagePullPolicy: IfNotPresent
        name: memgraph-bootstrap
        terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: '-10'
  labels:
    app.kubernetes.io/component: shared-postgresql-bootstrap
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
    environment: k3s
  name: platform-stack-shared-postgresql-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: shared-postgresql-bootstrap
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: platform-stack
        environment: k3s
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --dbname postgres; do
            echo "waiting for ${PGHOST}:${PGPORT}"
            sleep 2
          done
          psql -v ON_ERROR_STOP=1 --dbname postgres --set=gitea_db_password="$GITEA_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE gitea LOGIN PASSWORD %L', :'gitea_db_password')
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'gitea')\gexec
          SELECT format('ALTER ROLE gitea WITH LOGIN PASSWORD %L', :'gitea_db_password')
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'gitea')\gexec
          SELECT 'CREATE DATABASE gitea OWNER gitea'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'gitea')\gexec
          ALTER DATABASE gitea OWNER TO gitea;
          SQL
          psql -v ON_ERROR_STOP=1 --dbname postgres --set=vaultwarden_db_password="$VAULTWARDEN_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE vaultwarden LOGIN PASSWORD %L', :'vaultwarden_db_password')
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vaultwarden')\gexec
          SELECT format('ALTER ROLE vaultwarden WITH LOGIN PASSWORD %L', :'vaultwarden_db_password')
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'vaultwarden')\gexec
          SELECT 'CREATE DATABASE vaultwarden OWNER vaultwarden'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'vaultwarden')\gexec
          ALTER DATABASE vaultwarden OWNER TO vaultwarden;
          SQL
          psql -v ON_ERROR_STOP=1 --dbname postgres --set=nextcloud_db_password="$NEXTCLOUD_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE nextcloud LOGIN PASSWORD %L', :'nextcloud_db_password')
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'nextcloud')\gexec
          SELECT format('ALTER ROLE nextcloud WITH LOGIN PASSWORD %L', :'nextcloud_db_password')
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'nextcloud')\gexec
          SELECT 'CREATE DATABASE nextcloud OWNER nextcloud'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'nextcloud')\gexec
          ALTER DATABASE nextcloud OWNER TO nextcloud;
          SQL
          psql -v ON_ERROR_STOP=1 --dbname postgres --set=paperless_db_password="$PAPERLESS_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE paperless LOGIN PASSWORD %L', :'paperless_db_password')
          WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'paperless')\gexec
          SELECT format('ALTER ROLE paperless WITH LOGIN PASSWORD %L', :'paperless_db_password')
          WHERE EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'paperless')\gexec
          SELECT 'CREATE DATABASE paperless OWNER paperless'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'paperless')\gexec
          ALTER DATABASE paperless OWNER TO paperless;
          SQL
        env:
        - name: PGHOST
          value: platform-stack-shared-postgresql
        - name: PGPORT
          value: '5432'
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: shared-postgresql-auth
        - name: GITEA_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: GITEA__database__PASSWD
              name: gitea-config-secrets
        - name: VAULTWARDEN_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: VAULTWARDEN_DB_PASSWORD
              name: vaultwarden-config-secrets
        - name: NEXTCLOUD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: PAPERLESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PAPERLESS_DB_PASSWORD
              name: paperless-config-secrets
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        name: shared-postgresql-bootstrap
        terminationMessagePolicy: FallbackToLogsOnError
      restartPolicy: Never
