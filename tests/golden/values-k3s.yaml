apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
    environment: k3s
  name: platform-stack-nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: nextcloud
  serviceName: platform-stack-nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - env:
        - name: NEXTCLOUD_ADMIN_USER
          value: nextcloud-admin
        - name: NEXTCLOUD_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: NEXTCLOUD_ADMIN_PASSWORD
              name: nextcloud-config-secrets
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: cloud.homebase.local platform-stack-nextcloud platform-stack-nextcloud.ai-homebase.svc platform-stack-nextcloud.ai-homebase.svc.cluster.local
        - name: TRUSTED_PROXIES
          value: 10.42.0.0/16
        - name: APACHE_DISABLE_REWRITE_IP
          value: '1'
        - name: OVERWRITEPROTOCOL
          value: https
        - name: PHP_MEMORY_LIMIT
          value: 512M
        - name: PHP_UPLOAD_LIMIT
          value: 16G
        - name: NEXTCLOUD_INIT_HTACCESS
          value: 'true'
        - name: SMTP_HOST
          value: platform-stack-postfix-relay
        - name: SMTP_PORT
          value: '587'
        - name: SMTP_NAME
          value: ''
        - name: SMTP_SECURE
          value: ''
        - name: SMTP_AUTHTYPE
          value: ''
        - name: MAIL_FROM_ADDRESS
          value: noreply
        - name: MAIL_DOMAIN
          value: example.com
        - name: POSTGRES_HOST
          value: platform-stack-shared-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        image: nextcloud:33.0.0-apache
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'
          initialDelaySeconds: 30
          periodSeconds: 10
        name: nextcloud
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: '4'
            memory: 8Gi
          requests:
            cpu: '1'
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      initContainers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until PGPASSWORD="$NEXTCLOUD_DB_PASSWORD" psql \
            --host "platform-stack-shared-postgresql" \
            --port "5432" \
            --username "nextcloud" \
            --dbname "nextcloud" \
            -tAc "SELECT current_database(), current_user;" | grep -qx 'nextcloud|nextcloud'; do
            echo "waiting for live PostgreSQL bootstrap of nextcloud"
            sleep 2
          done
        env:
        - name: NEXTCLOUD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-shared-postgresql-bootstrap
      - command:
        - /bin/sh
        - -ceu
        - |
          if ! su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; then
            exit 0
          fi
          idx=0
          for domain in localhost $NEXTCLOUD_TRUSTED_DOMAINS; do
            su -s /bin/sh www-data -c "cd /var/www/html && php occ config:system:set trusted_domains ${idx} --value='${domain}'"
            idx=$((idx + 1))
          done
        env:
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: cloud.homebase.local platform-stack-nextcloud platform-stack-nextcloud.ai-homebase.svc platform-stack-nextcloud.ai-homebase.svc.cluster.local
        image: nextcloud:33.0.0-apache
        imagePullPolicy: IfNotPresent
        name: reconcile-trusted-domains
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
---
