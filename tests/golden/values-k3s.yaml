        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: vaultwarden
    spec:
      containers:
      - env:
        - name: DATA_FOLDER
          value: /data
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: vaultwarden-config-secrets
        - name: DOMAIN
          value: https://vaultwarden.vpn.homebase.internal
        - name: SIGNUPS_ALLOWED
          value: 'false'
        - name: INVITATIONS_ALLOWED
          value: 'true'
        - name: WEBSOCKET_ENABLED
          value: 'true'
        - name: SMTP_HOST
          value: platform-stack-postfix-relay
        - name: SMTP_PORT
          value: '587'
        - name: SMTP_FROM
          value: noreply@example.com
        - name: SMTP_FROM_NAME
          value: ai-homebase
        - name: SMTP_SECURITY
          value: 'off'
        image: ghcr.io/dani-garcia/vaultwarden:1.35.4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: http
        name: vaultwarden
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /data
          name: data
      initContainers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until PGPASSWORD="$VAULTWARDEN_DB_PASSWORD" psql \
            --host platform-stack-shared-postgresql \
            --port 5432 \
            --username vaultwarden \
            --dbname vaultwarden \
            -tAc "SELECT current_database(), current_user;" | grep -qx 'vaultwarden|vaultwarden'; do
            echo "waiting for live PostgreSQL bootstrap of vaultwarden"
            sleep 2
          done
        env:
        - name: VAULTWARDEN_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: VAULTWARDEN_DB_PASSWORD
              name: vaultwarden-config-secrets
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-shared-postgresql-bootstrap
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-vaultwarden-data
