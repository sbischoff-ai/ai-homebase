          value: deu+eng
        image: paperlessngx/paperless-ngx:2.20
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: http
        name: paperless-ngx
        ports:
        - containerPort: 8000
