        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - SETGID
            - SETUID
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /usr/src/paperless/data
          name: data
        - mountPath: /usr/src/paperless/media
          name: media
        - mountPath: /usr/src/paperless/consume
          name: consume
        - mountPath: /usr/src/paperless/export
          name: export
      initContainers:
      - command:
        - /bin/sh
        - -ceu
        - |
          until PGPASSWORD="$PAPERLESS_DB_PASSWORD" psql \
            --host "platform-stack-shared-postgresql" \
            --port "5432" \
            --username "paperless" \
            --dbname "paperless" \
            -tAc "SELECT current_database(), current_user;" | grep -qx 'paperless|paperless'; do
            echo "waiting for live PostgreSQL bootstrap of paperless"
            sleep 2
          done
        env:
        - name: PAPERLESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PAPERLESS_DB_PASSWORD
              name: paperless-config-secrets
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-shared-postgresql-bootstrap
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-paperless-ngx-data
      - name: media
        persistentVolumeClaim:
          claimName: platform-stack-paperless-ngx-media
      - name: consume
        persistentVolumeClaim:
          claimName: platform-stack-paperless-ngx-consume
      - name: export
        persistentVolumeClaim:
          claimName: platform-stack-paperless-ngx-export
