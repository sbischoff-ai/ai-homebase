        - |
          set -eu
          mkdir -p /tools-target
          docker_path="$(command -v docker || true)"
          if [ -z "${docker_path}" ]; then
            echo >&2 "remoteDocker.cli.image must contain a working docker CLI on PATH so OpenClaw can use the Docker sandbox backend."
            exit 1
          fi
          cp -f "${docker_path}" /tools-target/docker || {
            echo >&2 "Failed to copy ${docker_path} into /tools-target/docker for OpenClaw remote Docker support."
            exit 1
          }
          chmod 0755 /tools-target /tools-target/docker || {
            echo >&2 "Failed to lock permissions on /tools-target/docker for OpenClaw remote Docker support."
            exit 1
          }
          chown -R 1000:1000 /tools-target || {
            echo >&2 "Failed to hand /tools-target to UID/GID 1000 after copying the docker CLI."
            exit 1
          }
        image: docker:28.0.4-cli
        imagePullPolicy: IfNotPresent
        name: remote-docker-cli
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /tools-target
          name: remote-docker-cli
      - command:
        - /bin/sh
        - -c
        - |
          set -eu
          export PATH="/opt/openclaw-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          docker_path="$(command -v docker || true)"
          if [ -z "${docker_path}" ]; then
            echo >&2 "Docker sandbox backend requested, but no docker CLI is available after the remoteDocker.cli init step."
            exit 1
          fi
          ssh_path="$(command -v ssh || true)"
          if [ -z "${ssh_path}" ]; then
            echo >&2 "OpenClaw remote Docker over ssh:// requires an ssh client in the OpenClaw image. Build from images/openclaw-remote-docker/Dockerfile or use an equivalent image."
            exit 1
          fi
          echo "docker CLI available at ${docker_path}"
          echo "ssh client available at ${ssh_path}"
        image: ghcr.io/openclaw/openclaw:2026.4.14
        imagePullPolicy: IfNotPresent
        name: remote-docker-runtime-check
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /opt/openclaw-tools/bin
          name: remote-docker-cli
          readOnly: true
      - command:
        - /bin/sh
        - -c
        - |
          set -eu
          mkdir -p /ssh-target
          if [ ! -s /ssh-source/id_ed25519 ]; then
            echo >&2 "remoteDocker.ssh.secretName must reference a Secret containing non-empty id_ed25519 and known_hosts keys; id_ed25519 is missing or empty."
            exit 1
          fi
          if [ ! -s /ssh-source/known_hosts ]; then
            echo >&2 "remoteDocker.ssh.secretName must reference a Secret containing non-empty id_ed25519 and known_hosts keys; known_hosts is missing or empty."
            exit 1
          fi
          echo "Copying SSH files from /ssh-source into /ssh-target."
          cp -f /ssh-source/id_ed25519 /ssh-target/id_ed25519 || {
            echo >&2 "Failed to copy /ssh-source/id_ed25519 to /ssh-target/id_ed25519; verify the mounted Secret files are readable and that the init container security context allows writes to /ssh-target."
            exit 1
          }
          cp -f /ssh-source/known_hosts /ssh-target/known_hosts || {
            echo >&2 "Failed to copy /ssh-source/known_hosts to /ssh-target/known_hosts; verify the mounted Secret files are readable and that the init container security context allows writes to /ssh-target."
            exit 1
          }
          echo "Locking permissions before handing /ssh-target to UID/GID 1000."
          chmod 0700 /ssh-target || {
            echo >&2 "Failed to set mode 0700 on /ssh-target before ownership changes; verify the init container security context still permits writes to the mounted emptyDir volume."
            exit 1
          }
          chmod 0600 /ssh-target/id_ed25519 || {
            echo >&2 "Failed to set mode 0600 on /ssh-target/id_ed25519 before ownership changes; verify the copied SSH key is writable inside /ssh-target and that the init container security context still permits writes to the mounted emptyDir volume."
            exit 1
          }
          chmod 0644 /ssh-target/known_hosts || {
            echo >&2 "Failed to set mode 0644 on /ssh-target/known_hosts before ownership changes; verify the copied known_hosts file is writable inside /ssh-target and that the init container security context still permits writes to the mounted emptyDir volume."
            exit 1
          }
          chown -R 1000:1000 /ssh-target || {
            echo >&2 "Failed to hand /ssh-target to UID/GID 1000 after permissions were locked down; verify the init container still runs as UID/GID 0 with the CHOWN capability required by the security context."
            exit 1
          }
        image: ghcr.io/openclaw/openclaw:2026.4.14
        imagePullPolicy: IfNotPresent
        name: remote-docker-ssh-permissions
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /ssh-source
          name: remote-docker-ssh-secret
          readOnly: true
        - mountPath: /ssh-target
          name: remote-docker-ssh
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openclaw
      volumes:
      - emptyDir:
          medium: Memory
        name: tmp
      - hostPath:
          path: /var/lib/ai-homebase/openclaw-state
          type: DirectoryOrCreate
        name: data
      - configMap:
          name: platform-stack-openclaw
        name: config-source
      - name: mcp-runtime
      - name: memgraph-tools-runtime
      - name: remote-docker-cli
      - name: remote-docker-ssh-secret
        secret:
          secretName: openclaw-remote-docker-ssh
      - name: remote-docker-ssh
