              name: vaultwarden-config-secrets
        - name: DOMAIN
          value: https://vaultwarden.vpn.homebase.internal
        - name: SIGNUPS_ALLOWED
          value: 'false'
        - name: INVITATIONS_ALLOWED
          value: 'true'
        - name: WEBSOCKET_ENABLED
          value: 'true'
        - name: SMTP_HOST
          value: platform-stack-postfix-relay
        - name: SMTP_PORT
          value: '587'
        - name: SMTP_FROM
          value: noreply@example.com
        - name: SMTP_FROM_NAME
          value: ai-homebase
        - name: SMTP_SECURITY
          value: 'off'
        image: ghcr.io/dani-garcia/vaultwarden:1.35.4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: http
        name: vaultwarden
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: http
