apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
    environment: k3s
  name: platform-stack-nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: nextcloud
  serviceName: platform-stack-nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: nextcloud
    spec:
      containers:
      - env:
        - name: NEXTCLOUD_ADMIN_USER
          value: nextcloud-admin
        - name: NEXTCLOUD_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: NEXTCLOUD_ADMIN_PASSWORD
              name: nextcloud-config-secrets
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: cloud.homebase.local platform-stack-nextcloud platform-stack-nextcloud.ai-homebase.svc
            platform-stack-nextcloud.ai-homebase.svc.cluster.local
        - name: TRUSTED_PROXIES
          value: 10.42.0.0/16
        - name: APACHE_DISABLE_REWRITE_IP
          value: '1'
        - name: OVERWRITEPROTOCOL
          value: https
        - name: PHP_MEMORY_LIMIT
          value: 512M
        - name: PHP_UPLOAD_LIMIT
          value: 16G
        - name: NEXTCLOUD_INIT_HTACCESS
          value: 'true'
        - name: SMTP_HOST
          value: platform-stack-postfix-relay
        - name: SMTP_PORT
          value: '587'
        - name: SMTP_NAME
          value: ''
        - name: SMTP_SECURE
          value: ''
        - name: SMTP_AUTHTYPE
          value: ''
        - name: MAIL_FROM_ADDRESS
          value: noreply
        - name: MAIL_DOMAIN
          value: example.com
        - name: POSTGRES_HOST
          value: platform-stack-shared-postgresql
        - name: POSTGRES_PORT
          value: '5432'
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_USER
          value: nextcloud
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        - name: REDIS_HOST
          value: platform-stack-shared-redis
        - name: REDIS_HOST_PORT
          value: '6379'
        - name: REDIS_HOST_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST_PASSWORD
              name: nextcloud-config-secrets
        image: nextcloud:33.0.0-apache
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json
              2>/dev/null | grep -q "\"installed\":true"'
          initialDelaySeconds: 30
          periodSeconds: 10
        name: nextcloud
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json
              2>/dev/null | grep -q "\"installed\":true"'
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: '3'
            memory: 6Gi
          requests:
            cpu: 750m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      initContainers:
      - command:
        - /bin/sh
        - -ceu
        - "if [ ! -f /var/www/html/config/config.php ]; then\n  exit 0\nfi\nif su\
          \ -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json\
          \ 2>/dev/null | grep -q \"\\\"installed\\\":true\"'; then\n  exit 0\nfi\n\
          echo \"removing incomplete Nextcloud bootstrap state\"\nrm -f /var/www/html/config/config.php\
          \ /var/www/html/nextcloud-init-sync.lock\n"
        image: nextcloud:33.0.0-apache
        imagePullPolicy: IfNotPresent
        name: recover-incomplete-bootstrap
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      - command:
        - /bin/sh
        - -ceu
        - "until PGPASSWORD=\"$NEXTCLOUD_DB_PASSWORD\" psql \\\n  --host \"platform-stack-shared-postgresql\"\
          \ \\\n  --port \"5432\" \\\n  --username \"nextcloud\" \\\n  --dbname \"\
          nextcloud\" \\\n  -tAc \"SELECT current_database(), current_user;\" | grep\
          \ -qx 'nextcloud|nextcloud'; do\n  echo \"waiting for live PostgreSQL bootstrap\
          \ of nextcloud\"\n  sleep 2\ndone\n"
        env:
        - name: NEXTCLOUD_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: nextcloud-config-secrets
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-shared-postgresql-bootstrap
      - command:
        - /bin/sh
        - -ceu
        - "if ! su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json\
          \ 2>/dev/null | grep -q \"\\\"installed\\\":true\"'; then\n  exit 0\nfi\n\
          idx=0\nfor domain in localhost $NEXTCLOUD_TRUSTED_DOMAINS; do\n  su -s /bin/sh\
          \ www-data -c \"cd /var/www/html && php occ config:system:set trusted_domains\
          \ ${idx} --value='${domain}'\"\n  idx=$((idx + 1))\ndone\n"
        env:
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: cloud.homebase.local platform-stack-nextcloud platform-stack-nextcloud.ai-homebase.svc
            platform-stack-nextcloud.ai-homebase.svc.cluster.local
        image: nextcloud:33.0.0-apache
        imagePullPolicy: IfNotPresent
        name: reconcile-trusted-domains
        volumeMounts:
        - mountPath: /var/www/html
          name: data
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: paperless-ngx
    environment: k3s
  name: platform-stack-paperless-ngx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: paperless-ngx
  serviceName: platform-stack-paperless-ngx
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: paperless-ngx
    spec:
      containers:
      - env:
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: PAPERLESS_SECRET_KEY
              name: paperless-config-secrets
        - name: PAPERLESS_ADMIN_USER
          value: paperless-admin
        - name: PAPERLESS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PAPERLESS_ADMIN_PASSWORD
              name: paperless-config-secrets
        - name: PAPERLESS_DBENGINE
          value: postgresql
        - name: PAPERLESS_DBHOST
          value: platform-stack-shared-postgresql
        - name: PAPERLESS_DBPORT
          value: '5432'
        - name: PAPERLESS_DBNAME
          value: paperless
        - name: PAPERLESS_DBUSER
          value: paperless
        - name: PAPERLESS_DBPASS
          valueFrom:
            secretKeyRef:
              key: PAPERLESS_DB_PASSWORD
              name: paperless-config-secrets
        - name: PAPERLESS_REDIS
          valueFrom:
            secretKeyRef:
              key: PAPERLESS_REDIS
              name: paperless-config-secrets
        - name: PAPERLESS_REDIS_PREFIX
          value: paperless
        - name: PAPERLESS_URL
          value: http://paperless.vpn.homebase.internal
        - name: PAPERLESS_ALLOWED_HOSTS
          value: paperless.vpn.homebase.internal
        - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
          value: http://paperless.vpn.homebase.internal
        - name: PAPERLESS_CORS_ALLOWED_HOSTS
          value: ''
        - name: PAPERLESS_TIME_ZONE
          value: Europe/Berlin
        - name: PAPERLESS_OCR_LANGUAGE
          value: deu+eng
        image: paperlessngx/paperless-ngx:2.20
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 10
          tcpSocket:
            port: http
        name: paperless-ngx
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - SETGID
            - SETUID
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /usr/src/paperless/data
          name: data
        - mountPath: /usr/src/paperless/media
          name: media
        - mountPath: /usr/src/paperless/consume
          name: consume
        - mountPath: /usr/src/paperless/export
          name: export
      initContainers:
      - command:
        - /bin/sh
        - -ceu
        - "until PGPASSWORD=\"$PAPERLESS_DB_PASSWORD\" psql \\\n  --host \"platform-stack-shared-postgresql\"\
          \ \\\n  --port \"5432\" \\\n  --username \"paperless\" \\\n  --dbname \"\
          paperless\" \\\n  -tAc \"SELECT current_database(), current_user;\" | grep\
          \ -qx 'paperless|paperless'; do\n  echo \"waiting for live PostgreSQL bootstrap\
          \ of paperless\"\n  sleep 2\ndone\n"
        env:
        - name: PAPERLESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: PAPERLESS_DB_PASSWORD
              name: paperless-config-secrets
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        name: wait-for-shared-postgresql-bootstrap
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-paperless-ngx-data
      - name: media
        persistentVolumeClaim:
          claimName: platform-stack-paperless-ngx-media
      - name: consume
        persistentVolumeClaim:
          claimName: platform-stack-paperless-ngx-consume
      - name: export
        persistentVolumeClaim:
          claimName: platform-stack-paperless-ngx-export
