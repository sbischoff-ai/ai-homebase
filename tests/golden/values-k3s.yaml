  workspace-watchdog-skills__check-heartbeat-and-budget__SKILL.md: |
    ---
    name: check-heartbeat-and-budget
    description: Use for heartbeat-driven monitoring, readiness checks, coordination-status checks, or budget sentinel alerts.
    ---

    # Heartbeat And Budget Sentinel

    Use for lightweight recurring checks.

    ## Signals

    - gateway readiness endpoint: `http://127.0.0.1:18789/readyz`
    - shared coordination status marker: Nextcloud `/Projects/ai-homebase/coordination-status.json`
    - spend posture: `tokscale --openclaw --today --json`

    ## Procedure

    1. Read the relevant shared Nextcloud `/Desk/current.md`, Nextcloud `/Desk/index.md`, and local desk cues only when heartbeat or orientation review genuinely needs them.
    2. Check readiness.
    3. Read the shared coordination status marker when activity context is relevant.
    4. Review only the calendars, task lists, or tables registered for `heartbeat` or `orientation` review.
    5. Compare against known baselines before calling something a deviation.
    6. Compare spend posture against Nextcloud `/Projects/ai-homebase/budget-policy.md` and treat "approaching a ceiling" as a warning signal, not an automatic emergency.
    7. Write only compact durable status updates; routine all-clear heartbeat runs should stay in the status log, not expand into new documents.
    8. From cron, do not depend on session visibility or session messaging unless the cron prompt explicitly requires it.

    ## Boundaries

    - Respect the rules in `classify-severity-and-escalate`.
    - Prefer low false positives over aggressive escalation.
    - Do not turn heartbeat review into generic stack housekeeping for higher-cost agents.
  workspace-watchdog-skills__classify-severity-and-escalate__SKILL.md: |
    ---
    name: classify-severity-and-escalate
    description: Use when classifying a monitoring result, deciding whether to escalate, or preparing a Watchdog Alert.
    ---

    # Severity And Escalation

    Use when deciding whether to log, wait, or escalate.

    ## Severity Gates

    | Level | Criteria | Action |
    | --- | --- | --- |
    | info | Observation only; no user impact, no baseline deviation | Log only. Do not message main. |
    | warning | Deviation from baseline, partial degradation, or budget posture approaching a configured ceiling while the system is still functional | Log. Escalate to main only if it persists for 2 consecutive checks at least 10 minutes apart. |
    | critical | Service unreachable, data-loss risk, or security concern | Escalate immediately after confirmation from at least one independent signal. |

    ## Anti-False-Positive Rules

    - cold-start exemption: initial session startup latency is expected
    - sandbox isolation exemption: cron-context session visibility may be incomplete
    - cooldown: wait 30 minutes before re-escalating the same critical issue unless evidence changes
    - baseline requirement: compare against documented baselines before calling something a deviation

    ## Cron Behavior

    Do not use `sessions_send` or `sessions_list` from cron context unless the cron prompt explicitly instructs you to do so.
    From cron:
    - treat Nextcloud `/Projects/...` as remote paths
    - use Nextcloud tools for durable state
    - use the gateway readiness endpoint only as a local HTTP check
    - keep heartbeat-triggered checks narrow instead of broadening into unrelated maintenance

    ## Alert Format

    ```markdown
    ## Watchdog Alert
    **System:** <service or system>
    **Severity:** <info | warning | critical>
    **Detected:** <timestamp>

    ### Observation
    <facts only>

    ### Baseline comparison
    <comparison to known baseline or note that none exists>

    ### Recommended action
    <what should happen next and who should own it>
    ```
  workspace-watchdog-skills__manage-nextcloud-incidents__SKILL.md: |
    ---
    name: manage-nextcloud-incidents
    description: Use when recording or updating durable monitoring state in Nextcloud, including incidents, baselines, and escalation trails.
    ---

    # Nextcloud Incident Ops

    Watchdog uses Nextcloud for durable monitoring state.

    ## Typical Paths

    - Nextcloud `/Projects/ai-homebase/incidents/YYYY-MM-DD-short-title.md`
    - Nextcloud `/Projects/ai-homebase/baselines.md`
    - Nextcloud `/Projects/ai-homebase/escalation-rules.md`
    - Nextcloud `/Projects/ai-homebase/watchdog-status-log.md`
    - Nextcloud `/Projects/ai-homebase/coordination-status.json`

    ## Procedure

    1. Treat Nextcloud paths as remote paths.
    2. For routine all-clear checks, update only Nextcloud `/Projects/ai-homebase/watchdog-status-log.md` when anything needs to be preserved. Do not create a new document.
    3. For meaningful incidents or baseline changes, write the smallest durable artifact that preserves the evidence.
    4. Update Nextcloud `/Desk/current.md` or Nextcloud `/Desk/daily/` when another session should be aware of an active or recent incident quickly.
    5. If you create a recurring shared monitoring surface outside the usual incident paths, register it in Nextcloud `/Desk/index.md`.
    6. After writing an incident report, store a Qdrant summary with `project`, `tags`, and `nc_refs`.
    7. Escalate to main only when the severity gate is met.
    8. Keep per-check scratch work local; only promote durable patterns, baselines, and incident state.

    Use `classify-severity-and-escalate` to decide whether the case is `info`, `warning`, or `critical`.

    ## Boundaries

    - Prefer one evolving baseline or status log over many fragmented notes.
    - Do not turn Nextcloud `/Desk/` into an incident archive; it is for bounded continuity.
    - Keep incident reports factual and concise.
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
    environment: k3s
  name: platform-stack-openclaw
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nextcloud
    environment: k3s
  name: platform-stack-nextcloud-cron
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: platform-stack
            app.kubernetes.io/name: nextcloud
        spec:
          containers:
          - command:
            - /bin/sh
            - -ceu
            - |
              if ! su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; then
                echo "skipping cron: nextcloud not installed yet"
                exit 0
              fi
              php -f /var/www/html/cron.php
            env:
            - name: POSTGRES_HOST
              value: platform-stack-shared-postgresql
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: nextcloud-config-secrets
            - name: REDIS_HOST
              value: platform-stack-shared-redis
            - name: REDIS_HOST_PORT
              value: '6379'
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_HOST_PASSWORD
                  name: nextcloud-config-secrets
            - name: SMTP_HOST
              value: platform-stack-postfix-relay
            - name: SMTP_PORT
              value: '587'
            - name: SMTP_NAME
              value: ''
            - name: SMTP_SECURE
              value: ''
            - name: SMTP_AUTHTYPE
              value: ''
            - name: MAIL_FROM_ADDRESS
              value: noreply
            - name: MAIL_DOMAIN
              value: example.com
            image: nextcloud:33.0.2-apache
            imagePullPolicy: IfNotPresent
            name: nextcloud-cron
            resources:
              limits:
                cpu: 500m
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsGroup: 33
              runAsNonRoot: true
              runAsUser: 33
            volumeMounts:
            - mountPath: /var/www/html
              name: data
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: data
  schedule: '*/5 * * * *'
  successfulJobsHistoryLimit: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: memgraph
    environment: k3s
  name: platform-stack-memgraph
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: memgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: memgraph
    spec:
      containers:
      - command:
        - /bin/sh
        - -ceu
        - |
          exec /usr/lib/memgraph/memgraph \
            --bolt-address=0.0.0.0 \
            --bolt-port=7687 \
            --monitoring-address=0.0.0.0 \
            --monitoring-port=7444 \
            --data-directory=/var/lib/memgraph
        image: memgraph/memgraph:3.8.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 15
          tcpSocket:
            port: bolt
        name: memgraph
        ports:
        - containerPort: 7687
          name: bolt
        - containerPort: 7444
          name: http
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          tcpSocket:
            port: bolt
        resources:
          limits:
            cpu: '3'
            memory: 6Gi
          requests:
            cpu: 750m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 0
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/memgraph
          name: data
        - mountPath: /var/log/memgraph
          name: logs
      initContainers:
      - command:
        - sh
        - -ceu
        - |
          mkdir -p /var/lib/memgraph
          mkdir -p /var/log/memgraph
          chown -R 0:0 /var/lib/memgraph
