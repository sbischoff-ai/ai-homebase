apiVersion: v1
data:
  openclaw.json: "{\n  \"gateway\": {\n    \"mode\": \"local\",\n    \"bind\": \"\
    lan\",\n    \"port\": 18789,\n    \"auth\": {\n      \"mode\": \"token\",\n  \
    \    \"token\": \"${OPENCLAW_GATEWAY_TOKEN}\"\n    },\n    \"controlUi\": {\n\
    \      \"enabled\": true,\n      \"allowedOrigins\": [\"https://openclaw.aks.example.com\"\
    ]\n    }\n  },\n  \"agents\": {\n    \"defaults\": {\n      \"workspace\": \"\
    ~/.openclaw/workspace\"\n    },\n    \"list\": [{\"id\":\"default\",\"name\":\"\
    OpenClaw Assistant\",\"workspace\":\"~/.openclaw/workspace\"}]\n  }\n}\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
    platform: aks
  name: platform-stack-openclaw
---
apiVersion: v1
data:
  autoscalingEnabled: 'true'
  domain: aks.example.com
  externalSecretsEnabled: 'true'
  ingressEnabled: 'false'
  observabilityEnabled: 'true'
  persistenceEnabled: 'true'
  workerIsolationEnabled: 'true'
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: platform-stack
    platform: aks
  name: platform-stack-platform-stack-settings
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openclaw
    platform: aks
  name: platform-stack-openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openclaw
    spec:
      containers:
      - env:
        - name: OPENCLAW_STATE_DIR
          value: /home/node/.openclaw
        - name: OPENCLAW_CONFIG_PATH
          value: /etc/openclaw/openclaw.json
        - name: OPENCLAW_GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              key: OPENCLAW_GATEWAY_TOKEN
              name: openclaw-app-secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: OPENAI_API_KEY
              name: openclaw-app-secrets
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: ANTHROPIC_API_KEY
              name: openclaw-app-secrets
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              key: TAVILY_API_KEY
              name: openclaw-app-secrets
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              key: GOOGLE_API_KEY
              name: openclaw-app-secrets
        - name: BRAVE_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              key: BRAVE_SEARCH_API_KEY
              name: openclaw-app-secrets
        image: myregistry.azurecr.io/openclaw:stable
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
        name: openclaw
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /home/node/.openclaw
          name: data
        - mountPath: /etc/openclaw/openclaw.json
          name: config
          readOnly: true
          subPath: openclaw.json
      imagePullSecrets:
      - name: acr-pull
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openclaw
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: platform-stack-openclaw
      - configMap:
          items:
          - key: openclaw.json
            path: openclaw.json
          name: platform-stack-openclaw
        name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openhands
    platform: aks
  name: platform-stack-openhands
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: platform-stack
      app.kubernetes.io/name: openhands
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: platform-stack
        app.kubernetes.io/name: openhands
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: workload-tier
                operator: In
                values:
                - isolated
      containers:
      - env:
        - name: AGENT_SERVER_IMAGE_REPOSITORY
          value: ghcr.io/openhands/agent-server
        - name: AGENT_SERVER_IMAGE_TAG
          value: 1.12.0-python
        - name: RUNTIME_MODE
          value: ''
        - name: QUEUE_ENABLED
          value: 'true'
        - name: QUEUE_PROVIDER
          value: azure-servicebus
        - name: QUEUE_ENDPOINT
          value: sb://<namespace>.servicebus.windows.net/
        - name: QUEUE_NAME
          value: openhands-jobs
        - name: QUEUE_DLQ_NAME
          value: openhands-jobs-deadletter
        - name: WORKER_CONCURRENCY
          value: '4'
        image: myregistry.azurecr.io/openhands:stable
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 20
          periodSeconds: 15
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        name: openhands
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          initialDelaySeconds: 15
          periodSeconds: 15
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        startupProbe:
          failureThreshold: 30
          periodSeconds: 10
          tcpSocket:
            port: 3000
          timeoutSeconds: 5
      imagePullSecrets:
      - name: acr-pull
      nodeSelector:
        kubernetes.azure.com/mode: user
        workload-tier: isolated
      runtimeClassName: kata-cc
      securityContext:
        fsGroup: 1000
      serviceAccountName: platform-stack-openhands
      tolerations:
      - effect: NoSchedule
        key: workload-tier
        operator: Equal
        value: isolated
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/instance: platform-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: openhands
    platform: aks
  name: platform-stack-openhands
spec:
  maxReplicas: 8
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-stack-openhands
---
apiVersion: v1
