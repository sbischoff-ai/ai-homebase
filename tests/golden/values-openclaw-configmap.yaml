    ---

    # Nextcloud Coordination

    Main owns shared coordination state, not specialist project authorship.

    ## Main's Nextcloud Scope

    Use Nextcloud for:
    - `/Desk/` shared continuity and live indexing
    - `/Projects/` sharing and top-level coordination
    - user-facing status docs and shared outputs
    - calendars, todos, reminders, and tables when they improve collaboration
    - `/Projects/ai-homebase/heartbeat.json`
    - quiet background collaboration in the shared `openclaw` account before something is intentionally shared with the user's own account

    Do not use Nextcloud to:
    - author detailed project specs or durable task breakdowns that belong with architect
    - store code
    - duplicate large specialist deliverables in chat
    - replace local workspace WIP or Qdrant for private rough thinking and quick recall

    ## Procedure

    1. Treat all Nextcloud paths as remote paths.
    2. On first use, ensure `/Desk/`, `/Desk/current.md`, `/Desk/index.md`, and `/Desk/daily/README.md` exist.
    3. Create missing parent directories before writing.
    4. Before major coordination, read `/Desk/current.md`, `/Desk/index.md`, and the latest shared daily note when they exist.
    5. Review only the calendars, tasks, and tables registered for startup, active coordination, or another explicitly scheduled review.
    6. Default to a one-day lookback and seven-day lookahead for registered calendars and task lists unless the surface says otherwise.
    7. For user-facing project work, check whether `/Projects/<slug>/` already exists.
    8. If the task is durable planning, route it to architect rather than writing the artifact yourself.
    9. If the task is implementation context or runbook material, route it to coder.
    10. Prefer calendar or tasks for commitments, reminders, and follow-through instead of burying them in markdown.
    11. Prefer tables when the user needs a repeatedly updated structured overview.
    12. Register new folders outside `/Projects/<slug>/`, relevant calendars, task lists, tables, and user-shared folders in `/Desk/index.md`.
    13. Each `/Desk/index.md` entry should include `type`, stable `id` or path, purpose, steward, project or domain, and a read trigger.
    14. Use shares when an artifact should become user-visible outside the agent loop.
    15. When shared coordination state changes in a way watchdog should notice, update `/Projects/ai-homebase/heartbeat.json`.
    16. When durable facts or rules are created, store a Qdrant summary with `project`, `tags`, and `nc_refs`, plus `expiry` when the memory is intentionally short-lived.

    Do not create a standing heartbeat for a frontier agent just to poll for conditions.
    If a recurring need is a simple timed check or reminder, prefer `watchdog` or a conservative cron.
    If it is a recurring multi-step workflow with stable rules, route toward architect and `manage-worker-lifecycle`.
    If a higher-cost agent needs recurring work, prefer sparse cron such as nightly or weekly rather than a 30-minute heartbeat.
    Do not let `/Desk/` become a generic archive; move stable material into Qdrant, Memgraph, or `/Projects/`.

    ## Common Paths

    - `/Desk/current.md`
    - `/Desk/index.md`
    - `/Desk/daily/`
    - `/Projects/<slug>/status.md`
    - `/Projects/<slug>/outputs/`
    - `/Projects/ai-homebase/heartbeat.json`

    ## Escalate

    - when project-folder authorship should belong to architect
    - when the user asks for durable technical notes that belong with coder
  workspace-main-skills__handoff-specialist-work__SKILL.md: |
    ---
    name: handoff-specialist-work
    description: Use when main needs to route work to a standing specialist or review a specialist return. Covers the pre-handoff recall check, the exact Task Handoff format, and how to evaluate returned deliverables.
    ---

    # Specialist Handoff

    Use this skill when routing real specialist work.

    ## Before Sending Work

    1. Read the relevant parts of `CURRENT.md`, `SURFACES.md`, and the latest local daily note.
    2. Read the relevant shared `/Desk/current.md`, `/Desk/index.md`, and the latest shared daily note when they exist.
    3. Search Qdrant for relevant prior context.
    4. Check Nextcloud `/Projects/<slug>/` for existing artifacts when a project is involved, plus any registered shared surfaces that matter to the task.
    5. Include those findings in the handoff.

    ## Archivist Escalation

    Route to archivist when:
    - Qdrant results are sparse, conflicting, or inconclusive on a topic that should be documented
    - the task needs a structural picture of entities and relationships rather than a single fact
    - a decision touches many durable entities and confidence about their relationships matters
    - memory likely exists but semantic search is not surfacing it

    Do not escalate to archivist when a focused Qdrant search already returns a clear result.

    ## Handoff Format

    ```markdown
    ## Task Handoff
    **To:** <agent>
    **From:** main
    **Project:** <slug or none>
    **Task type:** <coordination | design | implementation | recall | monitoring | review>

    ### Request
    <1-3 sentences>

    ### Context
    - <facts, prior decisions, constraints, consulted artifacts>

    ### Deliverable
    - <what should come back and where it should be stored>

    ### Urgency
    <normal | soon | urgent>
    ```

    ## When Work Returns

    1. Review the deliverable against the request.
    2. Synthesize or relay it for the user if appropriate.
    3. Route follow-up to the right agent instead of doing their job yourself.

    ## Boundaries

    - Do not describe a delegation without actually sending it when routing is required.
    - Prefer durable Nextcloud artifacts over long message threads.
  workspace-main-skills__manage-worker-lifecycle__SKILL.md: |
    ---
    name: manage-worker-lifecycle
    description: Use when main needs to decide whether a worker is appropriate, request a worker definition from architect, instantiate an approved worker, or retire one. Covers worker-definition inputs, activation steps, update flow, and decommissioning.
    ---

    # Worker Lifecycle

    Use this skill when recurring work might become a worker.

    ## Decision Rule

    - If a recurring task is a simple timed check, polling loop, or reminder, prefer `watchdog` or a conservative cron before involving a higher-cost specialist.
    - If it is a recurring multi-step workflow with stable rules, route to architect for a worker definition.
    - If the workflow truly needs heartbeat, treat that as a strong signal for a dedicated worker on `gpt-5.4-nano` unless the task clearly needs `gpt-5.4-mini`.
    - Do not give a frontier standing agent a default heartbeat unless the user is explicitly aware of the ongoing budget cost.

    ## Requesting A Worker Definition

    When asking architect for a worker, include:
    - what it should do
    - how often it should run
    - what tools or data sources it needs
    - any sensitivity concerns

    ## Activating An Approved Worker

    1. Read the package from Nextcloud.
    2. Create the workspace directory.
    3. Fill the worker-template files, including `CURRENT.md`, `SURFACES.md`, and `daily/` when the worker should keep continuity across sessions.
    4. Register the agent with `openclaw agents add`.
    5. Update `/Projects/ai-homebase/budget-policy.md` if the new agent changes the stack's ongoing LLM spend posture, expected daily budget, or token guidance.
    6. Register any shared worker surfaces in `/Desk/index.md` when they will matter outside the worker's private workspace.
    7. Add cron if needed.
    8. Confirm activation to the user.

    ## Worker Lifecycle Rules

    - when agents are added, retired, or materially re-scoped, keep `/Projects/ai-homebase/budget-policy.md` current if budget posture changes
    - updates go through architect first
    - create `HEARTBEAT.md` only when the approved worker definition explicitly uses heartbeat; otherwise use cron or on-demand triggers only
    - decommission by removing cron, deleting the agent, and informing the user

    ## Boundaries

    - Main owns instantiation, scheduling, and retirement after approval.
    - Main also owns keeping the shared budget policy aligned with live agent changes it makes.
    - Do not skip architect when the workflow needs a real worker definition.
  workspace-main-skills__record-memory-and-heartbeat__SKILL.md: |
    ---
    name: record-memory-and-heartbeat
    description: Use when main needs to decide what durable facts belong in Qdrant or when to update the shared heartbeat file. Covers memory triggers, nc_refs, and the exact heartbeat write shape.
    ---

    # Memory And Heartbeat

    Use this skill after meaningful coordination work.

    ## Search Trigger

    Read the local desk and the relevant shared `/Desk/` cues first.
    Search Qdrant before non-trivial coordination, especially when prior context, preferences, or project history may matter.
    Prefer small recency-scoped searches guided by active project slugs, people, services, and open loops.

    ## Store Triggers

    Store a Qdrant memory when:
    - a durable user preference becomes clear
    - a project-level decision is made
    - a handoff creates or changes a durable artifact
    - a stack-level operating rule changes

    When a memory corresponds to a Nextcloud artifact, include `nc_refs`.
    When a memory is project-specific, set `project`.
    Add 1 to 4 short `tags` for discoverability.
    Use `expiry` for short-lived current-context memories that should stop shaping retrieval after the near term.

    Use desk promotion first when the information is only short-term continuity:
    - local-only current state -> `CURRENT.md` or `daily/`
    - cross-agent or user-relevant current state -> `/Desk/current.md` or `/Desk/daily/`
    - durable recall -> Qdrant
    - structural world-model changes -> archivist plus Memgraph

    ## Heartbeat

    After meaningful coordination work:
    - refresh `CURRENT.md` and the latest local note when short-term continuity changed
    - promote cross-agent or user-relevant current state into `/Desk/current.md` or `/Desk/daily/` when it should survive a restart
    - register newly important shared surfaces in `/Desk/index.md`
    - capture user-relevant decisions in Nextcloud when they belong in a durable artifact
    - store durable new preferences or rules in Qdrant when recall should survive the current work
    - refresh `/Projects/ai-homebase/heartbeat.json` when shared coordination state changed in a way watchdog should notice
    - do nothing extra when nothing durable changed

    When you refresh the shared heartbeat file, write:
    `{"lastActivity":"ISO-8601","agent":"main","status":"ok"}`

    ## Boundaries

    - Do not treat local retrieval hints as the primary long-term memory system.
    - Do not treat `/Desk/` as a general archive.
    - Do not leave user-relevant durable state only in chat.
  workspace-main-skills__track-budget__SKILL.md: |
    ---
    name: track-budget
    description: Use when main needs to check or manage OpenClaw/Codex spend before delegating specialist work. Covers tokscale checks, combining coder Codex usage from Nextcloud, and short delegation guidance under budget pressure.
    ---

    # Budget Tracking

    Main is the budget manager for the stack.

    ## Checks

    - total today: `tokscale --openclaw --today --json`
    - weekly or monthly: `tokscale --openclaw --week --json`, `tokscale --openclaw --month --json`
    - per-model: `tokscale --openclaw --today --group-by model --json`
    - pricing lookup: `tokscale pricing "<model>"`

    Coder's Codex usage is tracked separately in Nextcloud at:
    - `/Projects/ai-homebase/codex-usage/YYYY-MM-DD.json`

    Tokscale reads session data directly from the gateway.
    It groups spend by model, not by agent, so use the standing agent model assignments as an approximation when you need per-agent posture.

    ## Procedure

    1. Check gateway-side spend with `tokscale`.
    2. If coder Codex usage matters, read the matching Nextcloud usage file and add it to the daily picture.
    3. Compare posture against `/Projects/ai-homebase/budget-policy.md`.
    4. Before non-trivial delegation, decide whether the specialist should keep the session short.
    5. If the user explicitly marks the work as off-budget, note that in the handoff.
    6. Use the result to guide work classes:
       - `P0` direct user requests always proceed
       - `P1` active handoffs proceed unless a hard ceiling is at risk
       - `P2` proactive work defers according to the shared budget policy
       - `P3` speculative work skips according to the shared budget policy

    ## Off-Budget Handling

    - If the user explicitly marks the work as off-budget, note that in the handoff.
    - Tell delegated specialists they may skip their self-checks.

    ## Output

    Use short guidance in handoffs:
    - normal posture
    - near ceiling, keep the session short
    - defer speculative work
