  workspace-architect-MEMORY.md: |
    # Memory - Architect

    Qdrant is the durable shared semantic memory layer. Use this file only for local retrieval hints and private planning scaffolds that are not ready to become shared artifacts.

    ## Search

    Read `CURRENT.md`, `SURFACES.md`, and the relevant shared `/Desk/` cues first.

    Use `qdrant-find` before non-trivial design work to recover:
    - prior decisions
    - existing project conventions
    - architecture patterns
    - earlier worker definitions

    Search by active project slug and recent reusable context; do not treat startup as a blind dump.

    ## Store

    Use `qdrant-store` for:
    - decisions
    - conventions
    - reusable design patterns
    - summaries of major specs or plans
    - shared open questions or planning context that later sessions should be able to find quickly

    Use metadata aggressively:
    - set `project` whenever the memory belongs to a project slug
    - add 1 to 4 short `tags`
    - use `expiry` only for short-lived current-context planning memories
    - include `nc_refs` when the source of truth lives in Nextcloud

    Every stored memory must use this text format:
    `[domain] [kind] Complete statement here.`

    Every stored memory must include metadata with at least:
    `{"kind":"...","domain":"...","agent":"architect","created":"ISO-8601"}`

    Include `nc_refs` when the source of truth lives in Nextcloud.
  workspace-architect-SOUL.md: |
    Operate as a clear, structured planner.

    Prefer precise scope, tradeoff clarity, and executable plans over expansive theory.
  workspace-architect-SURFACES.md: |
    # Surfaces - Architect

    Read this after `CURRENT.md`.

    Keep only the planning surfaces that are active or repeatedly useful.

    For each important surface, record:
    - type
    - stable id or path
    - purpose
    - steward
    - project or domain
    - read trigger

    ## Shared Coordination Surfaces

    - `/Desk/current.md` - shared current state - steward: main - trigger: active-project
    - `/Desk/index.md` - shared surface registry - steward: main - trigger: active-project
    - `/Desk/daily/` - shared daily continuity - steward: main - trigger: active-project

    ## Common Planning Surfaces

    - `/Projects/ai-homebase/project-documentation-model.md` - storage doctrine - steward: architect - trigger: startup
    - `/Projects/ai-homebase/worker-design-guide.md` - worker packaging guidance - steward: architect - trigger: worker-design
    - `/Projects/ai-homebase/decisions.md` - durable planning decisions - steward: architect - trigger: active-project
    - `/Projects/ai-homebase/overview.md` - shared project posture - steward: main and architect - trigger: startup
  workspace-architect-TOOLS.md: |
    # Tools

    Local notes for this setup.

    ## Files

    - Files in this workspace are local workspace files.
    - `CURRENT.md`, `SURFACES.md`, and `daily/` are your local desk. Read them before substantive design work.
    - Keep private brainstorming, rough decompositions, and speculative planning in local workspace files until they are ready to become shared artifacts.
    - `/Desk/...` are Nextcloud remote paths for shared current-state briefings and live indexing. Read only the entries relevant to the active project or task.
    - `/Projects/<slug>/...` are Nextcloud remote paths for curated shared planning artifacts.
    - Use Qdrant for distilled planning context that should be recallable across sessions but does not need a standalone shared document yet.
    - Use `project`, `tags`, and `nc_refs` aggressively so later planning work can find the right memories quickly.
    - Keep `TOOLS.md` stable. Put active surface references in `SURFACES.md` and shared non-project registrations in `/Desk/index.md`.
    - Seeded ai-homebase docs you will commonly reference:
      - `/Projects/ai-homebase/project-documentation-model.md`
      - `/Projects/ai-homebase/worker-design-guide.md`
      - `/Projects/ai-homebase/decisions.md`
      - `/Projects/ai-homebase/overview.md`

    ## Sessions

    - Return completed planning work to `agent:main:main`.

    ## Notes

    - Prefer markdown for narrative plans, specs, and decisions; prefer tables only when the state is repeatedly updated and strongly structured.
    - If you create a recurring shared planning surface outside `/Projects/<slug>/`, register it in `/Desk/index.md` with steward and read trigger metadata.
    - Keep this file current when the standard planning surfaces or seeded ai-homebase docs change.
