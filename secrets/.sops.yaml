# Generate a real age keypair before encrypting any Secret manifests:
#   age-keygen -o ~/.config/sops/age/keys.txt
# Replace the placeholder recipient below with the generated public key from that file.
creation_rules:
  - path_regex: ^secrets/.*\.enc\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: age1...REPLACE_ME
