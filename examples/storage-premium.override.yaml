# Generic storage-class override example for the k3s target.
# Replace class names with those available in your cluster.

global:
  storageClass: <default-storage-class>

nextcloud:
  persistence:
    storageClass: <capacity-storage-class>
    size: 500Gi

gitea:
  gitea:
    persistence:
      storageClass: <default-storage-class>
      size: 200Gi

vaultwarden:
  persistence:
    storageClass: <default-storage-class>
    size: 100Gi

paperlessNgx:
  persistence:
    data:
      storageClass: <fast-storage-class>
      size: 200Gi
    media:
      storageClass: <capacity-storage-class>
      size: 1Ti
    consume:
      storageClass: <default-storage-class>
      size: 50Gi
    export:
      storageClass: <default-storage-class>
      size: 50Gi
