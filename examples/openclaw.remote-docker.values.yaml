# Overlay this after charts/platform-stack/values.yaml plus your target overlay.
# Replace placeholders before applying.

openclaw:
  image:
    repository: "<registry>/openclaw-remote-docker"
    tag: "<image-tag>"
  remoteDocker:
    enabled: true
    dockerHost: "ssh://docker-remote@<remote-docker-host>:2222"
    home: /home/node
    ssh:
      secretName: "<openclaw-remote-docker-ssh-secret>"
      mountPath: /home/node/.ssh
  openclaw:
    agents:
      defaults:
        sandbox:
          docker:
            image: "<sandbox-image-name>"
          browser:
            image: "<browser-sandbox-image-name>"
            cdpSourceRange: "<cluster-egress-cidr>"
