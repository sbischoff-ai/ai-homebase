# Optional k3d user overrides loaded *after* values.yaml + values-k3d.yaml.
# Keep this file out of source control in real environments if it contains secrets.

# Enable OpenClaw ingress for local ingress curl checks.
openclaw:
  ingress:
    enabled: true

# Example: point to a local registry mirror instead of public images.
# openclaw:
#   image:
#     repository: k3d-ai-homebase-registry.localhost:5000/openclaw
#     tag: dev

# Example: override the in-cluster registry hostname for local testing.
# global:
#   hosts:
#     registry: registry.localtest.me

# Example: scale local Gitea storage up for a repo-heavy test.
# gitea:
#   gitea:
#     persistence:
#       enabled: true
#       size: 20Gi

# Example: tune local Nextcloud storage or disable the service for a lighter one-off run.
# nextcloud:
#   enabled: true
#   persistence:
#     size: 20Gi

# Example: override the standard Nextcloud MCP hostname when your Incus VM/container DNS needs
# a different host-routed name than the shipped localtest.me default.
# global:
#   hosts:
#     nextcloudMcp: nextcloud-mcp.example.internal
#     qdrant: qdrant.example.internal
#     qdrantMcp: qdrant-mcp.example.internal

# Example: override the standard OpenClaw remote Docker sandbox endpoint or images.
# Layer examples/openclaw.remote-docker.values.yaml after the target overlay when the default
# host.k3d.internal:2222 / SSH Secret / browser.cdpSourceRange values need adjustment.
