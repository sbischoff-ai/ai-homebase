# Optional k3d user overrides loaded *after* values.yaml + values-k3d.yaml.
# Keep this file out of source control in real environments if it contains secrets.

# Enable OpenClaw ingress for local ingress curl checks.
openclaw:
  ingress:
    enabled: true

# Example: point to a local registry mirror instead of public images.
