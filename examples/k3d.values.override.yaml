# Optional k3d user overrides loaded *after* values.yaml + values-k3d.yaml.
# Keep this file out of source control in real environments if it contains secrets.

# Enable OpenClaw ingress for local ingress curl checks.
openclaw:
  ingress:
    enabled: true

# Example: point to a local registry mirror instead of public images.
# openclaw:
#   image:
#     repository: k3d-ai-homebase-registry.localhost:5000/openclaw
#     tag: dev
# openhands:
#   image:
#     repository: k3d-ai-homebase-registry.localhost:5000/openhands
#     tag: dev

# Example: temporarily enable an optional service for a focused local test.
# gitea:
#   enabled: true
#   persistence:
#     enabled: true
#     size: 5Gi

# Example: enable OpenClaw remote Docker sandboxing.
# Layer examples/openclaw.remote-docker.values.yaml after the target overlay and
# set openclaw.remoteDocker.dockerHost / SSH Secret / browser.cdpSourceRange for your environment.
