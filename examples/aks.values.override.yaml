# Overlay this after charts/platform-stack/values-aks.yaml.
# Add profile/value overlays as needed, for example:
#   --values-file examples/profile-content-services.override.yaml
#   --values-file examples/storage-premium.override.yaml

global:
  domain: <your-domain>
  hosts:
    openclaw: <openclaw-hostname>
    openhands: <openhands-hostname>
    nextcloud: <nextcloud-hostname>
    gitea: <gitea-hostname>
    paperlessNgx: <paperless-hostname>
    infisical: <infisical-hostname>
    wgEasy: <wgeasy-hostname>
  imagePullSecrets:
    - acr-pull

openclaw:
  image:
    repository: <your-acr>.azurecr.io/openclaw
    tag: <image-tag>
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: <openclaw-client-id>

openhands:
  image:
    repository: <your-acr>.azurecr.io/openhands
    tag: <image-tag>
  queue:
    enabled: true
    provider: azure-servicebus
    endpoint: sb://<servicebus-namespace>.servicebus.windows.net/
    queueName: <jobs-queue-name>
    dlqName: <jobs-dlq-name>
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: <openhands-client-id>

gitea:
  # Keep non-sensitive defaults in profile values; wire secrets through upstream chart values.
  gitea:
    admin:
      existingSecret: gitea-app-secrets
    additionalConfigFromEnvs:
      - GITEA__database__PASSWD
      - GITEA__session__PROVIDER_CONFIG
      - GITEA__cache__HOST
      - GITEA__queue__CONN_STR
      - GITEA__global_lock__SERVICE_CONN_STR
      - GITEA__mailer__PASSWD
      - GITEA__oauth2_client__HOMEBASE__CLIENT_SECRET
      - GITEA__security__SECRET_KEY
      - GITEA__security__INTERNAL_TOKEN
    additionalConfigSources:
      - secret:
          secretName: gitea-app-secrets
