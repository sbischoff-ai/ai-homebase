# Overlay this after charts/platform-stack/values-dev.yaml.
# You can combine this with profile overlays, for example:
#   --values-file examples/profile-content-services.override.yaml

global:
  hosts:
    openclaw: <openclaw-dev-hostname>
    openhands: <openhands-dev-hostname>
    nextcloud: <nextcloud-dev-hostname>
    gitea: <gitea-dev-hostname>
    paperlessNgx: <paperless-dev-hostname>
    infisical: <infisical-dev-hostname>
    wgEasy: <wgeasy-dev-hostname>
  imagePullSecrets:
    - <optional-image-pull-secret>

openclaw:
  image:
    repository: <registry>/openclaw
    tag: <image-tag>

openhands:
  image:
    repository: <registry>/openhands
    tag: <image-tag>
  queue:
    enabled: true
    provider: <queue-provider>
    endpoint: <queue-endpoint>
    queueName: <queue-name>
    dlqName: <dlq-name>
