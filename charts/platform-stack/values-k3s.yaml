# k3s overlay for the productive homelab deployment.
# Load this after charts/platform-stack/values.yaml.

global:
  storageClass: local-path
  domain: homebase.internal
  hosts:
    openclaw: openclaw.vpn.homebase.internal
    openhands: openhands.vpn.homebase.internal
    nextcloud: cloud.homebase.internal
    gitea: gitea.vpn.homebase.internal
    paperlessNgx: paperless.vpn.homebase.internal
    infisical: infisical.vpn.homebase.internal
  commonLabels:
    environment: k3s

openclaw:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: openclaw.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
  persistence:
    enabled: true
    size: 50Gi
    storageClass: local-path
  remoteDocker:
    enabled: true
    dockerHost: ssh://docker-remote@openclaw-sandbox.homebase.internal:2222
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - http://openclaw.vpn.homebase.internal

openhands:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: true
    hostName: openhands.vpn.homebase.internal
    ingressClassName: nginx
    annotations: {}
    tls: []
  persistence:
    enabled: true
    size: 100Gi
    storageClass: local-path
  kubernetes:
    ingress_domain: openhands.vpn.homebase.internal
    pvc_storage_size: 5Gi
    pvc_storage_class: local-path
    resource_cpu_request: "1"
    resource_memory_request: 1Gi
    resource_memory_limit: 2Gi

nextcloud:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: cloud.homebase.internal
        paths:
          - path: /
            pathType: Prefix
  persistence:
    enabled: true
    size: 250Gi
    storageClass: local-path

gitea:
  enabled: true
  gitea:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
    persistence:
      enabled: true
      size: 120Gi
      storageClass: local-path
    admin:
      username: git-admin
      existingSecret: ""

paperlessNgx:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: paperless.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
  persistence:
    data:
      enabled: true
      size: 30Gi
      storageClass: local-path
    media:
      enabled: true
      size: 250Gi
      storageClass: local-path
    consume:
      enabled: true
      size: 20Gi
      storageClass: local-path
    export:
      enabled: true
      size: 20Gi
      storageClass: local-path

infisical:
  enabled: true
  ingress:
    enabled: true
    hostName: infisical.vpn.homebase.internal
    ingressClassName: nginx
    annotations: {}
    tls: []
  postgresql:
    enabled: false
  redis:
    enabled: false

sharedPostgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: local-path

sharedRedis:
  enabled: true
  master:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: local-path
