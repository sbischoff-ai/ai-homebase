# k3s overlay for the productive homelab deployment.
# Load this after charts/platform-stack/values.yaml.

global:
  storageClass: local-path
  domain: homebase.internal
  hosts:
    openclaw: openclaw.vpn.homebase.internal
    nextcloud: cloud.homebase.internal
    gitea: gitea.vpn.homebase.internal
    argocd: argocd.vpn.homebase.internal
    vaultwarden: vaultwarden.vpn.homebase.internal
    paperlessNgx: paperless.vpn.homebase.internal
  commonLabels:
    environment: k3s

openclaw:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: openclaw.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.vpn.homebase.internal
  persistence:
    enabled: true
    size: 50Gi
    storageClass: local-path
  remoteDocker:
    enabled: true
    dockerHost: ssh://docker-remote@openclaw-sandbox.homebase.internal:2222
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.vpn.homebase.internal
      trustedProxies:
        - 10.42.0.0/16


nextcloud:
  enabled: true
  ingress:
    private:
      enabled: true
      className: nginx
      host: cloud.homebase.internal
    public:
      enabled: true
      className: nginx
  persistence:
    enabled: true
    size: 250Gi
    storageClass: local-path
  trustedProxies:
    - 10.42.0.0/16

argoCd:
  enabled: false
  argocd:
    server:
      ingress:
        enabled: true
        ingressClassName: nginx
        hostname: argocd.vpn.homebase.internal
        tls: false

gitea:
  enabled: true
  gitea:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
    persistence:
      enabled: true
      size: 120Gi
      storageClass: local-path
    admin:
      username: git-admin
      existingSecret: ""

vaultwarden:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: vaultwarden.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: vaultwarden-tls
        hosts:
          - vaultwarden.vpn.homebase.internal
  persistence:
    enabled: true
    size: 20Gi
    storageClass: local-path

postfixRelay:
  enabled: true

paperlessNgx:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: paperless.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
  persistence:
    data:
      enabled: true
      size: 30Gi
      storageClass: local-path
    media:
      enabled: true
      size: 250Gi
      storageClass: local-path
    consume:
      enabled: true
      size: 20Gi
      storageClass: local-path
    export:
      enabled: true
      size: 20Gi
      storageClass: local-path


sharedPostgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: local-path

sharedRedis:
  enabled: true
  master:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: local-path
