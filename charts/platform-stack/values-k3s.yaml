# k3s overlay for the productive homelab deployment.
# Load this after charts/platform-stack/values.yaml.
#
# Target posture:
# - single-node k3s
# - Hetzner A42U-class host
# - Ryzen 7 Pro 8700GE
# - 64 GiB RAM
# - ~3 TiB storage
#
# The resource settings below aim to keep the current stack comfortable on that host
# while leaving headroom for the Incus-backed OpenClaw sandbox VM and future services
# such as Qdrant, Qdrant MCP, Memgraph, Memgraph Lab, and coder-deployed apps.

global:
  storageClass: local-path
  domain: homebase.internal
  hosts:
    openclaw: openclaw.vpn.homebase.internal
    nextcloud: cloud.homebase.internal
    nextcloudMcp: nextcloud-mcp.vpn.homebase.internal
    qdrant: qdrant.vpn.homebase.internal
    qdrantMcp: qdrant-mcp.vpn.homebase.internal
    memgraph: memgraph.vpn.homebase.internal
    memgraphLab: memgraph-lab.vpn.homebase.internal
    gitea: gitea.vpn.homebase.internal
    registry: registry.vpn.homebase.internal
    argocd: argocd.vpn.homebase.internal
    vaultwarden: vaultwarden.vpn.homebase.internal
    paperlessNgx: paperless.vpn.homebase.internal
  commonLabels:
    environment: k3s

openclaw:
  enabled: true
  image:
    repository: openclaw-remote-docker
    tag: "trixie-slim"
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: openclaw.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.vpn.homebase.internal
  persistence:
    enabled: true
    hostPath: /var/lib/ai-homebase/openclaw-state
    size: 100Gi
    storageClass: local-path
  remoteDocker:
    enabled: true
    dockerHost: ssh://docker-remote@openclaw-sandbox.homebase.internal:2222
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 6Gi
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.vpn.homebase.internal
      trustedProxies:
        - 10.42.0.0/16
    mcp:
      servers:
        nextcloud:
          args:
            - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL}
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL}
            - --header
            - Authorization=${OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER}
    agents:
      defaults:
        sandbox:
          docker:
            env:
              MEMGRAPH_HOST: memgraph.vpn.homebase.internal
              MEMGRAPH_PORT: "7687"
              MEMGRAPH_BOLT_URI: bolt://memgraph.vpn.homebase.internal:7687
              QDRANT_URL: https://qdrant.vpn.homebase.internal
              QDRANT_COLLECTION: openclaw-memory
              QDRANT_API_KEY: ${QDRANT_API_KEY}


nextcloud:
  enabled: true
  ingress:
    private:
      enabled: true
      className: nginx
      host: cloud.homebase.internal
    public:
      enabled: true
      className: nginx
  persistence:
    enabled: true
    size: 1Ti
    storageClass: local-path
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "4"
      memory: 8Gi
  cron:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  trustedProxies:
    - 10.42.0.0/16

nextcloudMcp:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: nextcloud-mcp.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-mcp-tls
        hosts:
          - nextcloud-mcp.vpn.homebase.internal
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

qdrant:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: qdrant.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: qdrant-tls
        hosts:
          - qdrant.vpn.homebase.internal
  persistence:
    enabled: true
    size: 150Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 750m
      memory: 2Gi
    limits:
      cpu: "3"
      memory: 6Gi

qdrantMcp:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: qdrant-mcp.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: qdrant-mcp-tls
        hosts:
          - qdrant-mcp.vpn.homebase.internal
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

memgraph:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: memgraph.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: memgraph-tls
        hosts:
          - memgraph.vpn.homebase.internal
  persistence:
    enabled: true
    size: 200Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 750m
      memory: 2Gi
    limits:
      cpu: "3"
      memory: 6Gi

memgraphLab:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: memgraph-lab.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: memgraph-lab-tls
        hosts:
          - memgraph-lab.vpn.homebase.internal
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

argoCd:
  enabled: false
  argocd:
    server:
      ingress:
        enabled: true
        ingressClassName: nginx
        hostname: argocd.vpn.homebase.internal
        tls: false

gitea:
  enabled: true
  gitea:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
    persistence:
      enabled: true
      size: 150Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 750m
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 3Gi
    initContainers:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    admin:
      username: git-admin
      existingSecret: ""

registry:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: registry.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: registry-tls
        hosts:
          - registry.vpn.homebase.internal
  persistence:
    enabled: true
    size: 100Gi
    storageClass: local-path

vaultwarden:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: vaultwarden.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: vaultwarden-tls
        hosts:
          - vaultwarden.vpn.homebase.internal
  persistence:
    enabled: true
    size: 20Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

postfixRelay:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

paperlessNgx:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: paperless.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
  persistence:
    data:
      enabled: true
      size: 50Gi
      storageClass: local-path
    media:
      enabled: true
      size: 300Gi
      storageClass: local-path
    consume:
      enabled: true
      size: 20Gi
      storageClass: local-path
    export:
      enabled: true
      size: 20Gi
      storageClass: local-path
  resources:
    requests:
      cpu: 750m
      memory: 1536Mi
    limits:
      cpu: "3"
      memory: 6Gi


sharedPostgresql:
  enabled: true
  resources:
    requests:
      cpu: 1500m
      memory: 3Gi
    limits:
      cpu: "4"
      memory: 8Gi
  primary:
    persistence:
      enabled: true
      size: 150Gi
      storageClass: local-path

sharedRedis:
  enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  master:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: local-path
