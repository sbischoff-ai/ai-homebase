global:
  imagePullSecrets: []
  storageClass: ""
  domain: homebase.local
  mail:
    domain: example.com
    smtpHost: smtp.example.com
    fromLocalpart: noreply
    fromName: ai-homebase
    fromAddress: noreply@example.com
  hosts:
    openclaw: openclaw.homebase.local
    nextcloud: cloud.homebase.local
    nextcloudMcp: nextcloud-mcp.homebase.local
    gitea: gitea.vpn.homebase.internal
    argocd: argocd.vpn.homebase.internal
    vaultwarden: vaultwarden.homebase.local
    paperlessNgx: paperless.homebase.local
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

cert-manager:
  crds:
    enabled: true
    keep: true

certManager:
  enabled: true
  resourcesEnabled: false
  resourceNamespace: ""
  internalCA:
    enabled: true
    selfSignedClusterIssuerName: platform-stack-selfsigned-bootstrap
    caClusterIssuerName: platform-stack-root-ca
    rootCertificate:
      name: platform-stack-root-ca
      secretName: platform-stack-root-ca
      commonName: platform-stack.homebase.local
      duration: 87600h # 10 years
      renewBefore: 720h # 30 days
      privateKey:
        algorithm: ECDSA
        size: 256
        rotationPolicy: Always
      subject:
        organizations:
          - ai-homebase
  openclawCertificate:
    enabled: true
    name: openclaw-ingress
    duration: 2160h # 90 days
    renewBefore: 360h # 15 days
    issuerRef:
      kind: ClusterIssuer
      group: cert-manager.io
      name: ""

openclaw:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: ""
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: openclaw.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.homebase.local
  service:
    type: ClusterIP
    port: 18789
    targetPort: 18789
    annotations: {}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  autoscaling:
    enabled: false
  remoteDocker:
    enabled: true
    dockerHost: "ssh://docker-remote@openclaw-sandbox:2222"
    home: /home/node
    cli:
      enabled: true
      image:
        repository: docker
        tag: "28.0.4-cli"
        pullPolicy: IfNotPresent
      installPath: /opt/openclaw-tools/bin
    ssh:
      secretName: openclaw-remote-docker-ssh
      mountPath: /home/node/.ssh
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.homebase.local
      trustedProxies: []
    agents:
      defaults:
        workspace: /home/node/.openclaw/workspace
        sandbox:
          backend: docker
          mode: non-main
          scope: agent
          docker:
            image: openclaw-sandbox:bookworm-slim
            workdir: /workspace
            readOnlyRoot: true
            tmpfs:
              - /tmp
              - /var/tmp
              - /run
            user: 1000:1000
            capDrop:
              - ALL
            pidsLimit: 256
            memory: 1g
            memorySwap: 2g
            cpus: 1
            network: bridge
        browser:
          enabled: true
          image: openclaw-sandbox-browser:bookworm-slim
          network: bridge
          cdpPort: 9222
          vncPort: 5900
          noVncPort: 6080
          headless: false
          enableNoVnc: true
          cdpSourceRange: ""
    commands:
      mcp: true
    mcp:
      servers:
        nextcloud:
          command: node
          args:
            - /home/node/.openclaw/workspace/mcp-http-bridge.mjs
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL}
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL}
            - --header
            - Authorization=${OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER}
    plugins:
      entries: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  existingSecret: "openclaw-app-secrets"
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: ""
    anthropicApiKey: ""
    braveApiKey: ""
    kimiApiKey: ""
    moonshotApiKey: ""
    tavilyApiKey: ""
    perplexityApiKey: ""
    geminiApiKey: ""
    xaiApiKey: ""
    googleApiKey: ""
    braveSearchApiKey: ""
  secretRefs:
    - name: openclaw-nextcloud-mcp-secrets
      key: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
      envVar: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER

argoCd:
  enabled: false
  argocd:
    configs:
      params:
        server.insecure: true
    server:
      ingress:
        enabled: true
        ingressClassName: internal-nginx
        hostname: argocd.vpn.homebase.internal
        annotations: {}
        tls: false

nextcloud:
  enabled: true
  image:
    repository: nextcloud
    tag: "33.0.0-apache"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    path: /
    pathType: Prefix
    private:
      enabled: true
      className: internal-nginx
      annotations:
        cert-manager.io/cluster-issuer: platform-stack-root-ca
      host: cloud.homebase.local
      tls:
        secretName: nextcloud-private-tls
    public:
      enabled: false
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      host: ""
      tls:
        secretName: nextcloud-public-tls
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 250Gi
    storageClass: ""
    annotations: {}
  resources: {}
  bootstrapWait:
    image:
      repository: docker.io/postgres
      tag: "17.5-alpine"
      pullPolicy: IfNotPresent
  probes:
    liveness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 10
      periodSeconds: 10
  backup:
    annotations: {}
  existingSecret: ""
  secretRefs: []
  admin:
    user: nextcloud-admin
    passwordSecret:
      name: nextcloud-config-secrets
      key: NEXTCLOUD_ADMIN_PASSWORD
  trustedDomains:
    - cloud.homebase.local
    - platform-stack-nextcloud
    - platform-stack-nextcloud.ai-homebase.svc
    - platform-stack-nextcloud.ai-homebase.svc.cluster.local
  trustedProxies: []
  bootstrapUsers:
    - username: openclaw-mcp
      displayName: OpenClaw MCP
      passwordSecret:
        name: openclaw-nextcloud-mcp-secrets
        key: NEXTCLOUD_PASSWORD
  bootstrapApps:
    - notes
    - tables
    - calendar
    - tasks
  externalDatabase:
    host: platform-stack-shared-postgresql
    port: 5432
    database: nextcloud
    user: nextcloud
    passwordSecret:
      name: nextcloud-config-secrets
      key: POSTGRES_PASSWORD
  externalRedis:
    host: platform-stack-shared-redis
    port: 6379
    passwordSecret:
      name: nextcloud-config-secrets
      key: REDIS_HOST_PASSWORD
  smtp:
    host: platform-stack-postfix-relay
    port: 587
    user: ""
    secure: ""
    authType: ""
    fromAddress: noreply
    domain: example.com
    passwordSecret:
      name: ""
      key: ""

nextcloudMcp:
  enabled: true
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: true
    className: internal-nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: nextcloud-mcp.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-mcp-tls
        hosts:
          - nextcloud-mcp.homebase.local
  nextcloud:
    url: http://platform-stack-nextcloud
  authentication:
    mode: multi_user_basic
  args:
    - --enable-app
    - notes
    - --enable-app
    - webdav
    - --enable-app
    - tables
    - --enable-app
    - calendar

gitea:
  enabled: false
  gitea:
    enabled: true
    image:
      repository: gitea
      tag: "1.25.5"
      rootless: true
      pullPolicy: IfNotPresent
    service:
      http:
        type: ClusterIP
        port: 3000
    ingress:
      enabled: true
      className: internal-nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "32m"
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
      tls: []
    persistence:
      enabled: true
      size: 120Gi
      storageClass: ""
    preExtraInitContainers:
      - name: wait-for-shared-postgresql-bootstrap
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -ceu
          - |
            until PGPASSWORD="$GITEA__database__PASSWD" psql \
              --host platform-stack-shared-postgresql \
              --port 5432 \
              --username gitea \
              --dbname gitea \
              -tAc "SELECT current_database(), current_user;" | grep -qx 'gitea|gitea'; do
              echo "waiting for live PostgreSQL bootstrap of gitea"
              sleep 2
            done
        env:
          - name: GITEA__database__PASSWD
            valueFrom:
              secretKeyRef:
                name: gitea-config-secrets
                key: GITEA__database__PASSWD
    gitea:
      admin:
        username: git-admin
        existingSecret: ""
      # First phase intentionally limits Gitea to Git/PR/wiki usage.
      # Keep actions/runners unset here; upstream moved them to a dedicated chart.
      config:
        database:
          DB_TYPE: postgres
          HOST: platform-stack-shared-postgresql:5432
          NAME: gitea
          USER: gitea
        session:
          PROVIDER: redis
        cache:
          ENABLED: true
          ADAPTER: redis
        queue:
          TYPE: redis
        global_lock:
          SERVICE_TYPE: redis
        service:
          DISABLE_REGISTRATION: true
      additionalConfigFromEnvs:
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__database__PASSWD
        - name: GITEA__session__PROVIDER_CONFIG
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__session__PROVIDER_CONFIG
        - name: GITEA__cache__HOST
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__cache__HOST
        - name: GITEA__queue__CONN_STR
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__queue__CONN_STR
        - name: GITEA__global_lock__SERVICE_CONN_STR
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__global_lock__SERVICE_CONN_STR
      additionalConfigSources: []
    postgresql:
      enabled: false
      primary:
        persistence:
          enabled: true
          size: 20Gi
          storageClass: ""
    postgresql-ha:
      enabled: false
    valkey:
      enabled: false
    valkey-cluster:
      enabled: false

vaultwarden:
  enabled: false
  image:
    repository: ghcr.io/dani-garcia/vaultwarden
    tag: "1.35.4"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    enabled: true
    className: ""
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: vaultwarden.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: vaultwarden-tls
        hosts:
          - vaultwarden.homebase.local
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    storageClass: ""
    annotations: {}
  resources: {}
  existingSecret: ""
  secretRefs: []
  databaseUrlSecret:
    name: vaultwarden-config-secrets
    key: DATABASE_URL
  bootstrapWait:
    image:
      repository: docker.io/postgres
      tag: "17.5-alpine"
      pullPolicy: IfNotPresent
  appConfig:
    domain: ""
    signupsAllowed: false
    invitationsAllowed: true
    websocketEnabled: true
  smtp:
    host: platform-stack-postfix-relay
    port: 587
    from: noreply@example.com
    fromName: ai-homebase
    security: "off"
    username: ""
    passwordSecret:
      name: ""
      key: ""

postfixRelay:
  enabled: false
  image:
    repository: boky/postfix
    tag: "v4.4.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 587
    targetPort: 587
    annotations: {}
  replicaCount: 1
  podAnnotations: {}
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: true
    readOnlyRootFilesystem: false
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
  config:
    allowedSenderDomains: ""
    hostname: ""
    mynetworks:
      - 127.0.0.0/8
      - 10.42.0.0/16
      - 10.43.0.0/16
    inboundDebugging: false
    logFormat: plain
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Compatibility bridge for paperless-ngx subchart-local gating:
# keep this true so umbrella toggle paperlessNgx.enabled remains the single operator switch.
paperless-ngx:
  enabled: true

paperlessNgx:
  enabled: false
  image:
    repository: paperlessngx/paperless-ngx
    tag: "2.20"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: paperless.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    data:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 30Gi
      storageClass: ""
      annotations: {}
    media:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 250Gi
      storageClass: ""
      annotations: {}
    consume:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 20Gi
      storageClass: ""
      annotations: {}
    export:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 20Gi
      storageClass: ""
      annotations: {}
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/health/
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /api/health/
      initialDelaySeconds: 10
      periodSeconds: 10
  bootstrapWait:
    image:
      repository: docker.io/postgres
      tag: "17.5-alpine"
      pullPolicy: IfNotPresent
  secretKeySecret:
    name: paperless-config-secrets
    key: PAPERLESS_SECRET_KEY
  admin:
    user: paperless-admin
    mail: ""
    passwordSecret:
      name: paperless-config-secrets
      key: PAPERLESS_ADMIN_PASSWORD
  existingSecret: ""
  secretRefs: []
  externalDatabase:
    host: platform-stack-shared-postgresql
    port: 5432
    name: paperless
    user: paperless
    passwordSecret:
      name: paperless-config-secrets
      key: PAPERLESS_DB_PASSWORD
  redis:
    passwordSecret:
      name: ""
      key: ""
    url: ""
    urlSecret:
      name: paperless-config-secrets
      key: PAPERLESS_REDIS
    prefix: paperless
  appConfig:
    url: ""
    allowedHosts: ""
    csrfTrustedOrigins: ""
    corsAllowedHosts: ""
    timeZone: Europe/Berlin
    ocrLanguage: deu+eng


sharedPostgresql:
  enabled: true
  fullnameOverride: platform-stack-shared-postgresql
  image:
    registry: docker.io
    repository: postgres
    tag: "17.5"
  bootstrap:
    image:
      registry: docker.io
      repository: postgres
      tag: "17.5-alpine"
      pullPolicy: IfNotPresent
  auth:
    existingSecret: shared-postgresql-auth
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: ""
    initdb:
      scriptsSecret: shared-postgresql-initdb

sharedRedis:
  enabled: true
  fullnameOverride: platform-stack-shared-redis
  image:
    registry: docker.io
    repository: redis
    tag: "8.0.3"
  architecture: standalone
  auth:
    enabled: true
    existingSecret: shared-redis-auth
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: ""
