global:
  imagePullSecrets: []
  storageClass: ""
  domain: homebase.local
  mail:
    domain: example.com
    smtpHost: smtp.example.com
    fromLocalpart: noreply
    fromName: ai-homebase
    fromAddress: noreply@example.com
  hosts:
    openclaw: openclaw.homebase.local
    nextcloud: cloud.homebase.local
    nextcloudMcp: nextcloud-mcp.homebase.local
    qdrant: qdrant.homebase.local
    qdrantMcp: qdrant-mcp.homebase.local
    memgraph: memgraph.homebase.local
    memgraphLab: memgraph-lab.homebase.local
    gitea: gitea.vpn.homebase.internal
    registry: registry.homebase.local
    argocd: argocd.vpn.homebase.internal
    vaultwarden: vaultwarden.homebase.local
    paperlessNgx: paperless.homebase.local
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

cert-manager:
  crds:
    enabled: true
    keep: true

certManager:
  enabled: true
  resourcesEnabled: false
  resourceNamespace: ""
  internalCA:
    enabled: true
    selfSignedClusterIssuerName: platform-stack-selfsigned-bootstrap
    caClusterIssuerName: platform-stack-root-ca
    rootCertificate:
      name: platform-stack-root-ca
      secretName: platform-stack-root-ca
      commonName: platform-stack.homebase.local
      duration: 87600h # 10 years
      renewBefore: 720h # 30 days
      privateKey:
        algorithm: ECDSA
        size: 256
        rotationPolicy: Always
      subject:
        organizations:
          - ai-homebase
  openclawCertificate:
    enabled: true
    name: openclaw-ingress
    duration: 2160h # 90 days
    renewBefore: 360h # 15 days
    issuerRef:
      kind: ClusterIssuer
      group: cert-manager.io
      name: ""

openclaw:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: ""
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: openclaw.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.homebase.local
  service:
    type: ClusterIP
    port: 18789
    targetPort: 18789
    annotations: {}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  autoscaling:
    enabled: false
  env:
    - name: XDG_CONFIG_HOME
      value: /home/node/.openclaw/.config
    - name: XDG_CACHE_HOME
      value: /home/node/.openclaw/.cache
    - name: XDG_STATE_HOME
      value: /home/node/.openclaw/.local/state
    - name: GIT_CONFIG_GLOBAL
      value: /home/node/.openclaw/.config/git/config
    - name: SSL_CERT_FILE
      value: /home/node/.openclaw/certs/ai-homebase-ca-bundle.crt
    - name: REQUESTS_CA_BUNDLE
      value: /home/node/.openclaw/certs/ai-homebase-ca-bundle.crt
    - name: NODE_EXTRA_CA_CERTS
      value: /home/node/.openclaw/certs/ai-homebase-ca-bundle.crt
    - name: GIT_SSL_CAINFO
      value: /home/node/.openclaw/certs/ai-homebase-ca-bundle.crt
    - name: CURL_CA_BUNDLE
      value: /home/node/.openclaw/certs/ai-homebase-ca-bundle.crt
    - name: MEMGRAPH_HOST
      value: '{{ printf "%s-memgraph" .Release.Name | trunc 63 | trimSuffix "-" }}'
    - name: MEMGRAPH_PORT
      value: "7687"
    - name: MEMGRAPH_BOLT_URI
      value: 'bolt://{{ printf "%s-memgraph" .Release.Name | trunc 63 | trimSuffix "-" }}:7687'
    - name: CODER_GITEA_BASE_URL
      value: https://gitea.homebase.local
    - name: CODER_GITEA_BOOTSTRAP_URL
      value: 'http://{{ printf "%s-gitea-http.%s.svc.cluster.local:3000" .Release.Name .Release.Namespace }}'
    - name: CODER_GITEA_TEA_URL
      value: 'http://{{ printf "%s-gitea-http.%s.svc.cluster.local:3000" .Release.Name .Release.Namespace }}'
    - name: CODER_GITEA_HOST
      value: gitea.homebase.local
    - name: CODER_GITEA_USERNAME
      value: coder
    - name: CODER_GITEA_EMAIL
      value: coder@example.invalid
    - name: CODER_GITEA_TEA_LOGIN_NAME
      value: coder
    - name: CODER_GITEA_TEA_TOKEN_NAME
      value: openclaw-coder-sandbox
    - name: CODER_REGISTRY_HOST
      value: registry.homebase.local
    - name: CODER_REGISTRY_USERNAME
      value: coder
    - name: CODER_REGISTRY_BASE_URL
      value: https://registry.homebase.local
    - name: REVIEWER_GITEA_BASE_URL
      value: 'http://{{ printf "%s-gitea-http.%s.svc.cluster.local:3000" .Release.Name .Release.Namespace }}'
    - name: REVIEWER_GITEA_BOOTSTRAP_URL
      value: 'http://{{ printf "%s-gitea-http.%s.svc.cluster.local:3000" .Release.Name .Release.Namespace }}'
    - name: REVIEWER_GITEA_TEA_URL
      value: 'http://{{ printf "%s-gitea-http.%s.svc.cluster.local:3000" .Release.Name .Release.Namespace }}'
    - name: REVIEWER_GITEA_HOST
      value: '{{ printf "%s-gitea-http.%s.svc.cluster.local" .Release.Name .Release.Namespace }}'
    - name: REVIEWER_GITEA_USERNAME
      value: reviewer
    - name: REVIEWER_GITEA_EMAIL
      value: reviewer@example.invalid
    - name: REVIEWER_GITEA_TEA_LOGIN_NAME
      value: reviewer
    - name: REVIEWER_GITEA_TEA_TOKEN_NAME
      value: openclaw-reviewer
  remoteDocker:
    enabled: true
    dockerHost: "ssh://docker-remote@openclaw-sandbox:2222"
    home: /home/node
    cli:
      enabled: true
      image:
        repository: docker
        tag: "28.0.4-cli"
        pullPolicy: IfNotPresent
      installPath: /opt/openclaw-tools/bin
    ssh:
      secretName: openclaw-remote-docker-ssh
      mountPath: /home/node/.ssh
  qdrant:
    url: ""
    collectionName: openclaw-memory
    apiKeySecret:
      name: ""
      key: QDRANT_API_KEY
  workspaceBootstrap:
    enabled: true
    giteaAdminUsername: git-admin
    agents:
      main:
        workspace: /home/node/.openclaw/workspace
        filesDir: workspaces/main
      coder:
        workspace: /home/node/.openclaw/workspace-coder
        filesDir: workspaces/coder
      architect:
        workspace: /home/node/.openclaw/workspace-architect
        filesDir: workspaces/architect
      archivist:
        workspace: /home/node/.openclaw/workspace-archivist
        filesDir: workspaces/archivist
      watchdog:
        workspace: /home/node/.openclaw/workspace-watchdog
        filesDir: workspaces/watchdog
      auditor:
        workspace: /home/node/.openclaw/workspace-auditor
        filesDir: workspaces/auditor
      worker-template:
        workspace: /home/node/.openclaw/worker-template
        filesDir: workspaces/worker-template
  openclaw:
    cron:
      enabled: true
      store: ~/.openclaw/cron/jobs.json
      maxConcurrentRuns: 1
      sessionRetention: 24h
      runLog:
        maxBytes: 2mb
        keepLines: 2000
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.homebase.local
      trustedProxies: []
    agents:
      defaults:
        workspace: /home/node/.openclaw/workspace
        heartbeat:
          every: 0m
        models:
          openai/gpt-5.4:
            alias: Main / Coder / Architect / Archivist / Auditor
          anthropic/claude-sonnet-4-6:
            alias: Main / Architect
          openai/gpt-5.4-nano:
            alias: Watchdog
          anthropic/claude-opus-4-6:
            alias: Auditor
        sandbox:
          backend: docker
          mode: non-main
          scope: agent
          workspaceAccess: rw
          sessionToolsVisibility: "all"
          docker:
            image: registry.homebase.local/coder/openclaw-sandbox:trixie-slim
            workdir: /workspace
            readOnlyRoot: true
            tmpfs:
              - /tmp
              - /var/tmp
              - /run
            env:
              HOME: /workspace/.home
              XDG_CONFIG_HOME: /workspace/.home/.config
              XDG_CACHE_HOME: /workspace/.home/.cache
              XDG_STATE_HOME: /workspace/.home/.local/state
              SSL_CERT_FILE: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
              REQUESTS_CA_BUNDLE: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
              NODE_EXTRA_CA_CERTS: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
              GIT_SSL_CAINFO: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
              CURL_CA_BUNDLE: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
              MEMGRAPH_HOST: memgraph.homebase.local
              MEMGRAPH_PORT: "7687"
              MEMGRAPH_BOLT_URI: bolt://memgraph.homebase.local:7687
              QDRANT_URL: https://qdrant.homebase.local
              QDRANT_COLLECTION: openclaw-memory
              QDRANT_API_KEY: ${QDRANT_API_KEY}
              GITHUB_TOKEN: ${GITHUB_TOKEN}
              OPENAI_API_KEY: ${OPENAI_API_KEY}
              ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
              GEMINI_API_KEY: ${GEMINI_API_KEY}
            user: 1000:1000
            capDrop:
              - ALL
            pidsLimit: 256
            memory: 1g
            memorySwap: 2g
            cpus: 1
            network: bridge
          browser:
            enabled: true
            image: openclaw-sandbox-browser:bookworm-slim
            network: bridge
            cdpPort: 9222
            vncPort: 5900
            noVncPort: 6080
            headless: false
            enableNoVnc: true
            cdpSourceRange: ""
      list:
        - id: main
          default: true
          name: OpenClaw Assistant
          workspace: /home/node/.openclaw/workspace
          heartbeat:
            every: 0m
            includeSystemPromptSection: false
          model:
            primary: openai/gpt-5.4
            fallbacks:
              - anthropic/claude-sonnet-4-6
          skills:
            - handoff-specialist-work
            - manage-worker-lifecycle
            - bind-channels
            - coordinate-in-nextcloud
            - record-memory-and-coordination-status
            - track-budget
            - healthcheck
            - node-connect
            - skill-creator
            - session-logs
            - weather
            - summarize
          subagents:
            allowAgents:
              - coder
              - architect
              - archivist
              - auditor
        - id: coder
          name: Coder
          workspace: /home/node/.openclaw/workspace-coder
          model:
            primary: anthropic/claude-sonnet-4-6
            fallbacks:
              - openai/gpt-5.4
          skills:
            - manage-gitea-gitops-and-registry
            - run-codex-and-log-usage
            - update-implementation-notes
            - github
            - tmux
          sandbox:
            mode: all
            workspaceAccess: rw
            docker:
              image: registry.homebase.local/coder/openclaw-sandbox-coder:trixie-slim
              tmpfs:
                - /tmp
                - /var/tmp
                - /run
              env:
                HOME: /workspace/.home
                CODEX_HOME: /workspace/.home/.codex
                XDG_CONFIG_HOME: /workspace/.home/.config
                XDG_CACHE_HOME: /workspace/.home/.cache
                XDG_STATE_HOME: /workspace/.home/.local/state
                SSL_CERT_FILE: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                REQUESTS_CA_BUNDLE: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                NODE_EXTRA_CA_CERTS: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                GIT_SSL_CAINFO: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                CURL_CA_BUNDLE: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                CODER_GITEA_BASE_URL: https://gitea.homebase.local
                CODER_GITEA_TEA_URL: https://gitea.homebase.local
                CODER_GITEA_HOST: gitea.homebase.local
                CODER_GITEA_USERNAME: coder
                CODER_GITEA_EMAIL: coder@example.invalid
                CODER_GITEA_PASSWORD: ${CODER_GITEA_PASSWORD}
                CODER_GITEA_TOKEN: ${CODER_GITEA_TOKEN}
                CODER_GITOPS_REPO_NAME: cluster-gitops
                CODER_SANDBOX_IMAGES_REPO_NAME: openclaw-sandbox-images
                CODER_GITOPS_REPO_BRANCH: main
                CODER_GITOPS_PROJECT: platform-stack
                CODER_GITEA_TEA_LOGIN_NAME: coder
                CODER_GITEA_TEA_TOKEN_NAME: openclaw-coder-sandbox
                CODER_REGISTRY_HOST: registry.homebase.local
                CODER_REGISTRY_BASE_URL: https://registry.homebase.local
                CODER_REGISTRY_USERNAME: coder
                CODER_REGISTRY_PASSWORD: ${CODER_REGISTRY_PASSWORD}
                CODER_REGISTRY_NAMESPACE: coder
                CODEX_DEFAULT_MODEL: gpt-5.4-mini
                CODEX_MODEL: openai/gpt-5.3-codex
                DOCKER_HOST: ${DOCKER_HOST}
                OPENAI_API_KEY: ${OPENAI_API_KEY}
                GITHUB_TOKEN: ${GITHUB_TOKEN}
              setupCommand: /usr/local/bin/coder-init.sh
        - id: architect
          name: Architect
          workspace: /home/node/.openclaw/workspace-architect
          model:
            primary: anthropic/claude-sonnet-4-6
            fallbacks:
              - openai/gpt-5.4
          sandbox:
            mode: non-main
            workspaceAccess: rw
            docker:
              image: registry.homebase.local/coder/openclaw-sandbox:trixie-slim
              workdir: /workspace
              readOnlyRoot: true
              tmpfs:
                - /tmp
                - /var/tmp
                - /run
              env:
                HOME: /workspace/.home
                XDG_CONFIG_HOME: /workspace/.home/.config
                XDG_CACHE_HOME: /workspace/.home/.cache
                XDG_STATE_HOME: /workspace/.home/.local/state
                SSL_CERT_FILE: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                REQUESTS_CA_BUNDLE: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                NODE_EXTRA_CA_CERTS: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                GIT_SSL_CAINFO: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                CURL_CA_BUNDLE: /workspace/.openclaw-runtime/ai-homebase-ca-bundle.crt
                MEMGRAPH_HOST: memgraph.homebase.local
                MEMGRAPH_PORT: "7687"
                MEMGRAPH_BOLT_URI: bolt://memgraph.homebase.local:7687
                QDRANT_URL: https://qdrant.homebase.local
                QDRANT_COLLECTION: openclaw-memory
                QDRANT_API_KEY: ${QDRANT_API_KEY}
                GITHUB_TOKEN: ${GITHUB_TOKEN}
                OPENAI_API_KEY: ${OPENAI_API_KEY}
                ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
                GEMINI_API_KEY: ${GEMINI_API_KEY}
                REVIEWER_GITEA_BASE_URL: https://gitea.homebase.local
                REVIEWER_GITEA_TEA_URL: https://gitea.homebase.local
                REVIEWER_GITEA_HOST: gitea.homebase.local
                REVIEWER_GITEA_USERNAME: reviewer
                REVIEWER_GITEA_EMAIL: reviewer@example.invalid
                REVIEWER_GITEA_PASSWORD: ${REVIEWER_GITEA_PASSWORD}
                REVIEWER_GITEA_TOKEN: ${REVIEWER_GITEA_TOKEN}
                REVIEWER_GITEA_TEA_LOGIN_NAME: reviewer
                REVIEWER_GITEA_TEA_TOKEN_NAME: openclaw-reviewer
              user: 1000:1000
              capDrop:
                - ALL
              pidsLimit: 256
              memory: 1g
              memorySwap: 2g
              cpus: 1
              network: bridge
              setupCommand: /usr/local/bin/reviewer-gitea-init.sh
          skills:
            - plan-projects
            - package-worker-definitions
            - deliver-design
            - gitea-browse
            - skill-creator
            - session-logs
            - summarize
            - github
          tools:
            deny:
              - tts
              - image_generate
              - canvas
        - id: archivist
          name: Archivist
          workspace: /home/node/.openclaw/workspace-archivist
          model:
            primary: openai/gpt-5.4-mini
            fallbacks:
              - anthropic/claude-sonnet-4-6
          skills:
            - curate-memgraph
            - groom-knowledge-graph
            - map-context-and-link-evidence
            - use-nextcloud-docs-for-graph-work
            - session-logs
            - summarize
          sandbox:
            mode: non-main
          tools:
            deny:
              - tts
              - image_generate
              - canvas
              - browser
        - id: watchdog
          name: Watchdog
          workspace: /home/node/.openclaw/workspace-watchdog
          heartbeat:
            every: 30m
          model:
            primary: openai/gpt-5.4-nano
            fallbacks:
              - anthropic/claude-haiku-4-5
          skills:
            - classify-severity-and-escalate
            - manage-nextcloud-incidents
            - check-heartbeat-and-budget
            - healthcheck
            - node-connect
            - session-logs
          sandbox:
            mode: "off"
          tools:
            deny:
              - image_generate
              - canvas
              - tts
              - image
              - browser
              - sessions_spawn
              - agents_list
              - subagents
        - id: auditor
          name: Auditor
          workspace: /home/node/.openclaw/workspace-auditor
          model:
            primary: anthropic/claude-opus-4-6
            fallbacks:
              - openai/gpt-5.4
          skills:
            - classify-review-mode
            - manage-review-packets
            - format-verdict
            - gitea-browse
            - session-logs
            - summarize
            - github
          sandbox:
            mode: "off"
          tools:
            deny:
              - tts
              - image_generate
              - canvas
    tools:
      sessions:
        visibility: all
      agentToAgent:
        enabled: true
        allow:
          - main
          - coder
          - architect
          - archivist
          - watchdog
          - auditor
    skills:
      allowBundled:
        - weather
        - healthcheck
        - node-connect
        - skill-creator
        - session-logs
        - tmux
        - summarize
        - github
    plugins:
      slots:
        memory: none
    commands:
      mcp: true
    mcp:
      servers:
        nextcloud:
          command: node
          args:
            - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL}
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL}
            - --header
            - Authorization=${OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER}
        qdrant:
          command: node
          args:
            - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
            - --url
            - ${OPENCLAW_QDRANT_MCP_INTERNAL_URL}
            - --url
            - ${OPENCLAW_QDRANT_MCP_EXTERNAL_URL}
    plugins:
      entries: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  existingSecret: "openclaw-secrets"
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ANTHROPIC_API_KEY
    braveApiKey: BRAVE_API_KEY
    moonshotApiKey: MOONSHOT_API_KEY
    perplexityApiKey: PERPLEXITY_API_KEY
    geminiApiKey: GEMINI_API_KEY
    xaiApiKey: XAI_API_KEY
    githubToken: GITHUB_TOKEN
  secretRefs:
    - name: openclaw-nextcloud-mcp-secrets
      key: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
      envVar: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
    - name: coder-credentials
      key: CODER_GITEA_PASSWORD
      envVar: CODER_GITEA_PASSWORD
    - name: coder-credentials
      key: CODER_GITEA_TOKEN
      envVar: CODER_GITEA_TOKEN
    - name: coder-credentials
      key: CODER_REGISTRY_PASSWORD
      envVar: CODER_REGISTRY_PASSWORD
    - name: reviewer-credentials
      key: REVIEWER_GITEA_PASSWORD
      envVar: REVIEWER_GITEA_PASSWORD
    - name: reviewer-credentials
      key: REVIEWER_GITEA_TOKEN
      envVar: REVIEWER_GITEA_TOKEN

argoCd:
  enabled: false
  argocd:
    configs:
      params:
        server.insecure: true
    server:
      ingress:
        enabled: true
        ingressClassName: internal-nginx
        hostname: argocd.vpn.homebase.internal
        annotations: {}
        tls: false

nextcloud:
  enabled: true
  image:
    repository: nextcloud
    tag: "33.0.2-apache"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    path: /
    pathType: Prefix
    private:
      enabled: true
      className: internal-nginx
      annotations:
        cert-manager.io/cluster-issuer: platform-stack-root-ca
      host: cloud.homebase.local
      tls:
        secretName: nextcloud-private-tls
    public:
      enabled: false
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      host: ""
      tls:
        secretName: nextcloud-public-tls
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 250Gi
    storageClass: ""
    annotations: {}
  resources: {}
  bootstrapWait:
    image:
      repository: docker.io/postgres
      tag: "17.5-alpine"
      pullPolicy: IfNotPresent
  probes:
    liveness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  backup:
    annotations: {}
  existingSecret: ""
  secretRefs: []
  admin:
    user: nextcloud-admin
    passwordSecret:
      name: nextcloud-config-secrets
      key: NEXTCLOUD_ADMIN_PASSWORD
  trustedDomains:
    - cloud.homebase.local
    - platform-stack-nextcloud
    - platform-stack-nextcloud.ai-homebase.svc
    - platform-stack-nextcloud.ai-homebase.svc.cluster.local
  trustedProxies: []
  bootstrapUsers:
    - username: openclaw
      displayName: OpenClaw
      passwordSecret:
        name: openclaw-nextcloud-mcp-secrets
        key: NEXTCLOUD_PASSWORD
  bootstrapApps:
    - notes
    - tables
    - calendar
    - tasks
  skeletonDirectory: ""
  bootstrapProjectContent:
    - slug: ai-homebase
      ownerUsername: openclaw
      projectsFilesDir: bootstrap-content/ai-homebase/projects
      projectsFiles:
        - path: overview.md
        - path: multi-agent-topology.md
        - path: gitops-workflow.md
        - path: cluster-architecture.md
        - path: project-documentation-model.md
        - path: worker-design-guide.md
        - path: qdrant-memory-schema.md
        - path: knowledge-graph-schema.md
        - path: budget-policy.md
        - path: decisions.md
        - path: automation-backlog.md
        - path: archivist-grooming-log.md
        - path: watchdog-status-log.md
        - path: incidents/README.md
        - path: audit-reports/README.md
        - path: coordination-status.json
        - path: codex-usage/.gitkeep
        - path: audit-log.md
