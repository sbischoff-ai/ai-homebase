global:
  imagePullSecrets: []
  storageClass: ""
  domain: homebase.local
  hosts:
    openclaw: openclaw.homebase.local
    openhands: openhands.homebase.local
    nextcloud: nextcloud.homebase.local
    gitea: gitea.homebase.local
    paperless: paperless.homebase.local
    paperlessNgx: paperless.homebase.local
    infisical: infisical.homebase.local
    wg: wg.homebase.local
    vpn: wg.homebase.local
    wgEasy: wg.homebase.local
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

openclaw:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/example/openclaw
    tag: ""
    pullPolicy: IfNotPresent
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: openclaw.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    annotations: {}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  autoscaling:
    enabled: false
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - http://openclaw.homebase.local
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  existingSecret: "openclaw-app-secrets"
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ANTHROPIC_API_KEY
    googleApiKey: GOOGLE_API_KEY
    tavilyApiKey: TAVILY_API_KEY
    braveSearchApiKey: BRAVE_SEARCH_API_KEY
  secretRefs: []

openhands:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/example/openhands
    tag: ""
    pullPolicy: IfNotPresent
  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 3000
    annotations: {}
  # OpenHands UI/API should be exposed when the service is enabled.
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: openhands.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  workspace:
    enabled: false
    size: 20Gi
    storageClass: ""
  queue:
    enabled: false
    provider: ""
    endpoint: ""
    queueName: ""
    dlqName: ""
    workerConcurrency: 4
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  # Scheduling controls consumed by the OpenHands subchart.
  # If both workerIsolation.* and openhands.* are set, openhands.* wins.
  runtimeClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

nextcloud:
  enabled: false
  image:
    repository: nextcloud
    tag: "29.0.0-apache"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: nextcloud.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 250Gi
    storageClass: ""
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 10
      periodSeconds: 10
  backup:
    annotations: {}
  existingSecret: ""
  secretRefs: []

gitea:
  enabled: false
  image:
    repository: gitea/gitea
    tag: "1.22.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: gitea.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 120Gi
    storageClass: ""
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/healthz
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /api/healthz
      initialDelaySeconds: 10
      periodSeconds: 10
  backup:
    annotations: {}
  existingSecret: ""
  secretRefs: []

paperlessNgx:
  enabled: false
  image:
    repository: ghcr.io/paperless-ngx/paperless-ngx
    tag: "2.11.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: paperless.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    data:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 30Gi
      storageClass: ""
      annotations: {}
    media:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 250Gi
      storageClass: ""
      annotations: {}
    consume:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 20Gi
      storageClass: ""
      annotations: {}
    export:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 20Gi
      storageClass: ""
      annotations: {}
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/health/
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /api/health/
      initialDelaySeconds: 10
      periodSeconds: 10
  existingSecret: ""
  secretRefs: []

infisical:
  enabled: false
  infisical:
    enabled: true
    image:
      repository: infisical/infisical
      tag: "v0.151.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
    resources: {}
    autoBootstrap:
      enabled: false
    kubeSecretRef: ""
  ingress:
    enabled: true
    hostName: infisical.homebase.local
    ingressClassName: ""
    annotations: {}
    tls: []
    nginx:
      enabled: false
  postgresql:
    enabled: true
    primary:
      persistence:
        enabled: false
        size: 10Gi
        storageClass: ""
  redis:
    enabled: true

wgEasy:
  enabled: false
  image:
    repository: ghcr.io/wg-easy/wg-easy
    tag: "14"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    wireguardPort: 51820
    uiPort: 51821
    annotations: {}
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: wg.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
    storageClass: ""
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
  backup:
    annotations: {}
  existingSecret: ""
  secretRefs: []

# Platform-level feature toggles and placeholders for future integration templates.
externalSecrets:
  enabled: false
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  refreshInterval: 1h
  mappings: []

observability:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
  logging:
    enabled: false
    destination: ""

persistence:
  enabled: false
  snapshots:
    enabled: false
  backups:
    enabled: false
    schedule: ""

autoscaling:
  enabled: false
  profile: balanced

workerIsolation:
  enabled: false
  # Operator-facing isolation intent. Mirror these values into openhands.*
  # to affect the rendered OpenHands Deployment.
  runtimeClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
