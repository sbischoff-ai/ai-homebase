global:
  imagePullSecrets: []
  storageClass: ""
  domain: homebase.local
  mail:
    domain: example.com
    smtpHost: smtp.example.com
    fromLocalpart: noreply
    fromName: ai-homebase
    fromAddress: noreply@example.com
  hosts:
    openclaw: openclaw.homebase.local
    nextcloud: cloud.homebase.local
    nextcloudMcp: nextcloud-mcp.homebase.local
    qdrant: qdrant.homebase.local
    qdrantMcp: qdrant-mcp.homebase.local
    memgraph: memgraph.homebase.local
    memgraphLab: memgraph-lab.homebase.local
    gitea: gitea.vpn.homebase.internal
    registry: registry.homebase.local
    argocd: argocd.vpn.homebase.internal
    vaultwarden: vaultwarden.homebase.local
    paperlessNgx: paperless.homebase.local
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

cert-manager:
  crds:
    enabled: true
    keep: true

certManager:
  enabled: true
  resourcesEnabled: false
  resourceNamespace: ""
  internalCA:
    enabled: true
    selfSignedClusterIssuerName: platform-stack-selfsigned-bootstrap
    caClusterIssuerName: platform-stack-root-ca
    rootCertificate:
      name: platform-stack-root-ca
      secretName: platform-stack-root-ca
      commonName: platform-stack.homebase.local
      duration: 87600h # 10 years
      renewBefore: 720h # 30 days
      privateKey:
        algorithm: ECDSA
        size: 256
        rotationPolicy: Always
      subject:
        organizations:
          - ai-homebase
  openclawCertificate:
    enabled: true
    name: openclaw-ingress
    duration: 2160h # 90 days
    renewBefore: 360h # 15 days
    issuerRef:
      kind: ClusterIssuer
      group: cert-manager.io
      name: ""

openclaw:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: ""
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: openclaw.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.homebase.local
  service:
    type: ClusterIP
    port: 18789
    targetPort: 18789
    annotations: {}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  autoscaling:
    enabled: false
  env:
    - name: MEMGRAPH_HOST
      value: '{{ printf "%s-memgraph" .Release.Name | trunc 63 | trimSuffix "-" }}'
    - name: MEMGRAPH_PORT
      value: "7687"
    - name: MEMGRAPH_BOLT_URI
      value: 'bolt://{{ printf "%s-memgraph" .Release.Name | trunc 63 | trimSuffix "-" }}:7687'
  remoteDocker:
    enabled: true
    dockerHost: "ssh://docker-remote@openclaw-sandbox:2222"
    home: /home/node
    cli:
      enabled: true
      image:
        repository: docker
        tag: "28.0.4-cli"
        pullPolicy: IfNotPresent
      installPath: /opt/openclaw-tools/bin
    ssh:
      secretName: openclaw-remote-docker-ssh
      mountPath: /home/node/.ssh
  workspaceBootstrap:
    enabled: true
    agents:
      main:
        workspace: /home/node/.openclaw/workspace
        filesDir: workspaces/main
      coder:
        workspace: /home/node/.openclaw/workspace-coder
        filesDir: workspaces/coder
      architect:
        workspace: /home/node/.openclaw/workspace-architect
        filesDir: workspaces/architect
      archivist:
        workspace: /home/node/.openclaw/workspace-archivist
        filesDir: workspaces/archivist
      watchdog:
        workspace: /home/node/.openclaw/workspace-watchdog
        filesDir: workspaces/watchdog
      auditor:
        workspace: /home/node/.openclaw/workspace-auditor
        filesDir: workspaces/auditor
  openclaw:
    cron:
      enabled: true
      store: ~/.openclaw/cron/jobs.json
      maxConcurrentRuns: 1
      sessionRetention: 24h
      runLog:
        maxBytes: 2mb
        keepLines: 2000
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.homebase.local
      trustedProxies: []
    agents:
      defaults:
        workspace: /home/node/.openclaw/workspace
        models:
          openai/gpt-5.4:
            alias: Main / Coder / Architect / Archivist / Auditor
          anthropic/claude-sonnet-4-6:
            alias: Main / Architect
          openai/gpt-5.4-nano:
            alias: Watchdog
          anthropic/claude-opus-4-6:
            alias: Auditor
        sandbox:
          backend: docker
          mode: non-main
          scope: agent
          workspaceAccess: rw
          sessionToolsVisibility: "all"
          docker:
            image: registry.homebase.local/coder/openclaw-sandbox:trixie-slim
            workdir: /workspace
            readOnlyRoot: true
            tmpfs:
              - /tmp
              - /var/tmp
              - /run
            env:
              MEMGRAPH_HOST: memgraph.homebase.local
              MEMGRAPH_PORT: "7687"
              MEMGRAPH_BOLT_URI: bolt://memgraph.homebase.local:7687
            user: 1000:1000
            capDrop:
              - ALL
            pidsLimit: 256
            memory: 1g
            memorySwap: 2g
            cpus: 1
            network: bridge
          browser:
            enabled: true
            image: openclaw-sandbox-browser:bookworm-slim
            network: bridge
            cdpPort: 9222
            vncPort: 5900
            noVncPort: 6080
            headless: false
            enableNoVnc: true
            cdpSourceRange: ""
      list:
        - id: main
          default: true
          name: OpenClaw Assistant
          workspace: /home/node/.openclaw/workspace
          model:
            primary: openai/gpt-5.4
            fallbacks:
              - anthropic/claude-sonnet-4-6
          skills:
            - specialist_handoff
            - worker_lifecycle
            - channel_binding
            - nextcloud_coordination
            - memory_and_heartbeat
            - budget_tracking
          subagents:
            allowAgents:
              - coder
              - architect
              - archivist
              - auditor
        - id: coder
          name: Coder
          workspace: /home/node/.openclaw/workspace-coder
          model:
            primary: anthropic/claude-sonnet-4-6
            fallbacks:
              - openai/gpt-5.4
          skills:
            - gitea_gitops_registry
            - codex_execution_and_logging
            - nextcloud_implementation_handoff
            - coding-agent
            - github
            - tmux
          sandbox:
            mode: all
            workspaceAccess: rw
            docker:
              image: registry.homebase.local/coder/openclaw-sandbox-coder:trixie-slim
              binds:
                - /var/run/docker.sock:/var/run/docker.sock
              tmpfs:
                - /tmp
                - /var/tmp
                - /run
              env:
                HOME: /workspace/.home
                CODEX_HOME: /workspace/.home/.codex
                XDG_CONFIG_HOME: /workspace/.home/.config
                XDG_CACHE_HOME: /workspace/.home/.cache
                XDG_STATE_HOME: /workspace/.home/.local/state
                CODER_GITEA_BASE_URL: https://gitea.homebase.local
                CODER_GITEA_HOST: gitea.homebase.local
                CODER_GITEA_USERNAME: coder
                CODER_GITEA_EMAIL: coder@example.invalid
                CODER_GITEA_PASSWORD: ${CODER_GITEA_PASSWORD}
                CODER_GITOPS_REPO_NAME: cluster-gitops
                CODER_SANDBOX_IMAGES_REPO_NAME: openclaw-sandbox-images
                CODER_GITOPS_REPO_BRANCH: main
                CODER_GITOPS_PROJECT: platform-stack
                CODER_GITEA_TEA_LOGIN_NAME: coder
                CODER_GITEA_TEA_TOKEN_NAME: openclaw-coder-sandbox
                CODER_REGISTRY_HOST: registry.homebase.local
                CODER_REGISTRY_BASE_URL: https://registry.homebase.local
                CODER_REGISTRY_USERNAME: coder
                CODER_REGISTRY_PASSWORD: ${CODER_REGISTRY_PASSWORD}
                CODER_REGISTRY_NAMESPACE: coder
                CODEX_DEFAULT_MODEL: gpt-5.4-mini
                CODEX_MODEL: openai/gpt-5.3-codex
                OPENAI_API_KEY: ${OPENAI_API_KEY}
                GITHUB_TOKEN: ${GITHUB_TOKEN}
              setupCommand: /usr/local/bin/coder-init.sh
        - id: architect
          name: Architect
          workspace: /home/node/.openclaw/workspace-architect
          model:
            primary: anthropic/claude-sonnet-4-6
            fallbacks:
              - openai/gpt-5.4
          skills:
            - nextcloud_project_planning
            - worker_definition_package
            - design_handoff
        - id: archivist
          name: Archivist
          workspace: /home/node/.openclaw/workspace-archivist
          model:
            primary: openai/gpt-5.4-mini
            fallbacks:
              - anthropic/claude-sonnet-4-6
          skills:
            - memgraph_curation
            - recent_memory_grooming
            - context_map_and_memory_linking
            - nextcloud_knowledge_support
          sandbox:
            mode: non-main
        - id: watchdog
          name: Watchdog
          workspace: /home/node/.openclaw/workspace-watchdog
          model:
            primary: openai/gpt-5.4-nano
            fallbacks:
              - anthropic/claude-haiku-4-5
          skills:
            - severity_and_escalation
            - nextcloud_incident_ops
            - heartbeat_and_budget_sentinel
            - healthcheck
            - session-logs
          sandbox:
            mode: "off"
        - id: auditor
          name: Auditor
          workspace: /home/node/.openclaw/workspace-auditor
          model:
            primary: anthropic/claude-opus-4-6
            fallbacks:
              - openai/gpt-5.4
          skills:
            - review_modes_and_handoff
            - nextcloud_review_packets
            - verdict_formatting
            - summarize
          sandbox:
            mode: "off"
    tools:
      sessions:
        visibility: all
      agentToAgent:
        enabled: true
        allow:
          - main
          - coder
          - architect
          - archivist
          - watchdog
          - auditor
    skills:
      allowBundled:
        - weather
        - healthcheck
        - node-connect
        - skill-creator
        - session-logs
        - coding-agent
        - tmux
        - summarize
        - github
    plugins:
      slots:
        memory: none
    commands:
      mcp: true
    mcp:
      servers:
        nextcloud:
          command: node
          args:
            - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL}
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL}
            - --header
            - Authorization=${OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER}
        qdrant:
          command: node
          args:
            - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
            - --url
            - ${OPENCLAW_QDRANT_MCP_INTERNAL_URL}
            - --url
            - ${OPENCLAW_QDRANT_MCP_EXTERNAL_URL}
    plugins:
      entries: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  existingSecret: "openclaw-secrets"
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ANTHROPIC_API_KEY
    braveApiKey: BRAVE_API_KEY
    moonshotApiKey: MOONSHOT_API_KEY
    perplexityApiKey: PERPLEXITY_API_KEY
    geminiApiKey: GEMINI_API_KEY
    xaiApiKey: XAI_API_KEY
    githubToken: GITHUB_TOKEN
  secretRefs:
    - name: openclaw-nextcloud-mcp-secrets
      key: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
      envVar: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
    - name: coder-credentials
      key: CODER_GITEA_PASSWORD
      envVar: CODER_GITEA_PASSWORD
    - name: coder-credentials
      key: CODER_REGISTRY_PASSWORD
      envVar: CODER_REGISTRY_PASSWORD

argoCd:
  enabled: false
  argocd:
    configs:
      params:
        server.insecure: true
    server:
      ingress:
        enabled: true
        ingressClassName: internal-nginx
        hostname: argocd.vpn.homebase.internal
        annotations: {}
        tls: false

nextcloud:
  enabled: true
  image:
    repository: nextcloud
    tag: "33.0.2-apache"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    path: /
    pathType: Prefix
    private:
      enabled: true
      className: internal-nginx
      annotations:
        cert-manager.io/cluster-issuer: platform-stack-root-ca
      host: cloud.homebase.local
      tls:
        secretName: nextcloud-private-tls
    public:
      enabled: false
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      host: ""
      tls:
        secretName: nextcloud-public-tls
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 250Gi
    storageClass: ""
    annotations: {}
  resources: {}
  bootstrapWait:
    image:
      repository: docker.io/postgres
      tag: "17.5-alpine"
      pullPolicy: IfNotPresent
  probes:
    liveness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 10
      periodSeconds: 10
  backup:
    annotations: {}
  existingSecret: ""
  secretRefs: []
  admin:
    user: nextcloud-admin
    passwordSecret:
      name: nextcloud-config-secrets
      key: NEXTCLOUD_ADMIN_PASSWORD
  trustedDomains:
    - cloud.homebase.local
    - platform-stack-nextcloud
    - platform-stack-nextcloud.ai-homebase.svc
    - platform-stack-nextcloud.ai-homebase.svc.cluster.local
  trustedProxies: []
  bootstrapUsers:
    - username: openclaw
      displayName: OpenClaw
      passwordSecret:
        name: openclaw-nextcloud-mcp-secrets
        key: NEXTCLOUD_PASSWORD
  bootstrapApps:
    - notes
    - tables
    - calendar
    - tasks
  skeletonDirectory: ""
  bootstrapProjectContent:
    - slug: ai-homebase
      ownerUsername: openclaw
      projectsFilesDir: bootstrap-content/ai-homebase/projects
      projectsFiles:
        - path: overview.md
        - path: multi-agent-topology.md
        - path: gitops-workflow.md
        - path: cluster-architecture.md
        - path: project-documentation-model.md
        - path: worker-design-guide.md
        - path: qdrant-memory-schema.md
        - path: knowledge-graph-schema.md
        - path: budget-policy.md
        - path: archivist-grooming-log.md
        - path: incidents/README.md
        - path: heartbeat.json
        - path: codex-usage/.gitkeep
        - path: audit-log.md
        - path: baselines.md
        - path: escalation-rules.md
  externalDatabase:
    host: platform-stack-shared-postgresql
    port: 5432
    database: nextcloud
    user: nextcloud
    passwordSecret:
      name: nextcloud-config-secrets
      key: POSTGRES_PASSWORD
  externalRedis:
    host: platform-stack-shared-redis
    port: 6379
    passwordSecret:
      name: nextcloud-config-secrets
      key: REDIS_HOST_PASSWORD
  smtp:
    host: platform-stack-postfix-relay
    port: 587
    user: ""
    secure: ""
    authType: ""
    fromAddress: noreply
    domain: example.com
    passwordSecret:
      name: ""
      key: ""

nextcloudMcp:
  enabled: true
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: true
    className: internal-nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: nextcloud-mcp.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-mcp-tls
        hosts:
          - nextcloud-mcp.homebase.local
  nextcloud:
    url: http://platform-stack-nextcloud
  authentication:
    mode: multi_user_basic
  enabledApps:
    - webdav
    - sharing
    - tables
    - calendar

qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.17.1"
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: internal-nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: qdrant.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: qdrant-tls
        hosts:
          - qdrant.homebase.local
  persistence:
    enabled: true
    size: 100Gi

qdrantMcp:
  enabled: true
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: internal-nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: qdrant-mcp.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: qdrant-mcp-tls
        hosts:
          - qdrant-mcp.homebase.local
  qdrant:
    url: http://platform-stack-qdrant:6333
    collectionName: openclaw-memory
  embedding:
    provider: fastembed
    model: BAAI/bge-base-en-v1.5
  toolDescriptions:
    store: |
      Store a memory for cross-agent recall. Use this to preserve durable knowledge such as user preferences, decisions, conventions, patterns, incidents, plans, creative content, and reusable context.

      REQUIRED: The `information` parameter must begin with domain and kind tags in brackets, followed by a complete statement:
        [real|speculative|fictional|synthetic] [user-preference|user-context|decision|convention|pattern|fact|plan|task-context|incident|monitor-rule|creative|relationship|reference] Your memory text here.

      REQUIRED: The `metadata` parameter must be a JSON object with at minimum:
        {"kind": "...", "domain": "...", "agent": "...", "created": "ISO-8601"}

      Optional metadata: confidence (high|medium|low), project, tags (array), nc_refs (array of {type, id, path, label}), supersedes, expiry, source_url.

      Guidelines:
      - Store facts you would want any agent to recall weeks later.
      - Do not store ephemeral task status, transient tool output, or easily re-derivable information.
      - Do not store secrets or credentials.
      - For fictional or creative content, always use domain `fictional`.
      - If correcting a prior memory, include `supersedes` in metadata and mention the correction in the text.
      - Include Nextcloud references in both the text and `nc_refs` metadata when relevant.
    find: |
      Search shared semantic memory across all agents. Returns memories ranked by relevance.

      Use this tool before answering questions about user preferences, prior decisions, established conventions, past incidents, project history, people and relationships, creative worlds, or anything that may have been stored previously.

      Query tips:
      - Include a domain tag when useful: `[real] user's preferred editor` or `[fictional] Ashenmoor political structure`
      - Include a kind tag when useful: `[decision] database choice for Nextcloud`
      - Use natural language for broad recall.
      - Be specific when possible.
      - If results mix real and fictional content, re-query with an explicit `[real]` or `[fictional]` prefix.

      Important:
      - This searches all memories from all agents.
      - Returned memories include metadata such as kind, domain, agent, confidence, and Nextcloud references.
      - Treat speculative or low-confidence results cautiously.
      - Treat expired memories as potentially stale.
 
      Filtering:
      - You can filter by metadata fields using the `query_filter` parameter.
      - All memories include a `created` ISO-8601 timestamp in metadata.
      - Common metadata fields: `kind`, `domain`, `agent`, `confidence`, `project`, `tags`.
      - Example: Find memories from the last 24 hours:
        query_filter: {"must": [{"key": "created", "range": {"gte": "2026-04-02T00:00:00Z"}}]}
      - Example: Find memories by a specific agent:
        query_filter: {"must": [{"key": "agent", "match": {"value": "coder"}}]}
      - Example: Find decisions from a specific project:
        query_filter: {"must": [{"key": "kind", "match": {"value": "decision"}}, {"key": "project", "match": {"value": "ai-homebase"}}]}
      - Combine semantic search (the `query` parameter) with filters for best results.

memgraph:
  enabled: true
  image:
    repository: memgraph/memgraph
    tag: "3.8.1"
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: internal-nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: memgraph.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: memgraph-tls
        hosts:
          - memgraph.homebase.local
  persistence:
    enabled: true
    size: 100Gi

memgraphLab:
  enabled: true
  image:
    repository: memgraph/lab
    tag: "3.9.0"
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: internal-nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: memgraph-lab.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: memgraph-lab-tls
        hosts:
          - memgraph-lab.homebase.local
  memgraph:
    host: platform-stack-memgraph
    port: 7687

memgraphBootstrap:
  enabled: true
  seedCypherFile: memgraph-seed.cypher

gitea:
  enabled: false
  gitea:
    enabled: true
    image:
      repository: gitea
      tag: "1.25.5"
      rootless: true
      pullPolicy: IfNotPresent
    service:
      http:
        type: ClusterIP
        port: 3000
    ingress:
      enabled: true
      className: internal-nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "32m"
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
      tls: []
    persistence:
      enabled: true
      size: 120Gi
      storageClass: ""
    preExtraInitContainers:
      - name: wait-for-shared-postgresql-bootstrap
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -ceu
          - |
            until PGPASSWORD="$GITEA__database__PASSWD" psql \
              --host platform-stack-shared-postgresql \
              --port 5432 \
              --username gitea \
              --dbname gitea \
              -tAc "SELECT current_database(), current_user;" | grep -qx 'gitea|gitea'; do
              echo "waiting for live PostgreSQL bootstrap of gitea"
              sleep 2
            done
        env:
          - name: GITEA__database__PASSWD
            valueFrom:
              secretKeyRef:
                name: gitea-config-secrets
                key: GITEA__database__PASSWD
    gitea:
      admin:
        username: git-admin
        existingSecret: ""
      # First phase intentionally limits Gitea to Git/PR/wiki usage.
      # Keep actions/runners unset here; upstream moved them to a dedicated chart.
      config:
        database:
          DB_TYPE: postgres
          HOST: platform-stack-shared-postgresql:5432
          NAME: gitea
          USER: gitea
        session:
          PROVIDER: redis
        cache:
          ENABLED: true
          ADAPTER: redis
        queue:
          TYPE: redis
        global_lock:
          SERVICE_TYPE: redis
        service:
          DISABLE_REGISTRATION: true
      additionalConfigFromEnvs:
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__database__PASSWD
        - name: GITEA__session__PROVIDER_CONFIG
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__session__PROVIDER_CONFIG
        - name: GITEA__cache__HOST
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__cache__HOST
        - name: GITEA__queue__CONN_STR
          valueFrom:
            secretKeyRef:
