global:
  imagePullSecrets: []
  storageClass: ""
  domain: homebase.local
  hosts:
    openclaw: openclaw.homebase.local
    openhands: openhands.homebase.local
    nextcloud: cloud.homebase.local
    gitea: gitea.vpn.homebase.internal
    paperlessNgx: paperless.homebase.local
    infisical: infisical.homebase.local
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

openclaw:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: ""
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: openclaw.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  service:
    type: ClusterIP
    port: 18789
    targetPort: 18789
    annotations: {}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  autoscaling:
    enabled: false
  remoteDocker:
    enabled: true
    dockerHost: "ssh://docker-remote@openclaw-sandbox:2222"
    home: /home/node
    ssh:
      secretName: openclaw-remote-docker-ssh
      mountPath: /home/node/.ssh
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - http://openclaw.homebase.local
    agents:
      defaults:
        sandbox:
          mode: non-main
          backend: docker
          scope: agent
          docker:
            image: openclaw-sandbox:bookworm-slim
            workdir: /workspace
            readOnlyRoot: true
            tmpfs:
              - /tmp
              - /var/tmp
              - /run
            user: 1000:1000
            capDrop:
              - ALL
            pidsLimit: 256
            memory: 1g
            memorySwap: 2g
            cpus: 1
            network: bridge
          browser:
            enabled: true
            image: openclaw-sandbox-browser:bookworm-slim
            network: bridge
            cdpPort: 9222
            vncPort: 5900
            noVncPort: 6080
            headless: false
            enableNoVnc: true
            cdpSourceRange: ""
    plugins:
      entries: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  existingSecret: "openclaw-app-secrets"
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: ""
    anthropicApiKey: ""
    googleApiKey: ""
    tavilyApiKey: ""
    braveSearchApiKey: ""
  secretRefs: []
openhands:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/openhands/openhands
    tag: "1.5.0"
    pullPolicy: IfNotPresent
  service:
    enabled: true
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  # OpenHands ships with ingress enabled by default so enabled services are reachable.
  ingress:
    enabled: true
    hostName: openhands.homebase.local
    ingressClassName: ""
    # Keep hostName on an internal/VPN DNS name when exposing OpenHands privately.
    annotations: {}
    tls: []
  workspace:
    enabled: false
    size: 20Gi
    storageClass: ""
  queue:
    enabled: false
    provider: ""
    endpoint: ""
    queueName: ""
    dlqName: ""
    workerConcurrency: 4
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  # Scheduling controls consumed by the OpenHands subchart.
  runtimeClassName: ""
  runtime:
    mode: kubernetes
  kubernetes:
    namespace: ai-homebase
    ingress_domain: ""
    pvc_storage_size: 2Gi
    pvc_storage_class: ""
    resource_cpu_request: "1"
    resource_memory_request: 1Gi
    resource_memory_limit: 2Gi
    image_pull_secret: ""
    ingress_tls_secret: ""
    node_selector_key: ""
    node_selector_val: ""
    tolerations_yaml: ""
    privileged: false
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

nextcloud:
  enabled: true
  image:
    repository: nextcloud
    tag: "29.0.0-apache"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: cloud.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-tls
        hosts:
          - cloud.homebase.local
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 250Gi
    storageClass: ""
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 10
      periodSeconds: 10
  backup:
    annotations: {}
  existingSecret: ""
  secretRefs: []

gitea:
  enabled: false
  gitea:
    enabled: true
    image:
      repository: gitea/gitea
      tag: "1.22.0"
      pullPolicy: IfNotPresent
    service:
      http:
        type: ClusterIP
        port: 3000
    ingress:
      enabled: true
      className: internal-nginx
      annotations: {}
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
      tls: []
    persistence:
      enabled: true
      size: 120Gi
      storageClass: ""
    admin:
      username: git-admin
      existingSecret: ""
    # First phase intentionally limits Gitea to Git/PR/wiki usage.
    # Actions/runners move to a later dedicated deployment.
    actions:
      enabled: false
    config:
      database:
        DB_TYPE: postgres
        HOST: platform-stack-shared-postgresql:5432
        NAME: gitea
        USER: gitea
      session:
        PROVIDER: redis
      cache:
        ENABLED: true
        ADAPTER: redis
      queue:
        TYPE: redis
      global_lock:
        SERVICE_TYPE: redis
      service:
        DISABLE_REGISTRATION: true
    additionalConfigFromEnvs:
      - GITEA__database__PASSWD
      - GITEA__session__PROVIDER_CONFIG
      - GITEA__cache__HOST
      - GITEA__queue__CONN_STR
      - GITEA__global_lock__SERVICE_CONN_STR
    additionalConfigSources: []
    postgresql:
      enabled: false
      primary:
        persistence:
          enabled: true
          size: 20Gi
          storageClass: ""
    postgresql-ha:
      enabled: false
    redis:
      enabled: false
    redis-cluster:
      enabled: false

# Compatibility bridge for paperless-ngx subchart-local gating:
# keep this true so umbrella toggle paperlessNgx.enabled remains the single operator switch.
paperless-ngx:
  enabled: true

paperlessNgx:
  enabled: false
  image:
    repository: paperlessngx/paperless-ngx
    tag: "2.20"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: paperless.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    data:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 30Gi
      storageClass: ""
      annotations: {}
    media:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 250Gi
      storageClass: ""
      annotations: {}
    consume:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 20Gi
      storageClass: ""
      annotations: {}
    export:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 20Gi
      storageClass: ""
      annotations: {}
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/health/
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /api/health/
      initialDelaySeconds: 10
      periodSeconds: 10
  existingSecret: ""
  secretRefs: []

infisical:
  enabled: true
  infisical:
    enabled: true
    image:
      repository: infisical/infisical
      tag: "v0.151.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
    resources: {}
    autoBootstrap:
      enabled: false
      organization: default-org
      credentialSecret:
        name: infisical-bootstrap-credentials
      secretDestination:
        name: infisical-bootstrap-secret
        namespace: default
    kubeSecretRef: infisical-secrets
  ingress:
    enabled: true
    hostName: infisical.homebase.local
    ingressClassName: ""
    annotations: {}
    tls: []
    nginx:
      enabled: false
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: false
        size: 10Gi
        storageClass: ""
  redis:
    enabled: false

sharedPostgresql:
  enabled: true
  fullnameOverride: platform-stack-shared-postgresql
  image:
    registry: docker.io
    repository: postgres
    tag: "17.5"
  auth:
    existingSecret: shared-postgresql-auth
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: ""
    initdb:
      scriptsSecret: shared-postgresql-initdb

sharedRedis:
  enabled: true
  fullnameOverride: platform-stack-shared-redis
  image:
    registry: docker.io
    repository: redis
    tag: "8.0.3"
  architecture: standalone
  auth:
    enabled: true
    existingSecret: shared-redis-auth
    existingSecretPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: ""
