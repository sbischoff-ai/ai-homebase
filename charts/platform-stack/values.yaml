  enabled: false
  actions:
    enabled: true
    runner:
      vmName: gitea-actions-runner
      hostAlias: gitea-actions-runner.homebase.internal
      sshPort: 2223
      labels:
        - linux-amd64
        - homebase-coder
      jobImage: gitea-actions-job:trixie-slim
  gitea:
    enabled: true
    image:
      repository: gitea
      tag: "1.25.5"
      rootless: true
      pullPolicy: IfNotPresent
    service:
      http:
        type: ClusterIP
        port: 3000
    ingress:
      enabled: true
      className: internal-nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "32m"
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
      tls: []
    persistence:
      enabled: true
      size: 120Gi
      storageClass: ""
    preExtraInitContainers:
      - name: wait-for-shared-postgresql-bootstrap
        image: docker.io/postgres:17.5-alpine
        imagePullPolicy: IfNotPresent
        command:
          - /bin/sh
          - -ceu
          - |
            until PGPASSWORD="$GITEA__database__PASSWD" psql \
              --host platform-stack-shared-postgresql \
              --port 5432 \
              --username gitea \
              --dbname gitea \
              -tAc "SELECT current_database(), current_user;" | grep -qx 'gitea|gitea'; do
              echo "waiting for live PostgreSQL bootstrap of gitea"
              sleep 2
            done
        env:
          - name: GITEA__database__PASSWD
            valueFrom:
              secretKeyRef:
                name: gitea-config-secrets
                key: GITEA__database__PASSWD
    deployment:
      env:
        - name: GITEA_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA_RUNNER_REGISTRATION_TOKEN
    gitea:
      admin:
        username: git-admin
        existingSecret: ""
      # First phase intentionally limits Gitea to Git/PR/wiki usage.
      # Keep actions/runners unset here; upstream moved them to a dedicated chart.
      config:
        database:
          DB_TYPE: postgres
          HOST: platform-stack-shared-postgresql:5432
          NAME: gitea
          USER: gitea
        session:
          PROVIDER: redis
        cache:
          ENABLED: true
          ADAPTER: redis
        queue:
          TYPE: redis
        global_lock:
          SERVICE_TYPE: redis
        service:
          DISABLE_REGISTRATION: true
      additionalConfigFromEnvs:
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__database__PASSWD
        - name: GITEA__session__PROVIDER_CONFIG
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__session__PROVIDER_CONFIG
        - name: GITEA__cache__HOST
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__cache__HOST
        - name: GITEA__queue__CONN_STR
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__queue__CONN_STR
        - name: GITEA__global_lock__SERVICE_CONN_STR
          valueFrom:
            secretKeyRef:
              name: gitea-config-secrets
              key: GITEA__global_lock__SERVICE_CONN_STR
      additionalConfigSources: []
    postgresql:
      enabled: false
      primary:
        persistence:
          enabled: true
          size: 20Gi
          storageClass: ""
