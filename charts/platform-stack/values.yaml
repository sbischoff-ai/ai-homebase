global:
  imagePullSecrets: []
  storageClass: ""
  domain: homebase.local
  mail:
    domain: example.com
    smtpHost: smtp.example.com
    fromLocalpart: noreply
    fromName: ai-homebase
    fromAddress: noreply@example.com
  hosts:
    openclaw: openclaw.homebase.local
    nextcloud: cloud.homebase.local
    nextcloudMcp: nextcloud-mcp.homebase.local
    qdrant: qdrant.homebase.local
    qdrantMcp: qdrant-mcp.homebase.local
    memgraph: memgraph.homebase.local
    memgraphLab: memgraph-lab.homebase.local
    gitea: gitea.vpn.homebase.internal
    registry: registry.homebase.local
    argocd: argocd.vpn.homebase.internal
    vaultwarden: vaultwarden.homebase.local
    paperlessNgx: paperless.homebase.local
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

cert-manager:
  crds:
    enabled: true
    keep: true

certManager:
  enabled: true
  resourcesEnabled: false
  resourceNamespace: ""
  internalCA:
    enabled: true
    selfSignedClusterIssuerName: platform-stack-selfsigned-bootstrap
    caClusterIssuerName: platform-stack-root-ca
    rootCertificate:
      name: platform-stack-root-ca
      secretName: platform-stack-root-ca
      commonName: platform-stack.homebase.local
      duration: 87600h # 10 years
      renewBefore: 720h # 30 days
      privateKey:
        algorithm: ECDSA
        size: 256
        rotationPolicy: Always
      subject:
        organizations:
          - ai-homebase
  openclawCertificate:
    enabled: true
    name: openclaw-ingress
    duration: 2160h # 90 days
    renewBefore: 360h # 15 days
    issuerRef:
      kind: ClusterIssuer
      group: cert-manager.io
      name: ""

openclaw:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/openclaw/openclaw
    tag: ""
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: openclaw.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.homebase.local
  service:
    type: ClusterIP
    port: 18789
    targetPort: 18789
    annotations: {}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  autoscaling:
    enabled: false
  remoteDocker:
    enabled: true
    dockerHost: "ssh://docker-remote@openclaw-sandbox:2222"
    home: /home/node
    cli:
      enabled: true
      image:
        repository: docker
        tag: "28.0.4-cli"
        pullPolicy: IfNotPresent
      installPath: /opt/openclaw-tools/bin
    ssh:
      secretName: openclaw-remote-docker-ssh
      mountPath: /home/node/.ssh
  workspaceBootstrap:
    enabled: true
    agents:
      main:
        workspace: /home/node/.openclaw/workspace
        filesDir: workspaces/main
      coder:
        workspace: /home/node/.openclaw/workspace-coder
        filesDir: workspaces/coder
      architect:
        workspace: /home/node/.openclaw/workspace-architect
        filesDir: workspaces/architect
      archivist:
        workspace: /home/node/.openclaw/workspace-archivist
        filesDir: workspaces/archivist
      watchdog:
        workspace: /home/node/.openclaw/workspace-watchdog
        filesDir: workspaces/watchdog
  openclaw:
    cron:
      enabled: true
      store: ~/.openclaw/cron/jobs.json
      maxConcurrentRuns: 1
      sessionRetention: 24h
      runLog:
        maxBytes: 2mb
        keepLines: 2000
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.homebase.local
      trustedProxies: []
    agents:
      defaults:
        workspace: /home/node/.openclaw/workspace
        models:
          openai/gpt-4.1:
            alias: Main
          anthropic/claude-sonnet-4-6:
            alias: Coder / Archivist
          anthropic/claude-opus-4-6:
            alias: Architect
          openai/gpt-4.1-nano:
            alias: Watchdog
        sandbox:
          backend: docker
          mode: non-main
          scope: agent
          sessionToolsVisibility: "all"
          docker:
            image: registry.homebase.local/coder/openclaw-sandbox:bookworm-slim
            workdir: /workspace
            readOnlyRoot: true
            tmpfs:
              - /tmp
              - /var/tmp
              - /run
            user: 1000:1000
            capDrop:
              - ALL
            pidsLimit: 256
            memory: 1g
            memorySwap: 2g
            cpus: 1
            network: bridge
          browser:
            enabled: true
            image: openclaw-sandbox-browser:bookworm-slim
            network: bridge
            cdpPort: 9222
            vncPort: 5900
            noVncPort: 6080
            headless: false
            enableNoVnc: true
            cdpSourceRange: ""
      list:
        - id: main
          default: true
          name: OpenClaw Assistant
          workspace: /home/node/.openclaw/workspace
          model:
            primary: openai/gpt-4.1
            fallbacks:
              - anthropic/claude-sonnet-4-6
          subagents:
            allowAgents:
              - coder
              - architect
              - archivist
        - id: coder
          name: Coder
          workspace: /home/node/.openclaw/workspace-coder
          model:
            primary: anthropic/claude-sonnet-4-6
            fallbacks:
              - openai/gpt-4.1
          sandbox:
            mode: all
            docker:
              image: registry.homebase.local/coder/openclaw-sandbox-coder:bookworm-slim
              binds:
                - /var/run/docker.sock:/var/run/docker.sock
              tmpfs:
                - /tmp
                - /var/tmp
                - /run
                - /workspace
              env:
                HOME: /workspace/.home
                CODEX_HOME: /workspace/.home/.codex
                XDG_CONFIG_HOME: /workspace/.home/.config
                XDG_CACHE_HOME: /workspace/.home/.cache
                XDG_STATE_HOME: /workspace/.home/.local/state
                CODER_GITEA_BASE_URL: https://gitea.homebase.local
                CODER_GITEA_HOST: gitea.homebase.local
                CODER_GITEA_USERNAME: coder
                CODER_GITEA_EMAIL: coder@example.invalid
                CODER_GITEA_PASSWORD: ${CODER_GITEA_PASSWORD}
                CODER_GITOPS_REPO_NAME: cluster-gitops
                CODER_SANDBOX_IMAGES_REPO_NAME: openclaw-sandbox-images
                CODER_GITOPS_REPO_BRANCH: main
                CODER_GITOPS_PROJECT: platform-stack
                CODER_GITEA_TEA_LOGIN_NAME: coder
                CODER_GITEA_TEA_TOKEN_NAME: openclaw-coder-sandbox
                CODER_REGISTRY_HOST: registry.homebase.local
                CODER_REGISTRY_BASE_URL: https://registry.homebase.local
                CODER_REGISTRY_USERNAME: coder
                CODER_REGISTRY_PASSWORD: ${CODER_REGISTRY_PASSWORD}
                CODER_REGISTRY_NAMESPACE: coder
                OPENAI_API_KEY: ${OPENAI_API_KEY}
                GITHUB_TOKEN: ${GITHUB_TOKEN}
              setupCommand: /usr/local/bin/coder-init.sh
        - id: architect
          name: Architect
          workspace: /home/node/.openclaw/workspace-architect
          model:
            primary: anthropic/claude-opus-4-6
            fallbacks:
              - openai/o3
        - id: archivist
          name: Archivist
          workspace: /home/node/.openclaw/workspace-archivist
          model:
            primary: anthropic/claude-sonnet-4-6
            fallbacks:
              - openai/gpt-4.1-mini
          sandbox:
            mode: non-main
            docker:
              image: registry.homebase.local/coder/openclaw-sandbox-archivist:bookworm-slim
        - id: watchdog
          name: Watchdog
          workspace: /home/node/.openclaw/workspace-watchdog
          model:
            primary: openai/gpt-4.1-nano
            fallbacks:
              - anthropic/claude-haiku-4-5
          sandbox:
            mode: "off"
    tools:
      sessions:
        visibility: all
      agentToAgent:
        enabled: true
        allow:
          - main
          - coder
          - architect
          - archivist
          - watchdog
    skills:
      allowBundled:
        - weather
        - healthcheck
        - node-connect
        - skill-creator
        - session-logs
        - coding-agent
        - tmux
        - summarize
        - github
    commands:
      mcp: true
    mcp:
      servers:
        nextcloud:
          command: node
          args:
            - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL}
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL}
            - --header
            - Authorization=${OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER}
        qdrant:
          command: node
          args:
            - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
            - --url
            - ${OPENCLAW_QDRANT_MCP_INTERNAL_URL}
            - --url
            - ${OPENCLAW_QDRANT_MCP_EXTERNAL_URL}
    plugins:
      entries: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  networkPolicy:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  existingSecret: "openclaw-secrets"
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ANTHROPIC_API_KEY
    braveApiKey: BRAVE_API_KEY
    kimiApiKey: KIMI_API_KEY
    moonshotApiKey: MOONSHOT_API_KEY
    tavilyApiKey: TAVILY_API_KEY
    perplexityApiKey: PERPLEXITY_API_KEY
    geminiApiKey: GEMINI_API_KEY
    xaiApiKey: XAI_API_KEY
    githubToken: GITHUB_TOKEN
    googleApiKey: GOOGLE_API_KEY
    braveSearchApiKey: BRAVE_SEARCH_API_KEY
  secretRefs:
    - name: openclaw-nextcloud-mcp-secrets
      key: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
      envVar: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
    - name: coder-credentials
      key: CODER_GITEA_PASSWORD
      envVar: CODER_GITEA_PASSWORD
    - name: coder-credentials
      key: CODER_REGISTRY_PASSWORD
      envVar: CODER_REGISTRY_PASSWORD

argoCd:
  enabled: false
  argocd:
    configs:
      params:
        server.insecure: true
    server:
      ingress:
        enabled: true
        ingressClassName: internal-nginx
        hostname: argocd.vpn.homebase.internal
        annotations: {}
        tls: false

nextcloud:
  enabled: true
  image:
    repository: nextcloud
    tag: "33.0.0-apache"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    path: /
    pathType: Prefix
    private:
      enabled: true
      className: internal-nginx
      annotations:
        cert-manager.io/cluster-issuer: platform-stack-root-ca
      host: cloud.homebase.local
      tls:
        secretName: nextcloud-private-tls
    public:
      enabled: false
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      host: ""
      tls:
        secretName: nextcloud-public-tls
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 250Gi
    storageClass: ""
    annotations: {}
  resources: {}
  bootstrapWait:
    image:
      repository: docker.io/postgres
      tag: "17.5-alpine"
      pullPolicy: IfNotPresent
  probes:
    liveness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      enabled: true
      path: /status.php
      initialDelaySeconds: 10
      periodSeconds: 10
  backup:
    annotations: {}
  existingSecret: ""
  secretRefs: []
  admin:
    user: nextcloud-admin
    passwordSecret:
      name: nextcloud-config-secrets
      key: NEXTCLOUD_ADMIN_PASSWORD
  trustedDomains:
    - cloud.homebase.local
    - platform-stack-nextcloud
    - platform-stack-nextcloud.ai-homebase.svc
    - platform-stack-nextcloud.ai-homebase.svc.cluster.local
  trustedProxies: []
  bootstrapUsers:
    - username: openclaw
      displayName: OpenClaw
      passwordSecret:
        name: openclaw-nextcloud-mcp-secrets
        key: NEXTCLOUD_PASSWORD
  bootstrapApps:
    - notes
    - tables
    - calendar
    - tasks
  bootstrapProjectContent:
    - slug: ai-homebase
      ownerUsername: openclaw
      projectsFiles:
        - path: overview.md
          content: |
            # ai-homebase

            This project documents the running AI homebase cluster from the perspective of the agents operating inside it.

            Purpose:
            - explain what this cluster is for;
            - describe how the agents should work within it;
            - capture the durable operating model for evolving the stack over time.

            Working rule:
            - keep long-lived project documentation in `/Projects/ai-homebase/`;
            - keep temporary planning and scratchpad material in `/Notes/ai-homebase/`.
        - path: multi-agent-topology.md
          content: |
            # Multi-Agent Topology

            The cluster bootstraps five standing OpenClaw agents:

            - `main`: user-facing coordinator and manager of work
            - `architect`: project planner, designer, and documentation owner
            - `coder`: implementation and GitOps executor
            - `archivist`: long-horizon knowledge graph curator and memory steward
            - `watchdog`: low-cost monitoring, polling, heartbeat, and triage specialist

            Coordination model:
            - `main` decides whether work is a small task or a larger project.
            - small tasks may be handled directly by `main` when lightweight and low-risk.
            - projects go to `architect` first for planning, design, decomposition, and durable project documentation.
            - work goes to `archivist` when it needs durable graph curation, cross-domain context synthesis, or stable long-term memory structure.
            - `architect` returns actionable work items to `main`.
            - `main` then routes those items to the user, `coder`, `archivist`, `watchdog`, or itself.
        - path: gitops-workflow.md
          content: |
            # GitOps Workflow

            This stack is designed to evolve through repository changes, image publishing, and GitOps handoff.

            Core flow:
            - `architect` defines plans, design direction, and task decomposition.
            - `coder` applies cluster and application changes in the repository.
            - `coder` maintains the OpenClaw sandbox image source repo and publishes the resulting images to the in-cluster registry.
            - `coder` validates changes with the documented lint and render commands.
            - cluster-definition changes are pushed to the GitOps repo.
            - sandbox runtime changes are pushed to the sandbox-images repo and published to the registry before those tags are referenced from cluster config.
            - the user reviews the diff and syncs Argo CD manually.

            Important constraint:
            - `coder` executes changes;
            - `architect` should shape the work when a project needs planning or design first.
        - path: cluster-architecture.md
          content: |
            # Cluster Architecture

            The cluster centers on OpenClaw as the coordination layer and uses supporting services for durable operations.

            Important components:
            - OpenClaw for multi-agent coordination
            - Nextcloud for durable shared storage and project documentation
            - Gitea for source control, the GitOps repo, and the sandbox-images repo
            - the in-cluster registry for canonical OpenClaw sandbox image distribution
            - Argo CD for GitOps application delivery
            - shared PostgreSQL and Redis for stateful services
            - Qdrant for semantic memory and Memgraph for graph-structured long-term knowledge

            Runtime model:
            - the OpenClaw gateway owns durable state;
            - specialist execution happens through standing agents;
            - coder can use the remote Docker sandbox path for implementation work and owns the sandbox image source/publish workflow;
            - archivist curates Memgraph and the graph-linked Qdrant memory layer;
            - watchdog stays in the gateway for low-cost observation and triage.
        - path: project-documentation-model.md
          content: |
            # Project Documentation Model

            Every project should use the same separation of concerns:

            - `/Projects/<project-slug>/` is durable, curated, and long-term
            - `/Notes/<project-slug>/` is temporary, iterative, and short-term

            Durable artifacts belong in `/Projects/`, for example:
            - `spec.md`
            - `architecture.md`
            - `plan.md`
            - `decisions.md`

            Working notes belong in `/Notes/`, for example:
            - brainstorming
            - planning scratchpads
            - meeting notes
            - task breakdown drafts

            Promotion rule:
            - if something becomes important or stable, move it from `/Notes/` into `/Projects/`.
        - path: qdrant-memory-schema.md
          content: |
            # Qdrant Semantic Memory Schema

            This document defines the shared OpenClaw memory contract for the Qdrant MCP server.

            Summary:
            - all agents share one Qdrant collection for durable semantic memory;
            - retrieval is currently semantic, so text prefixes are part of the contract;
            - metadata is still required for auditability, cleanup, and future filtering.

            Required metadata:
            - `kind`
            - `domain`
            - `agent`
            - `created`

            Optional metadata:
            - `confidence`
            - `project`
            - `nc_refs`
            - `tags`
            - `supersedes`
            - `expiry`
            - `source_url`

            Stable kind vocabulary:
            - `user-preference`
            - `user-context`
            - `decision`
            - `convention`
            - `pattern`
            - `fact`
            - `plan`
            - `task-context`
            - `incident`
            - `monitor-rule`
            - `creative`
            - `relationship`
            - `reference`

            Stable domain vocabulary:
            - `real`
            - `speculative`
            - `fictional`
            - `synthetic`

            Required text format:
            - `[domain] [kind] Complete self-contained statement.`

            Guidance:
            - store durable knowledge, not transient status;
            - do not store secrets;
            - use `fictional` for creative content;
            - include Nextcloud references in both text and `nc_refs` when relevant.
        - path: knowledge-graph-schema.md
          content: |
            # Knowledge Graph Schema

            This document defines the initial canonical Memgraph schema for long-term OpenClaw knowledge.

            Stable label vocabulary:
            - `Entity`
            - `Person`
            - `User`
            - `Agent`
            - `Service`
            - `System`
            - `Project`
            - `Repository`
            - `MemoryEntry`

            Stable relationship vocabulary:
            - `HAS_MEMBER`
            - `USES`
            - `PART_OF`
            - `MANAGES`
            - `REFERS_TO`
            - `RELATES_TO`
            - `DERIVED_FROM`

            Rules:
            - prefer existing labels and relationships over inventing new ones;
            - use multiple labels when an entity belongs to several stable types;
            - attach type-specific metadata but keep canonical fields stable;
            - add `Entity` to durable nodes unless there is a strong reason not to;
            - use relationship properties such as `role`, `kind`, or `context` before inventing a new relationship type;
            - represent Qdrant memories as `MemoryEntry` nodes with their Qdrant ID in metadata;
            - connect memory nodes to entities so graph traversal and semantic search can be composed.
        - path: incidents/README.md
          content: |
            # Incident Reports

            Watchdog stores durable incident reports in this directory.

            File naming:
            - `YYYY-MM-DD-short-title.md`

            Recommended contents:
            - timeline
            - symptoms
            - suspected or confirmed cause
            - resolution
            - follow-up actions
        - path: heartbeat.json
          content: |
            {"lastActivity": "1970-01-01T00:00:00Z", "agent": "bootstrap", "status": "initial"}
        - path: budget-ledger.json
          content: |
            {
              "budgets": {
                "daily_soft_total": 12.50,
                "weekly_soft_total": 50.00,
                "monthly_hard_ceiling": 100.00,
                "per_agent_daily_soft": {
                  "main": 5.00,
                  "architect": 3.00,
                  "coder": 3.00,
                  "archivist": 1.00,
                  "watchdog": 0.50
                }
              },
              "entries": [],
              "note": "Agents append usage entries at session end. Main checks before delegating. Watchdog reads for daily digest. Format: {date, agent, tokens, estimatedCostUsd}. Monthly ceiling is the binding constraint; daily/weekly are soft."
            }
        - path: baselines.md
          content: |
            # Monitoring Baselines

            ## Gateway
            - /readyz -> HTTP 200 (expected at all times after startup)
            - Startup time: ~30-60 seconds after pod creation

            ## Sessions
            - Standing sessions after bootstrap: 5 (main, architect, coder, archivist, watchdog)
            - Cold-start session response time: 5-30 seconds (expected, not a fault)

            ## Services
            - Nextcloud: HTTP 200 at internal service URL
            - Memgraph: Bolt connection on port 7687
            - Qdrant: HTTP 200 at internal service URL

            ## Known Patterns
            - sessions_list returns 0 from sandboxed cron context (expected - sandbox isolation)
            - First heartbeat after deploy may show stale timestamp (expected - main has not run yet)

            Watchdog should update this document as new baselines are established.
        - path: escalation-rules.md
          content: |
            # Escalation Rules

            | Severity | Gate | Follow-up owner |
            | --- | --- | --- |
            | info | Expected behavior, first observation, or no user-visible impact | watchdog documents it and updates baselines if needed |
            | warning | Repeated deviation, degraded behavior, or issue needing scheduled follow-up | watchdog notifies main; main decides routing |
            | critical | User-visible outage, data-risk condition, or sustained control-plane failure | watchdog escalates to main immediately; main coordinates response |

            ## Anti-False-Positive Rules
            - Cold-start exemption: do not escalate slow first response from a newly created session if it falls within the documented cold-start baseline.
            - Sandbox isolation exemption: do not escalate `sessions_list` returning 0 from sandboxed cron context; that is expected isolation behavior.
            - 30-minute cooldown: do not re-raise the same warning or critical condition more than once within 30 minutes unless severity increases.
            - Baseline requirement: before classifying anything as a deviation, compare it against `/Projects/ai-homebase/baselines.md`. If no baseline exists, log it as info and propose a baseline instead of escalating.

            Ownership note:
            - `info` stays with `watchdog`.
            - `warning` goes from `watchdog` to `main` for prioritization and delegation.
            - `critical` goes directly to `main`, which owns immediate coordination and follow-up assignment.
      notes:
        - path: project-brief.md
          content: |
            # ai-homebase project brief

            This is the standing project for documenting and improving the cluster itself.

            Architect should keep this project current as the system evolves.
        - path: planning-backlog.md
          content: |
            # planning backlog

            Keep short-lived planning items here before they become durable project artifacts or routed tasks.

            Candidates:
            - architecture refinements
            - documentation gaps
            - workflow improvements
            - future service additions
        - path: open-questions.md
          content: |
            # open questions

            Use this note to capture unresolved design and operating questions about the cluster.

            Move resolved answers into durable project docs in `/Projects/ai-homebase/`.
  externalDatabase:
    host: platform-stack-shared-postgresql
    port: 5432
    database: nextcloud
    user: nextcloud
    passwordSecret:
      name: nextcloud-config-secrets
      key: POSTGRES_PASSWORD
  externalRedis:
    host: platform-stack-shared-redis
    port: 6379
    passwordSecret:
      name: nextcloud-config-secrets
      key: REDIS_HOST_PASSWORD
  smtp:
    host: platform-stack-postfix-relay
    port: 587
    user: ""
    secure: ""
    authType: ""
    fromAddress: noreply
    domain: example.com
    passwordSecret:
      name: ""
      key: ""

nextcloudMcp:
  enabled: true
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: true
    className: internal-nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: nextcloud-mcp.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-mcp-tls
        hosts:
          - nextcloud-mcp.homebase.local
  nextcloud:
    url: http://platform-stack-nextcloud
  authentication:
    mode: multi_user_basic
  enabledApps:
    - notes
    - webdav
    - sharing
    - tables
    - calendar

qdrant:
  enabled: true
  image:
    repository: qdrant/qdrant
    tag: "v1.17.1"
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: internal-nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: qdrant.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: qdrant-tls
        hosts:
          - qdrant.homebase.local
  persistence:
    enabled: true
    size: 100Gi

qdrantMcp:
  enabled: true
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: internal-nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: qdrant-mcp.homebase.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: qdrant-mcp-tls
        hosts:
          - qdrant-mcp.homebase.local
  qdrant:
    url: http://platform-stack-qdrant:6333
    collectionName: openclaw-memory
  embedding:
    provider: fastembed
    model: BAAI/bge-base-en-v1.5
  toolDescriptions:
    store: |
      Store a memory for cross-agent recall. Use this to preserve durable knowledge such as user preferences, decisions, conventions, patterns, incidents, plans, creative content, and reusable context.

      REQUIRED: The `information` parameter must begin with domain and kind tags in brackets, followed by a complete statement:
        [real|speculative|fictional|synthetic] [user-preference|user-context|decision|convention|pattern|fact|plan|task-context|incident|monitor-rule|creative|relationship|reference] Your memory text here.

      REQUIRED: The `metadata` parameter must be a JSON object with at minimum:
        {"kind": "...", "domain": "...", "agent": "...", "created": "ISO-8601"}

      Optional metadata: confidence (high|medium|low), project, tags (array), nc_refs (array of {type, id, path, label}), supersedes, expiry, source_url.

      Guidelines:
      - Store facts you would want any agent to recall weeks later.
      - Do not store ephemeral task status, transient tool output, or easily re-derivable information.
      - Do not store secrets or credentials.
      - For fictional or creative content, always use domain `fictional`.
      - If correcting a prior memory, include `supersedes` in metadata and mention the correction in the text.
      - Include Nextcloud references in both the text and `nc_refs` metadata when relevant.
    find: |
      Search shared semantic memory across all agents. Returns memories ranked by relevance.

      Use this tool before answering questions about user preferences, prior decisions, established conventions, past incidents, project history, people and relationships, creative worlds, or anything that may have been stored previously.

      Query tips:
      - Include a domain tag when useful: `[real] user's preferred editor` or `[fictional] Ashenmoor political structure`
      - Include a kind tag when useful: `[decision] database choice for Nextcloud`
      - Use natural language for broad recall.
      - Be specific when possible.
      - If results mix real and fictional content, re-query with an explicit `[real]` or `[fictional]` prefix.

      Important:
      - This searches all memories from all agents.
      - Retrieval is currently semantic, not metadata-filtered, so phrasing matters.
      - Returned memories include metadata such as kind, domain, agent, confidence, and Nextcloud references.
      - Treat speculative or low-confidence results cautiously.
      - Treat expired memories as potentially stale.

