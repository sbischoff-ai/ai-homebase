# Homelab overlay: public Nextcloud (dedicated cloud.<domain> host, no subpath), VPN-only access for internal/admin services.
# Layer this after charts/platform-stack/values-dev.yaml.

global:
  domain: homebase.example.com
  hosts:
    openclaw: openclaw.vpn.homebase.internal
    openhands: openhands.vpn.homebase.internal
    nextcloud: cloud.homebase.example.com
    gitea: gitea.vpn.homebase.internal
    paperlessNgx: paperless.vpn.homebase.internal
    infisical: infisical.vpn.homebase.internal
    wgEasy: wg.homebase.example.com

nextcloud:
  enabled: true
  persistence:
    enabled: true
    size: 100Gi
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: cloud.homebase.example.com
    hosts:
      - host: cloud.homebase.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-tls
        hosts:
          - cloud.homebase.example.com
  trustedDomains:
    - cloud.homebase.example.com
  admin:
    user: admin
    passwordSecret:
      name: nextcloud-app-secrets
      key: NEXTCLOUD_ADMIN_PASSWORD
  externalDatabase:
    passwordSecret:
      name: nextcloud-app-secrets
      key: POSTGRES_PASSWORD
  externalRedis:
    passwordSecret:
      name: nextcloud-app-secrets
      key: REDIS_HOST_PASSWORD

openclaw:
  enabled: true
  ingress:
    enabled: true
    className: internal-nginx
    annotations: {}
    hosts:
      - host: openclaw.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-vpn-tls
        hosts:
          - openclaw.vpn.homebase.internal
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.vpn.homebase.internal

openhands:
  enabled: false
  ingress:
    enabled: true
    hostName: openhands.vpn.homebase.internal
    ingressClassName: internal-nginx
    annotations: {}
    tls:
      - secretName: openhands-vpn-tls
        hosts:
          - openhands.vpn.homebase.internal

gitea:
  enabled: false
  gitea:
    enabled: true
    ingress:
      enabled: true
      className: internal-nginx
      annotations: {}
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: gitea-vpn-tls
          hosts:
            - gitea.vpn.homebase.internal

paperlessNgx:
  enabled: false
  service:
    type: ClusterIP
  ingress:
    enabled: false
    className: internal-nginx
    annotations: {}
    hosts:
      - host: paperless.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: paperless-vpn-tls
        hosts:
          - paperless.vpn.homebase.internal

infisical:
  enabled: true
  ingress:
    enabled: true
    hostName: infisical.vpn.homebase.internal
    ingressClassName: internal-nginx
    annotations: {}
    tls:
      - secretName: infisical-vpn-tls
        hosts:
          - infisical.vpn.homebase.internal

wgEasy:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: wg.homebase.example.com
    hosts:
      - host: wg.homebase.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: wg-easy-tls
        hosts:
          - wg.homebase.example.com
