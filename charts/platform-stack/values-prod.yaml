global:
  imagePullSecrets: []
  storageClass: premium-rwo
  domain: prod.example.com
  hosts:
    openclaw: openclaw.prod.example.com
    openhands: openhands.prod.example.com
    nextcloud: nextcloud.prod.example.com
    gitea: gitea.prod.example.com
    paperless: paperless.prod.example.com
    paperlessNgx: paperless.prod.example.com
    infisical: infisical.prod.example.com
    wg: wg.prod.example.com
    vpn: wg.prod.example.com
    wgEasy: wg.prod.example.com
  commonLabels:
    environment: production

openclaw:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: 25m
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: openclaw.prod.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-prod-tls
        hosts:
          - openclaw.prod.example.com
  persistence:
    enabled: true
    size: 50Gi
    storageClass: premium-rwo
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  networkPolicy:
    enabled: true
    policyTypes:
      - Ingress
      - Egress
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  existingSecret: openclaw-app-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ANTHROPIC_API_KEY
    googleApiKey: GOOGLE_API_KEY
    tavilyApiKey: TAVILY_API_KEY
    braveSearchApiKey: BRAVE_SEARCH_API_KEY
  secretRefs: []
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.prod.example.com


openhands:
  enabled: true
  replicaCount: 2
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
  # OpenHands UI/API should be exposed when the service is enabled.
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: openhands.prod.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  workspace:
    enabled: true
    size: 100Gi
    storageClass: premium-rwo
  queue:
    enabled: true
    provider: "<set-provider>"
    endpoint: "<set-endpoint>"
    queueName: openhands-jobs
    dlqName: openhands-jobs-deadletter
    workerConcurrency: 10
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Mirror workerIsolation.* into OpenHands scheduling fields.
  runtimeClassName: gvisor
  nodeSelector:
    workload-tier: isolated
  tolerations:
    - key: workload-tier
      operator: Equal
      value: isolated
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - platform-stack
            topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 750m
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 4Gi

nextcloud:
  enabled: false
  image:
    repository: ghcr.io/example/nextcloud
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: nextcloud.prod.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-prod-tls
        hosts:
          - nextcloud.prod.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 200Gi
    storageClass: premium-rwo
    annotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    liveness:
      enabled: true
      path: /status.php
    readiness:
      enabled: true
      path: /status.php
  existingSecret: nextcloud-app-secrets
  secretRefs: []

gitea:
  enabled: false
  image:
    repository: ghcr.io/example/gitea
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: gitea.prod.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gitea-prod-tls
        hosts:
          - gitea.prod.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 100Gi
    storageClass: premium-rwo
    annotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    liveness:
      enabled: true
      path: /api/healthz
    readiness:
      enabled: true
      path: /api/healthz
  existingSecret: gitea-app-secrets
  secretRefs: []

paperlessNgx:
  enabled: false
  image:
    repository: ghcr.io/example/paperless-ngx
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: paperless.prod.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: paperlessngx-prod-tls
        hosts:
          - paperless.prod.example.com
  persistence:
    data:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 100Gi
      storageClass: premium-rwo
    media:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 500Gi
      storageClass: premium-rwo
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  probes:
    liveness:
      enabled: true
      path: /api/health/
    readiness:
      enabled: true
      path: /api/health/
  existingSecret: paperlessngx-app-secrets
  secretRefs: []

infisical:
  enabled: false
  image:
    repository: ghcr.io/example/infisical
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: infisical.prod.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: infisical-prod-tls
        hosts:
          - infisical.prod.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 20Gi
    storageClass: premium-rwo
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    liveness:
      enabled: true
      path: /api/status
    readiness:
      enabled: true
      path: /api/status
  existingSecret: infisical-app-secrets
  secretRefs: []

wgEasy:
  enabled: false
  image:
    repository: ghcr.io/example/wg-easy
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    wireguardPort: 51820
    uiPort: 51821
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: wg.prod.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: wgeasy-prod-tls
        hosts:
          - wg.prod.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 20Gi
    storageClass: premium-rwo
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      enabled: true
      path: /
    readiness:
      enabled: true
      path: /
  existingSecret: wgeasy-app-secrets
  secretRefs: []

externalSecrets:
  enabled: true
  secretStoreRef:
    name: prod-secrets-store
    kind: ClusterSecretStore
  refreshInterval: 10m
  mappings:
    - name: openclaw-app
      targetSecretName: openclaw-app-secrets
      remoteRef:
        key: prod/openclaw/app
    - name: openhands-app
      targetSecretName: openhands-app-secrets
      remoteRef:
        key: prod/openhands/app

observability:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
  logging:
    enabled: true
    destination: central-logging

persistence:
  enabled: true
  snapshots:
    enabled: true
  backups:
    enabled: true
    schedule: "0 */6 * * *"

autoscaling:
  enabled: true
  profile: prod-high-availability

workerIsolation:
  enabled: true
  runtimeClassName: gvisor
  nodeSelector:
    workload-tier: isolated
  tolerations:
    - key: workload-tier
      operator: Equal
      value: isolated
      effect: NoSchedule
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                    - platform-stack
            topologyKey: kubernetes.io/hostname
