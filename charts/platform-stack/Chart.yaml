apiVersion: v2
name: platform-stack
description: Umbrella Helm chart for platform services
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: openclaw
    version: 0.1.0
    repository: file://../openclaw
    condition: openclaw.enabled
  - name: openhands
    version: 0.1.0
    repository: file://../openhands
    condition: openhands.enabled
  - name: nextcloud
    version: 0.1.0
    repository: file://../nextcloud
    condition: nextcloud.enabled
  - name: gitea
    version: 0.1.0
    repository: file://../gitea
    condition: gitea.enabled
  - name: paperless-ngx
    version: 0.1.0
    repository: file://../paperless-ngx
    condition: paperlessNgx.enabled
  - name: infisical
    version: 0.2.0
    repository: file://../infisical
    condition: infisical.enabled
  - name: wg-easy
    version: 0.1.0
    repository: file://../wg-easy
    condition: wgEasy.enabled
  - name: postgresql
    version: 16.7.21
    repository: oci://registry-1.docker.io/bitnamicharts
    alias: sharedPostgresql
    condition: sharedPostgresql.enabled
  - name: redis
    version: 21.2.13
    repository: oci://registry-1.docker.io/bitnamicharts
    alias: sharedRedis
    condition: sharedRedis.enabled
