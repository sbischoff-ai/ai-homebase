apiVersion: v2
name: platform-stack
description: Umbrella Helm chart for platform services
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: cert-manager
    version: v1.20.0
    repository: oci://quay.io/jetstack/charts
    condition: certManager.enabled
  - name: openclaw
    version: 0.1.2
    repository: file://../openclaw
    condition: openclaw.enabled
  - name: argo-cd
    version: 0.1.0
    repository: file://../argo-cd
    alias: argoCd
    condition: argoCd.enabled
  - name: nextcloud
    version: 0.1.0
    repository: file://../nextcloud
    condition: nextcloud.enabled
  - name: nextcloud-mcp
    version: 0.1.0
    repository: file://../nextcloud-mcp
    alias: nextcloudMcp
    condition: nextcloudMcp.enabled
  - name: gitea
    version: 0.1.0
    repository: file://../gitea
    condition: gitea.enabled
  - name: registry
    version: 0.1.0
    repository: file://../registry
    condition: registry.enabled
  - name: vaultwarden
    version: 0.1.0
    repository: file://../vaultwarden
    condition: vaultwarden.enabled
  - name: postfix-relay
    version: 0.1.0
    repository: file://../postfix-relay
    alias: postfixRelay
    condition: postfixRelay.enabled
  - name: paperless-ngx
    version: 0.1.0
    repository: file://../paperless-ngx
    alias: paperlessNgx
    condition: paperlessNgx.enabled
  - name: qdrant
    version: 0.1.0
    repository: file://../qdrant
    condition: qdrant.enabled
  - name: qdrant-mcp
    version: 0.1.0
    repository: file://../qdrant-mcp
    alias: qdrantMcp
    condition: qdrantMcp.enabled
  - name: memgraph
    version: 0.1.0
    repository: file://../memgraph
    condition: memgraph.enabled
  - name: memgraph-lab
    version: 0.1.0
    repository: file://../memgraph-lab
    alias: memgraphLab
    condition: memgraphLab.enabled
  - name: shared-postgresql
    version: 0.1.0
    repository: file://../shared-postgresql
    alias: sharedPostgresql
    condition: sharedPostgresql.enabled
  - name: shared-redis
    version: 0.1.0
    repository: file://../shared-redis
    alias: sharedRedis
    condition: sharedRedis.enabled
