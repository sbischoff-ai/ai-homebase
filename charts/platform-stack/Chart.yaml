apiVersion: v2
name: platform-stack
description: Umbrella Helm chart for platform services
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: cert-manager
    version: v1.20.0
    repository: oci://quay.io/jetstack/charts
    condition: certManager.enabled
  - name: openclaw
    version: 0.1.0
    repository: file://../openclaw
    condition: openclaw.enabled
  - name: argo-cd
    version: 0.1.0
    repository: file://../argo-cd
    alias: argoCd
    condition: argoCd.enabled
  - name: nextcloud
    version: 0.1.0
    repository: file://../nextcloud
    condition: nextcloud.enabled
  - name: gitea
    version: 0.1.0
    repository: file://../gitea
    condition: gitea.enabled
  - name: vaultwarden
    version: 0.1.0
    repository: file://../vaultwarden
    condition: vaultwarden.enabled
  - name: postfix-relay
    version: 0.1.0
    repository: file://../postfix-relay
    alias: postfixRelay
    condition: postfixRelay.enabled
  - name: paperless-ngx
    version: 0.1.0
    repository: file://../paperless-ngx
    alias: paperlessNgx
    condition: paperlessNgx.enabled
  - name: shared-postgresql
    version: 0.1.0
    repository: file://../shared-postgresql
    alias: sharedPostgresql
    condition: sharedPostgresql.enabled
  - name: shared-redis
    version: 0.1.0
    repository: file://../shared-redis
    alias: sharedRedis
    condition: sharedRedis.enabled
