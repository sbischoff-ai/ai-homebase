global:
  imagePullSecrets:
    - acr-pull
  storageClass: managed-csi
  domain: aks.example.com
  hosts:
    openclaw: openclaw.aks.example.com
    openhands: openhands.aks.example.com
    nextcloud: nextcloud.aks.example.com
    gitea: gitea.aks.example.com
    paperless: paperless.aks.example.com
    paperlessNgx: paperless.aks.example.com
    infisical: infisical.aks.example.com
    wg: wg.aks.example.com
    vpn: wg.aks.example.com
    wgEasy: wg.aks.example.com
  commonLabels:
    platform: aks

openclaw:
  enabled: true
  image:
    repository: myregistry.azurecr.io/openclaw
    tag: stable
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: openclaw.aks.example.com
    hosts:
      - host: openclaw.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.aks.example.com
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "<openclaw-workload-identity-client-id>"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: managed-csi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

openhands:
  enabled: true
  image:
    repository: myregistry.azurecr.io/openhands
    tag: stable
    pullPolicy: IfNotPresent
  service:
    enabled: true
    type: ClusterIP
  # OpenHands is intentionally internal-only by default.
  # Keep ingress disabled unless a controlled external entrypoint is required.
  ingress:
    enabled: false
    className: nginx
    annotations:
      kubernetes.io/ingress.class: internal
    hosts:
      - host: openhands.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "<openhands-workload-identity-client-id>"
  workspace:
    enabled: true
    size: 50Gi
    storageClass: managed-csi
  queue:
    enabled: true
    provider: azure-servicebus
    endpoint: sb://<namespace>.servicebus.windows.net/
    queueName: openhands-jobs
    dlqName: openhands-jobs-deadletter
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Mirror workerIsolation.* into OpenHands scheduling fields.
  runtimeClassName: kata-cc
  nodeSelector:
    kubernetes.azure.com/mode: user
    workload-tier: isolated
  tolerations:
    - key: workload-tier
      operator: Equal
      value: isolated
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload-tier
                operator: In
                values:
                  - isolated

nextcloud:
  enabled: false
  image:
    repository: myregistry.azurecr.io/nextcloud
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: nextcloud.aks.example.com
    hosts:
      - host: nextcloud.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-tls
        hosts:
          - nextcloud.aks.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    storageClass: managed-csi
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /status.php
    readiness:
      enabled: true
      path: /status.php
  secretRefs:
    existingSecret: nextcloud-app-secrets

gitea:
  enabled: false
  image:
    repository: myregistry.azurecr.io/gitea
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: gitea.aks.example.com
    hosts:
      - host: gitea.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: gitea-tls
        hosts:
          - gitea.aks.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    storageClass: managed-csi
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/healthz
    readiness:
      enabled: true
      path: /api/healthz
  secretRefs:
    existingSecret: gitea-app-secrets

paperlessNgx:
  enabled: false
  image:
    repository: myregistry.azurecr.io/paperless-ngx
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: paperless.aks.example.com
    hosts:
      - host: paperless.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: paperlessngx-tls
        hosts:
          - paperless.aks.example.com
  persistence:
    data:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 30Gi
      storageClass: managed-csi
    media:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 100Gi
      storageClass: managed-csi
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/health/
    readiness:
      enabled: true
      path: /api/health/
  secretRefs:
    existingSecret: paperlessngx-app-secrets

infisical:
  enabled: false
  image:
    repository: myregistry.azurecr.io/infisical
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: infisical.aks.example.com
    hosts:
      - host: infisical.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: infisical-tls
        hosts:
          - infisical.aks.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
    storageClass: managed-csi
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/status
    readiness:
      enabled: true
      path: /api/status
  secretRefs:
    existingSecret: infisical-app-secrets

wgEasy:
  enabled: false
  image:
    repository: myregistry.azurecr.io/wg-easy
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    webPort: 51821
    webTargetPort: 51821
    vpnPort: 51820
    vpnTargetPort: 51820
    annotations: {}
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: wg.aks.example.com
    hosts:
      - host: wg.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: wgeasy-tls
        hosts:
          - wg.aks.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
    storageClass: managed-csi
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /
    readiness:
      enabled: true
      path: /
  secretRefs:
    existingSecret: wgeasy-app-secrets

externalSecrets:
  enabled: true
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  refreshInterval: 15m
  mappings:
    - name: openclaw-secrets
      targetSecretName: openclaw-app-secrets
      remoteRef:
        key: kv-openclaw
    - name: openhands-secrets
      targetSecretName: openhands-app-secrets
      remoteRef:
        key: kv-openhands

observability:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
  logging:
    enabled: true
    destination: azure-monitor

persistence:
  enabled: true
  snapshots:
    enabled: true
  backups:
    enabled: true
    schedule: "0 2 * * *"

autoscaling:
  enabled: true
  profile: aks-balanced

workerIsolation:
  enabled: true
  runtimeClassName: kata-cc
  nodeSelector:
    kubernetes.azure.com/mode: user
    workload-tier: isolated
  tolerations:
    - key: workload-tier
      operator: Equal
      value: isolated
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload-tier
                operator: In
                values:
                  - isolated
