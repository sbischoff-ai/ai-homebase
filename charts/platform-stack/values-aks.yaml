global:
  imagePullSecrets:
    - acr-pull
  storageClass: managed-csi
  domain: aks.example.com
  hosts:
    openclaw: openclaw.aks.example.com
    openhands: openhands.aks.example.com
    nextcloud: nextcloud.aks.example.com
    gitea: gitea.vpn.homebase.internal
    paperlessNgx: paperless.aks.example.com
    infisical: infisical.aks.example.com
    wgEasy: wg.aks.example.com
  commonLabels:
    platform: aks

openclaw:
  enabled: true
  replicaCount: 1
  image:
    repository: myregistry.azurecr.io/openclaw
    tag: stable
    pullPolicy: IfNotPresent
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: openclaw.aks.example.com
    hosts:
      - host: openclaw.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.aks.example.com
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "<openclaw-workload-identity-client-id>"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: managed-csi
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  existingSecret: openclaw-app-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: ""
    anthropicApiKey: ""
    googleApiKey: ""
    tavilyApiKey: ""
    braveSearchApiKey: ""
  secretRefs: []
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.aks.example.com


openhands:
  enabled: true
  image:
    repository: ghcr.io/openhands/openhands
    tag: "1.5.0"
    pullPolicy: IfNotPresent
  service:
    enabled: true
    type: ClusterIP
  # Enable OpenHands ingress only for environments that intentionally expose a private/internal endpoint.
  ingress:
    enabled: false
    hostName: openhands.aks.example.com
    ingressClassName: nginx
    annotations: {}
    tls: []
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: "<openhands-workload-identity-client-id>"
  persistence:
    enabled: true
    size: 50Gi
    storageClass: managed-csi
  queue:
    enabled: true
    provider: azure-servicebus
    endpoint: sb://<namespace>.servicebus.windows.net/
    queueName: openhands-jobs
    dlqName: openhands-jobs-deadletter
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  runtimeClassName: kata-cc
  nodeSelector:
    kubernetes.azure.com/mode: user
    workload-tier: isolated
  tolerations:
    - key: workload-tier
      operator: Equal
      value: isolated
      effect: NoSchedule
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload-tier
                operator: In
                values:
                  - isolated

nextcloud:
  enabled: false
  image:
    repository: myregistry.azurecr.io/nextcloud
    tag: stable
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: nextcloud.aks.example.com
    hosts:
      - host: nextcloud.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-tls
        hosts:
          - nextcloud.aks.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 100Gi
    storageClass: managed-csi
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /status.php
    readiness:
      enabled: true
      path: /status.php
  existingSecret: nextcloud-app-secrets
  secretRefs: []

gitea:
  enabled: false
  gitea:
    enabled: true
    image:
      repository: myregistry.azurecr.io/gitea
      tag: stable
      pullPolicy: IfNotPresent
    service:
      http:
        type: ClusterIP
        port: 3000
    ingress:
      enabled: true
      className: internal-nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/hostname: gitea.vpn.homebase.internal
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: gitea-vpn-tls
          hosts:
            - gitea.vpn.homebase.internal
    persistence:
      enabled: true
      size: 20Gi
      storageClass: managed-csi
    admin:
      username: git-admin
      existingSecret: gitea-app-secrets
    config:
      database:
        DB_TYPE: postgres
        HOST: platform-stack-shared-postgresql:5432
        NAME: gitea
        USER: gitea
      session:
        PROVIDER: redis
      cache:
        ENABLED: true
        ADAPTER: redis
      queue:
        TYPE: redis
      global_lock:
        SERVICE_TYPE: redis
      service:
        DISABLE_REGISTRATION: true
    additionalConfigFromEnvs:
      - GITEA__database__PASSWD
      - GITEA__session__PROVIDER_CONFIG
      - GITEA__cache__HOST
      - GITEA__queue__CONN_STR
      - GITEA__global_lock__SERVICE_CONN_STR
    additionalConfigSources: []
    postgresql:
      enabled: false
      primary:
        persistence:
          enabled: true
          size: 20Gi
          storageClass: managed-csi
    postgresql-ha:
      enabled: false
    redis:
      enabled: false
    redis-cluster:
      enabled: false

paperlessNgx:
  enabled: false
  image:
    repository: paperlessngx/paperless-ngx
    tag: "2.20"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: paperless.aks.example.com
    hosts:
      - host: paperless.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: paperlessngx-tls
        hosts:
          - paperless.aks.example.com
  persistence:
    data:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 30Gi
      storageClass: managed-csi
    media:
      enabled: true
      existingClaim: ""
      accessModes: ["ReadWriteOnce"]
      size: 100Gi
      storageClass: managed-csi
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/health/
    readiness:
      enabled: true
      path: /api/health/
  existingSecret: paperlessngx-app-secrets
  secretRefs: []

infisical:
  enabled: true
  infisical:
    enabled: true
    image:
      repository: myregistry.azurecr.io/infisical
      tag: stable
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
    resources: {}
    autoBootstrap:
      enabled: false
      organization: default-org
      credentialSecret:
        name: infisical-bootstrap-credentials
      secretDestination:
        name: infisical-bootstrap-secret
        namespace: default
    kubeSecretRef: infisical-app-secrets
  ingress:
    enabled: true
    hostName: infisical.aks.example.com
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: infisical.aks.example.com
    tls:
      - secretName: infisical-tls
        hosts:
          - infisical.aks.example.com
    nginx:
      enabled: false
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: true
        size: 10Gi
        storageClass: managed-csi
  redis:
    enabled: false

wgEasy:
  enabled: true
  image:
    repository: myregistry.azurecr.io/wg-easy
    tag: stable
    pullPolicy: IfNotPresent
  service:
    # Keep baseline service private. Use the AKS UDP exposure example overlay
    # (examples/aks.wg-easy-udp-lb.override.yaml) to publish the VPN endpoint
    # with constrained source ranges in real environments.
    type: ClusterIP
    wireguardPort: 51820
    uiPort: 51821
    annotations: {}
  ingress:
    # Keep the web UI private by default on AKS; access it through the VPN
    # tunnel after the UDP endpoint is published.
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: wg.aks.example.com
    hosts:
      - host: wg.aks.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: wgeasy-tls
        hosts:
          - wg.aks.example.com
  persistence:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
    storageClass: managed-csi
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /
    readiness:
      enabled: true
      path: /
  existingSecret: wgeasy-app-secrets
  secretRefs: []
