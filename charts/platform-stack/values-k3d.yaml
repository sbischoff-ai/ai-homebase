>>>>>>> main
  existingSecret: openclaw-app-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ""
    googleApiKey: ""
    tavilyApiKey: ""
    braveSearchApiKey: ""
  secretRefs: []
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - http://openclaw.localtest.me


openhands:
  enabled: true
  # Local internal ingress mirrors OpenClaw ingress class/annotation convention.
  ingress:
    enabled: true
    hostName: openhands.localtest.me
    ingressClassName: nginx
    annotations: {}
    tls: []
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi

nextcloud:
  enabled: false
  persistence:
    enabled: false

gitea:
  enabled: false
  gitea:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    admin:
      username: git-admin
      existingSecret: ""
    config:
      database:
        DB_TYPE: postgres
        HOST: platform-stack-shared-postgresql:5432
        NAME: gitea
        USER: gitea
      session:
        PROVIDER: redis
      cache:
        ENABLED: true
        ADAPTER: redis
      queue:
        TYPE: redis
      global_lock:
        SERVICE_TYPE: redis
      service:
        DISABLE_REGISTRATION: true
    additionalConfigFromEnvs:
      - GITEA__database__PASSWD
      - GITEA__session__PROVIDER_CONFIG
      - GITEA__cache__HOST
      - GITEA__queue__CONN_STR
      - GITEA__global_lock__SERVICE_CONN_STR
    additionalConfigSources: []
    postgresql:
      enabled: false
      primary:
        persistence:
          enabled: true
          size: 10Gi
          storageClass: ""
    postgresql-ha:
      enabled: false
    redis:
      enabled: false
    redis-cluster:
      enabled: false

paperlessNgx:
  enabled: false
  service:
    type: ClusterIP
  persistence:
    data:
      enabled: false
    media:
      enabled: false
    consume:
      enabled: false
    export:
      enabled: false

infisical:
  enabled: true
  ingress:
    enabled: true
    hostName: infisical.localtest.me
    ingressClassName: nginx
    annotations: {}
    tls: []
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: false
  redis:
    enabled: false

wgEasy:
  enabled: true
  persistence:
    enabled: false
