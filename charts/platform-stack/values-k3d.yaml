# k3d overlay for local smoke tests.
# Load this after charts/platform-stack/values.yaml.

global:
  domain: localtest.me
  hosts:
    openclaw: openclaw.localtest.me
    nextcloud: nextcloud.localtest.me
    nextcloudMcp: nextcloud-mcp.localtest.me
    qdrant: qdrant.localtest.me
    qdrantMcp: qdrant-mcp.localtest.me
    memgraph: memgraph.localtest.me
    memgraphLab: memgraph-lab.localtest.me
    gitea: gitea.localtest.me
    registry: registry.localtest.me
    argocd: argocd.localtest.me
    vaultwarden: vaultwarden.localtest.me
    paperlessNgx: paperless.localtest.me

openclaw:
  enabled: true
  replicaCount: 1
  image:
    repository: openclaw-remote-docker
    tag: "trixie-slim"
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: openclaw.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.localtest.me
  persistence:
    enabled: true
    hostPath: /var/lib/ai-homebase/openclaw-state
  remoteDocker:
    enabled: true
    dockerHost: ssh://docker-remote@host.k3d.internal:2222
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi
  env:
    - name: NODE_OPTIONS
      value: --max-old-space-size=2048
    - name: MEMGRAPH_HOST
      value: '{{ printf "%s-memgraph" .Release.Name | trunc 63 | trimSuffix "-" }}'
    - name: MEMGRAPH_PORT
      value: "7687"
    - name: MEMGRAPH_BOLT_URI
      value: 'bolt://{{ printf "%s-memgraph" .Release.Name | trunc 63 | trimSuffix "-" }}:7687'
  existingSecret: openclaw-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ANTHROPIC_API_KEY
    braveApiKey: BRAVE_API_KEY
    moonshotApiKey: MOONSHOT_API_KEY
    perplexityApiKey: PERPLEXITY_API_KEY
    geminiApiKey: GEMINI_API_KEY
    xaiApiKey: XAI_API_KEY
    githubToken: GITHUB_TOKEN
  secretRefs:
    - name: openclaw-nextcloud-mcp-secrets
      key: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
      envVar: OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER
    - name: coder-credentials
      key: CODER_GITEA_PASSWORD
      envVar: CODER_GITEA_PASSWORD
    - name: coder-credentials
      key: CODER_REGISTRY_PASSWORD
      envVar: CODER_REGISTRY_PASSWORD
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.localtest.me
      trustedProxies:
        - 10.42.0.0/16
    mcp:
      servers:
        nextcloud:
          args:
            - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL}
            - --url
            - ${OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL}
            - --header
            - Authorization=${OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER}
    agents:
      defaults:
        sandbox:
          docker:
            env:
              MEMGRAPH_HOST: memgraph.localtest.me
              MEMGRAPH_PORT: "7687"
              MEMGRAPH_BOLT_URI: bolt://memgraph.localtest.me:7687
              QDRANT_URL: http://qdrant.localtest.me
              QDRANT_COLLECTION: openclaw-memory
              QDRANT_API_KEY: ${QDRANT_API_KEY}


nextcloud:
  enabled: true
  ingress:
    private:
      enabled: true
      className: nginx
      host: nextcloud.localtest.me
    public:
      enabled: false
  trustedDomains:
    - nextcloud.localtest.me
  trustedProxies:
    - 10.42.0.0/16
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path

nextcloudMcp:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: nextcloud-mcp.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-mcp-tls
        hosts:
          - nextcloud-mcp.localtest.me

qdrant:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: qdrant.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: qdrant-tls
        hosts:
          - qdrant.localtest.me
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path

qdrantMcp:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: qdrant-mcp.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: qdrant-mcp-tls
        hosts:
          - qdrant-mcp.localtest.me

memgraph:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: memgraph.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: memgraph-tls
        hosts:
          - memgraph.localtest.me
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path

memgraphLab:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: memgraph-lab.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: memgraph-lab-tls
        hosts:
          - memgraph-lab.localtest.me

argoCd:
  enabled: false
  argocd:
    redis:
      enabled: true
    redis-ha:
      enabled: false
    server:
      ingress:
        enabled: true
        ingressClassName: nginx
        hostname: argocd.localtest.me
        tls: false

gitea:
  enabled: true
  gitea:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: gitea.localtest.me
          paths:
            - path: /
              pathType: Prefix
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path
    admin:
      username: git-admin
      existingSecret: ""

registry:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: registry.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: registry-tls
        hosts:
          - registry.localtest.me
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path

vaultwarden:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    hosts:
      - host: vaultwarden.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: vaultwarden-tls
        hosts:
          - vaultwarden.localtest.me
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path

postfixRelay:
  enabled: true

paperlessNgx:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: paperless.localtest.me
        paths:
          - path: /
            pathType: Prefix
  persistence:
    data:
      enabled: true
      size: 5Gi
      storageClass: local-path
    media:
      enabled: true
      size: 10Gi
      storageClass: local-path
    consume:
      enabled: true
      size: 2Gi
      storageClass: local-path
    export:
      enabled: true
      size: 2Gi
      storageClass: local-path
