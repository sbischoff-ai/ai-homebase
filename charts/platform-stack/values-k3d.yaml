# k3d overlay for local smoke tests.
# Core app services keep their real upstream images; tune resources/storage here for local runs.
#
# Values precedence contract (lowest -> highest):
# 1) charts/platform-stack/values.yaml
# 2) charts/platform-stack/values-dev.yaml
# 3) charts/platform-stack/values-k3d.yaml
# 4) optional user override file(s) (for example: examples/k3d.values.override.yaml)
#
# Usage:
# helm upgrade --install platform-stack charts/platform-stack \
#   -n ai-homebase \
#   -f charts/platform-stack/values-dev.yaml \
#   -f charts/platform-stack/values-k3d.yaml \
#   -f examples/k3d.values.override.yaml

global:
  domain: localtest.me
  hosts:
    openclaw: openclaw.localtest.me
    openhands: openhands.localtest.me
    nextcloud: nextcloud.localtest.me
    gitea: gitea.vpn.homebase.internal
    paperlessNgx: paperless.localtest.me
    infisical: infisical.localtest.me
    wgEasy: wg.localtest.me

openclaw:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/openclaw/openclaw
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: openclaw.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: false
  probes:
    liveness:
      enabled: true
      path: /healthz
    readiness:
      enabled: true
      path: /readyz
    startup:
      enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL
  existingSecret: openclaw-app-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: ""
    anthropicApiKey: ""
    googleApiKey: ""
    tavilyApiKey: ""
    braveSearchApiKey: ""
  secretRefs: []
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - http://openclaw.localtest.me


openhands:
  enabled: true
  image:
    repository: ghcr.io/all-hands-ai/openhands
  service:
    enabled: true
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  # Local internal ingress mirrors OpenClaw ingress class/annotation convention.
  ingress:
    enabled: true
    hostName: openhands.localtest.me
    ingressClassName: nginx
    annotations: {}
    tls: []
  persistence:
    enabled: false
  probes:
    liveness:
      enabled: true
      type: tcp
      port: 3000
    readiness:
      enabled: true
      type: tcp
      port: 3000
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  securityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    capabilities:
      drop:
        - ALL

nextcloud:
  enabled: false
  persistence:
    enabled: false

gitea:
  enabled: false
  gitea:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    admin:
      username: git-admin
      existingSecret: ""
    config:
      database:
        DB_TYPE: postgres
        HOST: platform-stack-shared-postgresql:5432
        NAME: gitea
        USER: gitea
      session:
        PROVIDER: redis
      cache:
        ENABLED: true
        ADAPTER: redis
      queue:
        TYPE: redis
      global_lock:
        SERVICE_TYPE: redis
      service:
        DISABLE_REGISTRATION: true
    additionalConfigFromEnvs:
      - GITEA__database__PASSWD
      - GITEA__session__PROVIDER_CONFIG
      - GITEA__cache__HOST
      - GITEA__queue__CONN_STR
      - GITEA__global_lock__SERVICE_CONN_STR
    additionalConfigSources: []
    postgresql:
      enabled: false
      primary:
        persistence:
          enabled: true
          size: 10Gi
          storageClass: ""
    postgresql-ha:
      enabled: false
    redis:
      enabled: false
    redis-cluster:
      enabled: false

paperlessNgx:
  enabled: false
  service:
    type: ClusterIP
  persistence:
    data:
      enabled: false
    media:
      enabled: false
    consume:
      enabled: false
    export:
      enabled: false

infisical:
  enabled: true
  ingress:
    enabled: true
    hostName: infisical.localtest.me
    ingressClassName: nginx
    annotations: {}
    tls: []
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: false
  redis:
    enabled: false

wgEasy:
  enabled: true
  persistence:
    enabled: false
