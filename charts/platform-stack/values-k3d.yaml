# k3d overlay for local smoke tests.
# Load this after charts/platform-stack/values.yaml.

global:
  domain: localtest.me
  hosts:
    openclaw: openclaw.localtest.me
    openhands: openhands.localtest.me
    nextcloud: nextcloud.localtest.me
    gitea: gitea.vpn.homebase.internal
    paperlessNgx: paperless.localtest.me
    infisical: infisical.localtest.me
    wgEasy: wg.localtest.me

openclaw:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: false
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi
  existingSecret: openclaw-app-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ""
    googleApiKey: ""
    tavilyApiKey: ""
    braveSearchApiKey: ""
  secretRefs: []
  hostDockerSocket:
    enabled: true
    hostPath: /var/run/docker.sock
    mountPath: /var/run/docker.sock
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - http://openclaw.localtest.me
    agents:
      defaults:
        sandbox:
          mode: non-main

openhands:
  enabled: true
  ingress:
    enabled: true
    hostName: openhands.localtest.me
    ingressClassName: nginx
    annotations: {}
    tls: []
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi
  hostDockerSocket:
    enabled: true
    hostPath: /var/run/docker.sock
    mountPath: /var/run/docker.sock

nextcloud:
  enabled: false
  persistence:
    enabled: false

gitea:
  enabled: false

paperlessNgx:
  enabled: false
  persistence:
    data:
      enabled: false
    media:
      enabled: false
    consume:
      enabled: false
    export:
      enabled: false

infisical:
  enabled: true
  ingress:
    enabled: true
    hostName: infisical.localtest.me
    ingressClassName: nginx
    annotations: {}
    tls: []
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: false
  redis:
    enabled: false

wgEasy:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: wg.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  securityContext:
    privileged: true
  persistence:
    enabled: false
