# k3d overlay for local smoke tests.
# Load this after charts/platform-stack/values.yaml.

global:
  domain: localtest.me
  hosts:
    openclaw: openclaw.localtest.me
    nextcloud: nextcloud.localtest.me
    gitea: gitea.localtest.me
    vaultwarden: vaultwarden.localtest.me
    paperlessNgx: paperless.localtest.me

openclaw:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: openclaw.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: openclaw-tls
        hosts:
          - openclaw.localtest.me
  persistence:
    enabled: true
  remoteDocker:
    enabled: true
    dockerHost: ssh://docker-remote@host.k3d.internal:2222
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi
  existingSecret: openclaw-app-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: ""
    anthropicApiKey: ""
    braveApiKey: ""
    kimiApiKey: ""
    moonshotApiKey: ""
    tavilyApiKey: ""
    perplexityApiKey: ""
    geminiApiKey: ""
    xaiApiKey: ""
    googleApiKey: ""
    braveSearchApiKey: ""
  secretRefs: []
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.localtest.me
      trustedProxies:
        - 10.42.0.0/16


nextcloud:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: nextcloud.localtest.me
        paths:
          - path: /
            pathType: Prefix
  trustedDomains:
    - nextcloud.localtest.me
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path

gitea:
  enabled: true
  gitea:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: gitea.localtest.me
          paths:
            - path: /
              pathType: Prefix
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path
    admin:
      username: git-admin
      existingSecret: ""

vaultwarden:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: vaultwarden.localtest.me
        paths:
          - path: /
            pathType: Prefix
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path

paperlessNgx:
  enabled: true
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: paperless.localtest.me
        paths:
          - path: /
            pathType: Prefix
  persistence:
    data:
      enabled: true
      size: 5Gi
      storageClass: local-path
    media:
      enabled: true
      size: 10Gi
      storageClass: local-path
    consume:
      enabled: true
      size: 2Gi
      storageClass: local-path
    export:
      enabled: true
      size: 2Gi
      storageClass: local-path
