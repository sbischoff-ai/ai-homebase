# k3d overlay for local smoke tests.
# Load this after charts/platform-stack/values.yaml.

global:
  domain: localtest.me
  hosts:
    openclaw: openclaw.localtest.me
    openhands: openhands.localtest.me
    nextcloud: nextcloud.localtest.me
    gitea: gitea.vpn.homebase.internal
    paperlessNgx: paperless.localtest.me
    infisical: infisical.localtest.me

openclaw:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: openclaw.localtest.me
        paths:
          - path: /
            pathType: Prefix
  persistence:
    enabled: true
  remoteDocker:
    enabled: true
    dockerHost: ssh://docker-remote@host.k3d.internal:2222
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi
  existingSecret: openclaw-app-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ""
    googleApiKey: ""
    tavilyApiKey: ""
    braveSearchApiKey: ""
  secretRefs: []
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - https://openclaw.localtest.me

openhands:
  enabled: true
  ingress:
    enabled: true
    hostName: openhands.localtest.me
    ingressClassName: nginx
    annotations: {}
    tls: []
  persistence:
    enabled: false
  kubernetes:
    ingress_domain: openhands.localtest.me
    pvc_storage_size: 2Gi
    resource_cpu_request: "500m"
    resource_memory_request: 1Gi
    resource_memory_limit: 2Gi

nextcloud:
  enabled: false
  persistence:
    enabled: false

gitea:
  enabled: false

paperlessNgx:
  enabled: false
  persistence:
    data:
      enabled: false
    media:
      enabled: false
    consume:
      enabled: false
    export:
      enabled: false

infisical:
  enabled: true
  ingress:
    enabled: true
    hostName: infisical.localtest.me
    ingressClassName: nginx
    annotations: {}
    tls: []
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: false
  redis:
    enabled: false
