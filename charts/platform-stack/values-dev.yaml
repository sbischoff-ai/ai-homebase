global:
  domain: localtest.me
  hosts:
    openclaw: openclaw.localtest.me
    openhands: openhands.localtest.me
    nextcloud: nextcloud.localtest.me
    gitea: gitea.vpn.homebase.internal
    paperless: paperless.localtest.me
    paperlessNgx: paperless.localtest.me
    infisical: infisical.localtest.me
    wg: wg.localtest.me
    vpn: wg.localtest.me
    wgEasy: wg.localtest.me

openclaw:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: openclaw.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  existingSecret: openclaw-app-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: OPENAI_API_KEY
    anthropicApiKey: ANTHROPIC_API_KEY
    googleApiKey: GOOGLE_API_KEY
    tavilyApiKey: TAVILY_API_KEY
    braveSearchApiKey: BRAVE_SEARCH_API_KEY
  secretRefs: []
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - http://openclaw.localtest.me


openhands:
  enabled: true
  replicaCount: 1
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
  # Enable OpenHands ingress only for environments that intentionally expose a private/internal endpoint.
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: openhands.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

nextcloud:
  enabled: false
  image:
    repository: nextcloud
    tag: "29.0.0-apache"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: nextcloud.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    annotations: {}
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /status.php
    readiness:
      enabled: true
      path: /status.php
  existingSecret: ""
  secretRefs: []

gitea:
  enabled: false
  image:
    repository: gitea/gitea
    tag: "1.22.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}
  ingress:
    enabled: true
    className: internal-nginx
    annotations: {}
    hosts:
      - host: gitea.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    size: 30Gi
    storageClass: ""
    annotations: {}
  gitea:
    admin:
      username: git-admin
      existingSecret: ""
    config:
      database:
        DB_TYPE: postgres
        HOST: platform-stack-shared-postgresql:5432
        NAME: gitea
        USER: gitea
      session:
        PROVIDER: redis
      cache:
        ENABLED: true
        ADAPTER: redis
      queue:
        TYPE: redis
      global_lock:
        SERVICE_TYPE: redis
      service:
        DISABLE_REGISTRATION: true
    additionalConfigFromEnvs:
      - GITEA__database__PASSWD
      - GITEA__session__PROVIDER_CONFIG
      - GITEA__cache__HOST
      - GITEA__queue__CONN_STR
      - GITEA__global_lock__SERVICE_CONN_STR
    additionalConfigSources: []
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: true
        size: 10Gi
        storageClass: ""
  postgresql-ha:
    enabled: false
  redis:
    enabled: false
  redis-cluster:
    enabled: false
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/healthz
    readiness:
      enabled: true
      path: /api/healthz
  existingSecret: ""
  secretRefs:
    - name: gitea-app-secrets
      key: GITEA__database__PASSWD
      envVar: GITEA__database__PASSWD
    - name: gitea-app-secrets
      key: GITEA__session__PROVIDER_CONFIG
      envVar: GITEA__session__PROVIDER_CONFIG
    - name: gitea-app-secrets
      key: GITEA__cache__HOST
      envVar: GITEA__cache__HOST
    - name: gitea-app-secrets
      key: GITEA__queue__CONN_STR
      envVar: GITEA__queue__CONN_STR
    - name: gitea-app-secrets
      key: GITEA__global_lock__SERVICE_CONN_STR
      envVar: GITEA__global_lock__SERVICE_CONN_STR

paperlessNgx:
  enabled: false
  image:
    repository: ghcr.io/paperless-ngx/paperless-ngx
    tag: "2.11.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: paperless.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    data:
      enabled: true
      size: 20Gi
      storageClass: ""
      annotations: {}
    media:
      enabled: true
      size: 80Gi
      storageClass: ""
      annotations: {}
    consume:
      enabled: true
      size: 5Gi
      storageClass: ""
      annotations: {}
    export:
      enabled: true
      size: 5Gi
      storageClass: ""
      annotations: {}
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/health/
    readiness:
      enabled: true
      path: /api/health/
  existingSecret: ""
  secretRefs: []

infisical:
  enabled: false
  infisical:
    enabled: true
    image:
      repository: infisical/infisical
      tag: "v0.151.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
    resources: {}
    autoBootstrap:
      enabled: false
      organization: default-org
      credentialSecret:
        name: infisical-bootstrap-credentials
      secretDestination:
        name: infisical-bootstrap-secret
        namespace: default
    kubeSecretRef: infisical-secrets
  ingress:
    enabled: true
    hostName: infisical.localtest.me
    ingressClassName: nginx
    annotations: {}
    tls: []
    nginx:
      enabled: false
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: false
        size: 10Gi
        storageClass: ""
  redis:
    enabled: false

wgEasy:
  enabled: false
  image:
    repository: ghcr.io/wg-easy/wg-easy
    tag: "14"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    wireguardPort: 51820
    uiPort: 51821
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: wg.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    annotations: {}
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /
    readiness:
      enabled: true
      path: /
  existingSecret: ""
  secretRefs: []

externalSecrets:
  enabled: false

observability:
  enabled: false

persistence:
  enabled: false

autoscaling:
  enabled: false
  profile: dev-minimal

workerIsolation:
  enabled: false
