global:
  domain: homebase.local
  hosts:
    openclaw: openclaw.localtest.me
    openhands: openhands.homebase.local

openclaw:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: openclaw.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

openhands:
  enabled: true
  replicaCount: 1
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
  workspace:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false

externalSecrets:
  enabled: false

observability:
  enabled: false

persistence:
  enabled: false

autoscaling:
  enabled: false
  profile: dev-minimal

workerIsolation:
  enabled: false
