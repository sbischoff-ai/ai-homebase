global:
  domain: localtest.me
  hosts:
    openclaw: openclaw.vpn.homebase.internal
    openhands: openhands.vpn.homebase.internal
    nextcloud: cloud.localtest.me
    gitea: gitea.vpn.homebase.internal
    paperlessNgx: paperless.vpn.homebase.internal
    infisical: infisical.vpn.homebase.internal
    wgEasy: wg.localtest.me

openclaw:
  enabled: true
  replicaCount: 1
  ingress:
    enabled: false
  persistence:
    enabled: true
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  existingSecret: openclaw-app-secrets
  secretKeys:
    gatewayToken: OPENCLAW_GATEWAY_TOKEN
    openaiApiKey: ""
    anthropicApiKey: ""
    googleApiKey: ""
    tavilyApiKey: ""
    braveSearchApiKey: ""
  secretRefs: []
  openclaw:
    gateway:
      controlUi:
        allowedOrigins:
          - http://openclaw.vpn.homebase.internal


openhands:
  enabled: true
  replicaCount: 1
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
  # Enable OpenHands ingress only for environments that intentionally expose a private/internal endpoint.
  ingress:
    enabled: true
    hostName: openhands.vpn.homebase.internal
    ingressClassName: internal-nginx
    annotations: {}
    tls: []
  persistence:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi

nextcloud:
  enabled: true
  image:
    repository: nextcloud
    tag: "29.0.0-apache"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: cloud.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    annotations: {}
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /status.php
    readiness:
      enabled: true
      path: /status.php
  existingSecret: ""
  secretRefs: []

gitea:
  enabled: false
  gitea:
    enabled: true
    image:
      repository: gitea/gitea
      tag: "1.22.0"
      pullPolicy: IfNotPresent
    service:
      http:
        type: ClusterIP
        port: 3000
    ingress:
      enabled: true
      className: internal-nginx
      annotations: {}
      hosts:
        - host: gitea.vpn.homebase.internal
          paths:
            - path: /
              pathType: Prefix
      tls: []
    persistence:
      enabled: true
      size: 30Gi
      storageClass: ""
    admin:
      username: git-admin
      existingSecret: ""
    config:
      database:
        DB_TYPE: postgres
        HOST: platform-stack-shared-postgresql:5432
        NAME: gitea
        USER: gitea
      session:
        PROVIDER: redis
      cache:
        ENABLED: true
        ADAPTER: redis
      queue:
        TYPE: redis
      global_lock:
        SERVICE_TYPE: redis
      service:
        DISABLE_REGISTRATION: true
    additionalConfigFromEnvs:
      - GITEA__database__PASSWD
      - GITEA__session__PROVIDER_CONFIG
      - GITEA__cache__HOST
      - GITEA__queue__CONN_STR
      - GITEA__global_lock__SERVICE_CONN_STR
    additionalConfigSources: []
    postgresql:
      enabled: false
      primary:
        persistence:
          enabled: true
          size: 10Gi
          storageClass: ""
    postgresql-ha:
      enabled: false
    redis:
      enabled: false
    redis-cluster:
      enabled: false

paperlessNgx:
  enabled: false
  image:
    repository: paperlessngx/paperless-ngx
    tag: "2.20"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  ingress:
    enabled: false
    className: internal-nginx
    annotations: {}
    hosts:
      - host: paperless.vpn.homebase.internal
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    data:
      enabled: true
      size: 20Gi
      storageClass: ""
      annotations: {}
    media:
      enabled: true
      size: 80Gi
      storageClass: ""
      annotations: {}
    consume:
      enabled: true
      size: 5Gi
      storageClass: ""
      annotations: {}
    export:
      enabled: true
      size: 5Gi
      storageClass: ""
      annotations: {}
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /api/health/
    readiness:
      enabled: true
      path: /api/health/
  existingSecret: ""
  secretRefs: []

infisical:
  enabled: true
  infisical:
    enabled: true
    image:
      repository: infisical/infisical
      tag: "v0.151.0"
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
    resources: {}
    autoBootstrap:
      enabled: false
      organization: default-org
      credentialSecret:
        name: infisical-bootstrap-credentials
      secretDestination:
        name: infisical-bootstrap-secret
        namespace: default
    kubeSecretRef: infisical-secrets
  ingress:
    enabled: true
    hostName: infisical.vpn.homebase.internal
    ingressClassName: internal-nginx
    annotations: {}
    tls: []
    nginx:
      enabled: false
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: false
        size: 10Gi
        storageClass: ""
  redis:
    enabled: false

wgEasy:
  enabled: true
  image:
    repository: ghcr.io/wg-easy/wg-easy
    tag: "14"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    wireguardPort: 51820
    uiPort: 51821
    annotations: {}
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: wg.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    annotations: {}
  backup:
    annotations: {}
  resources: {}
  probes:
    liveness:
      enabled: true
      path: /
    readiness:
      enabled: true
      path: /
  existingSecret: ""
  secretRefs: []

