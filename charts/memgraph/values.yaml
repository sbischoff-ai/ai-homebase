nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: memgraph/memgraph
  tag: "3.8.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  hosts:
    memgraph: ""
  commonLabels: {}

service:
  type: ClusterIP
  boltPort: 7687
  httpPort: 7444
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
  defaultHost: memgraph.example.com
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  size: 100Gi
  storageClass: ""

volumePermissions:
  enabled: true
  image:
    repository: busybox
    tag: "1.36.1"
    pullPolicy: IfNotPresent
  resources: {}
  securityContext:
    runAsUser: 0
    runAsGroup: 0

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

probes:
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 15

nodeSelector: {}
tolerations: []
affinity: {}
