nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: infisical/infisical
  tag: "0.94.0"
  pullPolicy: IfNotPresent

global:
  storageClass: ""
  hosts:
    infisical: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: internal
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  # Example admin-surface policy: allow ingress only from trusted admin namespace(s).
  # ingress:
  #   - from:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: admin-tools
  # policyTypes:
  #   - Ingress
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

persistence:
  enabled: false
  existingClaim: ""
  accessModes: ["ReadWriteOnce"]
  size: 5Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}

backup:
  annotations: {}

resources: {}

# Secret injection conventions:
# - Secret names: kebab-case (example: infisical-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: INFISICAL_ENCRYPTION_KEY)
existingSecret: "" # Optional envFrom source for app credentials/secrets.
secretRefs: [] # [{name: infisical-app-secrets, key: INFISICAL_ENCRYPTION_KEY, envVar: INFISICAL_ENCRYPTION_KEY}]
