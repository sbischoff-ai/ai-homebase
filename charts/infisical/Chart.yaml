apiVersion: v2
name: infisical
description: Self-hosted Infisical with in-cluster PostgreSQL/Redis persistence and VPN-first ingress defaults
type: application
version: 0.2.0
appVersion: "0.151.0"
sources:
  - https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
  - https://github.com/Infisical/infisical-helm-charts
dependencies:
  - name: postgresql
    version: 14.1.10
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: redis
    version: 18.14.1
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
