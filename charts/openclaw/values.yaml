remoteDocker:
  enabled: true
  dockerHost: "ssh://docker-remote@openclaw-sandbox:2222"
  home: /home/node
  cli:
    enabled: true
    image:
      repository: docker
      tag: "28.0.4-cli"
      pullPolicy: IfNotPresent
    installPath: /opt/openclaw-tools/bin
