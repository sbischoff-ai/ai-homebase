nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/openclaw/openclaw
  tag: "2026.3.12"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  domain: ""
  hosts:
    openclaw: ""
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 18789
  targetPort: 18789
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Optional default used when ingress.hosts[*].host is omitted.
  # If empty, the chart falls back to global.hosts.openclaw.
  defaultHost: openclaw.example.com
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""
  mountPath: /home/node/.openclaw
  annotations: {}

config:
  enabled: true

openclaw:
  gateway:
    mode: local
    bind: lan
    port: 18789
    auth:
      mode: token
    controlUi:
      enabled: true
      allowedOrigins:
        - https://openclaw.example.com
  agents:
    defaults:
      workspace: ~/.openclaw/workspace
    list:
      - id: default
        name: OpenClaw Assistant
        workspace: ~/.openclaw/workspace

env: []
envFromSecrets: []
# Secret injection conventions:
# - Secret names: kebab-case (example: openclaw-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: OPENCLAW_GATEWAY_TOKEN)
existingSecret: openclaw-secrets # Secret name used for explicit key refs under secretKeys.
secretKeys:
  gatewayToken: OPENCLAW_GATEWAY_TOKEN
  openaiApiKey: ""
  anthropicApiKey: ""
  braveApiKey: ""
  kimiApiKey: ""
  moonshotApiKey: ""
  tavilyApiKey: ""
  perplexityApiKey: ""
  geminiApiKey: ""
  xaiApiKey: ""
  googleApiKey: "" # backward-compatible legacy alias for GEMINI_API_KEY-style setups
  braveSearchApiKey: "" # backward-compatible legacy alias for BRAVE_API_KEY-style setups
secretRefs: [] # [{name: openclaw-app-secrets, key: OPENCLAW_API_TOKEN, envVar: OPENCLAW_API_TOKEN}]

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

runtime:
  command:
    - node
    - openclaw.mjs
    - gateway
    - --allow-unconfigured
  args: []

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    enabled: true
    path: /startupz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: false
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""

extraVolumes: []
extraVolumeMounts: []

annotations: {}
