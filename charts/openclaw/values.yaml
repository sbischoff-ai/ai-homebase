nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/openclaw/openclaw
  tag: "2026.3.28"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  domain: ""
  hosts:
    openclaw: ""
    nextcloudMcp: ""
    qdrantMcp: ""
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 18789
  targetPort: 18789
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
  # Optional default used when ingress.hosts[*].host is omitted.
  # If empty, the chart falls back to global.hosts.openclaw.
  defaultHost: openclaw.example.com
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  hostPath: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""
  mountPath: /home/node/.openclaw
  annotations: {}

config:
  enabled: true
  launcher:
    enabled: true
    path: /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs

remoteDocker:
  enabled: true
  dockerHost: "ssh://docker-remote@openclaw-sandbox:2222"
  home: /home/node
  cli:
    enabled: true
    image:
      repository: docker
      tag: "28.0.4-cli"
      pullPolicy: IfNotPresent
    installPath: /opt/openclaw-tools/bin
  ssh:
    secretName: openclaw-remote-docker-ssh
    mountPath: /home/node/.ssh

workspaceBootstrap:
  enabled: true
  agents:
    main:
      workspace: /home/node/.openclaw/workspace
      filesDir: workspaces/main
    coder:
      workspace: /home/node/.openclaw/workspace-coder
      filesDir: workspaces/coder
    architect:
      workspace: /home/node/.openclaw/workspace-architect
      filesDir: workspaces/architect
    archivist:
      workspace: /home/node/.openclaw/workspace-archivist
      filesDir: workspaces/archivist
    watchdog:
      workspace: /home/node/.openclaw/workspace-watchdog
      filesDir: workspaces/watchdog
    auditor:
      workspace: /home/node/.openclaw/workspace-auditor
      filesDir: workspaces/auditor
openclaw:
  cron:
    enabled: true
    store: ~/.openclaw/cron/jobs.json
    maxConcurrentRuns: 1
    sessionRetention: 24h
    runLog:
      maxBytes: 2mb
      keepLines: 2000
  gateway:
    mode: local
    bind: lan
    port: 18789
    auth:
      mode: token
    controlUi:
      enabled: true
      allowedOrigins:
        - https://openclaw.example.com
    trustedProxies: []
  agents:
    defaults:
      workspace: /home/node/.openclaw/workspace
      models:
        openai/gpt-5.4-mini:
          alias: Main
        anthropic/claude-sonnet-4-6:
          alias: Main / Architect
        openai/gpt-5.4:
          alias: Coder / Archivist / Auditor
        openai/gpt-4.1-nano:
          alias: Watchdog
        anthropic/claude-opus-4-6:
          alias: Auditor
      sandbox:
        backend: docker
        mode: non-main
        scope: agent
        sessionToolsVisibility: "all"
        docker:
          image: registry.example.com/coder/openclaw-sandbox:bookworm-slim
          workdir: /workspace
          readOnlyRoot: true
          tmpfs:
            - /tmp
            - /var/tmp
            - /run
          user: 1000:1000
          capDrop:
            - ALL
          pidsLimit: 256
          memory: 1g
          memorySwap: 2g
          cpus: 1
          network: bridge
        browser:
          enabled: true
          image: openclaw-sandbox-browser:bookworm-slim
          network: bridge
          cdpPort: 9222
          vncPort: 5900
          noVncPort: 6080
          headless: false
          enableNoVnc: true
          cdpSourceRange: ""
    list:
      - id: main
        default: true
        name: OpenClaw Assistant
        workspace: /home/node/.openclaw/workspace
        model:
          primary: openai/gpt-5.4-mini
          fallbacks:
            - anthropic/claude-sonnet-4-6
        subagents:
          allowAgents:
            - coder
            - architect
            - archivist
            - auditor
      - id: coder
        name: Coder
        workspace: /home/node/.openclaw/workspace-coder
        model:
          primary: anthropic/claude-sonnet-4-6
          fallbacks:
            - openai/gpt-5.4
        sandbox:
          mode: all
          docker:
            image: registry.example.com/coder/openclaw-sandbox-coder:bookworm-slim
            binds:
              - /var/run/docker.sock:/var/run/docker.sock
            tmpfs:
              - /tmp
              - /var/tmp
              - /run
              - /workspace
            env:
              HOME: /workspace/.home
              CODEX_HOME: /workspace/.home/.codex
              XDG_CONFIG_HOME: /workspace/.home/.config
              XDG_CACHE_HOME: /workspace/.home/.cache
              XDG_STATE_HOME: /workspace/.home/.local/state
              CODER_GITEA_BASE_URL: https://gitea.example.com
              CODER_GITEA_HOST: gitea.example.com
              CODER_GITEA_USERNAME: coder
              CODER_GITEA_EMAIL: coder@example.invalid
              CODER_GITEA_PASSWORD: ${CODER_GITEA_PASSWORD}
              CODER_GITOPS_REPO_NAME: cluster-gitops
              CODER_SANDBOX_IMAGES_REPO_NAME: openclaw-sandbox-images
              CODER_GITOPS_REPO_BRANCH: main
              CODER_GITOPS_PROJECT: platform-stack
              CODER_GITEA_TEA_LOGIN_NAME: coder
              CODER_GITEA_TEA_TOKEN_NAME: openclaw-coder-sandbox
              CODER_REGISTRY_HOST: registry.example.com
              CODER_REGISTRY_BASE_URL: https://registry.example.com
              CODER_REGISTRY_USERNAME: coder
              CODER_REGISTRY_PASSWORD: ${CODER_REGISTRY_PASSWORD}
              CODER_REGISTRY_NAMESPACE: coder
              CODEX_MODEL: openai/gpt-5.3-codex
              OPENAI_API_KEY: ${OPENAI_API_KEY}
              GITHUB_TOKEN: ${GITHUB_TOKEN}
            setupCommand: /usr/local/bin/coder-init.sh
      - id: architect
        name: Architect
        workspace: /home/node/.openclaw/workspace-architect
        model:
          primary: anthropic/claude-sonnet-4-6
          fallbacks:
            - openai/o3
      - id: archivist
        name: Archivist
        workspace: /home/node/.openclaw/workspace-archivist
        model:
          primary: openai/gpt-5.4
          fallbacks:
            - anthropic/claude-sonnet-4-6
        sandbox:
          mode: non-main
          docker:
            image: registry.example.com/coder/openclaw-sandbox-archivist:bookworm-slim
      - id: watchdog
        name: Watchdog
        workspace: /home/node/.openclaw/workspace-watchdog
        model:
          primary: openai/gpt-4.1-nano
          fallbacks:
            - anthropic/claude-haiku-4-5
        sandbox:
          mode: "off"
      - id: auditor
        name: Auditor
        workspace: /home/node/.openclaw/workspace-auditor
        model:
          primary: anthropic/claude-opus-4-6
          fallbacks:
            - openai/gpt-5.4
        sandbox:
          mode: "off"
    tools:
      sessions:
        visibility: all
      agentToAgent:
        enabled: true
      allow:
        - main
        - coder
        - architect
        - archivist
        - watchdog
        - auditor
  skills:
    allowBundled:
      - weather
      - healthcheck
      - node-connect
      - skill-creator
      - session-logs
      - coding-agent
      - tmux
      - summarize
      - github
  commands:
    mcp: true
  mcp:
    servers:
      nextcloud:
        command: node
        args:
          - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
          - --url
          - ${OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL}
          - --url
          - ${OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL}
          - --header
          - Authorization=${OPENCLAW_NEXTCLOUD_MCP_AUTH_HEADER}
      qdrant:
        command: node
        args:
          - /opt/openclaw-runtime/mcp/mcp-http-bridge.mjs
          - --url
          - ${OPENCLAW_QDRANT_MCP_INTERNAL_URL}
          - --url
          - ${OPENCLAW_QDRANT_MCP_EXTERNAL_URL}
  plugins:
    entries: {}

env: []
envFromSecrets: []
# Secret injection conventions:
# - Secret names: kebab-case (example: openclaw-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: OPENCLAW_GATEWAY_TOKEN)
existingSecret: openclaw-secrets # Secret name used for explicit key refs under secretKeys.
secretKeys:
  gatewayToken: OPENCLAW_GATEWAY_TOKEN
  openaiApiKey: ""
  anthropicApiKey: ""
  braveApiKey: ""
  kimiApiKey: ""
  moonshotApiKey: ""
  tavilyApiKey: ""
  perplexityApiKey: ""
  geminiApiKey: ""
  xaiApiKey: ""
  githubToken: ""
  googleApiKey: "" # backward-compatible legacy alias for GEMINI_API_KEY-style setups
  braveSearchApiKey: "" # backward-compatible legacy alias for BRAVE_API_KEY-style setups
secretRefs: [] # [{name: openclaw-secrets, key: OPENCLAW_API_TOKEN, envVar: OPENCLAW_API_TOKEN}]

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

runtime:
  command:
    - node
    - openclaw.mjs
    - gateway
    - --allow-unconfigured
  args: []

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    enabled: true
    path: /startupz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 30

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: false
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
runtimeClassName: ""

extraVolumes: []
extraVolumeMounts: []

annotations: {}
