{{- if and .Values.ingress.enabled (eq (len .Values.ingress.hosts) 0) }}
{{- fail "ingress.enabled=true requires at least one ingress.hosts entry" }}
{{- end }}
{{- if and .Values.ingress.enabled (eq (coalesce .Values.ingress.defaultHost .Values.global.hosts.openclaw "") "") }}
{{- $missingHost := true }}
{{- range .Values.ingress.hosts }}
  {{- if .host }}{{- $missingHost = false }}{{- end }}
{{- end }}
{{- if $missingHost }}
{{- fail "ingress.enabled=true requires ingress.defaultHost, global.hosts.openclaw, or ingress.hosts[*].host" }}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- $defaultHost := coalesce .Values.ingress.defaultHost .Values.global.hosts.openclaw }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openclaw.fullname" . }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Keep ingress.hosts[*].host synchronized with openclaw.gateway.controlUi.allowedOrigins.
  # allowedOrigins entries must include the exact public origin scheme + host
  # (for example: https://openclaw.example.com for host openclaw.example.com).
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ default $defaultHost .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "openclaw.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
