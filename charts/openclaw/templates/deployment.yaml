{{- $gatewayAuthMode := .Values.openclaw.gateway.auth.mode | default "" }}
{{- $gatewayBind := .Values.openclaw.gateway.bind | default "" }}
{{- $controlUiEnabled := .Values.openclaw.gateway.controlUi.enabled }}
{{- $allowedOrigins := .Values.openclaw.gateway.controlUi.allowedOrigins | default (list) }}
{{- $allowedOriginsIncludesWildcard := has "*" $allowedOrigins }}
{{- $nonLoopbackBind := not (or (eq $gatewayBind "") (eq $gatewayBind "localhost") (eq $gatewayBind "127.0.0.1") (eq $gatewayBind "::1") (eq $gatewayBind "loopback") (eq $gatewayBind "local")) }}
{{- $remoteDockerEnabled := .Values.remoteDocker.enabled | default false }}
{{- $remoteDockerCliEnabled := and $remoteDockerEnabled (.Values.remoteDocker.cli.enabled | default true) }}
{{- $persistentConfigEnabled := and .Values.config.enabled .Values.persistence.enabled }}
{{- $persistentMountPath := trimSuffix "/" .Values.persistence.mountPath }}
{{- $configPath := ternary (printf "%s/openclaw.json" $persistentMountPath) "/etc/openclaw/openclaw.json" $persistentConfigEnabled }}
{{- $launcherPath := .Values.config.launcher.path | default "/opt/openclaw-runtime/mcp/mcp-http-bridge.mjs" }}
{{- $launcherDir := dir $launcherPath }}
{{- $remoteDockerCliInstallPath := .Values.remoteDocker.cli.installPath | default "/opt/openclaw-tools/bin" }}
{{- $memgraphToolsInstallPath := "/opt/memgraph-tools/bin" }}
{{- $nextcloudMcpHost := .Values.global.hosts.nextcloudMcp | default "" }}
{{- $qdrantHost := .Values.global.hosts.qdrant | default "" }}
{{- $qdrantMcpHost := .Values.global.hosts.qdrantMcp | default "" }}
{{- $nextcloudMcpExternalScheme := ternary "http" "https" (hasSuffix ".localtest.me" $nextcloudMcpHost) }}
{{- $nextcloudMcpExternalUrl := ternary (printf "%s://%s/mcp" $nextcloudMcpExternalScheme $nextcloudMcpHost) "" (ne $nextcloudMcpHost "") }}
{{- $nextcloudMcpInternalUrl := printf "http://%s-nextcloud-mcp.%s.svc.cluster.local:8000/mcp" .Release.Name .Release.Namespace }}
{{- $qdrantExternalScheme := ternary "http" "https" (hasSuffix ".localtest.me" $qdrantHost) }}
{{- $qdrantExternalUrl := ternary (printf "%s://%s" $qdrantExternalScheme $qdrantHost) "" (ne $qdrantHost "") }}
{{- $qdrantInternalUrl := printf "http://%s-qdrant.%s.svc.cluster.local:6333" .Release.Name .Release.Namespace }}
{{- $qdrantMcpExternalScheme := ternary "http" "https" (hasSuffix ".localtest.me" $qdrantMcpHost) }}
{{- $qdrantMcpExternalUrl := ternary (printf "%s://%s/mcp" $qdrantMcpExternalScheme $qdrantMcpHost) "" (ne $qdrantMcpHost "") }}
{{- $qdrantMcpInternalUrl := printf "http://%s-qdrant-mcp.%s.svc.cluster.local:8000/mcp" .Release.Name .Release.Namespace }}
{{- if and (eq $gatewayAuthMode "token") (not .Values.existingSecret) }}
{{- fail "openclaw.existingSecret is required when openclaw.gateway.auth.mode=token" }}
{{- end }}
{{- if and (eq $gatewayAuthMode "token") (not .Values.secretKeys.gatewayToken) }}
{{- fail "openclaw.secretKeys.gatewayToken is required when openclaw.gateway.auth.mode=token" }}
{{- end }}
{{- if and $remoteDockerEnabled (not .Values.remoteDocker.dockerHost) }}
{{- fail "remoteDocker.dockerHost is required when remoteDocker.enabled=true" }}
{{- end }}
{{- if and $remoteDockerEnabled (not .Values.remoteDocker.ssh.secretName) }}
{{- fail "remoteDocker.ssh.secretName is required when remoteDocker.enabled=true" }}
{{- end }}
{{- if and $remoteDockerEnabled (not .Values.remoteDocker.ssh.mountPath) }}
{{- fail "remoteDocker.ssh.mountPath is required when remoteDocker.enabled=true" }}
{{- end }}
{{- if and $remoteDockerCliEnabled (not $remoteDockerCliInstallPath) }}
{{- fail "remoteDocker.cli.installPath is required when remoteDocker.cli.enabled=true" }}
{{- end }}
{{- $sandboxMode := .Values.openclaw.agents.defaults.sandbox.mode | default "off" }}
{{- if and $nonLoopbackBind $controlUiEnabled (eq (len $allowedOrigins) 0) }}
{{- fail "openclaw.gateway.controlUi.allowedOrigins must be non-empty when gateway bind is non-loopback and control UI is enabled" }}
{{- end }}
{{- if and $nonLoopbackBind $controlUiEnabled $allowedOriginsIncludesWildcard }}
{{- fail "openclaw.gateway.controlUi.allowedOrigins cannot include \\\"*\\\" when gateway bind is non-loopback; set exact public origin(s)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openclaw.fullname" . }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openclaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openclaw.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.global.podAnnotations .Values.podAnnotations }}
      annotations:
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "openclaw.serviceAccountName" . }}
      {{- $pullSecrets := include "openclaw.effectiveImagePullSecrets" . | fromYamlArray }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{- range $pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.config.enabled $remoteDockerEnabled }}
      initContainers:
        {{- if .Values.config.enabled }}
        - name: config-permissions
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              normalize_seeded_skill() {
                target_path="$1"
                if [ "$(basename "${target_path}")" != "SKILL.md" ]; then
                  return 0
                fi
                tmp_path="$(mktemp)"
                sed '1{/^$/d;}' "${target_path}" >"${tmp_path}" || {
                  rm -f "${tmp_path}"
                  echo >&2 "Failed to normalize leading blank lines in ${target_path}."
                  exit 1
                }
                mv "${tmp_path}" "${target_path}" || {
                  rm -f "${tmp_path}"
                  echo >&2 "Failed to replace ${target_path} after normalizing skill frontmatter."
                  exit 1
                }
              }
              target_dir={{ ternary "/config-target-root" "/config-target" $persistentConfigEnabled | quote }}
              target_file="${target_dir}/openclaw.json"
              mkdir -p "${target_dir}"
              if [ ! -s /config-source/openclaw.json ]; then
                echo >&2 "Rendered ConfigMap file /config-source/openclaw.json is missing or empty; verify the openclaw ConfigMap rendered correctly before deployment."
                exit 1
              fi
              if [ -s "${target_file}" ]; then
                echo "Preserving existing OpenClaw config at ${target_file}."
              else
                cp -f /config-source/openclaw.json "${target_file}" || {
                  echo >&2 "Failed to bootstrap ${target_file} from /config-source/openclaw.json; verify the writable config target volume is mounted and accessible to the init container."
                  exit 1
                }
              fi
              {{- if and $persistentConfigEnabled .Values.workspaceBootstrap.enabled }}
              state_root=/config-target-root
              {{- range $agentId, $agentConfig := .Values.workspaceBootstrap.agents }}
              workspace_dir="${state_root}/{{ trimPrefix "/" (trimPrefix $persistentMountPath $agentConfig.workspace) }}"
              mkdir -p "${workspace_dir}" || {
                echo >&2 "Failed to create bootstrapped workspace directory ${workspace_dir} for agent {{ $agentId }}."
                exit 1
              }
              {{- $filesDir := $agentConfig.filesDir | default "" }}
              {{- range $path, $_ := $.Files.Glob (printf "files/%s/**" $filesDir) }}
              {{- $filePath := trimPrefix (printf "files/%s/" $filesDir) $path }}
              target_path="${workspace_dir}/{{ $filePath }}"
              target_parent="$(dirname "${target_path}")"
              mkdir -p "${target_parent}" || {
                echo >&2 "Failed to create ${target_parent} before seeding {{ $filePath }} for agent {{ $agentId }}."
                exit 1
              }
              if [ -e "${target_path}" ]; then
                echo "Preserving existing {{ $filePath }} in ${workspace_dir}."
              else
                cp -f /config-source/{{ printf "workspace-%s-%s" $agentId (replace "/" "__" $filePath) }} "${target_path}" || {
                  echo >&2 "Failed to seed {{ $filePath }} into ${workspace_dir} for agent {{ $agentId }}."
                  exit 1
                }
                normalize_seeded_skill "${target_path}"
              fi
              {{- end }}
              {{- end }}
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-source
              mountPath: /config-source
              readOnly: true
            {{- if .Values.config.launcher.enabled | default true }}
            - name: mcp-runtime
              mountPath: /runtime-target
            {{- end }}
            {{- if $persistentConfigEnabled }}
            - name: data
              mountPath: /config-target-root
            {{- else }}
            - name: config
              mountPath: /config-target
            {{- end }}
        {{- if and .Values.config.enabled (.Values.config.launcher.enabled | default true) }}
        - name: mcp-runtime
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ ! -s /config-source/mcp-http-bridge.mjs ]; then
                echo >&2 "Rendered ConfigMap file /config-source/mcp-http-bridge.mjs is missing or empty; verify the openclaw ConfigMap rendered correctly before deployment."
                exit 1
              fi
              mkdir -p /runtime-target || {
                echo >&2 "Failed to create MCP runtime target directory /runtime-target."
                exit 1
              }
              cp -f /config-source/mcp-http-bridge.mjs /runtime-target/mcp-http-bridge.mjs || {
                echo >&2 "Failed to bootstrap shared MCP bridge into /runtime-target/mcp-http-bridge.mjs."
                exit 1
              }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-source
              mountPath: /config-source
              readOnly: true
            - name: mcp-runtime
              mountPath: /runtime-target
        {{- end }}
        {{- end }}
        - name: memgraph-cli-runtime
          image: "memgraph/memgraph:3.8.1"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /tools-target/bin /tools-target/lib /tools-target/lib64
              cp -f /usr/bin/mgconsole /tools-target/lib/mgconsole || {
                echo >&2 "Failed to copy /usr/bin/mgconsole into the shared Memgraph tools volume."
                exit 1
              }
              cp -f /lib/x86_64-linux-gnu/libssl.so.3 /tools-target/lib/libssl.so.3
              cp -f /lib/x86_64-linux-gnu/libcrypto.so.3 /tools-target/lib/libcrypto.so.3
              cp -f /lib/x86_64-linux-gnu/libc.so.6 /tools-target/lib/libc.so.6
              cp -f /lib64/ld-linux-x86-64.so.2 /tools-target/lib64/ld-linux-x86-64.so.2
              cat >/tools-target/bin/mgconsole <<'EOF'
              #!/bin/sh
              set -eu
              exec /opt/memgraph-tools/lib64/ld-linux-x86-64.so.2 \
                --library-path /opt/memgraph-tools/lib \
                /opt/memgraph-tools/lib/mgconsole "$@"
              EOF
              chmod 0755 /tools-target/bin/mgconsole /tools-target/lib/mgconsole
              chown -R 1000:1000 /tools-target
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: memgraph-tools-runtime
              mountPath: /tools-target
        {{- if $remoteDockerEnabled }}
        {{- if $remoteDockerCliEnabled }}
        - name: remote-docker-cli
          image: "{{ .Values.remoteDocker.cli.image.repository }}:{{ .Values.remoteDocker.cli.image.tag }}"
          imagePullPolicy: {{ .Values.remoteDocker.cli.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /tools-target
              docker_path="$(command -v docker || true)"
              if [ -z "${docker_path}" ]; then
                echo >&2 "remoteDocker.cli.image must contain a working docker CLI on PATH so OpenClaw can use the Docker sandbox backend."
                exit 1
              fi
              cp -f "${docker_path}" /tools-target/docker || {
                echo >&2 "Failed to copy ${docker_path} into /tools-target/docker for OpenClaw remote Docker support."
                exit 1
              }
              chmod 0755 /tools-target /tools-target/docker || {
                echo >&2 "Failed to lock permissions on /tools-target/docker for OpenClaw remote Docker support."
                exit 1
              }
              chown -R 1000:1000 /tools-target || {
                echo >&2 "Failed to hand /tools-target to UID/GID 1000 after copying the docker CLI."
                exit 1
              }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: remote-docker-cli
              mountPath: /tools-target
        - name: remote-docker-runtime-check
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export PATH={{ printf "%s:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" $remoteDockerCliInstallPath | quote }}
              docker_path="$(command -v docker || true)"
              if [ -z "${docker_path}" ]; then
                echo >&2 "Docker sandbox backend requested, but no docker CLI is available after the remoteDocker.cli init step."
                exit 1
              fi
              ssh_path="$(command -v ssh || true)"
              if [ -z "${ssh_path}" ]; then
                echo >&2 "OpenClaw remote Docker over ssh:// requires an ssh client in the OpenClaw image. Build from images/openclaw-remote-docker/Dockerfile or use an equivalent image."
                exit 1
              fi
              echo "docker CLI available at ${docker_path}"
              echo "ssh client available at ${ssh_path}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: remote-docker-cli
              mountPath: {{ $remoteDockerCliInstallPath }}
              readOnly: true
        {{- end }}
        - name: remote-docker-ssh-permissions
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /ssh-target
              if [ ! -s /ssh-source/id_ed25519 ]; then
                echo >&2 "remoteDocker.ssh.secretName must reference a Secret containing non-empty id_ed25519 and known_hosts keys; id_ed25519 is missing or empty."
                exit 1
              fi
              if [ ! -s /ssh-source/known_hosts ]; then
                echo >&2 "remoteDocker.ssh.secretName must reference a Secret containing non-empty id_ed25519 and known_hosts keys; known_hosts is missing or empty."
                exit 1
              fi
              echo "Copying SSH files from /ssh-source into /ssh-target."
              cp -f /ssh-source/id_ed25519 /ssh-target/id_ed25519 || {
                echo >&2 "Failed to copy /ssh-source/id_ed25519 to /ssh-target/id_ed25519; verify the mounted Secret files are readable and that the init container security context allows writes to /ssh-target."
                exit 1
              }
              cp -f /ssh-source/known_hosts /ssh-target/known_hosts || {
                echo >&2 "Failed to copy /ssh-source/known_hosts to /ssh-target/known_hosts; verify the mounted Secret files are readable and that the init container security context allows writes to /ssh-target."
                exit 1
              }
              echo "Locking permissions before handing /ssh-target to UID/GID 1000."
              chmod 0700 /ssh-target || {
                echo >&2 "Failed to set mode 0700 on /ssh-target before ownership changes; verify the init container security context still permits writes to the mounted emptyDir volume."
                exit 1
              }
              chmod 0600 /ssh-target/id_ed25519 || {
                echo >&2 "Failed to set mode 0600 on /ssh-target/id_ed25519 before ownership changes; verify the copied SSH key is writable inside /ssh-target and that the init container security context still permits writes to the mounted emptyDir volume."
                exit 1
              }
              chmod 0644 /ssh-target/known_hosts || {
                echo >&2 "Failed to set mode 0644 on /ssh-target/known_hosts before ownership changes; verify the copied known_hosts file is writable inside /ssh-target and that the init container security context still permits writes to the mounted emptyDir volume."
                exit 1
              }
              chown -R 1000:1000 /ssh-target || {
                echo >&2 "Failed to hand /ssh-target to UID/GID 1000 after permissions were locked down; verify the init container still runs as UID/GID 0 with the CHOWN capability required by the security context."
                exit 1
              }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - name: remote-docker-ssh-secret
              mountPath: /ssh-source
              readOnly: true
            - name: remote-docker-ssh
              mountPath: /ssh-target
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "openclaw.name" . }}
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- with .Values.runtime.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.runtime.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: OPENCLAW_GATEWAY_PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: OPENCLAW_GATEWAY_BIND
              value: 0.0.0.0
            - name: OPENCLAW_HOME
              value: {{ .Values.persistence.mountPath | quote }}
            - name: OPENCLAW_STATE_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: OPENCLAW_CONFIG_PATH
              value: {{ $configPath | quote }}
            - name: OPENCLAW_SANDBOX
              value: {{ ternary "1" "0" (ne (toString $sandboxMode) "off") | quote }}
            - name: PATH
              value: {{ ternary (printf "%s:%s:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" $memgraphToolsInstallPath $remoteDockerCliInstallPath) (printf "%s:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" $memgraphToolsInstallPath) (and $remoteDockerEnabled $remoteDockerCliEnabled) | quote }}
            - name: OPENCLAW_NEXTCLOUD_MCP_INTERNAL_URL
              value: {{ $nextcloudMcpInternalUrl | quote }}
            - name: OPENCLAW_NEXTCLOUD_MCP_EXTERNAL_URL
              value: {{ $nextcloudMcpExternalUrl | quote }}
            - name: OPENCLAW_QDRANT_MCP_INTERNAL_URL
              value: {{ $qdrantMcpInternalUrl | quote }}
            - name: OPENCLAW_QDRANT_MCP_EXTERNAL_URL
              value: {{ $qdrantMcpExternalUrl | quote }}
            - name: OPENCLAW_QDRANT_INTERNAL_URL
              value: {{ $qdrantInternalUrl | quote }}
            - name: OPENCLAW_QDRANT_EXTERNAL_URL
              value: {{ $qdrantExternalUrl | quote }}
            - name: QDRANT_URL
              value: {{ (.Values.qdrant.url | default $qdrantInternalUrl) | quote }}
            - name: QDRANT_COLLECTION
              value: {{ (.Values.qdrant.collectionName | default "openclaw-memory") | quote }}
            {{- with .Values.qdrant.apiKeySecret.name }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.qdrant.apiKeySecret.key | default "QDRANT_API_KEY" }}
            {{- end }}
            {{- if $remoteDockerEnabled }}
            - name: DOCKER_HOST
              value: {{ .Values.remoteDocker.dockerHost | quote }}
            - name: HOME
              value: {{ .Values.remoteDocker.home | quote }}
            {{- end }}
            {{- with .Values.global.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.env }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
            {{- with .Values.existingSecret }}
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.secretKeys.gatewayToken }}
            {{- with $.Values.secretKeys.openaiApiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- with $.Values.secretKeys.anthropicApiKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- with $.Values.secretKeys.braveApiKey }}
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- with $.Values.secretKeys.kimiApiKey }}
            - name: KIMI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- with $.Values.secretKeys.moonshotApiKey }}
            - name: MOONSHOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- with $.Values.secretKeys.tavilyApiKey }}
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- with $.Values.secretKeys.perplexityApiKey }}
            - name: PERPLEXITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- with $.Values.secretKeys.geminiApiKey }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- with $.Values.secretKeys.xaiApiKey }}
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- with $.Values.secretKeys.githubToken }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
            {{- range .Values.secretRefs }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
          {{- if .Values.envFromSecrets }}
          envFrom:
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if and .Values.config.enabled (not $persistentConfigEnabled) }}
            - name: config
              mountPath: /etc/openclaw
            {{- end }}
            {{- if and .Values.config.enabled (.Values.config.launcher.enabled | default true) }}
            - name: mcp-runtime
              mountPath: {{ $launcherDir }}
              readOnly: true
            {{- end }}
            - name: memgraph-tools-runtime
              mountPath: /opt/memgraph-tools
              readOnly: true
            {{- if $remoteDockerEnabled }}
            {{- if $remoteDockerCliEnabled }}
            - name: remote-docker-cli
              mountPath: {{ $remoteDockerCliInstallPath }}
              readOnly: true
            {{- end }}
            - name: remote-docker-ssh
              mountPath: {{ .Values.remoteDocker.ssh.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        {{- if .Values.persistence.enabled }}
        - name: data
          {{- if .Values.persistence.hostPath }}
          hostPath:
            path: {{ .Values.persistence.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ default (include "openclaw.fullname" .) .Values.persistence.existingClaim }}
          {{- end }}
        {{- end }}
        {{- if .Values.config.enabled }}
        - name: config-source
          configMap:
            name: {{ include "openclaw.fullname" . }}
        {{- if not $persistentConfigEnabled }}
        - name: config
          emptyDir: {}
        {{- end }}
        {{- if .Values.config.launcher.enabled | default true }}
        - name: mcp-runtime
          emptyDir: {}
        {{- end }}
        {{- end }}
        - name: memgraph-tools-runtime
          emptyDir: {}
        {{- if $remoteDockerEnabled }}
        {{- if $remoteDockerCliEnabled }}
        - name: remote-docker-cli
          emptyDir: {}
        {{- end }}
        - name: remote-docker-ssh-secret
          secret:
            secretName: {{ .Values.remoteDocker.ssh.secretName }}
        - name: remote-docker-ssh
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with (coalesce .Values.nodeSelector .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.tolerations .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.affinity .Values.global.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
