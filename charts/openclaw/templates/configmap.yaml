{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw.fullname" . }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "commands": {{ toJson (.Values.openclaw.commands | default (dict)) }},
      "tools": {{ toJson (.Values.openclaw.tools | default (dict)) }},
      "cron": {{ toJson (.Values.openclaw.cron | default (dict)) }},
      "gateway": {
        "mode": {{ .Values.openclaw.gateway.mode | quote }},
        "bind": {{ .Values.openclaw.gateway.bind | quote }},
        "port": {{ .Values.openclaw.gateway.port }},
        "auth": {
          "mode": {{ .Values.openclaw.gateway.auth.mode | quote }},
          "token": "${OPENCLAW_GATEWAY_TOKEN}"
        },
        "controlUi": {
          "enabled": {{ .Values.openclaw.gateway.controlUi.enabled }},
          "allowedOrigins": {{ toJson .Values.openclaw.gateway.controlUi.allowedOrigins }}
        },
        "trustedProxies": {{ toJson (.Values.openclaw.gateway.trustedProxies | default (list)) }}
      },
      "agents": {
        "defaults": {{ toJson .Values.openclaw.agents.defaults }},
        "list": {{ toJson .Values.openclaw.agents.list }}
      },
      "skills": {{ toJson (.Values.openclaw.skills | default (dict)) }},
      "mcp": {{ toJson (.Values.openclaw.mcp | default (dict)) }},
      "plugins": {{ toJson .Values.openclaw.plugins }}
    }
  mcp-http-bridge.mjs: |
{{ .Files.Get "files/mcp-http-bridge.mjs" | indent 4 }}
  {{- if .Values.workspaceBootstrap.enabled }}
  {{- range $agentId, $agentConfig := .Values.workspaceBootstrap.agents }}
  {{- $filesDir := $agentConfig.filesDir | default "" }}
  {{- range $path, $_ := $.Files.Glob (printf "files/%s/**" $filesDir) }}
  {{- $filePath := trimPrefix (printf "files/%s/" $filesDir) $path }}
{{ printf "  workspace-%s-%s: |\n%s" $agentId (replace "/" "__" $filePath) ($.Files.Get $path | trimPrefix "\n" | indent 4) }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
