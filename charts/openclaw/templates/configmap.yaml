{{- if .Values.config.enabled }}
{{- $agentDefaults := deepCopy .Values.openclaw.agents.defaults }}
{{- $agentList := deepCopy .Values.openclaw.agents.list }}
{{- $coderGiteaUsername := "coder" }}
{{- $reviewerGiteaUsername := "reviewer" }}
{{- $giteaAdminUsername := .Values.workspaceBootstrap.giteaAdminUsername | default "git-admin" }}
{{- range $agent := $agentList }}
  {{- if eq (get $agent "id") "coder" }}
    {{- $coderGiteaUsername = dig "sandbox" "docker" "env" "CODER_GITEA_USERNAME" $coderGiteaUsername $agent }}
  {{- end }}
  {{- if eq (get $agent "id") "architect" }}
    {{- $reviewerGiteaUsername = dig "sandbox" "docker" "env" "REVIEWER_GITEA_USERNAME" $reviewerGiteaUsername $agent }}
  {{- end }}
{{- end }}
{{- if not .Values.qdrant.apiKeySecret.name }}
  {{- if and (hasKey $agentDefaults "sandbox") (hasKey $agentDefaults.sandbox "docker") (hasKey $agentDefaults.sandbox.docker "env") }}
    {{- $_ := unset $agentDefaults.sandbox.docker.env "QDRANT_API_KEY" }}
  {{- end }}
  {{- range $agent := $agentList }}
    {{- if and (hasKey $agent "sandbox") (hasKey $agent.sandbox "docker") (hasKey $agent.sandbox.docker "env") }}
      {{- $_ := unset $agent.sandbox.docker.env "QDRANT_API_KEY" }}
    {{- end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw.fullname" . }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
data:
  openclaw.json: |
    {
      "commands": {{ toJson (.Values.openclaw.commands | default (dict)) }},
      "tools": {{ toJson (.Values.openclaw.tools | default (dict)) }},
      "cron": {{ toJson (.Values.openclaw.cron | default (dict)) }},
      "gateway": {
        "mode": {{ .Values.openclaw.gateway.mode | quote }},
        "bind": {{ .Values.openclaw.gateway.bind | quote }},
        "port": {{ .Values.openclaw.gateway.port }},
        "auth": {
          "mode": {{ .Values.openclaw.gateway.auth.mode | quote }},
          "token": "${OPENCLAW_GATEWAY_TOKEN}"
        },
        "controlUi": {
          "enabled": {{ .Values.openclaw.gateway.controlUi.enabled }},
          "allowedOrigins": {{ toJson .Values.openclaw.gateway.controlUi.allowedOrigins }}
        },
        "trustedProxies": {{ toJson (.Values.openclaw.gateway.trustedProxies | default (list)) }}
      },
      "agents": {
        "defaults": {{ toJson $agentDefaults }},
        "list": {{ toJson $agentList }}
      },
      "skills": {{ toJson (.Values.openclaw.skills | default (dict)) }},
      "mcp": {{ toJson (.Values.openclaw.mcp | default (dict)) }},
      "plugins": {{ toJson .Values.openclaw.plugins }}
    }
  mcp-http-bridge.mjs: |
{{ .Files.Get "files/mcp-http-bridge.mjs" | indent 4 }}
  {{- if .Values.workspaceBootstrap.enabled }}
  {{- range $agentId, $agentConfig := .Values.workspaceBootstrap.agents }}
  {{- $filesDir := $agentConfig.filesDir | default "" }}
  {{- range $path, $_ := $.Files.Glob (printf "files/%s/**" $filesDir) }}
  {{- $filePath := trimPrefix (printf "files/%s/" $filesDir) $path }}
  {{- $renderedFile := $.Files.Get $path | replace "__CODER_GITEA_USERNAME__" $coderGiteaUsername | replace "__REVIEWER_GITEA_USERNAME__" $reviewerGiteaUsername | replace "__GITEA_ADMIN_USERNAME__" $giteaAdminUsername }}
{{ printf "  workspace-%s-%s: |\n%s" $agentId (replace "/" "__" $filePath) ($renderedFile | trimPrefix "\n" | indent 4) }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
