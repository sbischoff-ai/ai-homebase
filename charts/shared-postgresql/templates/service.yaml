apiVersion: v1
kind: Service
metadata:
  name: {{ include "shared-postgresql.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "shared-postgresql.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: postgresql
  selector:
    app.kubernetes.io/name: {{ include "shared-postgresql.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
