nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: nextcloud
  tag: "29.0.0-apache"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  hosts:
    nextcloud: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}

backup:
  annotations: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Secret injection conventions:
# - Secret names: kebab-case (example: nextcloud-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: NEXTCLOUD_ADMIN_PASSWORD)
# Canonical external service wiring:
# - externalDatabase.* maps to POSTGRES_* env vars.
# - externalRedis.* maps to REDIS_* env vars.
# Keep existingSecret/secretRefs for compatibility and additional app secrets.
existingSecret: "" # Optional envFrom source for app credentials/secrets.
secretRefs: [] # [{name: nextcloud-app-secrets, key: NEXTCLOUD_ADMIN_PASSWORD, envVar: NEXTCLOUD_ADMIN_PASSWORD}]

externalDatabase:
  host: ""
  port: 5432
  database: ""
  user: ""
  passwordSecret:
    name: ""
    key: ""

externalRedis:
  host: ""
  port: 6379
  passwordSecret:
    name: ""
    key: ""
