nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: nextcloud
  tag: "33.0.0-apache"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  hosts:
    nextcloud: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

ingress:
  path: /
  pathType: Prefix
  private:
    enabled: true
    className: ""
    annotations:
      cert-manager.io/cluster-issuer: platform-stack-root-ca
    host: ""
    tls:
      secretName: nextcloud-private-tls
  public:
    enabled: false
    className: ""
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
    host: ""
    tls:
      secretName: nextcloud-public-tls

networkPolicy:
  enabled: false
  ingress:
    ingressController:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
  egress:
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    postgresql:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shared-postgresql
    redis:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shared-redis
    smtp:
      enabled: false
      port: 587
      to: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 100Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  fsGroup: 33
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

backup:
  annotations: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

bootstrapWait:
  image:
    repository: docker.io/postgres
    tag: "17.5-alpine"
    pullPolicy: IfNotPresent

probes:
  liveness:
    enabled: true
    path: /status.php
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

# Secret injection conventions:
# - Secret names: kebab-case (example: nextcloud-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: NEXTCLOUD_ADMIN_PASSWORD)
# Canonical external service wiring:
# - externalDatabase.* maps to POSTGRES_* env vars.
# - externalRedis.* maps to REDIS_* env vars.
# Use existingSecret/secretRefs for additional app secrets.
existingSecret: "" # Optional envFrom source for app credentials/secrets.
secretRefs: [] # [{name: nextcloud-app-secrets, key: NEXTCLOUD_ADMIN_PASSWORD, envVar: NEXTCLOUD_ADMIN_PASSWORD}]

admin:
  user: ""
  passwordSecret:
    name: ""
    key: ""

# Supports either a YAML list of domains or a comma/space-delimited string.
trustedDomains: []
trustedProxies: []
overwriteProtocol: https
overwriteHost: ""
apacheDisableRewriteIp: true

php:
  memoryLimit: 512M
  uploadLimit: 16G

initHtaccess: true

# Empty string disables the default example-file skeleton for newly created
# users. Set a custom path if you want a managed skeleton tree instead.
skeletonDirectory: ""

smtp:
  host: ""
  port: 587
  user: ""
  secure: ""
  authType: ""
  passwordSecret:
    name: ""
    key: ""
  fromAddress: ""
  domain: ""

# Optional apps to install/enable during first-time bootstrap.
# This uses a post-installation entrypoint hook supported by the official
# Nextcloud container image.
initialApps: []

bootstrapApps: []

bootstrapUsers: []

bootstrapProjectContent: []

externalDatabase:
  host: ""
  port: 5432
  database: ""
  user: ""
  passwordSecret:
    name: ""
    key: ""

externalRedis:
  host: ""
  port: 6379
  passwordSecret:
    name: ""
    key: ""

cron:
  enabled: true
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  resources: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 33
    runAsGroup: 33
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
