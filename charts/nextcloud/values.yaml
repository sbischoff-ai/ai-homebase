nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: nextcloud
  tag: "29.0.0-apache"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  hosts:
    nextcloud: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  ingress:
    ingressController:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
  egress:
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    postgresql:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shared-postgresql
    redis:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shared-redis
    smtp:
      enabled: false
      port: 587
      to: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 100Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  fsGroup: 33
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - "ALL"

backup:
  annotations: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Secret injection conventions:
# - Secret names: kebab-case (example: nextcloud-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: NEXTCLOUD_ADMIN_PASSWORD)
# Canonical external service wiring:
# - externalDatabase.* maps to POSTGRES_* env vars.
# - externalRedis.* maps to REDIS_* env vars.
# Keep existingSecret/secretRefs for compatibility and additional app secrets.
existingSecret: "" # Optional envFrom source for app credentials/secrets.
secretRefs: [] # [{name: nextcloud-app-secrets, key: NEXTCLOUD_ADMIN_PASSWORD, envVar: NEXTCLOUD_ADMIN_PASSWORD}]

admin:
  user: ""
  passwordSecret:
    name: ""
    key: ""

# Supports either a YAML list of domains or a comma/space-delimited string.
trustedDomains: []
overwriteProtocol: https

php:
  memoryLimit: 512M
  uploadLimit: 16G

initHtaccess: true

smtp:
  host: ""
  port: 587
  user: ""
  passwordSecret:
    name: ""
    key: ""
  fromAddress: ""
  domain: ""

# Optional apps to install/enable during first-time bootstrap.
# This uses a post-installation entrypoint hook supported by the official
# Nextcloud container image.
initialApps: []

externalDatabase:
  host: ""
  port: 5432
  database: ""
  user: ""
  passwordSecret:
    name: ""
    key: ""

externalRedis:
  host: ""
  port: 6379
  passwordSecret:
    name: ""
    key: ""

cron:
  enabled: true
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  resources: {}
