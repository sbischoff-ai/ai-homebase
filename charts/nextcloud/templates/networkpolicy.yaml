{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nextcloud.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingress.ingressController.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- toYaml .Values.networkPolicy.egress.postgresql.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.externalDatabase.port }}
    - to:
        {{- toYaml .Values.networkPolicy.egress.redis.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.externalRedis.port }}
    {{- if .Values.networkPolicy.egress.smtp.enabled }}
    - to:
        {{- toYaml .Values.networkPolicy.egress.smtp.to | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.smtp.port }}
    {{- end }}
{{- end }}
