{{- if .Values.bootstrapUsers }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nextcloud.fullname" . }}-bootstrap-users
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "nextcloud.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap-users
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ceu
            - |
              until su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; do
                echo "waiting for nextcloud bootstrap"
                sleep 5
              done

              su -s /bin/sh www-data -c "cd /var/www/html && php occ config:system:set skeletondirectory --value=${NEXTCLOUD_SKELETONDIRECTORY}"

              {{- range $index, $user := .Values.bootstrapUsers }}
              username_var="BOOTSTRAP_USER_{{ $index }}_USERNAME"
              display_name_var="BOOTSTRAP_USER_{{ $index }}_DISPLAY_NAME"
              password_var="BOOTSTRAP_USER_{{ $index }}_PASSWORD"
              username="$(printenv "${username_var}")"
              display_name="$(printenv "${display_name_var}")"
              password="$(printenv "${password_var}")"

              if ! su -s /bin/sh www-data -c "cd /var/www/html && php occ user:info \"${username}\" >/dev/null 2>&1"; then
                OC_PASS="${password}" su -s /bin/sh www-data -c "cd /var/www/html && php occ user:add --password-from-env --display-name \"${display_name}\" \"${username}\""
              fi
              current_display_name="$(su -s /bin/sh www-data -c "cd /var/www/html && php occ user:info \"${username}\" 2>/dev/null" | sed -n 's/^  - display_name: //p' | head -n 1)"
              if [ "${current_display_name}" != "${display_name}" ]; then
                su -s /bin/sh www-data -c "cd /var/www/html && php occ user:setting \"${username}\" settings display_name \"${display_name}\" >/dev/null"
              fi
              OC_PASS="${password}" su -s /bin/sh www-data -c "cd /var/www/html && php occ user:resetpassword --password-from-env \"${username}\""
              {{- end }}
          env:
            - name: POSTGRES_HOST
              value: {{ .Values.externalDatabase.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.externalDatabase.port | toString | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.externalDatabase.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.externalDatabase.user | quote }}
            {{- if and .Values.externalDatabase.passwordSecret.name .Values.externalDatabase.passwordSecret.key }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.passwordSecret.name }}
                  key: {{ .Values.externalDatabase.passwordSecret.key }}
            {{- end }}
            - name: REDIS_HOST
              value: {{ .Values.externalRedis.host | quote }}
            - name: REDIS_HOST_PORT
              value: {{ .Values.externalRedis.port | toString | quote }}
            {{- if and .Values.externalRedis.passwordSecret.name .Values.externalRedis.passwordSecret.key }}
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalRedis.passwordSecret.name }}
                  key: {{ .Values.externalRedis.passwordSecret.key }}
            {{- end }}
            - name: NEXTCLOUD_SKELETONDIRECTORY
              value: {{ .Values.skeletonDirectory | quote }}
            {{- range $index, $user := .Values.bootstrapUsers }}
            - name: BOOTSTRAP_USER_{{ $index }}_USERNAME
              value: {{ $user.username | quote }}
            - name: BOOTSTRAP_USER_{{ $index }}_DISPLAY_NAME
              value: {{ default $user.username $user.displayName | quote }}
            - name: BOOTSTRAP_USER_{{ $index }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $user.passwordSecret.name }}
                  key: {{ $user.passwordSecret.key }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/www/html
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nextcloud.dataPvcName" . }}
{{- end }}
