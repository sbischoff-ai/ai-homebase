apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "nextcloud.fullname" . }}
  selector:
    matchLabels:
      {{- include "nextcloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nextcloud.selectorLabels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.backup.annotations }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.backup.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $pullSecrets := concat (.Values.global.imagePullSecrets | default (list)) (.Values.imagePullSecrets | default (list)) | uniq }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{- range $pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-shared-postgresql-bootstrap
          image: "{{ .Values.bootstrapWait.image.repository }}:{{ .Values.bootstrapWait.image.tag }}"
          imagePullPolicy: {{ .Values.bootstrapWait.image.pullPolicy }}
          command:
            - /bin/sh
            - -ceu
            - |
              until PGPASSWORD="$NEXTCLOUD_DB_PASSWORD" psql \
                --host {{ .Values.externalDatabase.host | quote }} \
                --port {{ .Values.externalDatabase.port | toString | quote }} \
                --username {{ .Values.externalDatabase.user | quote }} \
                --dbname {{ .Values.externalDatabase.database | quote }} \
                -tAc "SELECT current_database(), current_user;" | grep -qx '{{ .Values.externalDatabase.database }}|{{ .Values.externalDatabase.user }}'; do
                echo "waiting for live PostgreSQL bootstrap of {{ .Values.externalDatabase.user }}"
                sleep 2
              done
          env:
            - name: NEXTCLOUD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.passwordSecret.name }}
                  key: {{ .Values.externalDatabase.passwordSecret.key }}
        {{- $trustedDomains := .Values.trustedDomains }}
        {{- $trustedDomainsValue := "" }}
        {{- if kindIs "slice" $trustedDomains }}
        {{- $trustedDomainsValue = join " " $trustedDomains }}
        {{- else if $trustedDomains }}
        {{- $trustedDomainsValue = $trustedDomains | toString }}
        {{- end }}
        - name: reconcile-trusted-domains
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ceu
            - |
              if ! su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; then
                exit 0
              fi
              idx=0
              for domain in localhost $NEXTCLOUD_TRUSTED_DOMAINS; do
                su -s /bin/sh www-data -c "cd /var/www/html && php occ config:system:set trusted_domains ${idx} --value='${domain}'"
                idx=$((idx + 1))
              done
          env:
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: {{ $trustedDomainsValue | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/www/html
        - name: reconcile-system-settings
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ceu
            - |
              if ! su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'; then
                exit 0
              fi
              su -s /bin/sh www-data -c "cd /var/www/html && php occ config:system:set skeletondirectory --value=${NEXTCLOUD_SKELETONDIRECTORY}"
          env:
            - name: NEXTCLOUD_SKELETONDIRECTORY
              value: {{ .Values.skeletonDirectory | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/www/html
      containers:
        - name: nextcloud
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - su -s /bin/sh www-data -c 'cd /var/www/html && php occ status --output=json 2>/dev/null | grep -q "\"installed\":true"'
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- $trustedProxiesValue := join " " (.Values.trustedProxies | default (list)) }}
          env:
            - name: NEXTCLOUD_ADMIN_USER
              value: {{ .Values.admin.user | quote }}
            {{- if and .Values.admin.passwordSecret.name .Values.admin.passwordSecret.key }}
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.passwordSecret.name }}
                  key: {{ .Values.admin.passwordSecret.key }}
            {{- end }}
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: {{ $trustedDomainsValue | quote }}
            {{- if $trustedProxiesValue }}
            - name: TRUSTED_PROXIES
              value: {{ $trustedProxiesValue | quote }}
            {{- end }}
            {{- if .Values.apacheDisableRewriteIp }}
            - name: APACHE_DISABLE_REWRITE_IP
              value: "1"
            {{- end }}
            - name: OVERWRITEPROTOCOL
              value: {{ .Values.overwriteProtocol | quote }}
            {{- if .Values.overwriteHost }}
            - name: OVERWRITEHOST
              value: {{ .Values.overwriteHost | quote }}
            {{- end }}
            - name: PHP_MEMORY_LIMIT
              value: {{ .Values.php.memoryLimit | quote }}
            - name: PHP_UPLOAD_LIMIT
              value: {{ .Values.php.uploadLimit | quote }}
            - name: NEXTCLOUD_INIT_HTACCESS
              value: {{ .Values.initHtaccess | toString | quote }}
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | toString | quote }}
            - name: SMTP_NAME
              value: {{ .Values.smtp.user | quote }}
            - name: SMTP_SECURE
              value: {{ .Values.smtp.secure | quote }}
            - name: SMTP_AUTHTYPE
              value: {{ .Values.smtp.authType | quote }}
            {{- if and .Values.smtp.passwordSecret.name .Values.smtp.passwordSecret.key }}
            - name: SMTP_PASSWORD
              valueFrom:
                  secretKeyRef:
                  name: {{ .Values.smtp.passwordSecret.name }}
                  key: {{ .Values.smtp.passwordSecret.key }}
            {{- end }}
            - name: MAIL_FROM_ADDRESS
              value: {{ .Values.smtp.fromAddress | quote }}
            - name: MAIL_DOMAIN
              value: {{ .Values.smtp.domain | quote }}
            - name: POSTGRES_HOST
              value: {{ .Values.externalDatabase.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.externalDatabase.port | toString | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.externalDatabase.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.externalDatabase.user | quote }}
            {{- if and .Values.externalDatabase.passwordSecret.name .Values.externalDatabase.passwordSecret.key }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.passwordSecret.name }}
                  key: {{ .Values.externalDatabase.passwordSecret.key }}
            {{- end }}
            - name: REDIS_HOST
              value: {{ .Values.externalRedis.host | quote }}
            - name: REDIS_HOST_PORT
              value: {{ .Values.externalRedis.port | toString | quote }}
            {{- if and .Values.externalRedis.passwordSecret.name .Values.externalRedis.passwordSecret.key }}
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalRedis.passwordSecret.name }}
                  key: {{ .Values.externalRedis.passwordSecret.key }}
            {{- end }}
            {{- range .Values.secretRefs }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          {{- if or .Values.persistence.enabled .Values.initialApps }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /var/www/html
            - name: post-install-config-hook
              mountPath: /docker-entrypoint-hooks.d/pre-installation/00-pre-install-config.sh
              subPath: 00-pre-install-config.sh
              readOnly: true
            - name: post-install-config-hook
              mountPath: /docker-entrypoint-hooks.d/post-installation/50-post-install-config.sh
              subPath: 50-post-install-config.sh
              readOnly: true
            {{- end }}
            {{- if .Values.initialApps }}
            - name: initial-apps-hook
              mountPath: /docker-entrypoint-hooks.d/post-installation/99-initial-apps.sh
              subPath: 99-initial-apps.sh
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.persistence.enabled .Values.initialApps }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nextcloud.dataPvcName" . }}
        - name: post-install-config-hook
          configMap:
            name: {{ include "nextcloud.fullname" . }}-post-install-config-hook
            defaultMode: 0755
        {{- end }}
        {{- if .Values.initialApps }}
        - name: initial-apps-hook
          configMap:
            name: {{ include "nextcloud.fullname" . }}-initial-apps-hook
            defaultMode: 0755
        {{- end }}
      {{- end }}
