{{- if .Values.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "paperless-ngx.fullname" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "paperless-ngx.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "paperless-ngx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paperless-ngx.selectorLabels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.backup.annotations }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.backup.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      containers:
        - name: paperless-ngx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretKeySecret.name }}
                  key: {{ .Values.secretKeySecret.key }}
            - name: PAPERLESS_ADMIN_USER
              value: {{ .Values.admin.user | quote }}
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.passwordSecret.name }}
                  key: {{ .Values.admin.passwordSecret.key }}
            {{- if .Values.admin.mail }}
            - name: PAPERLESS_ADMIN_MAIL
              value: {{ .Values.admin.mail | quote }}
            {{- end }}
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: {{ .Values.externalDatabase.host | quote }}
            - name: PAPERLESS_DBPORT
              value: {{ .Values.externalDatabase.port | toString | quote }}
            - name: PAPERLESS_DBNAME
              value: {{ .Values.externalDatabase.name | quote }}
            - name: PAPERLESS_DBUSER
              value: {{ .Values.externalDatabase.user | quote }}
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.passwordSecret.name }}
                  key: {{ .Values.externalDatabase.passwordSecret.key }}
            - name: PAPERLESS_REDIS
              {{- if and .Values.redis.urlSecret.name .Values.redis.urlSecret.key }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.urlSecret.name }}
                  key: {{ .Values.redis.urlSecret.key }}
              {{- else if and .Values.redis.passwordSecret.name .Values.redis.passwordSecret.key }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.passwordSecret.name }}
                  key: {{ .Values.redis.passwordSecret.key }}
              {{- else }}
              value: {{ .Values.redis.url | quote }}
              {{- end }}
            - name: PAPERLESS_REDIS_PREFIX
              value: {{ .Values.redis.prefix | quote }}
            {{- range .Values.secretRefs }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.data.enabled }}
            - name: data
              mountPath: /usr/src/paperless/data
            {{- end }}
            {{- if .Values.persistence.media.enabled }}
            - name: media
              mountPath: /usr/src/paperless/media
            {{- end }}
            {{- if .Values.persistence.consume.enabled }}
            - name: consume
              mountPath: /usr/src/paperless/consume
            {{- end }}
            {{- if .Values.persistence.export.enabled }}
            - name: export
              mountPath: /usr/src/paperless/export
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if and .Values.persistence.data.enabled .Values.persistence.data.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.data.existingClaim }}
        {{- end }}
        {{- if and .Values.persistence.media.enabled .Values.persistence.media.existingClaim }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.media.existingClaim }}
        {{- end }}
        {{- if and .Values.persistence.consume.enabled .Values.persistence.consume.existingClaim }}
        - name: consume
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.consume.existingClaim }}
        {{- end }}
        {{- if and .Values.persistence.export.enabled .Values.persistence.export.existingClaim }}
        - name: export
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.export.existingClaim }}
        {{- end }}
{{- end }}
