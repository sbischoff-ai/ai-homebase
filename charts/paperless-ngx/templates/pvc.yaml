{{- if and .Values.persistence.data.enabled (not .Values.persistence.data.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
  {{- if or .Values.persistence.data.annotations .Values.backup.annotations }}
  annotations:
    {{- with .Values.backup.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.persistence.data.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.data.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
  {{- $sc := include "paperless-ngx.storageClass" (list .Values.persistence.data .) }}
  {{- if $sc }}
  storageClassName: {{ $sc }}
  {{- end }}
---
{{- end }}
