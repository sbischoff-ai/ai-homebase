{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "paperless-ngx.fullname" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "paperless-ngx.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingress.ingressController.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.postgresql.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.postgresql.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.externalDatabase.port }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.redis.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.redis.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.redis.port }}
{{- end }}
