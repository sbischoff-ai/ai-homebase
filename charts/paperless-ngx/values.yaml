enabled: false

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: paperlessngx/paperless-ngx
  tag: "2.20"
  pullPolicy: IfNotPresent

global:
  storageClass: ""
  hosts:
    paperless: ""
    paperlessNgx: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  data:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
    storageClass: ""
    annotations: {}
  media:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 20Gi
    storageClass: ""
    annotations: {}
  consume:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
    storageClass: ""
    annotations: {}
  export:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
    storageClass: ""
    annotations: {}

podAnnotations: {}

backup:
  annotations: {}

resources: {}

# Secret injection conventions:
# - Secret names: kebab-case (example: paperlessngx-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: PAPERLESS_SECRET_KEY)
existingSecret: "" # Optional envFrom source for app credentials/secrets.
secretRefs: [] # [{name: paperlessngx-app-secrets, key: PAPERLESS_SECRET_KEY, envVar: PAPERLESS_SECRET_KEY}]

externalDatabase:
  host: ""
  port: 5432
  name: "paperless"
  user: "paperless"
  passwordSecret:
    name: ""
    key: ""
