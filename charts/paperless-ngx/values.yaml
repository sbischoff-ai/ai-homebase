enabled: false

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: paperlessngx/paperless-ngx
  tag: "2.20"
  pullPolicy: IfNotPresent

global:
  storageClass: ""
  hosts:
    paperless: ""
    paperlessNgx: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  ingress:
    ingressController:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/component: controller
    wgEasy:
      enabled: false
      namespaceSelectors: []
  egress:
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    postgresql:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-homebase
      podSelector:
        matchLabels:
          app.kubernetes.io/name: shared-postgresql
    redis:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-homebase
      podSelector:
        matchLabels:
          app.kubernetes.io/name: shared-redis
      port: 6379

persistence:
  data:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
    storageClass: ""
    annotations: {}
  media:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 20Gi
    storageClass: ""
    annotations: {}
  consume:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
    storageClass: ""
    annotations: {}
  export:
    enabled: true
    existingClaim: ""
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
    storageClass: ""
    annotations: {}

podAnnotations: {}

backup:
  annotations: {}

resources: {}

probes:
  liveness:
    enabled: true
    path: /api/health/
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    enabled: true
    path: /api/health/
    initialDelaySeconds: 10
    periodSeconds: 10

# Secret injection conventions:
# - Secret names: kebab-case (example: paperlessngx-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: PAPERLESS_SECRET_KEY)
# Structured secret refs are the primary runtime contract for required Paperless env vars.
secretKeySecret:
  name: ""
  key: ""

admin:
  user: ""
  mail: ""
  passwordSecret:
    name: ""
    key: ""

existingSecret: "" # Optional envFrom source for app credentials/secrets.
secretRefs: [] # [{name: paperlessngx-app-secrets, key: PAPERLESS_SECRET_KEY, envVar: PAPERLESS_SECRET_KEY}]

externalDatabase:
  host: ""
  port: 5432
  name: "paperless"
  user: "paperless"
  passwordSecret:
    name: ""
    key: ""

redis:
  passwordSecret:
    name: ""
    key: ""
  url: ""
  urlSecret:
    name: ""
    key: ""
  prefix: ""

appConfig:
  url: ""
  allowedHosts: ""
  csrfTrustedOrigins: ""
  corsAllowedHosts: ""
  timeZone: "Europe/Berlin"
  ocrLanguage: "deu+eng"
