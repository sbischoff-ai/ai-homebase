nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: qdrant/qdrant
  tag: "v1.17.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  hosts:
    qdrant: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 6333
  targetPort: 6333
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
  defaultHost: qdrant.example.com
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  size: 100Gi
  storageClass: ""

volumePermissions:
  enabled: true
  image:
    repository: busybox
    tag: "1.36.1"
    pullPolicy: IfNotPresent
  resources: {}
  securityContext:
    runAsUser: 0
    runAsGroup: 0

podAnnotations: {}
podLabels: {}

env:
  - name: QDRANT__STORAGE__STORAGE_PATH
    value: /qdrant/storage/storage
  - name: QDRANT__STORAGE__SNAPSHOTS_PATH
    value: /qdrant/storage/snapshots
  - name: QDRANT__STORAGE__TEMP_PATH
    value: /qdrant/storage/tmp
envFromSecrets: []
existingSecret: ""
secretRefs: []

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

probes:
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    enabled: true
    path: /livez
    initialDelaySeconds: 30
    periodSeconds: 15

nodeSelector: {}
tolerations: []
affinity: {}
