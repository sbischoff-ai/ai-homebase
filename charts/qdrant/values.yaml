nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: qdrant/qdrant
  tag: "v1.17.1"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  hosts:
    qdrant: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 6333
  targetPort: 6333
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
  defaultHost: qdrant.example.com
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  size: 100Gi
  storageClass: ""

podAnnotations: {}
podLabels: {}

env: []
envFromSecrets: []
existingSecret: ""
secretRefs: []

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

probes:
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    enabled: true
    path: /livez
    initialDelaySeconds: 30
    periodSeconds: 15

nodeSelector: {}
tolerations: []
affinity: {}
