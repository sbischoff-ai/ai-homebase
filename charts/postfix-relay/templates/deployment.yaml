{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postfix-relay.fullname" . }}
  labels:
    {{- include "postfix-relay.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "postfix-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postfix-relay.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $pullSecrets := concat (.Values.global.imagePullSecrets | default (list)) (.Values.imagePullSecrets | default (list)) | uniq }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{- range $pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: postfix-relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: smtp-submission
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: ALLOWED_SENDER_DOMAINS
              value: {{ include "postfix-relay.allowedSenderDomains" . | quote }}
            - name: POSTFIX_myhostname
              value: {{ include "postfix-relay.hostname" . | quote }}
            - name: POSTFIX_mynetworks
              value: {{ join " " (.Values.config.mynetworks | default (list)) | quote }}
            - name: MASQUERADED_DOMAINS
              value: {{ include "postfix-relay.allowedSenderDomains" . | quote }}
            - name: INBOUND_DEBUGGING
              value: {{ ternary "1" "0" .Values.config.inboundDebugging | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: smtp-submission
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: smtp-submission
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
