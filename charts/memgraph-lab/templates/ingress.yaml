{{- if and .Values.ingress.enabled (eq (coalesce .Values.ingress.defaultHost .Values.global.hosts.memgraphLab "") "") }}
{{- fail "ingress.enabled=true requires ingress.defaultHost, global.hosts.memgraphLab, or ingress.hosts[*].host" }}
{{- end }}
{{- if .Values.ingress.enabled }}
{{- $defaultHost := coalesce .Values.ingress.defaultHost .Values.global.hosts.memgraphLab }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "memgraph-lab.fullname" . }}
  labels:
    {{- include "memgraph-lab.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ default $defaultHost .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "memgraph-lab.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
