enabled: false

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/dani-garcia/vaultwarden
  tag: "1.35.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  hosts:
    vaultwarden: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

probes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10

existingSecret: ""
secretRefs: []

databaseUrlSecret:
  name: ""
  key: ""

bootstrapWait:
  image:
    repository: docker.io/postgres
    tag: "17.5-alpine"
    pullPolicy: IfNotPresent

appConfig:
  domain: ""
  signupsAllowed: false
  invitationsAllowed: true
  websocketEnabled: true
