{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vaultwarden.fullname" . }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vaultwarden.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vaultwarden.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $pullSecrets := concat (.Values.global.imagePullSecrets | default (list)) (.Values.imagePullSecrets | default (list)) | uniq }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{- range $pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: wait-for-shared-postgresql-bootstrap
          image: "{{ .Values.bootstrapWait.image.repository }}:{{ .Values.bootstrapWait.image.tag }}"
          imagePullPolicy: {{ .Values.bootstrapWait.image.pullPolicy }}
          command:
            - /bin/sh
            - -ceu
            - |
              until PGPASSWORD="$VAULTWARDEN_DB_PASSWORD" psql \
                --host platform-stack-shared-postgresql \
                --port 5432 \
                --username vaultwarden \
                --dbname vaultwarden \
                -tAc "SELECT current_database(), current_user;" | grep -qx 'vaultwarden|vaultwarden'; do
                echo "waiting for live PostgreSQL bootstrap of vaultwarden"
                sleep 2
              done
          env:
            - name: VAULTWARDEN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecret.name }}
                  key: VAULTWARDEN_DB_PASSWORD
      containers:
        - name: vaultwarden
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: DATA_FOLDER
              value: /data
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseUrlSecret.name }}
                  key: {{ .Values.databaseUrlSecret.key }}
            {{- $domain := include "vaultwarden.domain" . }}
            {{- if $domain }}
            - name: DOMAIN
              value: {{ $domain | quote }}
            {{- end }}
            - name: SIGNUPS_ALLOWED
              value: {{ .Values.appConfig.signupsAllowed | toString | quote }}
            - name: INVITATIONS_ALLOWED
              value: {{ .Values.appConfig.invitationsAllowed | toString | quote }}
            - name: WEBSOCKET_ENABLED
              value: {{ .Values.appConfig.websocketEnabled | toString | quote }}
            {{- if .Values.smtp.host }}
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | toString | quote }}
            - name: SMTP_FROM
              value: {{ .Values.smtp.from | quote }}
            {{- if .Values.smtp.fromName }}
            - name: SMTP_FROM_NAME
              value: {{ .Values.smtp.fromName | quote }}
            {{- end }}
            - name: SMTP_SECURITY
              value: {{ .Values.smtp.security | quote }}
            {{- if .Values.smtp.username }}
            - name: SMTP_USERNAME
              value: {{ .Values.smtp.username | quote }}
            {{- end }}
            {{- if and .Values.smtp.passwordSecret.name .Values.smtp.passwordSecret.key }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smtp.passwordSecret.name }}
                  key: {{ .Values.smtp.passwordSecret.key }}
            {{- end }}
            {{- end }}
            {{- range .Values.secretRefs }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vaultwarden.fullname" . }}-data
        {{- end }}
      {{- end }}
{{- end }}
