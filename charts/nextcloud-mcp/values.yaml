nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/cbcoutinho/nextcloud-mcp-server
  tag: "0.65.3"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  hosts:
    nextcloudMcp: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
  defaultHost: nextcloud-mcp.example.com
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

nextcloud:
  url: http://platform-stack-nextcloud

authentication:
  mode: multi_user_basic

args:
  - --enable-app
  - notes
  - --enable-app
  - webdav
  - --enable-app
  - tables
  - --enable-app
  - calendar

podAnnotations: {}
podLabels: {}

env: []
envFromSecrets: []
existingSecret: ""
secretRefs: []

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6

nodeSelector: {}
tolerations: []
affinity: {}
