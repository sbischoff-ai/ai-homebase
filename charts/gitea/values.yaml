gitea:
  enabled: true
  image:
    repository: gitea/gitea
    tag: "1.22.0"
    pullPolicy: IfNotPresent
  service:
    http:
      type: ClusterIP
      port: 3000
    ssh:
      type: ClusterIP
      port: 22
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL
  admin:
    username: git-admin
    existingSecret: ""
  # Phase 1 intentionally focuses on Git/PR/wiki workflows.
  # Actions/runners are deferred to a later dedicated deployment.
  actions:
    enabled: false
  config:
    database:
      DB_TYPE: postgres
      HOST: platform-stack-shared-postgresql:5432
      NAME: gitea
      USER: gitea
    session:
      PROVIDER: redis
    cache:
      ENABLED: true
      ADAPTER: redis
    queue:
      TYPE: redis
    global_lock:
      SERVICE_TYPE: redis
  additionalConfigFromEnvs:
    - GITEA__database__PASSWD
    - GITEA__session__PROVIDER_CONFIG
    - GITEA__cache__HOST
    - GITEA__queue__CONN_STR
    - GITEA__global_lock__SERVICE_CONN_STR
  additionalConfigSources: []
  postgresql:
    enabled: false
    primary:
      persistence:
        enabled: true
        size: 10Gi
        storageClass: ""
  postgresql-ha:
    enabled: false
  redis:
    enabled: false
  redis-cluster:
    enabled: false
