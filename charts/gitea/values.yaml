nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: gitea/gitea
  tag: "1.22.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  hosts:
    gitea: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}

backup:
  annotations: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Secret injection conventions:
# - Secret names: kebab-case (example: gitea-app-secrets)
# - Secret data keys should match the consuming chart contract (for official admin bootstrap: username/password in gitea.admin.existingSecret).
existingSecret: "" # Optional envFrom source for app credentials/secrets.
secretRefs: [] # [{name: app-secrets, key: SOME_KEY, envVar: SOME_ENV}]

# Values passed through to the official Gitea chart dependency.
gitea:
  admin:
    username: git-admin
    existingSecret: ""
  config:
    database:
      DB_TYPE: postgres

postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""

postgresql-ha:
  enabled: false

redis:
  enabled: true
