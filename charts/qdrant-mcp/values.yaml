nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: python
  tag: "3.12-slim"
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  imagePullSecrets: []
  hosts:
    qdrantMcp: ""
  commonLabels: {}

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}

ingress:
  enabled: true
  className: ""
  annotations: {}
  defaultHost: qdrant-mcp.example.com
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

qdrant:
  url: http://platform-stack-qdrant:6333
  collectionName: openclaw-memory

embedding:
  provider: fastembed
  model: BAAI/bge-base-en-v1.5

command:
  - /bin/sh
  - -ceu
  - |
    if [ ! -x /tmp/qdrant-mcp/bin/mcp-server-qdrant ]; then
      python -m venv /tmp/qdrant-mcp
      /tmp/qdrant-mcp/bin/pip install --no-cache-dir "mcp-server-qdrant==0.8.0"
    fi
    exec /tmp/qdrant-mcp/bin/mcp-server-qdrant --transport streamable-http

podAnnotations: {}
podLabels: {}

env:
  - name: HOME
    value: /tmp
  - name: XDG_CACHE_HOME
    value: /tmp/.cache
  - name: HF_HOME
    value: /tmp/.cache/huggingface
  - name: HUGGINGFACE_HUB_CACHE
    value: /tmp/.cache/huggingface/hub
  - name: FASTMCP_HOST
    value: "0.0.0.0"
envFromSecrets: []
existingSecret: ""
secretRefs: []

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

probes:
  readiness:
    enabled: true
    type: tcp
    initialDelaySeconds: 180
    periodSeconds: 10
  liveness:
    enabled: true
    type: tcp
    initialDelaySeconds: 300
    periodSeconds: 15

nodeSelector: {}
tolerations: []
affinity: {}
