nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: "14"
  pullPolicy: IfNotPresent

global:
  storageClass: ""
  hosts:
    wg: ""
    vpn: ""
    wgEasy: ""
  commonLabels: {}

wg:
  host: ""
  subnet: "10.8.0.0/24"

service:
  type: LoadBalancer # Set to NodePort when your environment does not support LoadBalancer services.
  wireguardPort: 51820
  uiPort: 51821
  annotations: {}

ingress:
  enabled: false
  # Keep disabled by default. Prefer private exposure methods (internal ingress, VPN-only LB, or bastion).
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  # Example admin-surface policy: restrict web UI ingress and allow VPN UDP only from trusted CIDRs via CNI policies.
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

persistence:
  enabled: true
  existingClaim: ""
  accessModes: ["ReadWriteOnce"]
  size: 2Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}

backup:
  annotations: {}

resources: {}

securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - SYS_MODULE

# Secret injection conventions:
# - Secret names: kebab-case (example: wgeasy-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: WG_EASY_PASSWORD_HASH)
existingSecret: "" # Optional override for secret name containing required keys WG_HOST and PASSWORD.
secretRefs: [] # [{name: wgeasy-app-secrets, key: WG_EASY_PASSWORD_HASH, envVar: WG_EASY_PASSWORD_HASH}]
