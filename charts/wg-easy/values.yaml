nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: "14"
  pullPolicy: IfNotPresent

global:
  storageClass: ""
  hosts:
    wgEasy: ""
  commonLabels: {}

service:
  type: ClusterIP
  webPort: 51821
  webTargetPort: 51821
  vpnPort: 51820
  vpnTargetPort: 51820
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes: ["ReadWriteOnce"]
  size: 2Gi
  storageClass: ""

resources: {}
