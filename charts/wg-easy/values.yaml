nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: "14"
  pullPolicy: IfNotPresent

global:
  storageClass: ""
  hosts:
    wgEasy: ""
  commonLabels: {}

wg:
  host: ""
  subnet: "10.8.0.0/24"
  defaultAddress: ""
  defaultDns: "1.1.1.1"
  allowedIPs: "0.0.0.0/0"

service:
  type: LoadBalancer # Set to NodePort when your environment does not support LoadBalancer services.
  wireguardPort: 51820
  uiPort: 51821
  annotations: {}
  loadBalancerSourceRanges: []

ingress:
  enabled: false
  # Keep disabled by default. Prefer private exposure methods (internal ingress, VPN-only LB, or bastion).
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  # Example admin-surface policy: restrict web UI ingress and allow VPN UDP only from trusted CIDRs via CNI policies.
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

persistence:
  enabled: true
  existingClaim: ""
  accessModes: ["ReadWriteOnce"]
  size: 1Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

backup:
  annotations: {}

resources: {}

securityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    add:
      - NET_ADMIN
      - SYS_MODULE
    drop:
      - ALL

# Secret injection conventions:
# - Secret names: kebab-case (example: wgeasy-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: WG_HOST, PASSWORD_HASH)
existingSecret: "" # Optional override for secret name containing required keys WG_HOST and PASSWORD_HASH.
secretRefs: [] # [{name: wgeasy-app-secrets, key: WG_DEFAULT_DNS, envVar: WG_DEFAULT_DNS}]
