nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/wg-easy/wg-easy
  tag: "14"
  pullPolicy: IfNotPresent

global:
  storageClass: ""
  hosts:
    wg: ""
    vpn: ""
    wgEasy: ""
  commonLabels: {}

service:
  type: ClusterIP
  webPort: 51821
  webTargetPort: 51821
  vpnPort: 51820
  vpnTargetPort: 51820
  annotations: {}

ingress:
  enabled: false
  # Keep disabled by default. Prefer private exposure methods (internal ingress, VPN-only LB, or bastion).
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  # Example admin-surface policy: restrict web UI ingress and allow VPN UDP only from trusted CIDRs via CNI policies.
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

persistence:
  enabled: true
  existingClaim: ""
  accessModes: ["ReadWriteOnce"]
  size: 2Gi
  storageClass: ""
  annotations: {}

podAnnotations: {}

backup:
  annotations: {}

resources: {}
