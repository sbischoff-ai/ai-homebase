apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wg-easy.fullname" . }}
  labels:
    {{- include "wg-easy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wg-easy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wg-easy.selectorLabels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.backup.annotations }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.backup.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wg-easy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: web
              containerPort: {{ .Values.service.uiPort }}
            - name: vpn
              containerPort: {{ .Values.service.wireguardPort }}
              protocol: UDP
          {{- $secretName := default (printf "%s-secrets" (include "wg-easy.fullname" .)) .Values.existingSecret }}
          env:
            - name: WG_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: WG_HOST
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: PASSWORD
            - name: WG_DEFAULT_ADDRESS
              value: {{ default (regexReplaceAll "\\.0/[0-9]+$" .Values.wg.subnet ".x") .Values.wg.defaultAddress | quote }}
            - name: WG_DEFAULT_DNS
              value: {{ .Values.wg.defaultDns | quote }}
            - name: WG_ALLOWED_IPS
              value: {{ .Values.wg.allowedIPs | quote }}
          {{- if .Values.secretRefs }}
            {{- range .Values.secretRefs }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /etc/wireguard
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "wg-easy.fullname" .) .Values.persistence.existingClaim }}
      {{- end }}
