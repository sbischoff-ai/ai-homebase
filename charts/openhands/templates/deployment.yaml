apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openhands.fullname" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "openhands.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openhands.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.global.podAnnotations .Values.podAnnotations }}
      annotations:
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      {{- $persistence := include "openhands.persistenceConfig" . | fromYaml }}
      serviceAccountName: {{ include "openhands.serviceAccountName" . }}
      {{- $pullSecrets := include "openhands.effectiveImagePullSecrets" . | fromYamlArray }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{- range $pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "openhands.name" . }}
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- $envNames := dict }}
            - name: QUEUE_ENABLED
              value: {{ .Values.queue.enabled | quote }}
            {{- $_ := set $envNames "QUEUE_ENABLED" true }}
            - name: QUEUE_PROVIDER
              value: {{ .Values.queue.provider | quote }}
            {{- $_ := set $envNames "QUEUE_PROVIDER" true }}
            - name: QUEUE_ENDPOINT
              value: {{ .Values.queue.endpoint | quote }}
            {{- $_ := set $envNames "QUEUE_ENDPOINT" true }}
            - name: QUEUE_NAME
              value: {{ .Values.queue.queueName | quote }}
            {{- $_ := set $envNames "QUEUE_NAME" true }}
            - name: QUEUE_DLQ_NAME
              value: {{ .Values.queue.dlqName | quote }}
            {{- $_ := set $envNames "QUEUE_DLQ_NAME" true }}
            - name: WORKER_CONCURRENCY
              value: {{ .Values.queue.workerConcurrency | quote }}
            {{- $_ := set $envNames "WORKER_CONCURRENCY" true }}
            {{- range .Values.global.env }}
            {{- if and .name (not (hasKey $envNames .name)) }}
            {{- toYaml (list .) | nindent 12 }}
            {{- $_ := set $envNames .name true }}
            {{- end }}
            {{- end }}
            {{- range .Values.env }}
            {{- if and .name (not (hasKey $envNames .name)) }}
            {{- toYaml (list .) | nindent 12 }}
            {{- $_ := set $envNames .name true }}
            {{- end }}
            {{- end }}
            {{- range .Values.secretEnv }}
            {{- if and .name .secretName .key (not (hasKey $envNames .name)) }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
                  {{- with .optional }}
                  optional: {{ . }}
                  {{- end }}
            {{- $_ := set $envNames .name true }}
            {{- end }}
            {{- end }}
            {{- range .Values.secretRefs }}
            {{- if and .envVar .name .key (not (hasKey $envNames .envVar)) }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- $_ := set $envNames .envVar true }}
            {{- end }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.envFromSecrets }}
          envFrom:
            {{- with .Values.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- if eq (lower (default "tcp" .Values.probes.liveness.type)) "http" }}
            httpGet:
              path: {{ coalesce .Values.probes.liveness.path .Values.probes.liveness.endpoint "/healthz" }}
              port: {{ default "http" .Values.probes.liveness.port }}
            {{- else }}
            tcpSocket:
              port: {{ default 3000 .Values.probes.liveness.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- if eq (lower (default "tcp" .Values.probes.readiness.type)) "http" }}
            httpGet:
              path: {{ coalesce .Values.probes.readiness.path .Values.probes.readiness.endpoint "/readyz" }}
              port: {{ default "http" .Values.probes.readiness.port }}
            {{- else }}
            tcpSocket:
              port: {{ default 3000 .Values.probes.readiness.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            {{- if eq (lower (default "tcp" .Values.probes.startup.type)) "http" }}
            httpGet:
              path: {{ coalesce .Values.probes.startup.path .Values.probes.startup.endpoint "/healthz" }}
              port: {{ default "http" .Values.probes.startup.port }}
            {{- else }}
            tcpSocket:
              port: {{ default 3000 .Values.probes.startup.port }}
            {{- end }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if or $persistence.enabled .Values.extraVolumeMounts }}
          volumeMounts:
            {{- if $persistence.enabled }}
            - name: workspace
              mountPath: {{ $persistence.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $persistence.enabled .Values.extraVolumes }}
      volumes:
        {{- if $persistence.enabled }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-workspace" (include "openhands.fullname" .)) $persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- $runtime := .Values.runtime }}
      {{- $runtimeClassName := "" }}
      {{- if kindIs "string" $runtime }}
      {{- $runtimeClassName = $runtime }}
      {{- else if kindIs "map" $runtime }}
      {{- $runtimeClassName = (coalesce $runtime.className $runtime.runtimeClassName $runtime.name) | default "" }}
      {{- end }}
      {{- with (default .Values.runtimeClassName $runtimeClassName) }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with (coalesce .Values.nodeSelector .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.tolerations .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (coalesce .Values.affinity .Values.global.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
