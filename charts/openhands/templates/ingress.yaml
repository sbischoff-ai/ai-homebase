{{- if and .Values.service.enabled .Values.ingress.enabled }}
{{- $defaultHost := .Values.global.hosts.openhands -}}
{{- $hostName := default $defaultHost .Values.ingress.hostName -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openhands.fullname" . }}
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ $hostName | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "openhands.fullname" . }}
                port:
                  number: {{ $.Values.service.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
