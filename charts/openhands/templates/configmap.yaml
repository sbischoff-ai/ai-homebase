apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openhands.fullname" . }}-config
  labels:
    {{- include "openhands.labels" . | nindent 4 }}
data:
  config.toml: |
    [core]
    runtime = {{ .Values.runtime.mode | quote }}

    [kubernetes]
    namespace = {{ default .Release.Namespace .Values.kubernetes.namespace | quote }}
    ingress_domain = {{ .Values.kubernetes.ingress_domain | quote }}
    pvc_storage_size = {{ .Values.kubernetes.pvc_storage_size | quote }}
    pvc_storage_class = {{ .Values.kubernetes.pvc_storage_class | quote }}
    resource_cpu_request = {{ .Values.kubernetes.resource_cpu_request | quote }}
    resource_memory_request = {{ .Values.kubernetes.resource_memory_request | quote }}
    resource_memory_limit = {{ .Values.kubernetes.resource_memory_limit | quote }}
    image_pull_secret = {{ .Values.kubernetes.image_pull_secret | quote }}
    ingress_tls_secret = {{ .Values.kubernetes.ingress_tls_secret | quote }}
    node_selector_key = {{ .Values.kubernetes.node_selector_key | quote }}
    node_selector_val = {{ .Values.kubernetes.node_selector_val | quote }}
    tolerations_yaml = {{ .Values.kubernetes.tolerations_yaml | quote }}
    privileged = {{ .Values.kubernetes.privileged }}
