nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/openhands/openhands
  tag: "1.5.0"
  pullPolicy: IfNotPresent

agentServer:
  image:
    repository: ghcr.io/openhands/agent-server
    tag: 1.12.0-python

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  domain: ""
  hosts:
    openhands: ""
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

serviceAccount:
  create: true
  automountServiceAccountToken: true
  annotations: {}
  name: ""

rbac:
  create: true

service:
  enabled: true
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: true
  hostName: ""
  ingressClassName: ""
  annotations: {}
  tls: []

persistence:
  enabled: true
  mountPath: "/.openhands"
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClass: ""
  annotations: {}

# DEPRECATED: use persistence.* instead. These fields are still honored as a
# temporary compatibility fallback when persistence.* values are not set.
workspace:
  enabled: null
  existingClaim: ""
  accessModes: []
  size: ""
  storageClass: ""
  mountPath: ""
  annotations: {}

env: []
envFromSecrets: []
# Secret injection conventions:
# - Secret names: kebab-case (example: openhands-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: OPENHANDS_API_TOKEN)
existingSecret: "" # Optional envFrom source for app credentials/secrets (example: openhands-app-secrets).
# Explicit secret key -> env var mappings (OpenHands-focused examples):
# - required/expected: {name: openhands-app-secrets, key: LLM_API_KEY, envVar: LLM_API_KEY}
# - optional: {name: openhands-app-secrets, key: LLM_MODEL, envVar: LLM_MODEL}
# - optional: {name: openhands-app-secrets, key: OH_WEB_URL, envVar: OH_WEB_URL}
# - optional/future: provider or git credentials (for example OPENAI_API_KEY, GITHUB_TOKEN)
secretRefs: []
# Structured secret-backed env vars rendered as valueFrom.secretKeyRef:
# - {name: LLM_API_KEY, secretName: openhands-app-secrets, key: LLM_API_KEY}
# - {name: LLM_MODEL, secretName: openhands-app-secrets, key: LLM_MODEL, optional: true}
# - {name: OH_WEB_URL, secretName: openhands-app-secrets, key: OH_WEB_URL, optional: true}
secretEnv: []

queue:
  enabled: false
  provider: ""
  endpoint: ""
  queueName: ""
  dlqName: ""
  workerConcurrency: 4

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: false
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 42420
  supplementalGroups:
    - 42420

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 42420
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    enabled: true
    type: tcp
    port: 3000
    endpoint: /healthz
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    enabled: true
    type: tcp
    port: 3000
    endpoint: /readyz
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  startup:
    enabled: true
    type: tcp
    port: 3000
    endpoint: /healthz
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
runtime:
  mode: kubernetes
runtimeClassName: ""
kubernetes:
  namespace: ""
  ingress_domain: ""
  pvc_storage_size: "2Gi"
  pvc_storage_class: ""
  resource_cpu_request: "1"
  resource_memory_request: "1Gi"
  resource_memory_limit: "2Gi"
  image_pull_secret: ""
  ingress_tls_secret: ""
  node_selector_key: ""
  node_selector_val: ""
  tolerations_yaml: ""
  privileged: false

extraVolumes: []
extraVolumeMounts: []
