nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: docker.openhands.dev/openhands/openhands
  tag: "1.5"
  pullPolicy: IfNotPresent

agentServer:
  image:
    repository: ghcr.io/openhands/agent-server
    tag: 1.12.0-python

imagePullSecrets: []

global:
  imagePullSecrets: []
  storageClass: ""
  domain: ""
  hosts:
    openhands: ""
  commonLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

service:
  enabled: true
  type: ClusterIP
  port: 3000
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  hostName: ""
  ingressClassName: ""
  # Backward compatibility: className/hosts are still honored if set.
  className: ""
  annotations:
    kubernetes.io/ingress.class: internal
  hosts: []
  tls: []

workspace:
  enabled: false
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  storageClass: ""
  mountPath: /workspace
  annotations: {}

env: []
envFromSecrets: []
# Secret injection conventions:
# - Secret names: kebab-case (example: openhands-app-secrets)
# - Secret data keys: UPPER_SNAKE_CASE (example: OPENHANDS_API_TOKEN)
existingSecret: "" # Optional envFrom source for app credentials/secrets.
secretRefs: [] # [{name: openhands-app-secrets, key: OPENHANDS_API_TOKEN, envVar: OPENHANDS_API_TOKEN}]

queue:
  enabled: false
  provider: ""
  endpoint: ""
  queueName: ""
  dlqName: ""
  workerConcurrency: 4

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

networkPolicy:
  enabled: false
  # Example internal-only posture: allow traffic from the ingress controller and same namespace only.
  # ingress:
  #   - from:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: ingress-nginx
  #       - podSelector: {}
  # egress:
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: default
  # policyTypes:
  #   - Ingress
  #   - Egress
  ingress: []
  egress: []
  policyTypes:
    - Ingress
    - Egress

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

probes:
  liveness:
    enabled: true
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
runtime: null
runtimeClassName: ""

extraVolumes: []
extraVolumeMounts: []
